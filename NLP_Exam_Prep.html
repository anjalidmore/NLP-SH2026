{
 id:"f_hmm", m:"m3", q:"Q2", marks:4, topic:"3.1", title:"HMM — Emission and Transition Probabilities",
 why:"Its own practice slide, AND a previous-paper question worth 5 marks with a published rubric and matrix-format answer. The safest 4 marks on the paper if you drill the denominators.",
 pattern:{
  src:"practice.pptx slide 11",
  q:"Consider the following corpus:\n  <s> The doctor treats patients </s>\n  <s> A nurse checks records </s>\n  <s> The nurse treats patients </s>\n  <s> A doctor checks records </s>\n\nGiven the POS tags DT: Determiner, NN: Noun, VB: Verb, apply a bigram HMM to compute the emission and transition probabilities.",
  steps:[
   "STEP 1 — tag the corpus. The pattern is DT NN VB NN in all four sentences:\n  <s> The/DT doctor/NN treats/VB patients/NN </s>\n  <s> A/DT nurse/NN checks/VB records/NN </s>\n  <s> The/DT nurse/NN treats/VB patients/NN </s>\n  <s> A/DT doctor/NN checks/VB records/NN </s>",
   "STEP 2 — count each TAG. These are every denominator you will need:\n  c(<s>) = 4 · c(DT) = 4 · c(NN) = 8 · c(VB) = 4",
   "STEP 3 — EMISSION matrix,  P(word | tag) = c(tag, word) / c(tag).\n  Vocabulary: a, checks, doctor, nurse, patients, records, the, treats\n\n              DT(4)   NN(8)   VB(4)\n  the          2/4      0       0\n  a            2/4      0       0\n  doctor        0      2/8      0\n  nurse         0      2/8      0\n  patients      0      2/8      0\n  records       0      2/8      0\n  treats        0       0      2/4\n  checks        0       0      2/4\n\n  COLUMN CHECK: DT 2/4+2/4 = 1 ✓ · NN 4×(2/8) = 1 ✓ · VB 2/4+2/4 = 1 ✓",
   "STEP 4 — TRANSITION matrix,  P(tᵢ | tᵢ₋₁) = c(tᵢ₋₁, tᵢ) / c(tᵢ₋₁).  Rows = FROM, columns = TO.\n\n             DT     NN     VB    </s>\n  <s>(4)    4/4=1    0      0      0\n  DT(4)       0    4/4=1    0      0\n  NN(8)       0      0     4/8    4/8\n  VB(4)       0    4/4=1    0      0\n\n  ROW CHECK: every row sums to 1 ✓",
   "Read the NN row carefully: NN occurs 8 times — 4 times in subject position (followed by VB) and 4 times in object position (followed by </s>). That is where 1/2 and 1/2 come from."],
  answer:"EMISSION: P(the|DT) = P(a|DT) = 1/2 · P(doctor|NN) = P(nurse|NN) = P(patients|NN) = P(records|NN) = 1/4 · P(treats|VB) = P(checks|VB) = 1/2\n\nTRANSITION: P(DT|<s>) = 1 · P(NN|DT) = 1 · P(VB|NN) = 1/2 · P(</s>|NN) = 1/2 · P(NN|VB) = 1\n\nPresent both as MATRICES with the tag counts written above the columns — that is the format the official solution used (matrices B and A). Always finish with the row/column sum checks; they cost one line and catch every counting error."},
 questions:[
  {id:"fq_hmm1", d:"easy",
   q:"Corpus: <s> The cat sleeps </s> · <s> A dog barks </s>, tagged DT NN VB. Compute all emission probabilities.",
   a:"Tag counts: DT = 2, NN = 2, VB = 2.\nP(the|DT) = 1/2 · P(a|DT) = 1/2\nP(cat|NN) = 1/2 · P(dog|NN) = 1/2\nP(sleeps|VB) = 1/2 · P(barks|VB) = 1/2\nEvery column sums to 1 ✓"},
  {id:"fq_hmm2", d:"medium",
   q:"Same corpus (<s> The cat sleeps </s> · <s> A dog barks </s>). Compute the full transition matrix including <s> and </s>, and verify the row sums.",
   a:"c(<s>) = 2, c(DT) = 2, c(NN) = 2, c(VB) = 2.\n           DT    NN    VB   </s>\n <s>(2)    2/2=1  0     0     0\n DT(2)      0   2/2=1  0     0\n NN(2)      0     0   2/2=1  0\n VB(2)      0     0     0   2/2=1\nEvery row sums to 1 ✓\nComment: this corpus is perfectly regular (every sentence is DT NN VB), so every transition is deterministic — the model has learnt one rigid template and would assign probability 0 to any other tag sequence."},
  {id:"fq_hmm3", d:"medium",
   q:"PREVIOUS PAPER, 5 marks. Corpus: <s> the/DT students/NN pass/V the/DT test/NN </s> · <s> the/DT students/NN wait/V for/P the/DT result/NN </s> · <s> teachers/NN test/V students/NN </s>. Give the emission and transition matrices.",
   a:"Tag counts: DT = 4, NN = 6, V = 3, P = 1, <s> = 3.\nVocabulary (official key, alphabetical): for, pass, result, students, teachers, test, the, wait\n\nEMISSION B, P(word|tag):\n           for  pass  result  students  teachers  test  the  wait\n  DT        0     0      0        0         0       0     1     0\n  NN        0     0     1/6      3/6       1/6     1/6    0     0\n  V         0    1/3     0        0         0      1/3    0    1/3\n  P         1     0      0        0         0       0     0     0\n Column-wise per tag: NN 1/6+3/6+1/6+1/6 = 1 ✓ · V 3×(1/3) = 1 ✓\n\nTRANSITION A, P(to|from):\n            DT    NN    V     P    </s>\n  <s>(3)   2/3   1/3    0     0     0\n  DT(4)     0     1     0     0     0\n  NN(6)     0     0    1/2    0    1/2\n  V(3)     1/3   1/3    0    1/3    0\n  P(1)      1     0     0     0     0\nEvery row sums to 1 ✓\nNote 'test' is NN once and V once — its emission appears in BOTH rows, and only the transition model decides which reading wins in context."},
  {id:"fq_hmm4", d:"difficult",
   q:"Using the doctor/nurse corpus, a test sentence begins “The nurse …”. Compute the score of tagging 'nurse' as NN versus VB and explain which piece of the model decides it.",
   a:"Score of a prefix = π/transition × emission, chained.\n'The' as DT: P(DT|<s>) × P(the|DT) = 1 × 1/2 = 0.5\n'nurse' as NN: 0.5 × P(NN|DT) × P(nurse|NN) = 0.5 × 1 × 1/4 = 0.125\n'nurse' as VB: 0.5 × P(VB|DT) × P(nurse|VB) = 0.5 × 0 × 0 = 0\nNN wins outright.\nWHAT DECIDES IT: two separate zeros, and it is worth naming both.\n1. TRANSITION: P(VB|DT) = 0 — in this corpus a determiner is NEVER followed by a verb. This alone kills the VB path regardless of the word.\n2. EMISSION: P(nurse|VB) = 0 — 'nurse' was never tagged VB.\nEither zero is sufficient. The important consequence: a single zero in the transition matrix rules out an entire path permanently, which is why real taggers SMOOTH the transition and emission counts — otherwise a construction absent from the training corpus becomes impossible rather than merely unlikely."},
  {id:"fq_hmm5", d:"difficult",
   q:"Corpus: <s> Time/NN flies/VB fast/RB </s> · <s> Flies/NN fly/VB </s> · <s> Time/VB flies/NN </s>. Build both matrices and identify every ambiguous word.",
   a:"Tag counts: NN = 3 (Time-s1, Flies-s2, flies-s3), VB = 3 (flies-s1, fly-s2, Time-s3), RB = 1, <s> = 3.\n\nEMISSION P(word|tag), case-insensitive:\n          NN(3)   VB(3)   RB(1)\n  time     1/3     1/3      0\n  flies    2/3     1/3      0\n  fly       0      1/3      0\n  fast      0       0       1\n Column checks: NN 1/3+2/3 = 1 ✓ · VB 1/3+1/3+1/3 = 1 ✓ · RB = 1 ✓\n\nTRANSITION P(to|from):\n            NN     VB     RB    </s>\n  <s>(3)   2/3    1/3     0      0\n  NN(3)     0     2/3     0     1/3      (s1 Time->flies VB, s2 Flies->fly VB, s3 flies ends)\n  VB(3)    1/3     0     1/3    1/3      (s3 Time->flies NN, s1 flies->fast RB, s2 fly ends)\n  RB(1)     0      0      0      1\nEvery row sums to 1 ✓\n\nAMBIGUOUS WORDS: 'time' (NN and VB) and 'flies' (NN and VB). 'fly' and 'fast' are unambiguous in this corpus.\nThis is the “Time flies like an arrow” ambiguity written as a tagging problem — the emission matrix alone cannot resolve either word, so the transition matrix must."},
  {id:"fq_hmm6", d:"difficult",
   q:"A student computes emission as c(tag,word)/c(word) instead of c(tag,word)/c(tag). Using the doctor/nurse corpus, compute both for 'doctor' and explain which the HMM needs and what breaks otherwise.",
   a:"'doctor' occurs twice, always tagged NN; c(NN) = 8.\n CORRECT emission P(doctor|NN) = c(NN,doctor)/c(NN) = 2/8 = 0.25\n STUDENT'S value P(NN|doctor) = c(NN,doctor)/c(doctor) = 2/2 = 1\nWHICH THE HMM NEEDS: P(word | tag).\nWHY: the HMM is a GENERATIVE model. It comes from Bayes' theorem —\n  T̂ = argmax P(T|W) = argmax P(W|T)·P(T)/P(W) = argmax P(W|T)·P(T)\nand P(W|T) decomposes under the lexical-independence assumption into a product of P(wᵢ|tᵢ) terms. So emission must be word-given-tag.\nWHAT BREAKS with the student's version:\n1. The columns no longer sum to 1, so it is not a valid emission distribution.\n2. Every unambiguous word gets emission 1, so a rare word that happens to occur once looks as certain as a word seen a thousand times — frequency information is destroyed and rare words dominate the trellis.\n3. The quantity P(tag|word) is what a DISCRIMINATIVE model (MEMM/CRF) estimates. It is a different model with different properties — not a shortcut for the HMM."},
  {id:"fq_hmm7", d:"difficult",
   q:"Q2-style, 4 marks. Corpus: <s> Ravi/NN writes/VB code/NN </s> · <s> Priya/NN reviews/VB code/NN </s> · <s> Ravi/NN reviews/VB reports/NN </s>. Give both matrices with checks, then compute P(“<s> Priya writes code </s>” tagged NN VB NN).",
   a:"Tag counts: NN = 6 (Ravi, code, Priya, code, Ravi, reports), VB = 3, <s> = 3.\n\nEMISSION P(word|tag):\n            NN(6)   VB(3)\n  Ravi       2/6      0\n  Priya      1/6      0\n  code       2/6      0\n  reports    1/6      0\n  writes      0      1/3\n  reviews     0      2/3\n Column check: NN 2/6+1/6+2/6+1/6 = 1 ✓ · VB 1/3+2/3 = 1 ✓\n\nTRANSITION P(to|from):\n            NN     VB    </s>\n  <s>(3)   3/3=1    0     0\n  NN(6)     0      3/6   3/6\n  VB(3)   3/3=1     0     0\n Row check: all rows sum to 1 ✓\n\nPROBABILITY of <s> Priya/NN writes/VB code/NN </s>:\n P = P(NN|<s>)·P(Priya|NN) × P(VB|NN)·P(writes|VB) × P(NN|VB)·P(code|NN) × P(</s>|NN)\n   = 1 × 1/6 × 1/2 × 1/3 × 1 × 2/6 × 1/2\n   = (1/6) × (1/6) × (1/3) × (1/2)\n Step through: 1 × 0.16667 = 0.16667 · × 0.5 = 0.08333 · × 0.33333 = 0.027778\n              · × 1 = 0.027778 · × 0.33333 = 0.0092593 · × 0.5 = 0.0046296\n P ≈ 4.63 × 10⁻³\nAlways alternate transition × emission, one pair per word, and finish with the transition into </s>."}]
},
{
 id:"f_hmmtab", m:"m3", q:"Q2", marks:4, topic:"3.1", title:"HMM Table — Scoring Every Tag Sequence",
 why:"A practice slide of its own (“Practice HMM table”). It is the enumeration form of the Viterbi question — the same matrices, all paths scored, then normalised.",
 pattern:{
  src:"practice.pptx slide 12, using the slide-14 matrices",
  q:"Using the transition and emission matrices below, build the HMM table for the observation sequence “The chef” and give the most probable tag sequence.\n\nTRANSITION      DT    NN    VB   <E>        EMISSION    DT    NN    VB\n  <S>          0.7   0.3    0     0           The       0.9   0.1    0\n  DT            0    0.8   0.2    0           chef      0.1   0.8   0.1\n  NN            0    0.3   0.5   0.2          cooks      0    0.1   0.9\n  VB            0    0.4   0.4   0.2",
  steps:[
   "With 3 tags and 2 words there are 3² = 9 candidate sequences. Score each as\n   π(X₀) × P(O₀|X₀) × P(X₀,X₁) × P(O₁|X₁) × P(X₁,<E>)",
   "π comes from the <S> row: π(DT) = 0.7, π(NN) = 0.3, π(VB) = 0.\nEvery sequence starting VB scores 0 immediately — three rows eliminated.",
   "X₀ X₁ │ π(X₀) │ P(The|X₀) │ P(X₀,X₁) │ P(chef|X₁) │ P(X₁,<E>) │  Pᵣ\n  DT DT │  0.7  │    0.9    │   0.0    │    0.1     │    0      │  0\n  DT NN │  0.7  │    0.9    │   0.8    │    0.8     │   0.2     │  0.08064\n  DT VB │  0.7  │    0.9    │   0.2    │    0.1     │   0.2     │  0.00252\n  NN DT │  0.3  │    0.1    │   0.0    │    0.1     │    0      │  0\n  NN NN │  0.3  │    0.1    │   0.3    │    0.8     │   0.2     │  0.00144\n  NN VB │  0.3  │    0.1    │   0.5    │    0.1     │   0.2     │  0.00030\n  VB ** │   0   │     —     │    —     │     —      │    —      │  0",
   "Σ Pᵣ = 0.08064 + 0.00252 + 0.00144 + 0.00030 = 0.0849",
   "NORMALISE:  P̂ = Pᵣ / ΣPᵣ\n  DT NN = 0.08064 / 0.0849 = 0.9498\n  DT VB = 0.00252 / 0.0849 = 0.0297\n  NN NN = 0.00144 / 0.0849 = 0.0170\n  NN VB = 0.00030 / 0.0849 = 0.0035"],
  answer:"Most probable tag sequence: The/DT chef/NN, with raw score 0.08064 and normalised probability ≈ 0.95.\n\nOutput format: [ ('The', 'DT'), ('chef', 'NN') ]\n\nTwo things the examiner looks for: every row uses the SAME five factors (a missing end-transition silently changes the ranking), and the normalisation step is shown. Note also why enumeration is only usable here — 3 tags and 2 words gives 9 rows, but 3 tags and 10 words would give 59,049. That is what Viterbi exists to avoid."},
 questions:[
  {id:"fq_htab1", d:"easy",
   q:"With 4 possible tags and a 3-word sentence, how many rows does the enumeration table have? With 45 tags and 12 words?",
   a:"4³ = 64 rows.\n45¹² ≈ 6.9 × 10¹⁹ rows — completely infeasible.\nViterbi replaces this with O(N·T²) work = 12 × 45² = 24,300 operations, because it keeps only the single best path into each state at each position."},
  {id:"fq_htab2", d:"medium",
   q:"Two tags {A,B}, π(A)=0.6, π(B)=0.4. Emissions for w₁: P(w₁|A)=0.5, P(w₁|B)=0.2. Transitions: P(A|A)=0.7, P(B|A)=0.3, P(A|B)=0.4, P(B|B)=0.6. Emissions for w₂: P(w₂|A)=0.1, P(w₂|B)=0.8. Ignore the end transition. Score all four sequences and normalise.",
   a:"A A: 0.6 × 0.5 × 0.7 × 0.1 = 0.021\nA B: 0.6 × 0.5 × 0.3 × 0.8 = 0.072\nB A: 0.4 × 0.2 × 0.4 × 0.1 = 0.0032\nB B: 0.4 × 0.2 × 0.6 × 0.8 = 0.0384\nΣ = 0.1346\nNormalised: A B = 0.535 · B B = 0.285 · A A = 0.156 · B A = 0.024\nWinner: A B."},
  {id:"fq_htab3", d:"medium",
   q:"Using the slide-14 matrices, explain without full computation why every tag sequence beginning with VB scores exactly 0, and what that tells you about the corpus the matrices came from.",
   a:"The <S> row of the transition matrix gives P(VB|<S>) = 0. That factor is the FIRST term of every VB-initial path, so the whole product is 0 regardless of what follows.\nWHAT IT TELLS YOU: in the training corpus, no sentence ever began with a verb. The corpus contained no imperatives (“Cook the rice”) and no questions with fronted auxiliaries.\nWHY THAT MATTERS: it is a hard zero, not a small number, so the model treats a verb-initial sentence as IMPOSSIBLE rather than unusual. Feed it “Cook dinner quickly” and it cannot produce the correct tagging at all. This is the standard argument for SMOOTHING the transition matrix — the training corpus is a sample, and an event absent from a sample is not an impossible event."},
  {id:"fq_htab4", d:"difficult",
   q:"Using the slide-14 matrices, build the full HMM table for “chef cooks” (2 words) and give the most probable tag sequence with its normalised probability.",
   a:"π: DT 0.7, NN 0.3, VB 0.\nEmissions — chef: DT 0.1, NN 0.8, VB 0.1 · cooks: DT 0, NN 0.1, VB 0.9\nAny sequence ending in DT scores 0 (P(cooks|DT) = 0). Any starting VB scores 0 (π = 0).\n X₀ X₁ │ π │ P(chef|X₀) │ P(X₀,X₁) │ P(cooks|X₁) │ P(X₁,<E>) │ Pᵣ\n DT NN │0.7│    0.1     │   0.8    │     0.1     │    0.2    │ 0.7×0.1×0.8×0.1×0.2 = 0.00112\n DT VB │0.7│    0.1     │   0.2    │     0.9     │    0.2    │ 0.7×0.1×0.2×0.9×0.2 = 0.00252\n NN NN │0.3│    0.8     │   0.3    │     0.1     │    0.2    │ 0.3×0.8×0.3×0.1×0.2 = 0.00144\n NN VB │0.3│    0.8     │   0.5    │     0.9     │    0.2    │ 0.3×0.8×0.5×0.9×0.2 = 0.0216\nΣ = 0.00112 + 0.00252 + 0.00144 + 0.0216 = 0.02668\nNormalised: NN VB = 0.0216/0.02668 = 0.8096 · DT VB = 0.0945 · NN NN = 0.0540 · DT NN = 0.0420\nMOST PROBABLE: chef/NN cooks/VB, normalised probability ≈ 0.81.\nSensible: 'chef' emits strongly as NN (0.8) and 'cooks' strongly as VB (0.9), and NN->VB (0.5) is the most likely transition out of NN."},
  {id:"fq_htab5", d:"difficult",
   q:"In the pattern table DT NN scored 0.08064 and NN VB scored 0.00030 — a ratio of 269:1. Attribute the gap to individual factors.",
   a:"Compare factor by factor:\n π:              0.7 (DT) vs 0.3 (NN)   -> 2.33× for DT\n P(The|X₀):      0.9 (DT) vs 0.1 (NN)   -> 9× for DT\n P(X₀,X₁):       0.8 (DT->NN) vs 0.5 (NN->VB) -> 1.6× for DT NN\n P(chef|X₁):     0.8 (NN) vs 0.1 (VB)   -> 8× for DT NN\n P(X₁,<E>):      0.2 vs 0.2             -> no effect\nCombined: 2.33 × 9 × 1.6 × 8 = 268.8 ✓ matches the observed 269:1.\nDOMINANT CONTRIBUTORS: the two EMISSION probabilities — 'The' looks overwhelmingly like a determiner (9×) and 'chef' overwhelmingly like a noun (8×). Together they account for 72 of the 269. The transition and initial probabilities agree but contribute far less.\nBeing able to attribute a result to specific factors, rather than just reporting it, is the LO 3.4 analysis mark."},
  {id:"fq_htab6", d:"difficult",
   q:"A student normalises the table, gets 0.95 for DT NN, and writes “the tagger is 95% accurate”. Correct this precisely.",
   a:"The two quantities are unrelated.\n0.95 is the model's POSTERIOR CONFIDENCE in one tag sequence for ONE sentence, computed from the model's own parameters. It says how much of the probability mass this path takes among the paths the model itself considers — nothing more.\nACCURACY is an EMPIRICAL quantity measured against gold-standard annotation over many sentences: correctly tagged tokens ÷ total tokens.\nA model can be 95% confident and wrong. Indeed a model estimated from a tiny corpus will be MORE confident, not less, because sparse counts produce many zeros and near-zeros that make the alternatives look impossible. Over-confidence from sparse data is a known HMM failure mode, and smoothing the counts is the standard remedy.\nWHAT TO REPORT INSTEAD: per-token accuracy on held-out data, the most-frequent-tag baseline (~90% for English) for comparison, accuracy on UNSEEN words specifically, and per-tag F1."},
  {id:"fq_htab7", d:"difficult",
   q:"Q2-style, 4 marks. Tags {NN, VB}, π(NN)=0.8, π(VB)=0.2. Transitions: NN->NN 0.3, NN->VB 0.5, NN-><E> 0.2, VB->NN 0.6, VB->VB 0.1, VB-><E> 0.3. Emissions — 'dogs': NN 0.7, VB 0.1; 'bark': NN 0.2, VB 0.8. Build the full table for “dogs bark”, normalise, and state the answer.",
   a:"Four sequences; each score = π × P(dogs|X₀) × P(X₀,X₁) × P(bark|X₁) × P(X₁,<E>).\n\n X₀ X₁ │  π  │P(dogs|X₀)│P(X₀,X₁)│P(bark|X₁)│P(X₁,<E>)│ Pᵣ\n NN NN │ 0.8 │   0.7    │  0.3   │   0.2    │   0.2   │ 0.8×0.7×0.3×0.2×0.2 = 0.00672\n NN VB │ 0.8 │   0.7    │  0.5   │   0.8    │   0.3   │ 0.8×0.7×0.5×0.8×0.3 = 0.06720\n VB NN │ 0.2 │   0.1    │  0.6   │   0.2    │   0.2   │ 0.2×0.1×0.6×0.2×0.2 = 0.00048\n VB VB │ 0.2 │   0.1    │  0.1   │   0.8    │   0.3   │ 0.2×0.1×0.1×0.8×0.3 = 0.00048\n\nΣ Pᵣ = 0.00672 + 0.06720 + 0.00048 + 0.00048 = 0.07488\nNORMALISED:\n NN VB = 0.06720/0.07488 = 0.8974\n NN NN = 0.00672/0.07488 = 0.0897\n VB NN = 0.00048/0.07488 = 0.0064\n VB VB = 0.00048/0.07488 = 0.0064\n Sum = 1.000 ✓\n\nANSWER: dogs/NN bark/VB, with normalised probability ≈ 0.897.\nOutput as [ ('dogs','NN'), ('bark','VB') ]."}]
},
{
 id:"f_viterbi", m:"m3", q:"Q2", marks:4, topic:"3.1", title:"Viterbi Algorithm",
 why:"Its own practice slide with ready-made matrices, and the class notes say “Viterbi — SHOW THE STATE GRAPH”. The trellis drawing is part of the answer, not decoration.",
 pattern:{
  src:"practice.pptx slide 14",
  q:"The transition and emission probability matrices are given below. Apply the Viterbi algorithm to determine the most probable POS-tag sequence for the observation sequence “The chef cooks”.\n\nTRANSITION      DT    NN    VB   <E>        EMISSION    DT    NN    VB\n  <S>          0.7   0.3    0     0           The       0.9   0.1    0\n  DT            0    0.8   0.2    0           chef      0.1   0.8   0.1\n  NN            0    0.3   0.5   0.2          cooks      0    0.1   0.9\n  VB            0    0.4   0.4   0.2",
  steps:[
   "Each cell:  δ(tag) = max over previous tags of [ δ_prev × transition ] × emission.\nKeep a BACKPOINTER recording which previous tag produced the maximum.",
   "POSITION 1 — “The”  (use the <S> row as π):\n  δ(DT) = 0.7 × P(The|DT) = 0.7 × 0.9 = 0.63\n  δ(NN) = 0.3 × P(The|NN) = 0.3 × 0.1 = 0.03\n  δ(VB) = 0   × P(The|VB) = 0   × 0   = 0",
   "POSITION 2 — “chef”  (emissions: DT 0.1, NN 0.8, VB 0.1):\n  δ(DT) = max[ 0.63×P(DT|DT)=0.63×0 , 0.03×P(DT|NN)=0.03×0 , 0 ] = 0 ;  × 0.1 = 0\n  δ(NN) = max[ 0.63×0.8 = 0.504 , 0.03×0.3 = 0.009 , 0 ] = 0.504 ;  × 0.8 = 0.4032   bp = DT\n  δ(VB) = max[ 0.63×0.2 = 0.126 , 0.03×0.5 = 0.015 , 0 ] = 0.126 ;  × 0.1 = 0.0126   bp = DT",
   "POSITION 3 — “cooks”  (emissions: DT 0, NN 0.1, VB 0.9):\n  δ(DT) = 0 (emission is 0)\n  δ(NN) = max[ 0×… , 0.4032×P(NN|NN)=0.4032×0.3=0.12096 , 0.0126×P(NN|VB)=0.0126×0.4=0.00504 ]\n        = 0.12096 ;  × 0.1 = 0.012096   bp = NN\n  δ(VB) = max[ 0.4032×P(VB|NN)=0.4032×0.5=0.2016 , 0.0126×P(VB|VB)=0.0126×0.4=0.00504 ]\n        = 0.2016 ;  × 0.9 = 0.18144     bp = NN",
   "TERMINATE — multiply by the transition into <E> (0.2 from both NN and VB):\n  via NN: 0.012096 × 0.2 = 0.0024192\n  via VB: 0.18144  × 0.2 = 0.036288   <- the maximum",
   "BACKTRACE from the best final state:  VB  <-  NN  <-  DT",
   "STATE GRAPH to draw — three columns (The, chef, cooks) × three rows (DT, NN, VB), each cell holding its δ value, with the surviving best path drawn as a bold line DT -> NN -> VB and the pruned edges shown thin."],
  answer:"Most probable tag sequence:  The/DT  chef/NN  cooks/VB\n\nPath probability = 0.036288 including the transition into <E> (0.18144 if the end transition is not required — say which you used).\n\nMarks come from: the trellis/state graph drawn with every δ value, the max-and-backpointer at each cell, and the BACKTRACE. Do not read the answer off the largest cell in each column independently — the winning path may pass through cells that were not maximal in their own column."},
 questions:[
  {id:"fq_vit1", d:"easy",
   q:"Two tags {N,V}, π(N)=0.8, π(V)=0.2. First word 'birds': P(birds|N)=0.6, P(birds|V)=0.05. Compute δ₁(N) and δ₁(V) and say which paths survive.",
   a:"δ₁(N) = 0.8 × 0.6 = 0.48\nδ₁(V) = 0.2 × 0.05 = 0.01\nBOTH survive. Viterbi keeps one best path PER STATE, not one path overall — δ₁(V) is retained because a later emission could still make a V-initial path win. Discarding it now is the classic error."},
  {id:"fq_vit2", d:"medium",
   q:"Continuing: transitions N->N 0.4, N->V 0.6, V->N 0.7, V->V 0.3. Second word 'fly': P(fly|N)=0.1, P(fly|V)=0.8. Compute δ₂ for both tags with backpointers, and give the final tag sequence.",
   a:"δ₂(N) = max[ δ₁(N)×P(N|N) = 0.48×0.4 = 0.192 , δ₁(V)×P(N|V) = 0.01×0.7 = 0.007 ] × P(fly|N)\n      = 0.192 × 0.1 = 0.0192,  bp = N\nδ₂(V) = max[ δ₁(N)×P(V|N) = 0.48×0.6 = 0.288 , δ₁(V)×P(V|V) = 0.01×0.3 = 0.003 ] × P(fly|V)\n      = 0.288 × 0.8 = 0.2304,  bp = N\nBest final = δ₂(V) = 0.2304. Backtrace: V <- N.\nTAG SEQUENCE: birds/N fly/V."},
  {id:"fq_vit3", d:"medium",
   q:"Using the slide-14 matrices, run Viterbi on “The cooks” (2 words) and give the tag sequence.",
   a:"POSITION 1 'The': δ(DT) = 0.7×0.9 = 0.63 · δ(NN) = 0.3×0.1 = 0.03 · δ(VB) = 0\nPOSITION 2 'cooks' (emissions DT 0, NN 0.1, VB 0.9):\n δ(DT) = 0 (emission 0)\n δ(NN) = max[0.63×P(NN|DT)=0.63×0.8=0.504 , 0.03×P(NN|NN)=0.03×0.3=0.009] × 0.1 = 0.504×0.1 = 0.0504, bp = DT\n δ(VB) = max[0.63×P(VB|DT)=0.63×0.2=0.126 , 0.03×P(VB|NN)=0.03×0.5=0.015] × 0.9 = 0.126×0.9 = 0.1134, bp = DT\nEnd transition (0.2 from both): via NN 0.01008 · via VB 0.02268 <- max\nBacktrace: VB <- DT.\nTAG SEQUENCE: The/DT cooks/VB, path probability 0.02268.\nSensible — 'cooks' emits far more strongly as a verb (0.9 vs 0.1)."},
  {id:"fq_vit4", d:"difficult",
   q:"In the pattern trace, δ₂(NN) = 0.4032 and δ₂(VB) = 0.0126, yet BOTH backpointers point to DT. Explain why, and give a situation where two cells in the same column would have DIFFERENT backpointers.",
   a:"WHY BOTH POINT TO DT: at position 2 the candidates entering each cell are δ₁(DT) = 0.63 and δ₁(NN) = 0.03 (δ₁(VB) = 0). Because 0.63 is 21× larger than 0.03, the DT-origin term wins for BOTH destination cells, even though the transitions differ (DT->NN = 0.8 versus DT->VB = 0.2). One dominant predecessor can supply every cell in the next column.\nWHEN BACKPOINTERS DIFFER: when the previous column's values are comparable and the transition probabilities pull in opposite directions. Example: suppose δ₁(DT) = 0.30 and δ₁(NN) = 0.25, with DT->NN = 0.9, NN->NN = 0.2, DT->VB = 0.05, NN->VB = 0.8.\n  Into NN: max[0.30×0.9 = 0.270 , 0.25×0.2 = 0.050] -> bp = DT\n  Into VB: max[0.30×0.05 = 0.015 , 0.25×0.8 = 0.200] -> bp = NN\nDifferent backpointers in the same column.\nWHY THIS MATTERS: it is exactly why you must BACKTRACE rather than read the column maxima. The best final cell may have been reached through a predecessor that was not the best cell in its own column."},
  {id:"fq_vit5", d:"difficult",
   q:"Explain why Viterbi keeps only one path into each state, why that is safe, and what would have to change for a TRIGRAM tagger.",
   a:"WHY IT KEEPS ONE: dynamic programming. If two paths both arrive at tag t at position i, everything that happens afterwards depends only on t — not on how t was reached.\nWHY IT IS SAFE — the MARKOV PROPERTY. Every future factor (transitions and emissions from position i+1 onward) is IDENTICAL for both paths, so the one with the lower score at position i can never overtake. Formally this is optimal substructure: the best path through state t at time i must extend the best path INTO t at time i.\nCOST SAVING: exponential O(T^N) enumeration collapses to O(N·T²).\nWHAT CHANGES FOR A TRIGRAM TAGGER: the transition becomes P(tᵢ | tᵢ₋₂, tᵢ₋₁), so the future now depends on the last TWO tags, not one. The Markov property still holds — but over PAIRS of tags. So the trellis state must become a pair (tᵢ₋₁, tᵢ), and you keep one best path per PAIR. Complexity rises to O(N·T³) and the number of cells per column from T to T².\nGENERAL RULE: the trellis state must contain exactly as much history as the model conditions on."},
  {id:"fq_vit6", d:"difficult",
   q:"Using the slide-14 matrices, a student reports the tag sequence for “The chef cooks” by taking the largest cell in each column: DT (0.63), NN (0.4032), VB (0.18144). They get the right answer. Construct a case with the same matrices where this method would fail.",
   a:"They got lucky: here the column maxima happen to form a connected path.\nWHEN IT FAILS — whenever the best final cell was reached through a predecessor that was NOT its column's maximum, or when the column maxima are not joined by a legal transition.\nCONSTRUCTION with these matrices: note P(DT|NN) = 0 and P(DT|VB) = 0 — nothing can transition INTO DT except <S>. So take any 3-word sentence whose middle word emits most strongly as DT, e.g. emissions for a word 'the2': DT 0.9, NN 0.05, VB 0.05.\n Column 2 maximum would be DT (highest emission), but δ(DT) at position 2 = max[0.63×P(DT|DT)=0, 0.03×P(DT|NN)=0] × 0.9 = 0. The cell is ZERO despite the strong emission, because no transition reaches DT.\n A student reading 'largest emission per column' would report … DT … ; a student reading the largest δ per column would report the correct non-zero cell. And if the true best path passes through NN at position 2 while VB has the larger δ there, the column-max method reports an impossible sequence.\nTHE RULE: take the best FINAL cell and follow BACKPOINTERS. The backpointer records which predecessor actually produced that cell's value, which is the only thing guaranteeing the reported sequence is a legal, connected path."},
  {id:"fq_vit7", d:"difficult",
   q:"Q2-style, 4 marks. Tags {DT,NN,VB}. π: DT 0.6, NN 0.4, VB 0. Transitions: DT->NN 0.9, DT->VB 0.1, NN->NN 0.2, NN->VB 0.6, NN-><E> 0.2, VB->NN 0.5, VB-><E> 0.5. Emissions — 'A': DT 0.8, NN 0.1, VB 0 · 'student': DT 0, NN 0.9, VB 0.1 · 'reads': DT 0, NN 0.1, VB 0.8. Run Viterbi on “A student reads”.",
   a:"POSITION 1 — 'A':\n δ(DT) = 0.6 × 0.8 = 0.48\n δ(NN) = 0.4 × 0.1 = 0.04\n δ(VB) = 0 × 0 = 0\n\nPOSITION 2 — 'student' (emissions DT 0, NN 0.9, VB 0.1):\n δ(DT) = 0 (emission 0)\n δ(NN) = max[0.48×0.9 = 0.432 , 0.04×0.2 = 0.008] × 0.9 = 0.432 × 0.9 = 0.3888, bp = DT\n δ(VB) = max[0.48×0.1 = 0.048 , 0.04×0.6 = 0.024] × 0.1 = 0.048 × 0.1 = 0.0048, bp = DT\n\nPOSITION 3 — 'reads' (emissions DT 0, NN 0.1, VB 0.8):\n δ(NN) = max[0.3888×P(NN|NN)=0.3888×0.2=0.07776 , 0.0048×P(NN|VB)=0.0048×0.5=0.0024] × 0.1\n       = 0.07776 × 0.1 = 0.007776, bp = NN\n δ(VB) = max[0.3888×P(VB|NN)=0.3888×0.6=0.23328 , 0.0048×P(VB|VB)=0 (not given, treat as 0)] × 0.8\n       = 0.23328 × 0.8 = 0.186624, bp = NN\n\nTERMINATE: via NN 0.007776 × 0.2 = 0.0015552 · via VB 0.186624 × 0.5 = 0.093312  <- max\n\nBACKTRACE: VB <- NN <- DT\nANSWER: A/DT student/NN reads/VB, path probability 0.093312.\nDraw the 3×3 trellis with these δ values and the winning path in bold."}]
},
{
 id:"f_cky", m:"m3", q:"Q2", marks:4, topic:"3.4", title:"CKY Parsing Table",
 why:"Its own practice slide, named in the class notes for Q3/Q2, and asked in the previous paper with a published rubric and an answer table.",
 pattern:{
  src:"practice.pptx slide 13",
  q:"Consider the following CFG:\n  S  -> NP VP\n  VP -> VB NP\n  NP -> DT NN\n  DT -> A | The\n  NN -> farmer | crop\n  VB -> grows\n\nInput: “A farmer grows the crop”. Construct a CKY-based parsing table and the parse tree.",
  steps:[
   "CHECK CNF FIRST. S -> NP VP ✓ (two non-terminals), VP -> VB NP ✓, NP -> DT NN ✓, and all lexical rules are X -> terminal ✓. The grammar is already in Chomsky Normal Form, so no conversion is needed. Say this — it is a mark.",
   "Words: 1 A · 2 farmer · 3 grows · 4 the · 5 crop.  Build a 5 × 5 upper-triangular table; cell [i,j] holds the non-terminals spanning words i…j. Fill by SPAN LENGTH, never row by row.",
   "SPAN 1 (the diagonal):\n  [1,1] A      -> DT\n  [2,2] farmer -> NN\n  [3,3] grows  -> VB\n  [4,4] the    -> DT\n  [5,5] crop   -> NN",
   "SPAN 2:\n  [1,2] DT(1,1) + NN(2,2), rule NP -> DT NN  ->  NP   ('A farmer')\n  [2,3] NN + VB — no rule  ->  empty\n  [3,4] VB + DT — no rule  ->  empty\n  [4,5] DT(4,4) + NN(5,5), rule NP -> DT NN  ->  NP   ('the crop')",
   "SPAN 3:\n  [1,3] splits: NP(1,2)+VB(3,3) — no rule; DT(1,1)+[2,3] empty  ->  empty\n  [2,4] empty\n  [3,5] VB(3,3) + NP(4,5), rule VP -> VB NP  ->  VP   ('grows the crop')",
   "SPAN 4:  [1,4] and [2,5] — no split produces a rule  ->  empty",
   "SPAN 5 (the whole sentence):\n  [1,5] split after word 2:  NP(1,2) + VP(3,5), rule S -> NP VP  ->  S ✓",
   "THE TABLE:\n\n        A        farmer     grows      the        crop\n   1 │  DT   │   NP    │    —    │    —    │    S    │\n   2 │       │   NN    │    —    │    —    │    —    │\n   3 │       │         │   VB    │    —    │   VP    │\n   4 │       │         │         │   DT    │   NP    │\n   5 │       │         │         │         │   NN    │",
   "PARSE TREE, read back from the cells that produced S:\n\n                    S [1,5]\n                 /          \\\n           NP [1,2]         VP [3,5]\n            /    \\           /      \\\n       DT[1,1] NN[2,2]  VB[3,3]   NP[4,5]\n          |       |        |      /      \\\n          A    farmer   grows  DT[4,4] NN[5,5]\n                                  |        |\n                                 the      crop"],
  answer:"S appears in the top-right cell [1,5], so “A farmer grows the crop” BELONGS to the grammar. Parse tree as drawn above.\n\nThe previous paper's rubric awards 4–5 marks for a correct CKY table, so draw the whole triangular table including the empty cells — leaving them blank (rather than omitting them) shows you tested every split. Finish with the one-line conclusion about S in the top-right cell; the official solution states exactly that."},
 questions:[
  {id:"fq_cky1", d:"easy",
   q:"State the two rule forms allowed in Chomsky Normal Form and say which of these are legal: (a) A -> B C  (b) S -> a S b  (c) B -> b  (d) X -> Y Z W.",
   a:"CNF allows exactly: X -> Y Z (two non-terminals) and X -> a (a single terminal).\n(a) A -> B C — LEGAL.\n(b) S -> a S b — ILLEGAL (mixes terminals and non-terminals).\n(c) B -> b — LEGAL.\n(d) X -> Y Z W — ILLEGAL (three non-terminals); binarise as X -> Y M, M -> Z W."},
  {id:"fq_cky2", d:"medium",
   q:"How many cells does a CKY table have for a 6-word sentence, how many are actually used, and what is the algorithm's complexity?",
   a:"A 6 × 6 table has 36 cells, but CKY uses only the UPPER TRIANGLE (cells [i,j] with j ≥ i): n(n+1)/2 = 6×7/2 = 21 cells.\nComplexity: O(n³ · |G|). There are O(n²) cells and each needs up to n split points tested, with the grammar size as a constant factor. For n = 6 that is about 216 × |G| operations."},
  {id:"fq_cky3", d:"medium",
   q:"Using the farmer grammar, build the CKY table for “The crop grows”. Does it belong?",
   a:"Words: 1 The · 2 crop · 3 grows.\nSPAN 1: [1,1] DT · [2,2] NN · [3,3] VB\nSPAN 2: [1,2] DT+NN -> NP ✓ · [2,3] NN+VB -> no rule -> empty\nSPAN 3: [1,3] splits:\n  after word 1: DT(1,1) + [2,3] empty -> nothing\n  after word 2: NP(1,2) + VB(3,3) -> S needs NP VP, and [3,3] holds VB not VP -> nothing\n[1,3] is EMPTY, so the string does NOT belong to the grammar.\nWHY: the only VP rule is VP -> VB NP, so every verb must have an object noun phrase. 'grows' here is intransitive with nothing after it. Adding the rule VP -> VB would make the string parse. Naming the missing rule is the answer — 'it does not parse' alone is half the marks."},
  {id:"fq_cky4", d:"difficult",
   q:"PREVIOUS PAPER. Grammar: S -> NP VP · NP -> DT NN · VP -> VB NN · DT -> a|the · NN -> Man|Woman|Panda|Lion|leaves · VB -> eats|shoots|leaves. Build the CKY table for “The woman shoots Lion”.",
   a:"Words: 1 The · 2 woman · 3 shoots · 4 Lion.\nSPAN 1: [1,1] DT · [2,2] NN · [3,3] VB · [4,4] NN\nSPAN 2:\n [1,2] DT + NN, rule NP -> DT NN -> NP ✓\n [2,3] NN + VB — no rule -> empty\n [3,4] VB(3,3) + NN(4,4), rule VP -> VB NN -> VP ✓\nSPAN 3: [1,3] empty · [2,4] empty\nSPAN 4: [1,4] split after word 2: NP(1,2) + VP(3,4), rule S -> NP VP -> S ✓\nS is in the top-right cell, so the string BELONGS to the grammar. This matches the official key.\nTHE TRAP: this grammar has VP -> VB NN, so the object is a BARE NOUN and 'Lion' needs no determiner. Had the rule been VP -> VB NP (with NP -> DT NN), no NP could be built over the bare 'Lion' and the sentence would NOT parse. Same sentence, opposite verdict — read the VP rule before you start."},
  {id:"fq_cky5", d:"difficult",
   q:"Add the rule NP -> NN to the farmer grammar and rebuild the table for “Farmer grows crop”. What changes, and what does the unit rule force you to do?",
   a:"With NP -> NN, a bare noun can now be a noun phrase. The unit rule must be applied ON THE DIAGONAL, so each lexical cell carries both entries.\nWords: 1 Farmer · 2 grows · 3 crop.\nSPAN 1: [1,1] NN, and by NP -> NN also NP · [2,2] VB · [3,3] NN, and also NP\nSPAN 2: [1,2] NN/NP + VB — no rule (S needs NP VP, and VB is not a VP) -> empty\n        [2,3] VB(2,2) + NP(3,3), rule VP -> VB NP -> VP ✓\nSPAN 3: [1,3] split after word 1: NP(1,1) + VP(2,3), rule S -> NP VP -> S ✓\nThe string now BELONGS to the grammar, where without NP -> NN it would not.\nWHAT THE UNIT RULE FORCES: CNF forbids unit productions (X -> Y with Y a single non-terminal), so strictly the grammar must be converted first by substituting NN's terminal productions directly into NP: NP -> farmer | crop. In practice a CKY implementation handles it by taking the UNIT CLOSURE of each diagonal cell — adding every non-terminal reachable by unit rules. Forgetting this is the usual reason a table fails to reach S."},
  {id:"fq_cky6", d:"difficult",
   q:"A student fills the CKY table row by row (all of row 1, then row 2, …) and gets an empty top-right cell for a grammatical sentence. Diagnose, and state the correct fill order with the reason.",
   a:"DIAGNOSIS — wrong fill ORDER, not a wrong grammar.\nCell [1,n] is computed from pairs such as [1,2]+[3,n] and [1,3]+[4,n]. Filling row by row computes [1,2], [1,3], … , [1,n] BEFORE [3,n] or [4,n] exist, so every split the student tries finds an empty right-hand cell and nothing is ever entered.\nCORRECT ORDER — by SPAN LENGTH: all spans of length 1 (the diagonal), then all of length 2, then 3, up to n. Within a given length the order does not matter.\nREASON: CKY is a dynamic-programming chart parser. A cell of span L depends on cells of spans strictly less than L, so all shorter spans must be complete before any longer span is attempted. This is the same optimal-substructure discipline as Viterbi, which fills column by column for the same reason."},
  {id:"fq_cky7", d:"difficult",
   q:"Q2-style, 4 marks. Grammar: S -> NP VP · NP -> DT NN | NN · VP -> VB NP · DT -> the · NN -> chef | rice · VB -> cooks. Build the full CKY table for “the chef cooks rice” and state the conclusion.",
   a:"Words: 1 the · 2 chef · 3 cooks · 4 rice.\nSPAN 1 (apply the unit rule NP -> NN on the diagonal):\n [1,1] the   -> DT\n [2,2] chef  -> NN, and via NP -> NN also NP\n [3,3] cooks -> VB\n [4,4] rice  -> NN, and via NP -> NN also NP\nSPAN 2:\n [1,2] DT(1,1) + NN(2,2), rule NP -> DT NN -> NP ✓\n [2,3] NN/NP + VB — no rule -> empty\n [3,4] VB(3,3) + NP(4,4), rule VP -> VB NP -> VP ✓\nSPAN 3:\n [1,3] splits: DT+[2,3] empty; NP(1,2)+VB(3,3) — S needs a VP, not VB -> empty\n [2,4] splits: NN/NP(2,2)+VP(3,4) — S -> NP VP applies! -> S\n   (this is the sub-sentence 'chef cooks rice', legitimately an S)\nSPAN 4:\n [1,4] split after word 2: NP(1,2) + VP(3,4), rule S -> NP VP -> S ✓\n\n         the      chef      cooks     rice\n   1 │   DT    │   NP    │    —    │    S    │\n   2 │         │  NN,NP  │    —    │    S    │\n   3 │         │         │   VB    │   VP    │\n   4 │         │         │         │  NN,NP  │\n\nCONCLUSION: S appears in the top-right cell [1,4], so “the chef cooks rice” belongs to the grammar.\nNote the S in cell [2,4]: CKY builds EVERY constituent over every span, including sub-sentences that are not part of the final parse. That is normal, and is the standard criticism of bottom-up parsing — it does work the goal never needed."}]
},
{
 id:"f_lmd", m:"m3", q:"Q2", marks:4, topic:"3.3", title:"Leftmost Derivation and Parse Tree",
 why:"Its own practice slide, marked “in MSE” in the class notes, AND a previous-paper question with a published rubric that awards marks for the rule NUMBERING.",
 pattern:{
  src:"practice.pptx slide 15",
  q:"Consider the following CFG and apply the leftmost derivation, then construct the corresponding parse tree.\n\n  S  -> NP VP\n  NP -> DT NN\n  VP -> VB NP PP\n  PP -> Prep NP\n  DT -> The | a\n  NN -> teacher | lesson | classroom\n  VB -> conducts\n  Prep -> in\n\nSentence: “The teacher conducts a lesson in the classroom.”",
  steps:[
   "STEP 1 — LABEL every grammar rule with a number. The official rubric gives marks for this:\n  S  -> NP VP                              (1)\n  NP -> DT NN                              (2)\n  VP -> VB NP PP                           (3)\n  PP -> Prep NP                            (4)\n  DT -> The (5) | a (6)\n  NN -> teacher (7) | lesson (8) | classroom (9)\n  VB -> conducts                           (10)\n  Prep -> in                               (11)",
   "STEP 2 — LEFTMOST DERIVATION. At every step rewrite the LEFT-MOST non-terminal, citing the rule number:\n\n  S\n  => NP VP                                            (1)\n  => DT NN VP                                         (2)\n  => The NN VP                                        (5)\n  => The teacher VP                                   (7)\n  => The teacher VB NP PP                             (3)\n  => The teacher conducts NP PP                       (10)\n  => The teacher conducts DT NN PP                    (2)\n  => The teacher conducts a NN PP                     (6)\n  => The teacher conducts a lesson PP                 (8)\n  => The teacher conducts a lesson Prep NP            (4)\n  => The teacher conducts a lesson in NP              (11)\n  => The teacher conducts a lesson in DT NN           (2)\n  => The teacher conducts a lesson in the NN          (5)\n  => The teacher conducts a lesson in the classroom   (9)",
   "STEP 3 — PARSE TREE, annotating each node with its rule number:\n\n                             S (1)\n                     /                 \\\n                NP (2)                  VP (3)\n                /    \\           /        |         \\\n           DT(5)   NN(7)     VB(10)     NP(2)        PP(4)\n             |        |         |       /    \\       /     \\\n            The   teacher   conducts DT(6) NN(8) Prep(11)  NP(2)\n                                       |     |      |      /    \\\n                                       a  lesson    in  DT(5)  NN(9)\n                                                          |       |\n                                                         the  classroom"],
  answer:"14 derivation steps; rule sequence 1, 2, 5, 7, 3, 10, 2, 6, 8, 4, 11, 2, 5, 9.\nThe string IS generated by the grammar, so it belongs to the language.\n\nNote that rule (2) NP -> DT NN is used THREE times and rule (5) DT -> The twice. Reusing a rule is normal — do NOT invent new numbers for repeats.\nThe rubric rewards: correct rule labelling, a strictly leftmost derivation with numbers cited, and a correctly annotated tree."},
 questions:[
  {id:"fq_lmd1", d:"easy",
   q:"Grammar: S -> NP VP (1) · NP -> Det N (2) · VP -> V NP (3) · Det -> the (4) | a (5) · N -> boy (6) | dog (7) · V -> sees (8). Give the leftmost derivation of “the boy sees a dog”.",
   a:"S\n=> NP VP                 (1)\n=> Det N VP              (2)\n=> the N VP              (4)\n=> the boy VP            (6)\n=> the boy V NP          (3)\n=> the boy sees NP       (8)\n=> the boy sees Det N    (2)\n=> the boy sees a N      (5)\n=> the boy sees a dog    (7)\nNine steps; rule sequence 1, 2, 4, 6, 3, 8, 2, 5, 7."},
  {id:"fq_lmd2", d:"medium",
   q:"PREVIOUS PAPER. Grammar: S -> NP VP (1) · NP -> DT NN (2) · VP -> VB NN (3) · DT -> a (4) | the (5) · NN -> Man(6)|Woman(7)|Panda(8)|Lion(9)|leaves(10) · VB -> eats(11)|shoots(12)|leaves(13). Derive “The Panda eats leaves” and draw the tree.",
   a:"S\n=> NP VP                        (1)\n=> DT NN VP                     (2)\n=> The NN VP                    (5)\n=> The Panda VP                 (8)\n=> The Panda VB NN              (3)\n=> The Panda eats NN            (11)\n=> The Panda eats leaves        (10)\n\nPARSE TREE:\n              S (1)\n           /        \\\n       NP (2)       VP (3)\n       /   \\        /    \\\n   DT(5)  NN(8)  VB(11)  NN(10)\n     |      |      |       |\n    The   Panda  eats   leaves\n\nNote 'leaves' is ambiguous in this grammar — it is NN (rule 10) and VB (rule 13). Here it fills the object slot, so rule 10 applies. This is the official key's derivation and numbering."},
  {id:"fq_lmd3", d:"medium",
   q:"Using the teacher/classroom grammar, give the leftmost derivation of “A teacher conducts the lesson in a classroom”.",
   a:"S\n=> NP VP                                            (1)\n=> DT NN VP                                         (2)\n=> A NN VP                                          (6)\n=> A teacher VP                                     (7)\n=> A teacher VB NP PP                               (3)\n=> A teacher conducts NP PP                         (10)\n=> A teacher conducts DT NN PP                      (2)\n=> A teacher conducts the NN PP                     (5)\n=> A teacher conducts the lesson PP                 (8)\n=> A teacher conducts the lesson Prep NP            (4)\n=> A teacher conducts the lesson in NP              (11)\n=> A teacher conducts the lesson in DT NN           (2)\n=> A teacher conducts the lesson in a NN            (6)\n=> A teacher conducts the lesson in a classroom     (9)\nSame 14-step shape as the pattern; only the determiner choices (5 and 6) swap."},
  {id:"fq_lmd4", d:"difficult",
   q:"A student derives: S => NP VP => NP VB NP PP => DT NN VB NP PP => … Is this a valid leftmost derivation? Explain precisely.",
   a:"NO. The second step expands VP while NP is still unexpanded and stands to its LEFT.\nA leftmost derivation must, at every step, rewrite the LEFT-MOST non-terminal in the current sentential form. In 'NP VP' the leftmost non-terminal is NP, so the only legal second step is NP -> DT NN, giving 'DT NN VP'.\nIS THE STUDENT'S DERIVATION WRONG IN OUTPUT? No — it will reach the same terminal string and the same parse TREE, because a CFG derivation's end result does not depend on expansion order. What is wrong is that it is not a LEFTMOST derivation, which is what the question asked for.\nWHY THE EXAMINER CARES: leftmost derivation is a canonical form. Fixing the order makes the derivation unique for an unambiguous grammar, so two different leftmost derivations of the same string PROVE the grammar is ambiguous. That diagnostic is lost if the order is arbitrary.\nMarks: the rubric says 'correct leftmost derivation'; an out-of-order derivation typically scores partial."},
  {id:"fq_lmd5", d:"difficult",
   q:"Using the teacher/classroom grammar, is “The teacher conducts a lesson” in the language? Prove your answer.",
   a:"NO. Proof by exhaustion of the derivation:\nS => NP VP is the only S rule.\nNP => DT NN is the only NP rule, consuming 'The teacher'.\nVP => VB NP PP is the ONLY VP rule. It requires THREE constituents: a verb, a noun phrase, AND a prepositional phrase.\n VB => conducts consumes 'conducts'.\n NP => DT NN consumes 'a lesson'.\n PP => Prep NP now REQUIRES a preposition followed by a noun phrase — at minimum three more words (in + DT + NN). The input has none left.\nSo the derivation cannot terminate and the string is NOT in the language.\nDIAGNOSIS: the grammar has no intransitive or two-argument VP rule. Adding VP -> VB NP would admit this sentence.\nEXAM NOTE: always check the word count against the rules before deriving. Here the shortest string VP can generate is VB + DT NN + Prep DT NN = 6 words, so with 'The teacher' the shortest sentence in this language is 8 words — 'The teacher conducts a lesson' has only 5."},
  {id:"fq_lmd6", d:"difficult",
   q:"Add NP -> NP PP to the teacher grammar. Show that “The teacher conducts a lesson in the classroom” now has TWO leftmost derivations, and say what that proves.",
   a:"Label the new rule NP -> NP PP as (12).\nDERIVATION A — PP attaches to the VP (the original): the conducting happens in the classroom.\n S => NP VP (1) => … => The teacher VB NP PP (3) => … => The teacher conducts a lesson in the classroom\n Here VP -> VB NP PP supplies the PP as a sister of the verb.\nDERIVATION B — PP attaches to the object NP: the lesson-in-the-classroom is what is conducted.\n This needs a VP rule without a PP, so also add VP -> VB NP (13).\n S => NP VP (1) => DT NN VP (2) => The NN VP (5) => The teacher VP (7)\n   => The teacher VB NP (13) => The teacher conducts NP (10)\n   => The teacher conducts NP PP (12)          <- the new rule\n   => The teacher conducts DT NN PP (2) => The teacher conducts a NN PP (6)\n   => The teacher conducts a lesson PP (8) => … => The teacher conducts a lesson in the classroom\nSame terminal string, two DIFFERENT leftmost derivations, and therefore two different PARSE TREES.\nWHAT IT PROVES: the grammar is now STRUCTURALLY AMBIGUOUS. This is exactly the PP-attachment ambiguity from Module 1, appearing as a formal property of the grammar. A plain CFG cannot choose between the trees; a PCFG can, by comparing their probabilities — which is precisely why 3.3 introduces PCFGs after CFGs."},
  {id:"fq_lmd7", d:"difficult",
   q:"Q2-style, 4 marks. Grammar: S -> NP VP · NP -> DT NN · VP -> VB PP · PP -> Prep NP · DT -> The|the · NN -> train|station · VB -> arrives · Prep -> at. Label the rules, derive “The train arrives at the station” leftmost, and draw the annotated tree.",
   a:"STEP 1 — LABEL:\n S -> NP VP        (1)\n NP -> DT NN       (2)\n VP -> VB PP       (3)\n PP -> Prep NP     (4)\n DT -> The (5) | the (6)\n NN -> train (7) | station (8)\n VB -> arrives     (9)\n Prep -> at        (10)\n\nSTEP 2 — LEFTMOST DERIVATION:\n S\n => NP VP                                    (1)\n => DT NN VP                                 (2)\n => The NN VP                                (5)\n => The train VP                             (7)\n => The train VB PP                          (3)\n => The train arrives PP                     (9)\n => The train arrives Prep NP                (4)\n => The train arrives at NP                  (10)\n => The train arrives at DT NN               (2)\n => The train arrives at the NN              (6)\n => The train arrives at the station         (8)\n Eleven steps; sequence 1, 2, 5, 7, 3, 9, 4, 10, 2, 6, 8.\n\nSTEP 3 — PARSE TREE:\n                     S (1)\n                 /          \\\n            NP (2)          VP (3)\n            /    \\          /      \\\n        DT(5)  NN(7)    VB(9)     PP(4)\n          |      |        |       /     \\\n         The   train  arrives  Prep(10)  NP(2)\n                                  |      /    \\\n                                  at  DT(6)  NN(8)\n                                        |       |\n                                       the   station\n\nCONCLUSION: the string is generated by the grammar, so it belongs to the language."}]

 pattern:{

  q:"Compute the perplexity of “The storm causes heavy damage” by considering the bigram model from the following text:\n\n“The storm causes damage. The storm brings heavy rain. Heavy rain causes damage. The storm causes heavy damage. The rain causes flooding. The flooding causes damage.”",
  steps:[
   "STEP 1 — rewrite the corpus with sentence boundary markers (six sentences):\n  <s> The storm causes damage </s>\n  <s> The storm brings heavy rain </s>\n  <s> Heavy rain causes damage </s>\n  <s> The storm causes heavy damage </s>\n  <s> The rain causes flooding </s>\n  <s> The flooding causes damage </s>\nTreat the text case-insensitively, so 'Heavy' and 'heavy' are the same word — state that.",
   "STEP 2 — list the bigrams of the TEST sentence <s> The storm causes heavy damage </s>:\n  [<s>, The] · [The, storm] · [storm, causes] · [causes, heavy] · [heavy, damage] · [damage, </s>]",
   "STEP 3 — compute each bigram probability, P(wᵢ|wᵢ₋₁) = c(wᵢ₋₁, wᵢ) / c(wᵢ₋₁):\n\n  c(<s>) = 6,  c(<s>, The) = 5   (five of six sentences start with 'The')\n     P(The | <s>) = 5/6 = 0.8333\n  c(The) = 5,  c(The, storm) = 3   (sentences 1, 2, 4)\n     P(storm | The) = 3/5 = 0.6\n  c(storm) = 3,  c(storm, causes) = 2   (sentences 1 and 4; sentence 2 has 'storm brings')\n     P(causes | storm) = 2/3 = 0.6667\n  c(causes) = 5,  c(causes, heavy) = 1   (only sentence 4)\n     P(heavy | causes) = 1/5 = 0.2\n  c(heavy) = 3,  c(heavy, damage) = 1   (only sentence 4)\n     P(damage | heavy) = 1/3 = 0.3333\n  c(damage) = 4,  c(damage, </s>) = 4   (damage always ends its sentence)\n     P(</s> | damage) = 4/4 = 1",
   "STEP 4 — multiply to get P(W):\n  P(W) = 5/6 × 3/5 × 2/3 × 1/5 × 1/3 × 1\n  Cancel as you go:  (5/6)(3/5) = 1/2 ·  (1/2)(2/3) = 1/3 ·  (1/3)(1/5) = 1/15 ·  (1/15)(1/3) = 1/45\n  P(W) = 1/45 ≈ 0.02222",
   "STEP 5 — perplexity, with N = 5 (the number of WORDS in the test sentence):\n  PP(W) = P(W)^(−1/N) = ⁵√(1/P(W)) = ⁵√45\n  log₁₀45 = 1.6532 ; ÷5 = 0.33064 ; 10^0.33064 = 2.1414"],

 questions:[
  {id:"fq_pp1", d:"easy",
   q:"A 4-word test sentence has P(W) = 1/81 under a bigram model. Compute the perplexity and say what the number means.",
   a:"PP = (1/P(W))^(1/N) = 81^(1/4) = 3.\nMEANING: the model is, on average, choosing among about 3 equally likely next words at each position — its average branching factor is 3."},
  {id:"fq_pp2", d:"medium",
   q:"PREVIOUS PAPER. Compute the perplexity of “I like sweets” from: “I like many things to eat. I like cake. I like biscuits. And, yes, sweets. I do like them. I like jam. It is like sweets.”",
   a:"Seven sentences with boundaries; c(<s>) = 7.\nBigrams of the test sentence: [<s>,I] [I,like] [like,sweets] [sweets,</s>]\n P(I|<s>)      = c(<s> I)/c(<s>)      = 5/7 = 0.715\n P(like|I)     = c(I like)/c(I)       = 4/5 = 0.8\n P(sweets|like)= c(like sweets)/c(like)= 1/6 = 0.167\n P(</s>|sweets)= c(sweets </s>)/c(sweets) = 2/2 = 1\nP(W) = 0.715 × 0.8 × 0.167 × 1 = 0.095524\nN = 3 words, so PP(W) = ³√(1/0.095524) = ³√10.469 = 2.188\nThese are the official key's exact figures, including its rounding of 5/7 to 0.715."},
  {id:"fq_pp3", d:"medium",
   q:"Using the storm corpus, compute the perplexity of “The rain causes damage”.",
   a:"Bigrams: [<s>,The] [The,rain] [rain,causes] [causes,damage] [damage,</s>]\n P(The|<s>)    = 5/6 = 0.8333\n P(rain|The)   = c(The rain)/c(The) = 1/5 = 0.2      (only sentence 5)\n P(causes|rain)= c(rain causes)/c(rain) = 1/2 = 0.5  (rain occurs in s2 'heavy rain' end? no — s2 ends 'rain', s3 'rain causes'; c(rain) = 2, c(rain,causes) = 1)\n P(damage|causes) = c(causes damage)/c(causes) = 3/5 = 0.6   (s1, s3, s6)\n P(</s>|damage)= 4/4 = 1\nP(W) = 0.8333 × 0.2 × 0.5 × 0.6 × 1 = 0.05\nN = 4 words -> PP = (1/0.05)^(1/4) = 20^0.25 = 2.1147\nSlightly lower perplexity than the pattern sentence, because every bigram here is comfortably attested."},
  {id:"fq_pp4", d:"difficult",
   q:"Using the storm corpus, compute the perplexity of “The storm brings flooding”. Show what happens and what you must do about it.",
   a:"Bigrams: [<s>,The] [The,storm] [storm,brings] [brings,flooding] [flooding,</s>]\n P(The|<s>)        = 5/6 = 0.8333\n P(storm|The)      = 3/5 = 0.6\n P(brings|storm)   = c(storm brings)/c(storm) = 1/3 = 0.3333\n P(flooding|brings)= c(brings flooding)/c(brings) = 0/1 = 0     <- UNSEEN BIGRAM\n P(</s>|flooding)  = c(flooding </s>)/c(flooding) = 1/2 = 0.5\nP(W) = 0.8333 × 0.6 × 0.3333 × 0 × 0.5 = 0\nPP(W) = (1/0)^(1/4) -> UNDEFINED / INFINITE.\nWHAT YOU MUST DO: one unseen bigram drives the whole sentence probability to zero, so perplexity is meaningless until the model is SMOOTHED. Redo with Laplace. The vocabulary of the corpus is {The, storm, causes, damage, brings, heavy, rain, flooding} = 8 types, so:\n P(flooding|brings) = (0+1)/(1+8) = 1/9 = 0.1111\n and every other factor must be recomputed with add-one too:\n P(The|<s>) = (5+1)/(6+8) = 6/14 = 0.4286\n P(storm|The) = (3+1)/(5+8) = 4/13 = 0.3077\n P(brings|storm) = (1+1)/(3+8) = 2/11 = 0.1818\n P(</s>|flooding) = (1+1)/(2+8) = 2/10 = 0.2\n P(W) = 0.4286 × 0.3077 × 0.1818 × 0.1111 × 0.2 = 0.00053280\n PP = (1/0.00053280)^(1/4) = 1876.88^(1/4) = 6.582\nSHOW THE ZERO, NAME THE CAUSE, THEN REDO IT SMOOTHED — that is the full-marks route."},
  {id:"fq_pp5", d:"difficult",
   q:"Two students compute the perplexity of “The storm causes heavy damage” and get 2.141 and 1.921. Neither made an arithmetic error. Explain, and say which to write.",
   a:"Both multiplied the same six bigram factors to get P(W) = 1/45.\nSTUDENT A took N = 5, the number of WORDS in the test sentence: PP = 45^(1/5) = 2.1414.\nSTUDENT B took N = 6, the number of predicted TOKENS (the five words plus </s>): PP = 45^(1/6) = 1.8712... which is not 1.921 either; for 1.921 they used N = 5.83 or a slightly different P(W).\nThe principle is what matters: PP = P(W)^(−1/N), so the answer depends entirely on what N counts. Both conventions appear in the literature — if you count </s> as a predicted token then it should also be counted in N, which is internally consistent.\nWHAT IS NOT ACCEPTABLE: multiplying six factors and dividing by an N chosen for a different convention.\nWHICH TO WRITE: follow the class and the official key — N = the number of WORDS in the test sentence (so N = 5 here, PP ≈ 2.141) — and add one line: “N = 5, the number of words in the test sentence; the </s> factor is included in P(W) but not counted in N.” The examiner can then follow you."},
  {id:"fq_pp6", d:"difficult",
   q:"Compute the UNIGRAM perplexity of “The storm causes heavy damage” on the storm corpus and compare it with the bigram value of 2.141. What does the comparison show?",
   a:"UNIGRAM: exclude the boundary markers (the class rule written in red).\nToken counts across the six sentences:\n The 5 · storm 3 · causes 5 · damage 4 · brings 1 · heavy 3 · rain 2 · flooding 2\n N = 5+3+5+4+1+3+2+2 = 25 tokens.\nUnigram probabilities of the test words:\n P(The) = 5/25 = 0.2 · P(storm) = 3/25 = 0.12 · P(causes) = 5/25 = 0.2\n P(heavy) = 3/25 = 0.12 · P(damage) = 4/25 = 0.16\nP(W) = 0.2 × 0.12 × 0.2 × 0.12 × 0.16 = 0.00009216\nN = 5 -> PP = (1/0.00009216)^(1/5) = 10850.7^0.2\n log₁₀10850.7 = 4.03546 ; ÷5 = 0.80709 ; 10^0.80709 = 6.414\nUNIGRAM PP ≈ 6.41  versus  BIGRAM PP ≈ 2.14.\nWHAT IT SHOWS: the bigram model is three times less 'surprised' by this sentence, because it has learnt which words FOLLOW which. The unigram model is order-blind — it would assign the identical probability to “damage heavy causes storm The”, whereas the bigram model would give that scrambling a probability of zero.\nThis is exactly the class's closing note: “unigram is not good enough, since it takes no word history — so bigram would be better for these types of questions.”"},
  {id:"fq_pp7", d:"difficult",
   q:"Q3-style, 5 marks. Compute the bigram perplexity of “The chef cooks rice” from: “The chef cooks rice. The chef serves rice. A waiter serves food. The chef cooks food.” Show all four steps.",
   a:"STEP 1 — corpus with boundaries (four sentences), case-insensitive:\n <s> The chef cooks rice </s>\n <s> The chef serves rice </s>\n <s> A waiter serves food </s>\n <s> The chef cooks food </s>\n\nSTEP 2 — bigrams of the test sentence <s> The chef cooks rice </s>:\n [<s>,The] [The,chef] [chef,cooks] [cooks,rice] [rice,</s>]\n\nSTEP 3 — bigram probabilities:\n c(<s>) = 4, c(<s>,The) = 3      -> P(The|<s>)   = 3/4 = 0.75\n c(The) = 3, c(The,chef) = 3     -> P(chef|The)  = 3/3 = 1\n c(chef) = 3, c(chef,cooks) = 2  -> P(cooks|chef)= 2/3 = 0.6667\n c(cooks) = 2, c(cooks,rice) = 1 -> P(rice|cooks)= 1/2 = 0.5\n c(rice) = 2, c(rice,</s>) = 2   -> P(</s>|rice) = 2/2 = 1\n\n P(W) = 3/4 × 1 × 2/3 × 1/2 × 1\n      = (3/4)(2/3) = 1/2 ; (1/2)(1/2) = 1/4\n P(W) = 1/4 = 0.25\n\nSTEP 4 — perplexity with N = 4 words:\n PP(W) = (1/0.25)^(1/4) = 4^(1/4) = √2 = 1.4142\n\nBOXED: P(W) = 0.25, PP(W) ≈ 1.414.\nINTERPRETATION: an extremely low perplexity — the test sentence is verbatim a training sentence and every bigram is well attested, so the model is barely surprised at all. Report that; a perplexity this low on training-like data is expected and is not evidence of a good general model."}]

{
 id:"f_laplace", m:"m2", q:"Q3", marks:5, topic:"2.7.2", title:"Laplace (Add-1) Smoothing",
 why:"Its own practice slide and on the class notes' “lengthy / mandatory” list. One of only three Q3 slots. The whole difficulty is the denominator.",
 pattern:{
  src:"practice.pptx slide 17",
  q:"Using Add-1 (Laplace) smoothing, calculate the smoothed probability of the test sentence “Musicians perform live concerts”.\n\nTraining corpus:\n“Musicians perform concerts nightly. Musicians practice new songs. Live concerts attract audiences. New songs help musicians perform better.”",
  steps:[
   "STEP 1 — corpus with boundaries (four sentences), treated case-insensitively:\n  <s> Musicians perform concerts nightly </s>\n  <s> Musicians practice new songs </s>\n  <s> Live concerts attract audiences </s>\n  <s> New songs help musicians perform better </s>",
   "STEP 2 — vocabulary size V. Count the distinct WORD types (boundary markers are NOT counted, matching the class examples):\n  musicians, perform, concerts, nightly, practice, new, songs, live, attract, audiences, help, better\n  V = 12",
   "STEP 3 — the formula, and the counts each factor needs:\n  P(wᵢ | wᵢ₋₁) = ( c(wᵢ₋₁, wᵢ) + 1 ) / ( c(wᵢ₋₁) + V )\n\n  c(<s>) = 4 · c(musicians) = 3 · c(perform) = 2 · c(live) = 1 · c(concerts) = 2",
   "STEP 4 — bigram by bigram. Note the denominator CHANGES every time:\n\n  P(Musicians | <s>) = (2 + 1)/(4 + 12) = 3/16  = 0.1875\n     ('Musicians' starts sentences 1 and 2)\n  P(perform | Musicians) = (2 + 1)/(3 + 12) = 3/15 = 0.2\n     ('musicians perform' occurs in sentences 1 and 4)\n  P(live | perform) = (0 + 1)/(2 + 12) = 1/14 = 0.0714\n     UNSEEN — 'perform live' never occurs. Rescued from zero by smoothing.\n  P(concerts | live) = (1 + 1)/(1 + 12) = 2/13 = 0.1538\n     ('Live concerts' occurs in sentence 3)",
   "STEP 5 — multiply (stopping at the last word, as the question gives no </s>):\n  P(S) = 0.1875 × 0.2 × 0.0714 × 0.1538\n  Step through: 0.1875 × 0.2 = 0.0375 · × 0.0714286 = 0.00267857 · × 0.153846 = 0.000412088",
   "If the question wants the sentence CLOSED with </s>, add\n  P(</s> | concerts) = (0 + 1)/(2 + 12) = 1/14 = 0.0714\n  giving P(S) = 0.000412088 × 0.0714286 = 0.0000294349"],
  answer:"P(“Musicians perform live concerts”) = 3/16 × 3/15 × 1/14 × 2/13 ≈ 4.121 × 10⁻⁴\n\nClosing the sentence with </s> as well:  ≈ 2.943 × 10⁻⁵\n\nState which convention you used in one line. Two things carry the marks: V = 12 stated explicitly, and a denominator recomputed for EVERY bigram — c(wᵢ₋₁) changes each time, and reusing the first denominator throughout is the standard error.\nWithout smoothing, P(live|perform) = 0 would have made the whole sentence probability zero."},
 questions:[
  {id:"fq_lap1", d:"easy",
   q:"A corpus has N = 80 tokens and V = 20 types. 'model' occurs 4 times, 'tensor' never. Give both Laplace-smoothed UNIGRAM probabilities.",
   a:"P(w) = (c(w)+1)/(N+V), denominator = 80 + 20 = 100.\nP(model)  = (4+1)/100 = 0.05\nP(tensor) = (0+1)/100 = 0.01\nUnsmoothed these were 0.05 and 0. Note 'model' barely moved while 'tensor' went from impossible to merely unlikely — that is exactly what smoothing is for."},
  {id:"fq_lap2", d:"medium",
   q:"Corpus: <s> the cat sat </s> · <s> the cat ran </s> · <s> the dog ran </s>, with V = 5 (the, cat, dog, sat, ran). Compute the Laplace-smoothed P(<s> the dog sat </s>).",
   a:"Counts: c(<s>) = 3, c(the) = 3, c(dog) = 1, c(sat) = 1.\n P(the|<s>) = (3+1)/(3+5) = 4/8 = 0.5\n P(dog|the) = (1+1)/(3+5) = 2/8 = 0.25\n P(sat|dog) = (0+1)/(1+5) = 1/6 ≈ 0.1667      <- UNSEEN, rescued\n P(</s>|sat)= (1+1)/(1+5) = 2/6 ≈ 0.3333\nP(S) = 0.5 × 0.25 × 0.1667 × 0.3333 = 0.006944 ≈ 6.94 × 10⁻³\nWithout smoothing this sentence would score exactly 0, because 'dog sat' never occurs."},
  {id:"fq_lap3", d:"medium",
   q:"Using the musicians corpus (V = 12), compute the Laplace-smoothed P(“New songs attract audiences”).",
   a:"Counts: c(<s>) = 4, c(new) = 2, c(songs) = 2, c(attract) = 1.\n P(New|<s>) = (1+1)/(4+12) = 2/16 = 0.125        (sentence 4 starts with 'New')\n P(songs|New) = (2+1)/(2+12) = 3/14 ≈ 0.2143      ('new songs' in sentences 2 and 4)\n P(attract|songs) = (0+1)/(2+12) = 1/14 ≈ 0.0714  <- UNSEEN\n P(audiences|attract) = (1+1)/(1+12) = 2/13 ≈ 0.1538  ('attract audiences' in sentence 3)\nP(S) = 0.125 × 0.2143 × 0.0714286 × 0.153846\n     = 0.125 × 0.2143 = 0.026786 · × 0.0714286 = 0.0019133 · × 0.153846 = 0.00029435\nP(S) ≈ 2.944 × 10⁻⁴"},
  {id:"fq_lap4", d:"difficult",
   q:"A student computes P(perform|Musicians) as (2+1)/(4+12) = 0.1875 for the musicians corpus. Identify the error, give the correct value, and prove the student's version cannot be a probability distribution.",
   a:"ERROR: they reused c(<s>) = 4 as the denominator instead of the count of the actual history word. The history here is 'Musicians', and c(musicians) = 3.\nCORRECT: P(perform|Musicians) = (2+1)/(3+12) = 3/15 = 0.2.\nPROOF THE STUDENT'S VERSION IS INVALID: a conditional distribution must sum to 1 over all possible next words. With the correct denominator, summing over the V = 12 vocabulary words plus </s>:\n Σ (c(musicians, w) + 1) / (c(musicians) + V) = (c(musicians) + V) / (c(musicians) + V) = 1 ✓\n because Σ c(musicians, w) over all continuations = c(musicians) = 3, and there are V pseudo-counts of 1.\nWith the student's fixed denominator of 16, the same numerators sum to 15/16 ≠ 1.\nRULE TO REMEMBER: the denominator is the count of the HISTORY you conditioned on, plus V. N + V belongs only to the UNIGRAM formula."},
  {id:"fq_lap5", d:"difficult",
   q:"Using the musicians corpus, compute P(“Musicians perform concerts”) both WITHOUT and WITH Laplace smoothing, and explain the size of the change.",
   a:"UNSMOOTHED, P(wᵢ|wᵢ₋₁) = c(wᵢ₋₁,wᵢ)/c(wᵢ₋₁):\n P(Musicians|<s>) = 2/4 = 0.5\n P(perform|Musicians) = 2/3 = 0.6667\n P(concerts|perform) = 1/2 = 0.5     ('perform concerts' in sentence 1)\n P(W) = 0.5 × 0.6667 × 0.5 = 0.16667\n\nSMOOTHED, V = 12:\n P(Musicians|<s>) = (2+1)/(4+12) = 3/16 = 0.1875\n P(perform|Musicians) = (2+1)/(3+12) = 3/15 = 0.2\n P(concerts|perform) = (1+1)/(2+12) = 2/14 = 0.142857\n P(W) = 0.1875 × 0.2 × 0.142857 = 0.005357\n\nThe smoothed probability is about 31× SMALLER.\nWHY SO LARGE A DROP: every history count here is tiny (3, 4, 2) while V = 12, so adding 12 pseudo-counts to the denominator dominates the real evidence. Add-one discounts well-attested bigrams severely in order to reserve mass for the V − 1 continuations that were never seen.\nTHE TRADE-OFF TO STATE: smoothing buys the guarantee that no sentence gets probability zero, at the cost of badly distorting the probabilities of events you DID observe. On a realistic vocabulary (V in the tens of thousands) this distortion becomes indefensible, which is why Good-Turing and backoff exist."},
  {id:"fq_lap6", d:"difficult",
   q:"Compare, for the musicians corpus, what Laplace and Good-Turing would assign to the unseen bigram 'perform live'. Which uses evidence?",
   a:"LAPLACE: P(live|perform) = (0+1)/(c(perform) + V) = 1/(2+12) = 1/14 ≈ 0.0714.\n This depends only on c(perform) and V — no evidence at all about how often NEW bigrams actually appear in this corpus. Every unseen continuation of 'perform' gets the identical value.\n\nGOOD-TURING: the total mass reserved for unseen bigrams is P*_GT(0) = N₁/N, where N₁ is the number of bigram TYPES occurring exactly once and N the total bigram tokens.\n Bigrams of the corpus (19 tokens including boundaries) are almost all unique here, so N₁ is large relative to N and Good-Turing would reserve a substantial, EVIDENCE-DRIVEN share — the corpus is telling us, through its many once-only bigrams, that it is nowhere near exhausted.\n\nWHICH USES EVIDENCE: Good-Turing. It measures novelty directly (how many things were seen exactly once) rather than assuming a fixed pseudo-count.\nGOOD-TURING'S OWN WEAKNESS: it needs a reliable frequency-of-frequencies table, and Nc is noisy or zero for larger c, which is why Simple Good-Turing smooths the Nc curve before applying c* = (c+1)·N_(c+1)/N_c.\nPRACTICAL VERDICT: Laplace is fine for small V and hand computation (which is why it is the exam method); Good-Turing or backoff is what you would actually deploy."},
  {id:"fq_lap7", d:"difficult",
   q:"Q3-style, 5 marks. Corpus: “Students write exams. Students read books. Teachers write reports. Teachers read exams.” Using Add-1 smoothing, compute P(“Students write reports”). State V explicitly.",

{
 heading:"★ Zipf's Law &amp; Heap's Law", page:"p.7",
 blocks:[
  {t:"p", v:"<b>I) Zipf's Law</b>"},
  {t:"formula", v:"f ∝ 1/r        f · r = K\n\nm ∝ 1/√r   ;   m ∝ √f        where m = no. of meanings"},
  {t:"p", v:"<b>II) Heap's Law</b>"},
  {t:"formula", v:"|V| = K × N^β        (β = 0.4 – 0.6)"},
  {t:"warn", v:"Professor's margin note: &ldquo;<b>No sums about this — just know about Heap's.</b>&rdquo; So Heap's Law is a theory/definition answer only; Zipf's Law <b>is</b> examinable as a sum (MSE Q1e)."},
  {t:"ex",
   q:"r₁ = 20, f₁ = 1896. &nbsp;r₂ = 8, f₂ = ?",
   a:"f ∝ 1/r  ⇒  f·r = K<br>f₁·r₁ = K → 1896 × 20 = 37920 = K<br>f₂·r₂ = K → f₂ × 8 = 37920<br><b>∴ f₂ = 4740</b>"},
  {t:"ex",
   q:"m<sub>r</sub> = 20 ; m<sub>E</sub> = 30. &nbsp;Find r₁ : r₂.",
   a:"m ∝ 1/√r  ⇒  m₁/m₂ = √r₂ / √r₁<br>20/30 = √(r₂/r₁)<br>(20/30)² = r₂/r₁ → 400/900 = 4/9<br><b>∴ r₁ : r₂ = 9 : 4</b>"},
  {t:"p", v:"<b>Also on this page:</b> a DFA example — M = ( {q₀, q₁, q₂}, {0,1}, δ, q₀, {q₁} ) with its state diagram (self-loop 0 on q₀, 1 between q₀↔q₁, q₂ reachable on 1 with a 0 self-loop)."}
 ]

{
 heading:"N-gram Language Models — Derivation", page:"p.9–p.10 · 6/8/26",
 blocks:[
  {t:"p", v:"<i>ex:</i> Consider S → w₁ w₂ w₃ w₄ &nbsp;&mdash;&nbsp; &ldquo;I live in Mumbai and I love to ____&rdquo;"},
  {t:"list", v:[
   "<b>P(W)</b> or <b>P(S)</b> = P(w₁, w₂, w₃, … wₙ) &nbsp;&mdash;(1)&nbsp; the <b>joint / sentence probability</b>",
   "<b>P(w₄)</b> → the <b>conditional probability</b> / probability of the upcoming word"
  ]},
  {t:"p", v:"<b>Apply the chain rule:</b>"},
  {t:"formula", v:"P(B|A) = P(A,B) / P(A)\n\nP(x₁, x₂, … xₙ) = P(x₁) P(x₂|x₁) P(x₃|x₁,x₂) … P(xₙ|x₁ … xₙ₋₁)\n\n⇒ P(w₁, w₂ … wₙ) = ∏ᵢ P(wᵢ | w₁, w₂, … wᵢ₋₁)     —(3)"},
  {t:"p", v:"<b>Apply the Markov assumption on eqn (3):</b>"},
  {t:"note", v:"<b>Markov Assumption</b> says that the probability of the next word depends <b>only on a limited no. of recent previous words</b>, not on the entire history. For that we use the <b>N-GRAM language model</b>."},
  {t:"p", v:"<b>i) Unigram model</b>"},
  {t:"formula", v:"P(w₁ w₂ … wₙ) ≈ ∏ᵢ P(wᵢ)          P(wᵢ) = count(wᵢ) / N(tokens)"},
  {t:"warn", v:"Header note written across the top of the page: <b>ONLY IN UNIGRAM, WE WON'T CONSIDER THE SENTENCE BOUNDARY MARKERS &lt;s&gt; / &lt;/s&gt;.</b>"},
  {t:"p", v:"<b>ii) Bigram model</b> — considers a <b>one-word history</b>."},
  {t:"formula", v:"P(wᵢ | w₁, w₂ … wᵢ₋₁) ≈ P(wᵢ | wᵢ₋₁) = count(wᵢ₋₁, wᵢ) / count(wᵢ₋₁)"},
  {t:"p", v:"<b>iii) Trigram model</b> — <b>two-word history</b>."},
  {t:"formula", v:"P(w₃ | w₁, w₂) = c(wᵢ₋₂, wᵢ₋₁, wᵢ) / c(wᵢ₋₂, wᵢ₋₁)"},
  {t:"p", v:"<b>iv) Four-gram model</b> — <b>three-word history</b>."},
  {t:"formula", v:"P(w₄ | w₁, w₂, w₃)"},
  {t:"warn", v:"Margin note (11/8): <b>No numericals on tri- &amp; four-gram.</b> Know the formulas and the &lsquo;most probable next word&rsquo; reasoning, but the calculation-heavy sums will be bigram."}
 ]
},
{
 heading:"N-gram — Worked Sums", page:"p.10–p.11",
 blocks:[
  {t:"ex",
   q:"<b>Corpus:</b> &lt;s&gt; I like NLP &lt;/s&gt; · &lt;s&gt; I like Blockchain &lt;/s&gt; · &lt;s&gt; Sam likes NLP &lt;/s&gt;<br><b>i)</b> Calculate the unigram probability of the given words.",
   a:"<b>Step 1 — frequency table</b><br>I:2 · like:2 · NLP:2 · Blockchain:1 · Sam:1 · likes:1<br>&lt;s&gt;:3 · &lt;/s&gt;:3 &nbsp;<i>(sentence boundary markers — <b>not used here</b>)</i><br><b>tokens N = 9</b><br><br><b>Step 2 — P(wᵢ) = c(wᵢ)/N</b><br>P(I) = 2/9 · P(like) = 2/9 · P(NLP) = 2/9<br>P(Blockchain) = 1/9 · P(Sam) = 1/9 · P(likes) = 1/9"},
  {t:"ex",
   q:"<b>ii)</b> Calculate the sentence probability of &lsquo;I like NLP&rsquo; (unigram).",
   a:"P(S) = ∏ P(wᵢ) = P(I) × P(like) × P(NLP)<br>= 2/9 × 2/9 × 2/9 = <b>8/729 ≈ 0.011</b>"},
  {t:"ex",
   q:"Calculate the <b>bigram</b> probability of &lt;s&gt; I like NLP &lt;/s&gt; on the same corpus.",
   a:"w₁: P(I | &lt;s&gt;) = c(&lt;s&gt;, I)/c(&lt;s&gt;) = <b>2/3</b><br>w₂: P(like | I) = c(I, like)/c(I) = 2/2 = <b>1</b><br>w₃: P(NLP | like) = c(like, NLP)/c(like) = <b>1/2</b><br>w₄: P(&lt;/s&gt; | NLP) = c(NLP, &lt;/s&gt;)/c(NLP) = 2/2 = <b>1</b><br><br>P(sentence) = 2/3 × 1 × 1/2 × 1 = <b>1/3 ≈ 0.33</b>"}
 ]

{
 heading:"Most Probable Next Word", page:"p.11–p.12",
 blocks:[
  {t:"p", v:"<b>Q.</b> What is the most probable next word predicted by the model from the following word sequences?"},
  {t:"p", v:"<b>Corpus (7 sentences):</b><br>&lt;s&gt; I am Henry &lt;/s&gt;<br>&lt;s&gt; I like college &lt;/s&gt;<br>&lt;s&gt; Do Henry like college &lt;/s&gt;<br>&lt;s&gt; Henry I am &lt;/s&gt;<br>&lt;s&gt; Do I like Henry &lt;/s&gt;<br>&lt;s&gt; Do I like college &lt;/s&gt;<br>&lt;s&gt; I do like college &lt;/s&gt;"},
  {t:"p", v:"<b>Frequency table</b> — I:6 · am:2 · Henry:5 · like:5 · college:3 · Do:4 · &lt;s&gt;:7 · &lt;/s&gt;:7 &nbsp;·&nbsp; <b>tokens = 39</b>"},
  {t:"ex",
   q:"<b>i)</b> &ldquo;Do ___ ?&rdquo; &nbsp;<i>(bigram)</i>",
   a:"P(Henry | Do) = c(Do,Henry)/c(Do) = 1/4 = 0.25<br>P(I | Do) = c(Do,I)/c(Do) = 2/4 = <b>0.5</b><br>P(like | Do) = c(Do,like)/c(Do) = 1/4 = 0.25<br><br><b>∴ &lsquo;I&rsquo; is the most probable word to come after &lsquo;Do&rsquo;.</b>"},
  {t:"ex",
   q:"<b>ii)</b> &ldquo;&lt;s&gt; I like Henry ___ ?&rdquo; &nbsp;<i>(bigram)</i>",
   a:"P(&lt;/s&gt; | Henry) = c(Henry, &lt;/s&gt;)/c(Henry) = <b>3/5</b><br>P(like | Henry) = 1/5<br>P(I | Henry) = 1/5<br><br><b>∴ &lt;/s&gt; is the most probable word</b> (the sentence ends)."},
  {t:"ex",
   q:"<b>iii)</b> &ldquo;&lt;s&gt; Do I like ___ ?&rdquo; &nbsp;<i>(trigram)</i>",
   a:"P(wᵢ | wᵢ₋₂, wᵢ₋₁) = c(wᵢ₋₂, wᵢ₋₁, wᵢ) / c(wᵢ₋₂, wᵢ₋₁)<br>c(I, like) = 3<br>P(college | I, like) = c(I, like, college)/c(I, like) = <b>2/3</b><br>P(Henry | I, like) = c(I, like, Henry)/c(I, like) = 1/3<br><br><b>∴ &lsquo;college&rsquo; is the most probable word.</b>"},
  {t:"ex",
   q:"<b>iv)</b> &ldquo;&lt;s&gt; Do I like college ___ ?&rdquo; &nbsp;<i>(four-gram)</i>",
   a:"P(wᵢ | wᵢ₋₃, wᵢ₋₂, wᵢ₋₁) = c(wᵢ₋₃, wᵢ₋₂, wᵢ₋₁, wᵢ) / c(wᵢ₋₃, wᵢ₋₂, wᵢ₋₁)<br>P(&lt;/s&gt; | Do, I, like, college) = c(Do, I, like, college, &lt;/s&gt;) / c(Do, I, like, college) = <b>1</b>"}
 ]
},
{

 blocks:[
  {t:"ex",
   q:"Which of the following sentences gets the higher probability using <b>bigram</b>?<br>S₁ = &lt;s&gt; I like college &lt;/s&gt;<br>S₂ = &lt;s&gt; Do I like Henry &lt;/s&gt;<br><i>(scored against the 7-sentence Henry/college corpus above)</i>",

 ]

{
 heading:"Zero Probability Problem &amp; Laplace Smoothing", page:"p.13",
 blocks:[
  {t:"p", v:"<b># Zero probability problem</b> — if a sentence contains a zero-probability word / N-gram, its <b>entire sentence probability becomes zero</b>."},
  {t:"p", v:"<b>Smoothing</b> is required when we need to prevent zero probabilities for unseen words / N-grams."},
  {t:"p", v:"<b>⇒ Solution: Smoothing techniques</b>"},
  {t:"p", v:"<b>i) Laplace Smoothing / Add-one smoothing</b> — adds 1 to every n-gram count to avoid zero probability."},
  {t:"formula", v:"unigram :   P(w | class) = ( c(w) + 1 ) / ( N + |V| )\n\nbigram  :   P(wᵢ | wᵢ₋₁) = ( c(wᵢ₋₁, wᵢ) + 1 ) / ( c(wᵢ₋₁) + |V| )\n\nc  → count        |V| → vocabulary size / types        N → tokens"},
  {t:"note", v:"Margin notes: the <b>unigram</b> form is used &ldquo;when we want to segregate words&rdquo; (classification — Naïve Bayes); the <b>bigram</b> form is used for &ldquo;calculating the probability of sentences&rdquo;."}
 ]
},
{
 heading:"Laplace Smoothing — Worked Sums", page:"p.14",
 blocks:[
  {t:"ex",
   q:"For the given corpus compute the smoothed probability of the test sentence.<br><b>Corpus:</b> &lt;s&gt; I am Sam &lt;/s&gt; · &lt;s&gt; Sam I am &lt;/s&gt; · &lt;s&gt; I do not like Sam &lt;/s&gt;<br><b>Test sentence:</b> &lt;s&gt; I am Sam &lt;/s&gt;",
   a:"<b>Word | Freq:</b> &lt;s&gt;:3 · &lt;/s&gt;:3 · I:3 · am:2 · Sam:3 &nbsp;&nbsp;<b>V = types = 6</b><br><br>P(wᵢ|wᵢ₋₁) = ( c(wᵢ₋₁,wᵢ) + 1 ) / ( c(wᵢ₋₁) + V )<br><br>P(I | &lt;s&gt;) = (2+1)/(3+6) = 3/9 = <b>1/3</b><br>P(am | I) = (2+1)/(3+6) = 3/9 = <b>1/3</b><br>P(Sam | am) = (1+1)/(2+6) = 2/8 = <b>1/4</b><br>P(&lt;/s&gt; | Sam) = (2+1)/(3+6) = 3/9 = <b>1/3</b><br><br>P(S) = 1/3 × 1/3 × 1/4 × 1/3 <b>≈ 0.009</b>"},
  {t:"ex",
   q:"For the given corpus compute the smoothed probability of:<br>i) P(here|I) &nbsp; ii) P(it|I) &nbsp; iii) P(happy|I) &nbsp; iv) P(I|I)<br><b>Corpus:</b> &lt;s&gt; I am here &lt;/s&gt; · &lt;s&gt; I like it &lt;/s&gt; · &lt;s&gt; I am happy &lt;/s&gt;",
   a:"<b>Word | Freq:</b> &lt;s&gt;:3 · &lt;/s&gt;:3 · I:3 · am:2 · here:1 · like:1 · it:1 · happy:1<br><b>V = 6, N = 9</b><br><i>Margin note: since the class is not mentioned, we use <b>bigram</b>.</i><br><br>P(wᵢ|wᵢ₋₁) = ( c(wᵢ₋₁,wᵢ) + 1 ) / ( c(wᵢ₋₁) + V )<br><br>P(here | I) = (0+1)/(3+6) = <b>1/9</b><br>P(it | I) = (0+1)/(3+6) = <b>1/9</b><br>P(happy | I) = (0+1)/(3+6) = <b>1/9</b><br>P(I | I) = (0+1)/(3+6) = <b>1/9</b>"},
  {t:"note", v:"The notebook first tried the <b>unigram</b> form here — P(here|I) = (1+1)/(9+6) = 2/15 — then struck it out and redid it with the <b>bigram</b> form. The bigram answer (1/9) is the one to reproduce: the question asks for P(here | I), a conditional on a previous word, so the bigram formula is the correct one."}
 ]
},
{
 heading:"Naïve Bayes Classification", page:"p.15",
 blocks:[
  {t:"formula", v:"P(w | class) = ( c(w) + 1 ) / ( N + V )\n\nP(document | class) = ∏ P(wᵢ | class)"},
  {t:"ex",
   q:"<b>Naïve Bayes Spam Filter.</b> Vocabulary size = 8. Test if the given email is spam / ham.<br><br><b>Word | Count in SPAM:</b> Free:6 · Money:5 · Win:4 · Click:3 · Prize:2 · Meeting:0 · Project:0 · Launch:0 &nbsp;&nbsp;<b>Total tokens = 20</b><br><br><b>Test email:</b> &lsquo;win free money meeting&rsquo;",
   a:"<b>V = 8, N = 20</b><br>P(w | class) = ( c(w)+1 ) / ( N+V )<br><br>P(win | SPAM) = (4+1)/(8+20) = <b>5/28</b><br>P(free | SPAM) = (6+1)/(8+20) = 7/28 = <b>1/4</b><br>P(money | SPAM) = (5+1)/(8+20) = <b>6/28</b><br>P(meeting | SPAM) = (0+1)/28 = <b>1/28</b><br><br>P(email | SPAM) = 5/28 × 7/28 × 6/28 × 1/28<br><b>= 3.42 × 10⁻⁴</b>"},
  {t:"note", v:"Notice &lsquo;meeting&rsquo; has count 0 in SPAM — without add-1 smoothing the whole product would collapse to zero. That is exactly the zero-probability problem this technique exists to fix, and it's worth writing that sentence in the answer."},
  {t:"ex",
   q:"<b>Sentiment Analysis of a Product Review.</b> Classify a review as POSITIVE or NEGATIVE using Naïve Bayes. N = 25, V = 10.<br><br><b>Word | Count in POSITIVE:</b> great:8 · love:6 · excellent:5 · perfect:4 · amazing:2 · terrible:0 · refund:0 · broken:0<br><br><b>Test sentence:</b> &lsquo;product broken, please refund.&rsquo;",
   a:"<b>Left unsolved in the notebook</b> — it is set up as practice. Worked through with the same method:<br><br>P(w | POS) = ( c(w)+1 ) / ( N+V ) = ( c(w)+1 ) / 35<br><br>P(broken | POS) = (0+1)/35 = <b>1/35</b><br>P(refund | POS) = (0+1)/35 = <b>1/35</b><br>P(product | POS) = (0+1)/35 = <b>1/35</b> &nbsp;<i>(unseen)</i><br>P(please | POS) = (0+1)/35 = <b>1/35</b> &nbsp;<i>(unseen)</i><br><br>P(review | POS) = (1/35)⁴ = 1/1,500,625 <b>≈ 6.66 × 10⁻⁷</b><br><br>Every content word of the review is unseen in the POSITIVE class, so the POSITIVE likelihood is at its floor value. The NEGATIVE class table would give &lsquo;broken&rsquo; and &lsquo;refund&rsquo; non-zero counts and therefore a much larger product — <b>∴ classify as NEGATIVE</b>.<br><br><i>This one is in your Numericals tab as a question to attempt yourself.</i>"}
 ]
},
{
 heading:"Good-Turing Smoothing", page:"p.16 · 13/8",
 blocks:[
  {t:"num", v:[
   "<b>Good-Turing smoothed probability</b> for an observed n-gram:"
  ]},
  {t:"formula", v:"P*_GT = c* / N"},
