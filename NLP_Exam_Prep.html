{
 id:"s_m3_viterbi", title:"The Viterbi Algorithm", topic:"3.1", marks:5,
 lo:["LO 3.2","LO 3.1"], src:"NLP Notes p.26–27 (27/8)", tag:"Named for Q3 in the class MSE brief — “Viterbi (show state graph)”",
 idea:"Viterbi is enumeration made efficient: at every word, for every tag, keep only the single best path that reaches it. The brief explicitly says SHOW THE STATE GRAPH, so the drawing is part of the answer.",
 method:"Input: an observation sequence of length T, and the state graph.\n\nAt each word, for each tag:\n   score = ( best score of any tag at the previous word × transition )\n           × emission of the current word under this tag\nKeep the MAXIMUM and remember which previous tag produced it (backpointer).\nAt the end, take the best final score and follow the backpointers BACKWARDS\nto read off the tag sequence.\n\nEvery cell = previous best × transition × emission.\n\nFIVE STEPS the class used:\n 1. Assign correct POS tags to the training corpus.\n 2. Compute the emission / observation probability matrix.\n 3. Compute the state transition probability matrix.\n 4. Draw the state graph for all possible tags, filling in each cell.\n 5. Choose the greatest-value path and read the tags off backwards.",
 classQs:[
  {q:"Training corpus:\n<s> Martin/N Justin/N can/M watch/V Will/N <E>\n<s> Spot/N will/M watch/V Martin/N <E>\n<s> Will/M Justin/N spot/V Martin/N <E>\n<s> Martin/N will/M Pat/V Spot/N <E>\n(N = noun, M = modal verb, V = verb.)\nFind the most probable tag sequence for “Justin will spot Will” using Viterbi, and give the path probability.",
   steps:[
    "Step 1 — tag counts: N = 9, M = 4, V = 4, <s> = 4.",
    "Step 2 — EMISSION matrix P(word | tag):\n            N(9)    M(4)    V(4)\n  Martin    4/9      0       0\n  Justin    2/9      0       0\n  Will      1/9     3/4      0\n  Spot      2/9      0      1/4\n  can        0      1/4      0\n  watch      0       0      2/4\n  pat        0       0      1/4",
    "Step 3 — TRANSITION matrix P(to | from):\n            N      M      V     <E>\n  <s>(4)   3/4    1/4     0      0\n  N(9)     1/9    3/9    1/9    4/9\n  M(4)     1/4     0     3/4     0\n  V(4)      1      0      0      0",
    "Step 4 — the sentence “Justin will spot Will”. Candidate tags per word:\n  Justin -> N only        will -> N or M\n  spot   -> N or V        Will -> N or M\n  so 1 × 2 × 2 × 2 = 8 possible tag sequences. Viterbi explores the trellis instead of all 8 paths.",
    "Trellis, best path (each cell = previous best × transition × emission):\n  Justin as N:  P(N|<s>) × P(Justin|N) = 3/4 × 2/9 = 1/6 ≈ 0.1667\n  will as M:    0.1667 × P(M|N) × P(will|M) = 0.1667 × 3/9 × 3/4 = 0.04167\n  spot as V:    0.04167 × P(V|M) × P(spot|V) = 0.04167 × 3/4 × 1/4 = 0.0078125\n  Will as N:    0.0078125 × P(N|V) × P(Will|N) = 0.0078125 × 1 × 1/9 = 0.000868\n  into <E>:     0.000868 × P(<E>|N) = 0.000868 × 4/9 = 0.000386",
    "Step 5 — follow the backpointers: N <- M <- V <- N."],
   answer:"Most probable tag sequence: Justin/N will/M spot/V Will/N\nPath probability ≈ 3.86 × 10⁻⁴ (the class recorded ≈ 0.000324 for this path; the tag sequence is the answer that is marked).",
   watch:"Three things the examiner looks for. (1) The STATE GRAPH must be drawn — the brief says so explicitly. (2) Each cell is previous-best × transition × emission, in that order. (3) The final tag sequence is recovered by following BACKPOINTERS backwards from the best end state, not by reading the trellis left to right. Note also how the model resolves 'will': as M after a noun, because P(M|N) = 3/9 and P(will|M) = 3/4 both favour the modal reading."}],
 practice:[
  {id:"sp_m3v1", difficulty:"easy", kind:"numerical", src:"notes",
   q:"Two tags {N, V}. π(N) = 0.8, π(V) = 0.2. For the first word 'dogs': P(dogs|N) = 0.6, P(dogs|V) = 0.1. Compute the two Viterbi cells for position 1 and say which survives as the best so far.",
   answer:"δ₁(N) = π(N) × P(dogs|N) = 0.8 × 0.6 = 0.48\nδ₁(V) = π(V) × P(dogs|V) = 0.2 × 0.1 = 0.02\nBoth cells are KEPT (Viterbi keeps one best path per state, not one path overall), but N currently leads at 0.48. Do not discard V yet — a later emission could still make a V-initial path win."},
  {id:"sp_m3v2", difficulty:"basic", kind:"numerical", src:"notes",
   q:"Continuing: transitions P(N|N) = 0.3, P(V|N) = 0.7, P(N|V) = 0.5, P(V|V) = 0.5. Second word 'bark': P(bark|N) = 0.2, P(bark|V) = 0.5. Compute δ₂(N) and δ₂(V) with backpointers.",
   answer:"δ₂(N) = max[ δ₁(N)·P(N|N), δ₁(V)·P(N|V) ] × P(bark|N)\n      = max[ 0.48×0.3 = 0.144, 0.02×0.5 = 0.01 ] × 0.2 = 0.144 × 0.2 = 0.0288, backpointer -> N\nδ₂(V) = max[ δ₁(N)·P(V|N), δ₁(V)·P(V|V) ] × P(bark|V)\n      = max[ 0.48×0.7 = 0.336, 0.02×0.5 = 0.01 ] × 0.5 = 0.336 × 0.5 = 0.168, backpointer -> N\nBest final: δ₂(V) = 0.168. Following backpointers gives the tag sequence N V — 'dogs/N bark/V'."},
  {id:"sp_m3v3", difficulty:"basic", kind:"concept", src:"notes",
   q:"Why does Viterbi keep only ONE path into each state, and why is discarding the others safe?",
   answer:"Because of the MARKOV property: the probability of everything that happens after position i depends only on the tag at position i, not on how you got there. So if two paths both arrive at tag N at word i, whichever has the lower score can never overtake — every future factor multiplying it is identical for both.\nThat is the dynamic-programming optimal-substructure argument, and it is what turns an exponential O(T^N) enumeration into an O(N·T²) algorithm.\nIt is safe ONLY under the Markov assumption. If the model conditioned on longer history (a trigram tagger), you would need to keep one best path per PAIR of previous tags, not per tag."},
  {id:"sp_m3v4", difficulty:"moderate", kind:"numerical", src:"notes",
   q:"Using the class corpus (Martin/Justin/Will/Spot), compute the Viterbi score for the ALTERNATIVE tagging “Justin/N will/N spot/V Will/N” and compare it with the winning path.",
   answer:"Justin as N: 3/4 × 2/9 = 0.1667 (same start).\nwill as N:  0.1667 × P(N|N) × P(will|N) = 0.1667 × 1/9 × 1/9 = 0.002058\nspot as V:  0.002058 × P(V|N) × P(spot|V) = 0.002058 × 1/9 × 1/4 = 0.0000572\nWill as N:  0.0000572 × P(N|V) × P(Will|N) = 0.0000572 × 1 × 1/9 = 0.00000635\ninto <E>:   × 4/9 = 0.00000282\nCompare: winning path ≈ 3.86 × 10⁻⁴ vs this path ≈ 2.82 × 10⁻⁶ — about 137× smaller.\nWhy: 'will' as a noun has emission 1/9 against 3/4 as a modal, and the N->N transition (1/9) is far weaker than N->M (3/9). Both the lexical and the contextual evidence point the same way."},
  {id:"sp_m3v5", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"A student runs Viterbi and reports the tag sequence by taking, at EACH word independently, the tag with the highest cell value. Why can this differ from the true Viterbi answer? Construct the situation.",
   answer:"Because the per-column maximum ignores whether those tags form a CONNECTED path.\nExample: suppose at word 2 the best cell is tag A (0.30) and at word 3 the best cell is tag B (0.25), but the transition P(B|A) = 0. Then the sequence A B has probability 0 and is not a legal path at all, yet the greedy column-max reports it.\nThe correct procedure is to take the best FINAL cell and follow BACKPOINTERS, because each backpointer records which predecessor actually produced that cell's score. The winning path may pass through cells that were not the maximum in their own column.\nThis is a real and commonly penalised error — the class brief's instruction to 'show the state graph' exists partly so the examiner can see whether you followed backpointers."},
  {id:"sp_m3v6", difficulty:"difficult", kind:"numerical", src:"notes",
   q:"Using the class corpus, tag “Will spot Martin” with Viterbi. Note that 'Will' can be N or M and 'spot' can be N or V.",
   answer:"Emissions: P(Will|N) = 1/9, P(Will|M) = 3/4, P(spot|N) = 2/9, P(spot|V) = 1/4, P(Martin|N) = 4/9.\nTransitions: P(N|<s>) = 3/4, P(M|<s>) = 1/4, P(V|M) = 3/4, P(N|M) = 1/4, P(V|N) = 1/9, P(N|N) = 1/9, P(N|V) = 1, P(<E>|N) = 4/9.\n\nPosition 1 'Will':\n δ(N) = 3/4 × 1/9 = 0.0833\n δ(M) = 1/4 × 3/4 = 0.1875\nPosition 2 'spot':\n δ(N) = max[0.0833 × 1/9, 0.1875 × 1/4] × 2/9 = max[0.00926, 0.04688] × 0.2222 = 0.04688 × 0.2222 = 0.01042, backpointer M\n δ(V) = max[0.0833 × 1/9, 0.1875 × 3/4] × 1/4 = max[0.00926, 0.14063] × 0.25 = 0.03516, backpointer M\nPosition 3 'Martin' (N only):\n δ(N) = max[0.01042 × P(N|N)=1/9 -> 0.001157, 0.03516 × P(N|V)=1 -> 0.03516] × 4/9 = 0.03516 × 0.4444 = 0.015625, backpointer V\nInto <E>: 0.015625 × 4/9 = 0.006944\n\nBackpointers: N <- V <- M. Answer: Will/M spot/V Martin/N — which matches the training sentence 'Will/M Justin/N spot/V Martin/N' pattern for 'Will'."},
  {id:"sp_m3v7", difficulty:"exam-level", kind:"scenario", src:"notes",
   q:"Q3-style. Your HMM tagger, trained on newspaper text, tags the tweet “book flight rn” as book/N flight/N rn/N. Diagnose every cause and propose fixes.",
   answer:"Cause 1 — UNKNOWN WORD. 'rn' never appeared in the training corpus, so its emission probability is 0 for every tag. Many implementations then default to the most frequent tag, which is N. Fix: an unknown-word model (suffix features, capitalisation, an <UNK> class with smoothed emissions) or a discriminative model (MEMM/CRF, 3.2) which can use FEATURES of the word rather than its identity.\nCause 2 — DOMAIN MISMATCH. In newspaper text 'book' and 'flight' are overwhelmingly nouns, so both the emission and the transition statistics favour N. The tweet is an imperative, a construction that is rare in the training genre. Fix: train or adapt on in-domain (social-media) data.\nCause 3 — NO SENTENCE-INITIAL VERB EVIDENCE. If the training corpus rarely starts a sentence with a verb, P(V|<s>) is tiny or zero, which rules out the correct reading structurally — the same zero-transition problem seen earlier. Fix: smooth the transition matrix so no transition is exactly zero.\nCause 4 — LIMITED CONTEXT. A bigram HMM sees only the previous tag; it cannot use the fact that the whole utterance looks like a command. Fix: a CRF with global features, or a BiLSTM-CRF (3.2) which sees the entire sequence in both directions.\nThis is a full LO 3.4 answer: name the error, name the model assumption responsible, name the fix."}]
}

  {id:"sp_m3c1", difficulty:"easy", kind:"application", src:"notes",
   q:"Grammar: S -> NP VP (1) · NP -> Det N (2) · VP -> V NP (3) · Det -> the (4) | a (5) · N -> boy (6) | dog (7) · V -> sees (8) | likes (9). Give the left-most derivation of “the boy sees a dog”.",

  {id:"sp_m3c3", difficulty:"basic", kind:"application", src:"notes",
   q:"Grammar: NP -> Det Nominal (1) · Nominal -> Noun (2) | Nominal Noun (3) · Det -> a (4) | an (5) | the (6) · Noun -> cat (7) | ground (8) | butterfly (9) | flight (10). Give the left-most derivation of “a flight”.",
   answer:"NP\n=> Det Nominal        (1)\n=> a Nominal          (4)\n=> a Noun             (2)\n=> a flight           (10)\nParse tree:\n        NP\n       /   \\\n     Det  Nominal\n      |      |\n      a    Noun\n             |\n          flight\nThis is the class example from p.28 (top-down approach)."},
  {id:"sp_m3c4", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"Using the Panda grammar, show that “The lion leaves” has TWO left-most derivations, and say what that proves about the grammar.",
   answer:"Derivation A — 'leaves' as the verb, but VP -> VB NN needs an object, so this fails unless the grammar has VP -> VB. With the given rules only VP -> VB NN exists, so “The lion leaves” (3 words) cannot be derived at all: S -> NP VP -> DT NN VP -> The lion VP -> The lion VB NN would need a fourth word.\nSo the honest answer is: this string is NOT in the language of the given grammar.\nNow take “The lion leaves leaves”:\n Derivation A: S => NP VP (1) => DT NN VP (2) => The NN VP (5) => The lion VP (9) => The lion VB NN (3) => The lion leaves NN (13) => The lion leaves leaves (10).\n Derivation B is identical here because the grammar forces VB then NN — so the ambiguity is LEXICAL (which tag 'leaves' takes) rather than structural.\nWhat it proves: the grammar is lexically ambiguous because 'leaves' appears in both the NN and VB rules. A grammar is STRUCTURALLY ambiguous only if the same string has two different PARSE TREES — which needs two different rule expansions, e.g. adding VP -> VB or NP -> NP PP.\nSpotting that the string does not derive at all is itself the mark here — always check the word count against the rules before deriving."},
  {id:"sp_m3c5", difficulty:"moderate", kind:"application", src:"notes",
   q:"Add the rules VP -> VB NP PP and PP -> Prep NP to the Panda grammar and give the left-most derivation of “The Panda eats leaves in a lion”. (Ignore the semantics.)",
   answer:"Label the new rules: VP -> VB NP PP (14), PP -> Prep NP (15), Prep -> in (16), and NP -> NN (17) for a bare noun.\nS\n=> NP VP                                (1)\n=> DT NN VP                             (2)\n=> The NN VP                            (5)\n=> The Panda VP                         (8)\n=> The Panda VB NP PP                   (14)\n=> The Panda eats NP PP                 (11)\n=> The Panda eats NN PP                 (17)\n=> The Panda eats leaves PP             (10)\n=> The Panda eats leaves Prep NP        (15)\n=> The Panda eats leaves in NP          (16)\n=> The Panda eats leaves in DT NN       (2)\n=> The Panda eats leaves in a NN        (4)\n=> The Panda eats leaves in a lion      (9)\nNote: adding VP -> VB NP PP alongside VP -> VB NN makes the grammar genuinely ambiguous for some strings, because a PP could attach either inside the VP or inside the NP if you also add NP -> NP PP — the classic PP-attachment ambiguity from Module 1, now visible as two parse trees."},
  {id:"sp_m3c6", difficulty:"difficult", kind:"scenario", src:"notes",
   q:"You must write a CFG for a restaurant-booking assistant that accepts “book a table for four at eight”. Give a grammar, the left-most derivation, and state one limitation of using a CFG here (LO 3.5).",
   answer:"GRAMMAR:\n S -> VB NP PP PP                     (1)\n NP -> Det N                          (2)\n PP -> Prep NUM                       (3)\n VB -> book                           (4)\n Det -> a                             (5)\n N -> table                           (6)\n Prep -> for (7) | at (8)\n NUM -> four (9) | eight (10)\nDERIVATION:\n S => VB NP PP PP (1) => book NP PP PP (4) => book Det N PP PP (2) => book a N PP PP (5)\n   => book a table PP PP (6) => book a table Prep NUM PP (3) => book a table for NUM PP (7)\n   => book a table for four PP (9) => book a table for four Prep NUM (3)\n   => book a table for four at NUM (8) => book a table for four at eight (10)\nLIMITATION: the CFG accepts the STRUCTURE but carries no meaning — it cannot tell that 'for four' is a party size while 'at eight' is a time, because both are Prep NUM. It would equally accept “book a table at four for eight”, which means something different. A CFG defines a language, not an interpretation; you need semantic attachment (feature structures, or a semantic stage) to bind the numbers to the right slots.\nSecond acceptable limitation: CFGs cannot express agreement or long-distance constraints without a combinatorial blow-up of rules."},

 lo:["LO 3.2"], src:"NLP Notes p.30–31 (1/9)", tag:"Named for Q3 in the class MSE brief — and a previous-paper question",
 idea:"A bottom-up chart parser: fill the diagonal with the tags of each word, then combine adjacent cells until you either reach S in the top-right cell (the string belongs to the grammar) or you do not.",
 method:"CKY requires the grammar to be in CHOMSKY NORMAL FORM (CNF):\n     X -> Y Z      (exactly TWO non-terminals)\n     X -> a        (a single terminal)\n  X -> Y Z A  is NOT allowed (three non-terminals on the right).\n\nCLASS DEFINITION: “Reach till the root of the parse tree.”\n\nPROCEDURE for a sentence of n words, using an n × n upper-triangular table:\n 1. DIAGONAL: cell [i,i] gets every non-terminal that can produce word i.\n 2. For every span, try every split point k. If cell [i,k] contains Y and\n    cell [k+1,j] contains Z, and the grammar has X -> Y Z, put X in [i,j].\n 3. If S appears in the TOP-RIGHT cell (span = whole sentence), the string\n    belongs to the grammar. Otherwise it does not.\n 4. Read the parse tree back from the cells that produced S.",
 classQs:[
  {q:"Grammar: S -> NP VP · NP -> Det N · VP -> V NP · V -> includes · Det -> The | a · N -> meal | flight.\nConstruct the CKY table and the parse tree for “The flight includes a meal”.",
   steps:[
    "Check CNF: S -> NP VP ✓ (two non-terminals), NP -> Det N ✓, VP -> V NP ✓, and all the lexical rules are X -> terminal ✓. The grammar is already in CNF.",
    "Words: 1 The · 2 flight · 3 includes · 4 a · 5 meal. Build a 5 × 5 upper-triangular table; cell [i,j] holds the non-terminals spanning words i..j.",
    "DIAGONAL (span 1):\n  [1,1] The     -> Det\n  [2,2] flight  -> N\n  [3,3] includes-> V\n  [4,4] a       -> Det\n  [5,5] meal    -> N",
    "SPAN 2:\n  [1,2] = Det(1,1) + N(2,2) and NP -> Det N   ->  NP  ('The flight')\n  [2,3] = N + V — no rule    -> empty\n  [3,4] = V + Det — no rule  -> empty\n  [4,5] = Det + N -> NP      ('a meal')",
    "SPAN 3:\n  [1,3] = NP(1,2)+V(3,3) or Det(1,1)+[2,3]empty — no rule -> empty\n  [3,5] = V(3,3) + NP(4,5) and VP -> V NP  ->  VP  ('includes a meal')",
    "SPAN 4: [1,4] and [2,5] — no combination matches a rule -> empty.",
    "SPAN 5 (the whole sentence):\n  [1,5] = split after word 2: NP(1,2) + VP(3,5) and S -> NP VP  ->  S ✓",
    "S is in the top-right cell, so the string BELONGS to the grammar.",
    "PARSE TREE, read back from the cells:\n                   S [1,5]\n                /          \\\n          NP [1,2]         VP [3,5]\n           /    \\           /      \\\n       Det[1,1] N[2,2]  V[3,3]   NP[4,5]\n         |        |        |      /    \\\n        The    flight  includes Det[4,4] N[5,5]\n                                   |        |\n                                   a      meal"],
   answer:"S appears in cell [1,5], so “The flight includes a meal” belongs to the grammar. Parse tree as drawn above.",
   watch:"Fill the table by SPAN LENGTH, not row by row — every longer span depends on shorter ones already being complete. Most empty cells stay empty; write them as blank rather than skipping them, so the examiner can see you tested every split."},
  {q:"Same grammar, with Det -> a and N -> student | book, V -> reads. Construct the CKY table for “A student reads a book”.",
   steps:[
    "DIAGONAL: [1,1] A -> Det · [2,2] student -> N · [3,3] reads -> V · [4,4] a -> Det · [5,5] book -> N",
    "SPAN 2: [1,2] Det + N -> NP ✓ · [2,3] N + V -> nothing · [3,4] V + Det -> nothing · [4,5] Det + N -> NP ✓",
    "SPAN 3: [3,5] V(3,3) + NP(4,5) -> VP ✓ · [1,3] nothing",
    "SPAN 5: [1,5] NP(1,2) + VP(3,5) -> S ✓"],
   answer:"S is in [1,5]: “A student reads a book” belongs to the grammar. Non-empty cells: [1,1]Det [2,2]N [3,3]V [4,4]Det [5,5]N, [1,2]NP, [4,5]NP, [3,5]VP, [1,5]S.",
   watch:"Notice how few cells fill. In a small CNF grammar most of the chart stays empty — that is normal and is not a sign that you have gone wrong. The single thing to check is whether S reached the top-right cell."}],
 practice:[
  {id:"sp_m3k1", difficulty:"easy", kind:"concept", src:"notes",
   q:"State the two allowed rule forms in Chomsky Normal Form, and say which of these are legal: (a) S -> a S b, (b) A -> B C, (c) X -> Y Z A, (d) B -> b, (e) S -> ab.",
   answer:"CNF allows exactly:  X -> Y Z  (two non-terminals) and  X -> a  (one terminal).\n(a) S -> a S b   ILLEGAL — mixes a terminal and non-terminals.\n(b) A -> B C     LEGAL.\n(c) X -> Y Z A   ILLEGAL — three non-terminals; must be binarised into X -> Y W, W -> Z A.\n(d) B -> b       LEGAL.\n(e) S -> ab      ILLEGAL — two terminals on the right.\nThe class wrote exactly this contrast: S -> aSb | ab ✗ against A -> a ✓, B -> b ✓, and X -> YZA ✗."},
  {id:"sp_m3k2", difficulty:"easy", kind:"numerical", src:"notes",
   q:"How many cells does the CKY table have for a 5-word sentence, and how many are actually used?",
   answer:"A 5 × 5 table has 25 cells, but CKY uses only the UPPER TRIANGLE (a cell [i,j] with j ≥ i), which is n(n+1)/2 = 5×6/2 = 15 cells.\nMore generally the algorithm is O(n³ · |G|): n²/2 cells, and each needs up to n split points to be tested."},
  {id:"sp_m3k3", difficulty:"basic", kind:"application", src:"notes",
   q:"Convert to CNF: S -> NP VP PP, VP -> V, NP -> Det N.",
   answer:"S -> NP VP PP has three symbols, so binarise by introducing a new non-terminal:\n  S -> NP X\n  X -> VP PP\nVP -> V is a UNIT rule (a single non-terminal), which CNF also forbids. Remove it by substituting V's productions directly:\n  if V -> runs | sleeps then VP -> runs | sleeps\nNP -> Det N is already CNF ✓\nFinal CNF: S -> NP X · X -> VP PP · VP -> runs | sleeps · NP -> Det N (plus the lexical rules for Det and N)."},
  {id:"sp_m3k4", difficulty:"basic", kind:"application", src:"notes",
   q:"Grammar: S -> NP VP · NP -> Det N · VP -> V NP · Det -> the · N -> cat | dog · V -> chased. Build the CKY table for “the cat chased the dog”.",
   answer:"DIAGONAL: [1,1] the -> Det · [2,2] cat -> N · [3,3] chased -> V · [4,4] the -> Det · [5,5] dog -> N\nSPAN 2: [1,2] Det+N -> NP ✓ · [2,3] N+V -> — · [3,4] V+Det -> — · [4,5] Det+N -> NP ✓\nSPAN 3: [1,3] — · [2,4] — · [3,5] V(3,3)+NP(4,5) -> VP ✓\nSPAN 4: [1,4] — · [2,5] —\nSPAN 5: [1,5] NP(1,2)+VP(3,5) -> S ✓\nS is in the top-right cell, so the string belongs to the grammar."},
  {id:"sp_m3k5", difficulty:"moderate", kind:"application", src:"notes",
   q:"PREVIOUS PAPER. Using the Q1(c) grammar — S -> NP VP · NP -> DT NN · VP -> VB NN · DT -> a | the · NN -> Man | Woman | Panda | Lion | leaves · VB -> eats | shoots | leaves — build the CKY table for “The woman shoots Lion”. Does it belong?",
   a:"Words: 1 The · 2 woman · 3 shoots · 4 Lion.\nDIAGONAL: [1,1] The -> DT · [2,2] woman -> NN · [3,3] shoots -> VB · [4,4] Lion -> NN\nSPAN 2: [1,2] DT + NN -> NP ✓ · [2,3] NN + VB -> — · [3,4] VB(3,3) + NN(4,4) -> VP ✓  (the rule is VP -> VB NN, so a bare NN is exactly what it needs)\nSPAN 3: [1,3] — · [2,4] —\nSPAN 4: [1,4] NP(1,2) + VP(3,4) and S -> NP VP -> S ✓\nS is in the top-right cell, so “The woman shoots Lion” DOES belong to the grammar. This is the official answer key.\n\nTHE TRAP: read the VP rule carefully. This grammar has VP -> VB NN, so the object is a bare noun and 'Lion' needs no determiner. Had the rule been VP -> V NP (with NP -> Det N, as in the flight/meal grammar), no NP could be built over the bare 'Lion' and the string would NOT parse. Same sentence, opposite verdict — decided entirely by which VP rule the question gives you."},
  {id:"sp_m3k6", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"A student fills the CKY table row by row (all of row 1, then all of row 2) and gets an empty [1,5] even though the sentence is grammatical. What went wrong?",
   answer:"Order of filling. Cell [1,5] is computed from pairs like [1,2]+[3,5] and [1,3]+[4,5] — all of which are LONGER spans that must already be complete.\nFilling row by row computes [1,2], [1,3], [1,4], [1,5] before [3,5] or [4,5] exist, so every combination the student tries finds an empty right-hand cell and nothing is entered.\nCorrect order: by SPAN LENGTH. Do all spans of length 1 (the diagonal), then all of length 2, then length 3, and so on up to length n. Within a span length the order does not matter.\nThis is the defining property of a dynamic-programming chart parser: sub-problems must be solved before the problems that depend on them."},
  {id:"sp_m3k7", difficulty:"difficult", kind:"scenario", src:"notes",
   q:"For a 20-word sentence with a 100-rule grammar, compare CKY with a naive top-down parser that tries every derivation. Then say when you would still prefer top-down.",
   answer:"CKY is O(n³·|G|) = 20³ × 100 = 800,000 operations — entirely feasible, and it is guaranteed to terminate and to find EVERY parse.\nA naive top-down parser explores derivations, whose number grows exponentially with n; it also loops forever on LEFT-RECURSIVE rules (NP -> NP PP), and it re-does the same sub-parses many times because it has no chart.\nWhen top-down is still preferable:\n (1) When you need the parse INCREMENTALLY, left to right, as words arrive — CKY cannot report anything until the whole sentence is present, which rules it out for streaming or interactive input.\n (2) When the grammar is strongly predictive and the input is short, so the goal-directed search never explores irrelevant constituents — CKY builds every constituent that the grammar allows over every span, including many that cannot be part of any S-rooted parse.\n (3) When the grammar cannot be put in CNF without losing structure you care about, since CNF conversion changes the tree shape.\nThe Earley parser is the standard compromise: top-down prediction with a chart, giving O(n³) worst case without needing CNF."},
  {id:"sp_m3k8", difficulty:"exam-level", kind:"application", src:"notes",
   q:"Q3-style, 5 marks. Grammar: S -> NP VP · NP -> Det N | N · VP -> V NP · Det -> the · N -> dogs | bones · V -> eat. Build the full CKY table for “dogs eat the bones” and state the conclusion.",
   answer:"Words: 1 dogs · 2 eat · 3 the · 4 bones.\nDIAGONAL (span 1):\n [1,1] dogs -> N, and since NP -> N also NP\n [2,2] eat  -> V\n [3,3] the  -> Det\n [4,4] bones-> N, and NP\nSPAN 2:\n [1,2] N/NP + V -> no rule (VP needs V NP, not NP V) -> empty\n [2,3] V + Det -> empty\n [3,4] Det(3,3) + N(4,4) -> NP ✓\nSPAN 3:\n [1,3] empty\n [2,4] V(2,2) + NP(3,4) -> VP ✓\nSPAN 4:\n [1,4] split after word 1: NP(1,1) + VP(2,4) and S -> NP VP -> S ✓\nCONCLUSION: S appears in [1,4], so “dogs eat the bones” belongs to the grammar.\nNote the unit rule NP -> N: it must be applied on the DIAGONAL, so [1,1] and [4,4] each carry both N and NP. Forgetting this is the usual reason the table fails to reach S."}]
},
{
 id:"s_m3_pcfg", title:"PCFG — Probability of a Parse Tree", topic:"3.3", marks:2,
 lo:["LO 3.1"], src:"NLP Notes p.31–32", tag:"Named for Q1 in the class MSE brief (2 marks) — and a previous-paper question",
 idea:"Multiply the probability of every rule used in the tree. That is the whole computation. Its purpose is DISAMBIGUATION: when a sentence has two parses, the higher-probability tree wins.",
 method:"A PCFG attaches a probability to each production. For every non-terminal,\nthe probabilities of all its productions must sum to 1.\n\n     P(tree) = Π P(rule)   over every rule used in the tree,\n                            counting a rule once per USE.\n\nProcedure:\n 1. Draw (or read) the parse tree.\n 2. List every rule application, including the lexical rules at the leaves.\n 3. Multiply. Do not skip the DT -> the and NN -> cat rules — they carry\n    probabilities too and are the most commonly forgotten factors.\n\nDISAMBIGUATION: compute P(tree) for each competing parse; the larger one\nis the parse the model prefers.",
 classQs:[
  {q:"Compute the probability of the parse tree of “the mouse chased the cat”, given:\nS -> NP VP 0.75 · NP -> DT NN 0.25 · VP -> VB NP 0.35 · NN -> mouse 0.25 | cat 0.1 | dog 0.4 · VB -> chased 0.3 | dodged 0.5 · DT -> the 0.2 | a 0.35",
   steps:[
    "Draw the tree:\n                 S\n              /     \\\n            NP       VP\n           /  \\     /   \\\n        DT    NN  VB     NP\n         |     |   |     /  \\\n        the  mouse chased DT  NN\n                          |    |\n                         the  cat",
    "List every rule used, with its probability:\n  S  -> NP VP     0.75\n  NP -> DT NN     0.25     (subject NP)\n  DT -> the       0.2\n  NN -> mouse     0.25\n  VP -> VB NP     0.35\n  VB -> chased    0.3\n  NP -> DT NN     0.25     (object NP — the SAME rule, used a SECOND time)\n  DT -> the       0.2\n  NN -> cat       0.1",
    "Multiply:\n  0.75 × 0.25 × 0.35 × 0.2 × 0.25 × 0.3 × 0.25 × 0.2 × 0.1",
    "= 0.00000492"],
   answer:"P(tree) = 0.75 × 0.25 × 0.35 × 0.2 × 0.25 × 0.3 × 0.25 × 0.2 × 0.1 = 4.92 × 10⁻⁶",
   watch:"NP -> DT NN and DT -> the are each used TWICE — once for the subject and once for the object — so each probability appears TWICE in the product. Counting a repeated rule only once is the standard error on this question. Nine factors for this tree; count your factors against the tree's nodes before multiplying."},
  {q:"Compute the parse-tree probability for “A pilot likes flying planes”, with the tree given in class.",
   steps:[
    "The class's factors, read off the tree from the root down:\n  S               1\n  NP              0.3\n  DT -> A         0.3\n  NN -> pilot     0.3   (the class wrote 0.1 at this node — read your own tree)\n  VP              0.1\n  VBZ -> likes    0.1\n  VP internal     0.4\n  NP              0.4\n  VBG/JJ -> flying 0.5\n  NNS -> planes   0.34",
    "Multiply: 1 × 0.3 × 0.3 × 0.3 × 0.1 × 0.1 × 0.4 × 0.4 × 0.5 × 0.34"],
   answer:"The class recorded P(tree) ≈ 6.12 × 10⁻⁶. Multiplying the factor list exactly as transcribed above gives 7.34 × 10⁻⁶, so one node probability in the scan differs from the slide — use the tree printed in your own slide as the authority. Either way the METHOD is the mark: list every rule used, once per use, and multiply.",
   watch:"“A pilot likes flying planes” is the classic AMBIGUOUS sentence — 'flying' can be an adjective modifying 'planes' (planes that fly) or a gerund verb taking 'planes' as its object (the act of flying planes). A PCFG resolves it by computing BOTH trees and taking the larger probability. If an exam question gives you two trees, that comparison is the answer, not just one number."}],
 practice:[
  {id:"sp_m3g1", difficulty:"easy", kind:"numerical", src:"notes",
   q:"A parse tree uses exactly these rules: S -> NP VP (0.8), NP -> N (0.4), N -> dogs (0.5), VP -> V (0.6), V -> bark (0.3). Compute P(tree).",
   answer:"P = 0.8 × 0.4 × 0.5 × 0.6 × 0.3 = 0.0288 = 2.88 × 10⁻²."},
  {id:"sp_m3g2", difficulty:"easy", kind:"concept", src:"notes",
   q:"A PCFG has NP -> DT NN 0.25, NP -> N 0.4, NP -> NP PP 0.25. Is this a valid probability distribution? If not, fix it.",
   answer:"No. The probabilities of all productions of the SAME non-terminal must sum to 1, and 0.25 + 0.4 + 0.25 = 0.9.\nEither a fourth NP production with probability 0.1 is missing, or the values must be renormalised: divide each by 0.9 to give 0.278, 0.444, 0.278.\nThis constraint is what makes a PCFG a probability model over trees rather than an arbitrary scoring function."},
  {id:"sp_m3g3", difficulty:"basic", kind:"numerical", src:"notes",
   q:"Using the class PCFG (S->NP VP 0.75, NP->DT NN 0.25, VP->VB NP 0.35, NN: mouse 0.25/cat 0.1/dog 0.4, VB: chased 0.3/dodged 0.5, DT: the 0.2/a 0.35), compute P(tree) for “a dog dodged the mouse”.",
   answer:"Rules used:\n S -> NP VP    0.75\n NP -> DT NN   0.25   DT -> a  0.35   NN -> dog   0.4\n VP -> VB NP   0.35   VB -> dodged 0.5\n NP -> DT NN   0.25   DT -> the 0.2   NN -> mouse 0.25\nP = 0.75 × 0.25 × 0.35 × 0.4 × 0.35 × 0.5 × 0.25 × 0.2 × 0.25\n  = 0.75 × 0.25 = 0.1875\n  × 0.35 = 0.065625 · × 0.4 = 0.02625 · × 0.35 = 0.0091875 · × 0.5 = 0.00459375\n  × 0.25 = 0.0011484 · × 0.2 = 0.00022969 · × 0.25 = 0.00005742\nP(tree) ≈ 5.74 × 10⁻⁵.\nHigher than the 'mouse chased cat' tree (4.92 × 10⁻⁶) mainly because DT -> a (0.35) and NN -> dog (0.4) and VB -> dodged (0.5) are all more probable lexical choices."},
  {id:"sp_m3g4", difficulty:"moderate", kind:"application", src:"notes",
   q:"A sentence has two parses. Tree 1 uses rules with probabilities 0.6, 0.3, 0.5, 0.4, 0.2. Tree 2 uses 0.6, 0.7, 0.2, 0.4, 0.1. Which parse does the PCFG choose, and by what factor?",
   answer:"P(Tree 1) = 0.6 × 0.3 × 0.5 × 0.4 × 0.2 = 0.0072\nP(Tree 2) = 0.6 × 0.7 × 0.2 × 0.4 × 0.1 = 0.00336\nTree 1 wins, by a factor of 0.0072/0.00336 ≈ 2.14.\nThis is exactly what a PCFG is FOR: a plain CFG says both parses are legal and stops there; the probabilities break the tie."},
  {id:"sp_m3g5", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"THE REPEATED-RULE TRAP. For “the mouse chased the cat” a student writes P = 0.75 × 0.25 × 0.2 × 0.25 × 0.35 × 0.3 × 0.1 = 3.94 × 10⁻⁴, roughly 80× the correct answer. What did they omit?",
   answer:"They used NP -> DT NN and DT -> the only ONCE, but the tree contains TWO noun phrases (subject 'the mouse' and object 'the cat'), each requiring its own NP -> DT NN (0.25) and DT -> the (0.2).\nMissing factors: 0.25 × 0.2 = 0.05, and 1/0.05 = 20. The student's answer is 3.94 × 10⁻⁴ against the correct 4.92 × 10⁻⁶, a ratio of 80 — the remaining factor comes from also mis-ordering the lexical terms.\nRULE: a rule is counted once per USE, not once per grammar. Method to avoid it: count the NODES of your tree first (this tree has 9 rule applications), then check you have exactly that many factors before multiplying."},
  {id:"sp_m3g6", difficulty:"difficult", kind:"scenario", src:"notes",
   q:"Your PCFG consistently prefers the wrong attachment for “I saw the man with the telescope”, always attaching the PP to the noun. Explain the mechanism and give two fixes.",
   answer:"MECHANISM: the choice is between VP -> VB NP PP (attach to the verb — I used the telescope) and NP -> NP PP (attach to the noun — the man had the telescope). The PCFG multiplies rule probabilities, so whichever rule has the higher probability in the training treebank wins EVERY time, for every sentence — the model has no way to know that 'saw' is an instrument-taking verb while 'man' is not.\nThat is the core limitation of a vanilla PCFG: probabilities are attached to rules, not to WORDS, so the model is blind to lexical preferences.\nFIX 1 — LEXICALIZATION. Annotate each non-terminal with its head word (VP(saw), NP(man)), so the model can learn P(PP-attach | saw) separately from P(PP-attach | man). This is what lexicalized PCFGs / head-driven models do, and it is the standard cure for exactly this error.\nFIX 2 — PARENT ANNOTATION / richer non-terminals, or a discriminative reranker that scores complete trees with arbitrary features. A neural dependency parser sidesteps the problem entirely by scoring word-to-word attachments directly.\nThis is an LO 3.4 answer: name the wrong result, name the assumption that caused it, name the fix."},
  {id:"sp_m3g7", difficulty:"exam-level", kind:"numerical", src:"notes",
   q:"Q1-style, 2 marks. PCFG: S -> NP VP 0.9 · NP -> DT N 0.6 | N 0.4 · VP -> V NP 0.7 | V 0.3 · DT -> the 1.0 · N -> cat 0.5 | milk 0.5 · V -> drinks 1.0. Compute P(tree) for “the cat drinks milk”.",
   answer:"Tree: S -> NP(DT N) VP(V NP(N))\nRules used:\n S -> NP VP    0.9\n NP -> DT N    0.6      DT -> the 1.0     N -> cat 0.5\n VP -> V NP    0.7      V -> drinks 1.0\n NP -> N       0.4      N -> milk 0.5\nP = 0.9 × 0.6 × 1.0 × 0.5 × 0.7 × 1.0 × 0.4 × 0.5\n  = 0.9 × 0.6 = 0.54 · × 0.5 = 0.27 · × 0.7 = 0.189 · × 0.4 = 0.0756 · × 0.5 = 0.0378\nP(tree) = 0.0378 = 3.78 × 10⁻².\nNote the object NP uses the BARE-NOUN rule NP -> N (0.4), not NP -> DT N — 'milk' has no determiner. Picking the right NP rule for each branch is the mark."}]
},
{
 id:"s_m3_earley", title:"Top-Down Parsers — Predictive and Earley", topic:"3.4", marks:5,
 lo:["LO 3.2","LO 3.6"], src:"NLP Notes p.33–34",
 idea:"Both start from S and work down towards the words. The predictive parser keeps a STACK; the Earley parser keeps a CHART of dotted rules with a completed-status counter.",
 method:"PREDICTIVE PARSER — a stack machine.\n  Columns: Stack (top -> bottom) | Input remaining | Action\n  Actions: look up table[non-terminal, next input symbol] -> a rule;\n           POP the non-terminal, PUSH the right-hand side in reverse;\n           when the top of the stack is a TERMINAL that equals the next\n           input symbol, MATCH — pop it and advance the input.\n  Accept when the stack is $ and the input is $.\n\nEARLEY PARSER — a chart of DOTTED RULES with three operations:\n  PREDICT   the dot is before a NON-TERMINAL -> add that non-terminal's\n            rules with the dot at the start.\n  SCAN      the dot is before a TERMINAL that matches the next word ->\n            advance the dot and increment the completed count.\n  COMPLETE  the dot has reached the END of a rule -> advance the dot in\n            every rule that was waiting for that non-terminal.\n  Accept when S -> ... • is complete over the whole input.\n\nEarley needs NO CNF conversion and handles left recursion — its two\nadvantages over CKY.",
 classQs:[
  {q:"PREDICTIVE PARSER. Grammar: S -> NP VP · NP -> Det N | N · VP -> V NP · Det -> the | a · N -> cat | dog · V -> chases | sees. Trace “the dog chases a cat”.",
   steps:[
    "Stack (top->bottom) | Input remaining        | Action\n  S $               | the dog chases a cat $ | table[S,'the'] -> S -> NP VP; pop S, push NP VP\n  NP VP $           | the dog chases a cat $ | table[NP,'the'] -> NP -> Det N; pop NP, push Det N\n  Det N VP $        | the dog chases a cat $ | table[Det,'the'] -> Det -> the; Det is a terminal -> MATCH (1st)\n  N VP $            | dog chases a cat $     | table[N,'dog'] -> N -> dog; MATCH (2nd)\n  VP $              | chases a cat $         | table[VP,'chases'] -> VP -> V NP; pop VP, push V NP\n  V NP $            | chases a cat $         | V -> chases; MATCH (3rd)\n  NP $              | a cat $                | NP -> Det N; push Det N\n  Det N $           | a cat $                | Det -> a; MATCH (4th)\n  N $               | cat $                  | N -> cat; MATCH (5th)\n  $                 | $                      | ACCEPT"],
   answer:"The string is accepted. The stack empties to $ exactly as the input empties to $.",
   watch:"Push the right-hand side in REVERSE order so that the leftmost symbol ends up on top of the stack. Write the stack top-to-bottom and label every row with the action — the trace table IS the answer."},
  {q:"EARLEY PARSER. Same grammar, sentence “Dog chases a cat”. Give the operation / production / completed-status table.",
   steps:[
    "Operation      | Production        | Completed status\n  initialization | S -> • NP VP      | 0\n  predict        | NP -> • Det N     | 0\n                 | NP -> • N         | 0\n  scan: dog      | NP -> N •         | 1  (1st word scanned)\n  complete       | S -> NP • VP      | 1\n  predict        | VP -> • V NP      | 1\n  scan: chases   | VP -> V • NP      | 2  (2nd word scanned)\n  predict        | NP -> • Det N     | 2\n                 | NP -> • N         | 2\n  scan: a        | NP -> Det • N     | 3  (3rd word scanned)\n  scan: cat      | NP -> Det N •     | 4  (4th word scanned)\n  complete       | VP -> V NP •      | 4\n  complete       | S -> NP VP •      | 4  -> ACCEPT"],
   answer:"S -> NP VP • is complete with all 4 words scanned, so the string is accepted.",
   watch:"The dot's position tells you which operation to apply: dot before a non-terminal -> PREDICT; dot before a terminal matching the next word -> SCAN; dot at the end -> COMPLETE. The 'completed status' column is just how many input words have been consumed so far — increment it only on SCAN."}],
 practice:[
  {id:"sp_m3ep1", difficulty:"easy", kind:"concept", src:"notes",
   q:"Name the three Earley operations and say what triggers each.",
   answer:"PREDICT — triggered when the dot sits immediately before a NON-TERMINAL. Adds every production of that non-terminal with the dot at the start.\nSCAN — triggered when the dot sits immediately before a TERMINAL that matches the next input word. Advances the dot past it and consumes the word.\nCOMPLETE — triggered when the dot has reached the END of a production. Advances the dot in every earlier rule that was waiting for that non-terminal.\nMemory hook: predict looks down the grammar, scan looks at the input, complete looks back up the chart."},
  {id:"sp_m3ep2", difficulty:"basic", kind:"application", src:"notes",
   q:"Grammar: S -> NP VP · NP -> N · VP -> V · N -> birds · V -> fly. Give the full Earley trace for “birds fly”.",
   answer:"Operation      | Production      | Completed\ninitialization | S -> • NP VP    | 0\npredict        | NP -> • N       | 0\nscan: birds    | NP -> N •       | 1\ncomplete       | S -> NP • VP    | 1\npredict        | VP -> • V       | 1\nscan: fly      | VP -> V •       | 2\ncomplete       | S -> NP VP •    | 2  -> ACCEPT\nThe string is accepted with both words scanned."},
  {id:"sp_m3ep3", difficulty:"basic", kind:"application", src:"notes",
   q:"Using the predictive-parser grammar, trace “a cat sees the dog” as a stack table.",
   answer:"Stack             | Input remaining      | Action\nS $               | a cat sees the dog $ | S -> NP VP\nNP VP $           | a cat sees the dog $ | NP -> Det N\nDet N VP $        | a cat sees the dog $ | Det -> a; MATCH (1st)\nN VP $            | cat sees the dog $   | N -> cat; MATCH (2nd)\nVP $              | sees the dog $       | VP -> V NP\nV NP $            | sees the dog $       | V -> sees; MATCH (3rd)\nNP $              | the dog $            | NP -> Det N\nDet N $           | the dog $            | Det -> the; MATCH (4th)\nN $               | dog $                | N -> dog; MATCH (5th)\n$                 | $                    | ACCEPT"},
  {id:"sp_m3ep4", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"Add the rule NP -> NP PP to the grammar and run a naive top-down predictive parser. What happens, and how does Earley avoid it?",
   answer:"NP -> NP PP is LEFT-RECURSIVE: to expand NP the parser must first expand NP, which requires expanding NP … The predictive parser pushes NP onto the stack forever and never consumes an input symbol — an infinite loop with no error message.\nEarley avoids it because its chart records each dotted rule ONCE per input position. When PREDICT tries to add NP -> • NP PP at position 0 and that item is already present, nothing new is added and the loop terminates. The chart acts as a memo table, which is exactly what a naive stack parser lacks.\nThe alternative fix for a predictive parser is to REWRITE the grammar to remove left recursion (NP -> N NP', NP' -> PP NP' | ε), but that changes the shape of the parse tree, which may not be acceptable if the tree structure matters downstream.\nThis is the standard 'why Earley over predictive parsing' answer."},
  {id:"sp_m3ep5", difficulty:"moderate", kind:"application", src:"notes",
   q:"Trace the predictive parser on “the dog sees” with the grammar S -> NP VP · NP -> Det N · VP -> V NP. What happens and why?",
   answer:"Stack             | Input remaining  | Action\nS $               | the dog sees $   | S -> NP VP\nNP VP $           | the dog sees $   | NP -> Det N\nDet N VP $        | the dog sees $   | Det -> the; MATCH\nN VP $            | dog sees $       | N -> dog; MATCH\nVP $              | sees $           | VP -> V NP\nV NP $            | sees $           | V -> sees; MATCH\nNP $              | $                | FAILURE\nThe parser needs an NP but the input is exhausted. The string is REJECTED.\nWhy: the grammar's only VP rule is VP -> V NP, so every verb must have an object. An intransitive sentence needs the additional rule VP -> V. Diagnosing the failure as a missing grammar rule — rather than a parser bug — is the point of the question (LO 3.5: define the grammar's scope correctly)."},
  {id:"sp_m3ep6", difficulty:"difficult", kind:"tricky", src:"notes",
   q:"Compare top-down and bottom-up parsing on two specific failure modes, then say which the Earley algorithm inherits.",
   answer:"TOP-DOWN (predictive, Earley prediction):\n Strength — never builds a constituent that cannot be part of an S, because every prediction descends from the goal.\n Failure mode 1 — LEFT RECURSION causes non-termination (NP -> NP PP).\n Failure mode 2 — it can predict rules that are incompatible with the actual input words, wasting work on hypotheses the words immediately refute.\nBOTTOM-UP (shift-reduce, CKY):\n Strength — every constituent it builds is grounded in real input words, so it never predicts impossible structure.\n Failure mode 1 — it builds many constituents that can never be part of a complete parse (every legal sub-phrase over every span).\n Failure mode 2 — it cannot handle empty productions (X -> ε) naturally, and shift-reduce parsers face shift/reduce conflicts.\nEARLEY inherits the top-down family's goal-directedness but NOT its non-termination, because the chart deduplicates items. It is O(n³) in the worst case, O(n²) for unambiguous grammars, and linear for many practical ones — and unlike CKY it needs no CNF conversion.\nThat trio (goal-directed, chart-based, no CNF needed) is the examinable summary."},
  {id:"sp_m3ep7", difficulty:"exam-level", kind:"application", src:"notes",
   q:"Q3-style, 5 marks. Grammar: S -> NP VP · NP -> Det N | N · VP -> V NP · Det -> a · N -> boy | ball · V -> kicks. Give the complete Earley trace for “a boy kicks ball”.",
   answer:"Operation       | Production        | Completed status\ninitialization  | S -> • NP VP      | 0\npredict         | NP -> • Det N     | 0\n                | NP -> • N         | 0\nscan: a         | NP -> Det • N     | 1  (1st word)\nscan: boy       | NP -> Det N •     | 2  (2nd word)\ncomplete        | S -> NP • VP      | 2\npredict         | VP -> • V NP      | 2\nscan: kicks     | VP -> V • NP      | 3  (3rd word)\npredict         | NP -> • Det N     | 3\n                | NP -> • N         | 3\nscan: ball      | NP -> N •         | 4  (4th word)\ncomplete        | VP -> V NP •      | 4\ncomplete        | S -> NP VP •      | 4  -> ACCEPT\n\nThe string is accepted. Note that at position 3 BOTH NP rules are predicted, but only NP -> • N can scan 'ball' (there is no determiner), so the NP -> • Det N item simply dies — predicting an item that never advances is normal and costs nothing."}]
},
{
 id:"s_m3_choose", title:"Choosing and Comparing Approaches (HMM / MEMM / CRF · Parsers)", topic:"3.2", marks:5,
 lo:["LO 3.6","LO 3.4"], src:"Syllabus 3.2 + 3.4 · derived from the class-taught models",
 idea:"LO 3.6 asks you to DESIGN AND EVALUATE ALTERNATIVES. These questions give you a constraint and ask which model you would use — the justification against the rejected alternative is where the marks are.",
 method:"SEQUENCE LABELLING — the three models in one line each:\n  HMM   generative, models P(W,T) = Π P(wᵢ|tᵢ)·P(tᵢ|tᵢ₋₁).\n        Cannot use arbitrary features of the word (only its identity).\n  MEMM  discriminative, models P(tᵢ | wᵢ, tᵢ₋₁) directly with FEATURES\n        (suffix, capitalisation, word shape). Suffers the LABEL BIAS\n        problem: normalising per state means a state with few outgoing\n        transitions passes probability through regardless of the observation.\n  CRF   discriminative and globally normalised over the WHOLE sequence,\n        so it has MEMM's features without label bias. Slower to train.\n  BiLSTM-CRF adds learned representations and both-direction context.\n\nPARSING — the three algorithms:\n  Predictive (top-down)  simple, but loops on left recursion.\n  CKY (bottom-up)        O(n³), finds ALL parses, but REQUIRES CNF.\n  Earley (top-down+chart) O(n³) worst case, no CNF needed, handles left\n                         recursion, better on unambiguous grammars.\n\nANSWER SHAPE: name your choice, give the deciding property, then say\nexplicitly why the alternative loses on THIS constraint.",
 classQs:[
  {q:"You must tag social-media text containing many words unseen in training. Would you use an HMM or a CRF? Justify.",
   steps:[
    "Identify the deciding constraint: UNSEEN WORDS.",
    "What an HMM does with an unseen word: its emission probability P(w|t) is estimated from counts, so an unseen word has probability 0 for every tag; the model has no other information about the word and must fall back on a default.",
    "What a CRF does: it scores FEATURES, not word identities — suffix ('-ing' suggests VBG), capitalisation (suggests a proper noun), word shape, prefix, whether the word contains a digit.",
    "So the CRF can still tag a word it has never seen, because the features fire even when the word does not."],
   answer:"CRF. The deciding property is that a CRF is a discriminative, feature-based model: it conditions on arbitrary features of the observation (suffix, capitalisation, shape, surrounding words), so an unseen word still receives informative evidence. An HMM is generative and models P(word|tag) from counts alone, so an unseen word has zero emission probability under every tag and the model is forced onto a default guess.\nA CRF is also globally normalised, avoiding the label-bias problem that an MEMM would introduce.\nCost of the choice: a CRF is slower to train and needs feature engineering; an HMM trains from simple counts.",
   watch:"The full-marks structure: name the choice, name the ONE property that decides it, say what the alternative does instead, and admit the cost. A bare 'CRF is better' scores little."},
  {q:"A grammar contains the left-recursive rule NP -> NP PP and must not be rewritten. Which parser do you use — predictive, CKY or Earley?",
   steps:[
    "Predictive: left recursion causes infinite descent. RULED OUT.",
    "CKY: works, but REQUIRES conversion to Chomsky Normal Form, which is a rewrite of the grammar — the constraint forbids it, and CNF conversion also changes the shape of the resulting trees.",
    "Earley: handles left recursion natively because its chart deduplicates predicted items, and it needs no CNF conversion."],
   answer:"Earley. It is the only one of the three that both handles left recursion and leaves the grammar unchanged. Predictive parsing loops forever on NP -> NP PP; CKY works but demands CNF conversion, which the constraint forbids and which would alter the parse-tree shape.\nCost: Earley is more complex to implement than either alternative and is still O(n³) in the worst case for ambiguous grammars.",
   watch:"Always eliminate the alternatives EXPLICITLY, one line each. That structure is what an 'evaluate alternative approaches' outcome is testing."}],
 practice:[
  {id:"sp_m3ch1", difficulty:"basic", kind:"concept", src:"notes",
   q:"State one advantage of a discriminative model (MEMM/CRF) over a generative model (HMM) for POS tagging, and one advantage the other way.",
   answer:"Discriminative advantage: it can condition on ARBITRARY, OVERLAPPING FEATURES of the observation (suffix, capitalisation, the next word, word shape) without needing to model how those features were generated. An HMM would have to model the joint probability of every feature, which is intractable when features overlap.\nGenerative advantage: an HMM can be trained from simple counts, needs far less data, trains far faster, and can GENERATE data (it models the joint distribution P(W,T)), which also lets it handle missing observations gracefully."},
  {id:"sp_m3ch2", difficulty:"moderate", kind:"concept", src:"notes",
   q:"Explain the LABEL BIAS problem and say which model fixes it and how.",
   answer:"An MEMM normalises the probability distribution PER STATE: at each position, the outgoing transition probabilities from the current state must sum to 1.\nConsequence: a state with only ONE outgoing transition must give that transition probability 1, regardless of what the observation says. The observation is effectively ignored, and probability mass 'passes through' low-branching states. Paths through states with few outgoing options are therefore systematically favoured — a bias towards labels, not towards evidence.\nA CRF fixes it by normalising GLOBALLY over the whole sequence: the partition function Z is computed over all possible label sequences, so a single transition can never be forced to 1 and every observation's score contributes to the final comparison.\nThe cost is that computing Z requires a forward-backward pass over the entire sequence, making CRF training substantially slower."},
  {id:"sp_m3ch3", difficulty:"moderate", kind:"scenario", src:"notes",
   q:"You must parse 10,000 short, unambiguous sentences per second with a grammar already in CNF. Which parser, and why not the other two?",
   answer:"CKY is defensible and so is Earley — say which and justify.\nCKY: the grammar is ALREADY in CNF, so its main cost is paid. It is a simple, cache-friendly O(n³) table fill with no recursion, easy to implement and to parallelise across sentences. For SHORT sentences n³ is tiny.\nEarley: for UNAMBIGUOUS grammars Earley runs in O(n²), and for many practical grammars close to linear — so on unambiguous input it can beat CKY, and it wastes no work on constituents that cannot lead to an S.\nBest answer: choose EARLEY, because the sentences are stated to be unambiguous, which is precisely the case where Earley's complexity drops to O(n²) and its top-down prediction avoids building useless constituents. Reject predictive parsing (no chart, so it re-does work and risks left recursion). Note that CKY remains the safe choice if the grammar is highly ambiguous or if you need ALL parses.\nNaming the deciding property — 'unambiguous' — is the mark."},
  {id:"sp_m3ch4", difficulty:"difficult", kind:"scenario", src:"notes",
   q:"Design a POS tagger for Marathi with only 5,000 annotated sentences available. Choose a model, state your feature set, and name two evaluation methods.",
   answer:"CHOICE: a CRF, with a fallback comparison against an HMM baseline.\nWhy CRF over HMM: Marathi is morphologically rich, so the vocabulary is enormous and a huge fraction of test words will be unseen. An HMM's word-identity emissions collapse on unseen words. A CRF can use SUB-WORD features, which is exactly what a rich morphology provides.\nWhy CRF over BiLSTM-CRF: 5,000 sentences is far too little to train the neural layer from scratch; a linear CRF with good features is the stronger choice at this data scale (or fine-tune a pretrained multilingual model if one is available, which is the modern answer).\nFEATURE SET: last 1/2/3 characters (suffixes carry case, gender, number); first 1/2 characters; word length; whether the word contains a digit or Latin script (code-mixing); the previous and next word; the previous tag; whether the word is in a known lexicon.\nEVALUATION: (1) INTRINSIC — per-token accuracy and per-tag F1 on a held-out set, with a separate accuracy figure for UNSEEN words, which is where the model will actually differ from the baseline. (2) EXTRINSIC — measure a downstream task (chunking or translation quality) with each tagger. Also report a most-frequent-tag baseline so the numbers mean something.\nThis is a full LO 3.5 + LO 3.6 answer: problem statement, design, alternatives rejected, evaluation."},
  {id:"sp_m3ch5", difficulty:"exam-level", kind:"concept", src:"notes",
   q:"Q3-style, 5 marks. Compare CONSTITUENCY and DEPENDENCY parsing on: what the nodes represent, what the output looks like, one language type each suits, and one task each suits.",
   answer:"CONSTITUENCY (phrase-structure) parsing\n Nodes: PHRASES — non-terminals such as NP, VP, PP, with words only at the leaves.\n Output: a tree with internal structure showing how words group into phrases.\n Suits: languages with relatively FIXED word order such as English, where contiguous groups of words really do form phrases.\n Task: anything needing phrase boundaries — chunking, phrase-based translation, extracting noun phrases as index terms.\n\nDEPENDENCY parsing\n Nodes: WORDS. Every word except the root has exactly one head, and edges are labelled with the grammatical relation (subject, object, modifier).\n Output: a directed tree over the words themselves — no extra non-terminals.\n Suits: languages with FREE word order such as Hindi, Marathi or Turkish, where the subject can move around but the subject-of relation is unchanged.\n Task: relation and information extraction, question answering, semantic role labelling — anything that asks 'who did what to whom'.\n\nOne-line separator: constituency says HOW WORDS GROUP; dependency says WHICH WORD DEPENDS ON WHICH.\nLink to Module 1: free word order is a named Indian-language challenge, which is precisely why dependency parsing is preferred for Indian languages."}]
},

 id:"s_m3_errors", title:"Diagnosing Errors in Sequence and Syntax Models", topic:"3.2", marks:5,
 lo:["LO 3.4"], src:"Syllabus LO 3.4 · built on the class-taught models",
 idea:"LO 3.4 is an entire outcome about LIMITATIONS AND SOURCES OF ERROR. These questions give you a wrong output and ask which model assumption produced it — name the error, name the assumption, name the fix.",
 method:"THE DIAGNOSTIC CHECKLIST — work down it in order:\n 1. UNSEEN WORD?        emission = 0 under every tag -> unknown-word model,\n                        or a feature-based model (CRF).\n 2. UNSEEN N-GRAM?      a zero transition/bigram kills the whole path\n                        -> smoothing (Laplace, Good-Turing).\n 3. TOO LITTLE CONTEXT? a bigram HMM sees one previous tag only\n                        -> higher order, or a CRF / BiLSTM with global context.\n 4. WRONG NORMALISATION? per-state normalisation -> LABEL BIAS (MEMM)\n                        -> CRF (global normalisation).\n 5. DOMAIN MISMATCH?    training genre ≠ test genre -> retrain / adapt.\n 6. GRAMMAR TOO NARROW? a missing rule makes a legal sentence unparseable\n                        -> extend the grammar; check before blaming the parser.\n 7. RULE-LEVEL, NOT WORD-LEVEL PROBABILITIES?\n                        a PCFG always makes the same attachment choice\n                        -> lexicalization.",
 classQs:[
  {q:"An HMM tagger trained on news tags every occurrence of the word 'Google' as a common noun, even in “Google announced results”. Diagnose and fix.",
   steps:[
    "Checklist item 1 — is the word unseen? Possibly, if 'Google' post-dates the training corpus. Then its emission is 0 everywhere and the tagger falls back on a default tag.",
    "Checklist item 5 — domain and time mismatch: the corpus may predate the company, or use 'google' as a verb.",
    "Checklist item 3 — a bigram HMM sees only the previous tag, so it cannot use the strong evidence that the word is capitalised sentence-internally.",
    "The HMM's structural limitation: it can only condition on the word's IDENTITY, not on features such as capitalisation."],
   answer:"Cause: the HMM is a generative model whose only evidence about a word is P(word|tag), estimated from counts. It cannot use CAPITALISATION, which is the single strongest cue for a proper noun in English.\nFixes, in order of cost: (1) an unknown-word model that backs off to orthographic features (capitalised -> NNP); (2) a discriminative CRF that takes capitalisation, word shape and suffix as features; (3) retraining on a corpus that contains the word; (4) a gazetteer of company names.\nStructural statement for the marks: the error is not a bug, it is a consequence of the HMM's independence assumption that the word depends only on its own tag.",
   watch:"Answer in three parts every time: WHAT went wrong, WHICH model assumption caused it, WHAT would fix it. Two of the three loses marks."}],
 practice:[
  {id:"sp_m3er1", difficulty:"basic", kind:"scenario", src:"notes",
   q:"A bigram HMM tags “the old man the boats” incorrectly, treating 'man' as a noun. What is the linguistic difficulty and what model property causes the failure?",
   answer:"Linguistic difficulty: this is a garden-path sentence. The correct reading is [the old] as the subject noun phrase and 'man' as a VERB (to man the boats). Both readings are locally plausible, and the correct one only becomes clear at the end of the sentence.\nModel property: a bigram HMM conditions each tag on ONE previous tag. After 'the old' the local evidence overwhelmingly favours a noun (DT ADJ NN is far more frequent than DT ADJ VB), and the model has no way to look ahead to 'the boats' and revise.\nFix: a model with global context — a CRF with features over the whole sentence, or a BiLSTM-CRF which reads the sequence in both directions and so sees 'the boats' before committing to 'man'.\nThis is the cleanest illustration of the limited-context limitation in the syllabus."},
  {id:"sp_m3er2", difficulty:"moderate", kind:"scenario", src:"notes",
   q:"A CKY parser returns NO parse for a sentence a native speaker finds perfectly grammatical. Give three possible causes in the order you would check them.",
   answer:"1. MISSING GRAMMAR RULE — the most common cause. The construction is legal English but not in your grammar (e.g. no intransitive VP -> V rule, or no rule for a bare NP without a determiner). Check by hand-deriving the sentence.\n2. CNF CONVERSION ERROR — CKY requires Chomsky Normal Form. If a unit rule (NP -> N) or an epsilon rule was dropped rather than properly eliminated, legal strings become underivable. Verify the converted grammar generates the same language.\n3. LEXICON GAP — a word is missing from the lexical rules, so its diagonal cell is empty and no span containing it can ever be filled. This is the fastest to check: look at the diagonal first.\nOnly after all three would I suspect the parser implementation. Check the diagonal, then the grammar, then the CNF conversion — cheapest first."},
  {id:"sp_m3er3", difficulty:"moderate", kind:"interpret", src:"notes",
   q:"A tagger reports 96% accuracy but is unusable in production. Give two reasons a high accuracy figure can be misleading here.",
   answer:"1. THE BASELINE. Assigning every word its most frequent tag already gives roughly 90% on English. So 96% represents only a modest improvement over a trivial baseline, and the headline number hides that. Always report the baseline alongside.\n2. ERROR DISTRIBUTION. The 4% of errors are not random: they concentrate on exactly the AMBIGUOUS and UNSEEN words, which are the ones downstream components depend on. Accuracy on unseen words may be 60% while overall accuracy is 96%, because unseen words are a small share of tokens. A parser or IE system fed those errors fails on the sentences that matter.\nAlso acceptable: per-token accuracy hides SENTENCE-level accuracy — if errors are spread across sentences, a 96% token accuracy can mean well under half of sentences are perfectly tagged.\nWhat to report instead: accuracy on unseen words, per-tag F1, sentence-level accuracy, and an extrinsic evaluation on the downstream task."},
  {id:"sp_m3er4", difficulty:"difficult", kind:"scenario", src:"notes",
   q:"Two systems tag the same test set. System A (HMM) gets 94%; System B (MEMM) gets 93%, but B is much better on unseen words. Explain how both facts can be true and which you would deploy.",
   answer:"Both can be true because the test set is dominated by SEEN, unambiguous words. On those, the HMM's count-based emissions are extremely reliable, and the MEMM's per-state normalisation introduces LABEL BIAS: at states with few outgoing transitions the MEMM effectively ignores the observation, costing it accuracy on frequent, easy tokens. Since seen tokens are the large majority, A wins overall by 1 point.\nOn UNSEEN words, the HMM has zero emission evidence and defaults, while the MEMM's features (suffix, capitalisation, shape) still fire — so B wins decisively on that subset.\nDeployment decision depends on the input distribution. For clean, in-domain newswire, deploy A. For user-generated or open-domain text, where unseen words are frequent, deploy B, because the aggregate number will invert on that data.\nBest answer: deploy a CRF instead — it keeps the MEMM's features while removing label bias through global normalisation, which is precisely the defect costing B its point on seen words."},
  {id:"sp_m3er5", difficulty:"exam-level", kind:"scenario", src:"notes",
   q:"Q3-style, 5 marks. An end-to-end system tokenizes, tags, then parses. It fails on “Dr. Rao's team, based in Mumbai, won.” Trace the likely failure at EACH stage and name a fix for each.",
   answer:"PREPROCESSING (sentence segmentation + tokenization):\n Failure — the regex splits after “Dr.”, breaking one sentence into two fragments; “Rao's” may be split into “Rao” + “'s” or left whole, inconsistently.\n Fix — an abbreviation lexicon so 'Dr.' does not end a sentence; a documented clitic policy applied consistently.\n Why it matters most — errors cascade: every later stage receives a broken sentence.\n\nMORPHOLOGICAL / LEXICAL:\n Failure — “Rao” is an unseen proper noun; the possessive “'s” may not be recognised as a separate morpheme.\n Fix — an unknown-word model using capitalisation and word shape.\n\nPOS TAGGING:\n Failure — “based” is ambiguous (VBN in a reduced relative clause vs VBD as a main verb); an HMM with one tag of history will tend to the more frequent reading, and “won” at the end may be mis-tagged if the parse of the appositive went wrong.\n Fix — a CRF or BiLSTM-CRF with bidirectional context, which sees the commas and the final verb before committing.\n\nPARSING:\n Failure — the comma-delimited APPOSITIVE “, based in Mumbai,” is a construction many small grammars simply lack, so the parser returns no parse for a grammatical sentence.\n Fix — add rules for parenthetical/appositive modifiers (NP -> NP , VP ,), or use a dependency parser, which handles such modifiers as ordinary attachments without needing a phrase-structure rule.\n\nCLOSING LINE: the deepest problem is the cascade — a single tokenization error at stage 1 guarantees failure at stages 2-4, which is the classic argument for joint models over pipelines."}]
}
);

 {q:"Corpus: <s> I like NLP </s> · <s> I like Blockchain </s> · <s> Sam likes NLP </s>. What is N for a UNIGRAM model?", type:"mcq",

 {q:"Laplace bigram smoothing. Which denominator is correct?", type:"mcq",
  options:["N + |V|","c(w_i-1) + |V|","c(w_i) + |V|","N + 1"], correct:1,
  explanation:"c(w_i-1) + |V|. The denominator must be the count of the HISTORY you conditioned on, plus |V|. N + |V| is the UNIGRAM denominator — using it for bigrams makes the conditional distribution fail to sum to 1."},
 {q:"A word at rank 20 has frequency 1896. Under Zipf's law, what is the frequency at rank 8?", type:"mcq",
  options:["4740","758","2370","1896"], correct:0,

  options:["0.05","0.30","0.20","0.06"], correct:1,

 {q:"A test sentence of 3 words has P(W) = 3/20 under a bigram model. Using the class convention, the perplexity is:", type:"mcq",
  options:["6.67","1.88","1.61","2.71"], correct:1,
  explanation:"PP = (1/P)^(1/N) = (20/3)^(1/3) = 1.8821. N = 3 = the number of WORDS in the test sentence, even though four bigram factors were multiplied — the class convention."},
 {q:"A word appears in ALL documents of a collection. Its TF-IDF is:", type:"mcq",
  options:["Very high","Equal to its TF","Zero","Undefined"], correct:2,
  explanation:"IDF = log(N/df) = log(N/N) = log 1 = 0, so TF-IDF = TF × 0 = 0. This is the mechanism by which TF-IDF suppresses stop-words automatically."},

 {q:"Which pair of words survives Porter's Step 1b unchanged, and why?", type:"mcq",

DATA.quiz.m3_numericals = (DATA.quiz.m3_numericals||[]).concat([
 {q:"In an HMM tagger, the emission probability is:", type:"mcq",
  options:["P(tag | word) = c(tag,word)/c(word)","P(word | tag) = c(tag,word)/c(tag)","P(tag | previous tag)","P(word | previous word)"], correct:1,
  explanation:"P(word|tag) = c(tag,word)/c(tag). The denominator is always the TAG count. P(tag|word) would be a discriminative model — that is what an MEMM/CRF does, a different model."},
 {q:"Class corpus (Book/V a/DET car/N · Park/V the/DET car/N · The/DET book/N is/V in/PREP the/DET car/N · The/DET car/N is/V in/PREP a/DET park/N). What is P(car | N)?", type:"mcq",
  options:["4/9","4/6","1/6","2/6"], correct:1,
  explanation:"c(N) = 6 and 'car' is tagged N four times, so P(car|N) = 4/6 = 2/3. Check: the N column (book 1/6 + car 4/6 + park 1/6) sums to 1."},
 {q:"In a Viterbi trellis, each cell is computed as:", type:"mcq",
  options:["emission × transition only","previous best × transition × emission","sum over all previous cells × emission","initial probability × emission"], correct:1,
  explanation:"δ(t) = max over previous states of [previous δ × transition] × emission. Taking a SUM instead of a MAX gives the forward algorithm (total probability), not the best path."},
 {q:"Viterbi keeps only one path into each state. This is safe because of:", type:"mcq",
  options:["the independence of emissions","the Markov property","normalisation","the CNF requirement"], correct:1,
  explanation:"The Markov property: everything after position i depends only on the state at i, not on how it was reached. So a lower-scoring path into a state can never overtake — the optimal-substructure argument behind dynamic programming."},
 {q:"CKY requires the grammar to be in:", type:"mcq",
  options:["Greibach Normal Form","Chomsky Normal Form","Backus-Naur Form","No particular form"], correct:1,
  explanation:"Chomsky Normal Form: X -> Y Z or X -> a. This is CKY's main practical cost, and it is precisely what Earley does NOT require."},
 {q:"PCFG: a parse tree uses NP -> DT NN twice and DT -> the twice. How many times does each probability enter the product?", type:"mcq",
  options:["Once each","Twice each","Once, then squared at the end","Depends on the tree depth"], correct:1,
  explanation:"A rule is counted once per USE. Counting a repeated rule only once is the standard error on this question — it inflated the 'mouse chased the cat' answer by a factor of 20."},
 {q:"Compute P(tree) for the class PCFG example “the mouse chased the cat” (S->NP VP 0.75, NP->DT NN 0.25, VP->VB NP 0.35, DT->the 0.2, NN->mouse 0.25, VB->chased 0.3, NN->cat 0.1).", type:"mcq",
  options:["4.92 × 10⁻⁶","3.94 × 10⁻⁴","1.31 × 10⁻⁵","6.12 × 10⁻⁶"], correct:0,
  explanation:"0.75 × 0.25 × 0.2 × 0.25 × 0.35 × 0.3 × 0.25 × 0.2 × 0.1 = 4.92 × 10⁻⁶ — nine factors, because both NPs and both DTs are counted."},
 {q:"In a CKY table, if S appears in the top-right cell then:", type:"mcq",
  options:["the sentence is ambiguous","the sentence belongs to the grammar","the grammar is in CNF","the parse is unique"], correct:1,
  explanation:"S in the cell spanning the whole sentence means a derivation from S covers the entire input, so the string belongs to the language. If that cell contains S more than once (from different splits), the sentence is ambiguous."},
 {q:"Which Earley operation is triggered when the dot sits immediately before a non-terminal?", type:"mcq",
  options:["Scan","Predict","Complete","Accept"], correct:1,
  explanation:"Predict — add every production of that non-terminal with the dot at the start. Scan fires on a matching terminal; Complete fires when the dot reaches the end of a rule."},
 {q:"With 45 tags and a 10-word sentence, enumeration scores 45¹⁰ sequences while Viterbi does roughly:", type:"mcq",
  options:["45 × 10 operations","10 × 45² operations","45¹⁰ / 2 operations","10² × 45 operations"], correct:1,
  explanation:"Viterbi is O(N·T²) = 10 × 45² = 20,250, against roughly 3.4 × 10¹⁶ for enumeration. That reduction is the whole reason the algorithm exists."}
