  {id:"fq_ttr3", d:"medium",
   q:"Passage A (20 words) has TTR 0.80. Passage B (20 words) has TTR 0.45. Both are about cricket. Give the vocabulary size of each and state what you can and cannot conclude.",
   a:"|V|(A) = 0.80 × 20 = 16 types.  |V|(B) = 0.45 × 20 = 9 types.\nCAN conclude: at equal length, A genuinely uses nearly twice the distinct vocabulary; B repeats heavily (average 20/9 ≈ 2.2 occurrences per type).\nCANNOT conclude: that A is better written, more informative or more complex. B may be a commentary repeating player names and 'run/ball/over' — repetition that the subject demands.\nThe comparison IS valid here only because both passages are the same length. Across different lengths TTR is not comparable."},
  {id:"fq_ttr4", d:"difficult",
   q:"“Data drives decisions, and better data drives better decisions.” Compute N, |V|, TTR, and the per-word TTR of 'data', 'drives', 'decisions' and 'better'. Verify your counts with the sum check.",
   a:"Tokens: data(1) drives(2) decisions(3) and(4) better(5) data(6) drives(7) better(8) decisions(9) -> N = 9.\nType counts: data 2, drives 2, decisions 2, and 1, better 2.\nSum check: 2+2+2+1+2 = 9 ✓\n|V| = 5, so TTR = 5/9 ≈ 0.556.\nPer-word TTR (the class's form, type(w)/tokens):\n  TTR(data) = 2/9 ≈ 0.222 · TTR(drives) = 2/9 ≈ 0.222\n  TTR(decisions) = 2/9 ≈ 0.222 · TTR(better) = 2/9 ≈ 0.222\nNote every per-word TTR sums to 1: 2/9+2/9+2/9+1/9+2/9 = 9/9 ✓ — always run that check.\nInterpretation: TTR 0.556 is moderate; the sentence is a deliberate parallel construction, so four of its five types occur exactly twice."},
  {id:"fq_ttr5", d:"difficult",
   q:"Two students compute the TTR of “Don't stop believing — don't ever stop.” One gets 0.833, the other 0.700. Neither made an arithmetic slip. Reconstruct both counts and say which you would write in the exam.",
   a:"STUDENT 1 — whole-word tokenization, case-insensitive, punctuation dropped:\n  don't, stop, believing, don't, ever, stop -> N = 6; types: don't, stop, believing, ever -> |V| = 4... that gives 0.667, not 0.833.\n  For 0.833 they must have treated the two 'don't' forms as distinct (capital D vs lower d): |V| = 5, N = 6 -> 5/6 = 0.833. So: CASE-SENSITIVE counting.\nSTUDENT 2 — clitic splitting, case-insensitive:\n  do, n't, stop, believing, do, n't, ever, stop -> N = 8\n  types: do, n't, stop, believing, ever -> |V| = 5 -> 5/8 = 0.625... For 0.700 they counted the dash as a token: N = 9? No — with N = 10 and |V| = 7 you get 0.7.\nThe point of the question is the principle, not the reconciliation: CASE FOLDING and CLITIC SPLITTING each change both N and |V|, and so change the TTR.\nWhat to write in the exam: state the convention in one line — “punctuation excluded, case-insensitive, contractions kept whole” — then count. A stated convention cannot be marked wrong; an unstated one can."},
  {id:"fq_ttr6", d:"difficult",
   q:"A 500-token abstract has TTR 0.62. The full 8,000-token paper has TTR 0.19. (a) Vocabulary of each. (b) How many NEW types did the body of the paper add? (c) Which empirical law explains the falling TTR, and does the data fit it?",
   a:"(a) Abstract: |V| = 0.62 × 500 = 310 types.  Full paper: |V| = 0.19 × 8,000 = 1,520 types.\n(b) New types added by the body = 1,520 − 310 = 1,210, over 7,500 additional tokens — about 16% of the new running words were words not already seen.\n(c) HEAPS' LAW: |V| = K·N^β with β ≈ 0.4–0.6.\n Fit check: the token count grew 16× (500 -> 8,000) while the vocabulary grew 4.9× (310 -> 1,520).\n If |V| ∝ N^β then 4.9 = 16^β, so β = log(4.9)/log(16) = 0.689/1.204 ≈ 0.57.\n β ≈ 0.57 sits inside the stated 0.4–0.6 band, so the data fits Heaps' law well.\nConclusion: the TTR fell from 0.62 to 0.19 even though the vocabulary grew five-fold — TTR decline with length is a mathematical necessity, not evidence of poorer writing."},
  {id:"fq_ttr7", d:"difficult",
   q:"A plagiarism tool flags any submission whose TTR differs by more than 0.10 from the class average. Give two ways this produces false accusations and one statistically sound replacement.",
   a:"FALSE POSITIVE 1 — LENGTH. TTR falls with length, so a student who writes 1,500 words when the class average is 600 will have a structurally lower TTR and be flagged for being thorough. The tool is measuring length, not authorship.\nFALSE POSITIVE 2 — TOPIC AND GENRE. A submission on a narrow technical topic must repeat its terms ('transducer', 'morpheme'), depressing TTR; a discursive essay on the same syllabus point will score higher. The tool is measuring subject matter, not authorship.\nAlso: tokenization policy differences (contractions, hyphenated terms, code snippets) shift TTR by several points on their own.\nSOUND REPLACEMENT: standardised TTR — split every submission into fixed 100-token windows, compute TTR per window, and average. This removes the length confound entirely. Then compare each student against a distribution built from same-topic, same-length submissions, and treat TTR as ONE feature among several rather than a standalone threshold.\nGeneral principle (LO 2.3): a statistic is only interpretable against a matched baseline."}]
},
{
 id:"f_porter", m:"m2", q:"Q1", marks:2, topic:"2.6", title:"Porter Stemmer — the Measure m",
 why:"Named in the class notes' Q1 list, given its own practice slide, AND asked verbatim in the previous paper. Almost certainly on the paper.",
 pattern:{
  src:"practice.pptx slide 6",
  q:"Compute the measure m of the following words with respect to the Porter Stemmer:\n\nComplexity, Typography, Psychology, Organization",
  steps:[
   "Rule to apply: write the word as [C](VC)^m[V] and count the complete VC pairs.\nVowels are a, e, i, o, u — plus y WHEN IT FOLLOWS A CONSONANT.",
   "COMPLEXITY:  c o m p l e x i t y\n             c v c c c v c v c v      (final y follows t, so it is a VOWEL)\n Collapse:   C(c) V(o) C(mpl) V(e) C(x) V(i) C(t) V(y)\n Strip leading C and trailing V:  V C V C V C  ->  m = 3",
   "TYPOGRAPHY:  t y p o g r a p h y\n             c v c v c c v c c v      (both y's follow consonants -> vowels)\n Collapse:   C(t) V(y) C(p) V(o) C(gr) V(a) C(ph) V(y)\n Strip:      V C V C V C  ->  m = 3",
   "PSYCHOLOGY:  p s y c h o l o g y\n             c c v c c v c v c v\n Collapse:   C(ps) V(y) C(ch) V(o) C(l) V(o) C(g) V(y)\n Strip:      V C V C V C  ->  m = 3",
   "ORGANIZATION:  o r g a n i z a t i o n\n               v c c v c v c v c v v c\n Collapse:     V(o) C(rg) V(a) C(n) V(i) C(z) V(a) C(t) V(io) C(n)\n No leading C to strip, no trailing V:  V C V C V C V C V C  ->  m = 5"],
  answer:"Complexity: m = 3 · Typography: m = 3 · Psychology: m = 3 · Organization: m = 5\n\nShow the c/v line under each word — the official marking scheme for this question in the previous paper gave the marks for the VC pairing, written as P[yr][ot][echn][iq]ue style bracketing."},
 questions:[
  {id:"fq_por1", d:"easy",
   q:"Compute m for: cat, trouble, oats.",
   a:"cat: c v c -> C V C -> strip leading C -> V C -> m = 1.\ntrouble: t r o u b l e -> c c v v c c v -> C V C V -> strip leading C and trailing V -> V C -> m = 1.\noats: v v c c -> V C -> m = 1 (no leading C to strip)."},
  {id:"fq_por2", d:"medium",
   q:"PREVIOUS PAPER. Compute m for Pyrotechnique, acronymania, gyroscope, pylorus, and write the bracketing the official key used.",
   a:"Official key bracketing (each bracket is one VC pair):\n Pyrotechnique : P[yr][ot][echn][iq]ue      -> m = 4\n acronymania   : [acr][on][ym][an]ia         -> m = 4\n gyroscope     : g[yr][osc][op]e             -> m = 3\n pylorus       : p[yl][or][us]               -> m = 3\nNote how each bracket opens on a VOWEL and closes on the consonants that follow it, and how the leading consonant and any trailing vowel sit outside the brackets. Reproducing this bracketing is what the key rewards."},
  {id:"fq_por3", d:"medium",
   q:"Compute m for 'syzygy' and 'rhythm', and explain what makes them awkward.",
   a:"SYZYGY: s y z y g y -> the first y follows s (consonant) so it is a VOWEL; the same for the second and third.\n c v c v c v -> C V C V C V -> strip leading C and trailing V -> V C V C -> m = 2.\nRHYTHM: r h y t h m -> y follows h (consonant) -> vowel; nothing else is a vowel.\n c c v c c c -> C V C -> strip leading C -> V C -> m = 1.\nWhat makes them awkward: neither contains a single a/e/i/o/u. Porter's y-rule is doing ALL the work — without it these words would have no vowels at all and m would be undefined. This is exactly why the rule 'y is a vowel when it follows a consonant' has to be stated before you start."},
  {id:"fq_por4", d:"difficult",
   q:"Compute m for 'relational' and 'conditional'. Then state whether Porter's Step 4 rule (m>1) AL -> '' fires for each, and give the resulting stem.",
   a:"RELATIONAL: r e l a t i o n a l -> c v c v c v v c v c\n Collapse: C(r) V(e) C(l) V(a) C(t) V(io) C(n) V(a) C(l)\n Strip leading C: V C V C V C V C -> m = 4.\nCONDITIONAL: c o n d i t i o n a l -> c v c c v c v v c v c\n Collapse: C(c) V(o) C(nd) V(i) C(t) V(io) C(n) V(a) C(l)\n Strip leading C: V C V C V C V C -> m = 4.\nBoth have m = 4 > 1, so (m>1) AL -> '' FIRES for both:\n relational -> relation   ·   conditional -> condition\nThe m > 1 guard is a length test: it stops the rule stripping -al from a short word such as 'seal' (m = 1) and leaving a meaningless fragment. Always compute m BEFORE claiming a rule fires."},
  {id:"fq_por5", d:"difficult",
   q:"Two students compute m for 'yellow'. One says 1, the other says 2. Resolve it, and state the general rule that decides it.",
   a:"YELLOW: y e l l o w\nThe rule: y is a VOWEL only when it FOLLOWS A CONSONANT. Here 'y' is the FIRST letter — it follows nothing — so it is a CONSONANT.\n y(c) e(v) l(c) l(c) o(v) w(c)\n Collapse: C(y) V(e) C(ll) V(o) C(w)\n Strip leading C: V C V C -> m = 2.\nThe student who said 1 treated the initial y as a vowel, giving V C V C ... no — treating y as a vowel gives V(ye) C(ll) V(o) C(w) = V C V C = m = 2 as well. The likelier error is stopping after the first VC pair, or forgetting that 'w' at the end is a consonant and so completes the second pair rather than being stripped as a trailing vowel.\nCorrect answer: m = 2.\nGENERAL RULE: initial y = consonant (youth, yellow); y after a consonant = vowel (happy, syzygy). Decide every letter before you collapse, and never strip a trailing consonant — only a trailing VOWEL comes off."},
  {id:"fq_por6", d:"difficult",
   q:"Apply Porter Step 1a then Step 1b to: caresses, ponies, cries, feed, agreed, sing, motoring. Give the output at each step and name the rule and condition that fired.",
   a:"STEP 1a (tried in order; only the FIRST matching rule fires):\n caresses -> SSES -> SS   =>  caress\n ponies   -> IES  -> I    =>  poni\n cries    -> IES  -> I    =>  cri\n feed, agreed, sing, motoring -> no 1a rule matches (none ends in s) => unchanged\nSTEP 1b:\n feed     -> rule (m>0) EED -> EE. Stem before EED is 'f': pattern C only, m = 0, so the CONDITION FAILS => feed (unchanged).\n agreed   -> rule (m>0) EED -> EE. Stem before EED is 'agr': V C after stripping, m = 1 > 0, condition holds => agree.\n sing     -> rule (*v*) ING -> ''. Stem before ING is 's': NO VOWEL, condition fails => sing (unchanged).\n motoring -> rule (*v*) ING -> ''. Stem 'motor' contains vowels => motor.\n caress   -> no 1b rule applies => caress.\n poni, cri -> no 1b rule applies => unchanged.\nThe two conditions are the whole point: (m>0) is a LENGTH guard and (*v*) is a HAS-A-VOWEL guard. Both exist to stop the stemmer destroying short words — 'feed' and 'sing' are the standard demonstrations."},
  {id:"fq_por7", d:"difficult",
   q:"A search engine stems queries with Porter. Users complain that searching 'operating system' returns documents about surgical operations. Diagnose with reference to m, and say what you would change.",
   a:"DIAGNOSIS — OVER-STEMMING. Porter reduces both 'operating' (Step 1b: (*v*) ING -> '' gives 'operat', then Step 5 tidies to 'oper') and 'operation' (Step 4: (m>1) ION -> '' gives 'operat' -> 'oper') to the SAME stem. The two words then become one index term, so surgical and computing senses are conflated.\nWhy m does not save you: m is only a LENGTH guard. 'operating' and 'operation' both have m well above 1, so every relevant rule fires legitimately. Porter has no dictionary and no sense inventory, so it cannot know the two words belong to different domains — it only sees suffixes.\nWHAT I WOULD CHANGE, cheapest first:\n1. LEMMATIZATION instead of stemming for query terms: a dictionary + POS lookup keeps 'operating' (participle of operate) distinct from 'operation' (noun) where the lexicon says so.\n2. Index BIGRAMS as well as unigrams, so 'operating system' is a single index term and matches as a phrase — this fixes the reported complaint directly and cheaply.\n3. Keep the stemmed and unstemmed forms in separate index fields and rank exact matches above stemmed matches.\nGeneral trade-off to state: stemming raises RECALL and lowers PRECISION; lemmatization is more precise but slower and needs a lexicon."}]
},
{
 id:"f_ambig", m:"m1", q:"Q1", marks:2, topic:"1.2", title:"Ambiguity — Identify and Interpret",
 why:"Named in the class notes' Q1 list, given its own practice slide, and asked in the previous paper. The notes warn that MORE THAN ONE type will be present and that only the INTERPRETATION is wanted.",
 pattern:{
  src:"practice.pptx slide 7",
  q:"Identify the ambiguity in:\n\n“The manager told the employee that he had reviewed the report on the file.”",
  steps:[
   "Run the class's ambiguity identifier in order (notes p.4).",
   "Step 1 — is ONE WORD causing the confusion? No single word is ambiguous here. Not lexical.",
   "Step 2 — can the sentence have different GRAMMATICAL STRUCTURES? Yes: the prepositional phrase 'on the file' can attach to 'the report' (a report that is stored on the file) or to 'reviewed' (the reviewing was done on/against the file). Two parse trees exist -> SYNTACTIC (PP-attachment) ambiguity.",
   "Step 3 — with the grammar fixed, are there still multiple meanings? Yes, through the pronoun.",
   "Step 4 — issue with he / she / it / they? YES. 'he' can refer to the MANAGER or to the EMPLOYEE -> ANAPHORIC ambiguity.",
   "Step 5 — pragmatic? Not required; the sentence is a plain report.",
   "So TWO types are present, exactly as the class brief warned."],
  answer:"TWO ambiguity types.\n\n1. ANAPHORIC — the pronoun 'he' has two possible antecedents.\n   Reading A: the MANAGER had reviewed the report (and is telling the employee so).\n   Reading B: the EMPLOYEE had reviewed the report (and the manager is referring to that).\n\n2. SYNTACTIC (PP-attachment) — 'on the file' can attach in two places.\n   Reading A: [the report on the file] — the report that is on the file (attaches to the noun).\n   Reading B: [reviewed ... on the file] — the reviewing happened on the file (attaches to the verb).\n\nWrite the type, then BOTH interpretations, for each. The brief says 'interpretation only' — do not write an essay defining the five ambiguity types."},
 questions:[
  {id:"fq_amb1", d:"easy",
   q:"Identify the type and give both interpretations: “She saw the doctor with the microscope.”",
   a:"SYNTACTIC (structural / PP-attachment) ambiguity — two parse trees.\nReading A: she USED the microscope to see the doctor ('with the microscope' attaches to 'saw').\nReading B: she saw the doctor WHO HAD the microscope ('with the microscope' attaches to 'the doctor').\nIdentifier step 2: can the sentence have different grammatical structures? Yes."},
  {id:"fq_amb2", d:"medium",
   q:"Identify the type(s) and interpret: “The teacher informed the student that she had passed.”",
   a:"ANAPHORIC ambiguity — 'she' has two possible antecedents.\nReading A: the STUDENT had passed (the natural reading, and the one world knowledge favours).\nReading B: the TEACHER had passed (grammatically available — e.g. passed a certification).\nIdentifier step 4: is there an issue with he/she/it/they reference? Yes.\nNote for full marks: only ONE type is clearly present here, so say so — do not invent a second. Contrast with the manager/employee sentence, where a PP also creates a structural ambiguity."},
  {id:"fq_amb3", d:"medium",
   q:"Identify the type and interpret: “Visiting relatives can be exhausting.”",
   a:"SYNTACTIC / SEMANTIC ambiguity — the class filed this pattern (its 'Visiting aunts can be a nuisance' example) under semantic, because both readings survive once the grammar is settled.\nReading A: relatives WHO ARE VISITING are exhausting ('visiting' is an adjective modifying 'relatives').\nReading B: the act of US VISITING relatives is exhausting ('visiting' is a gerund heading the subject).\nBest exam answer: name it structural/semantic, give both readings, and note in one line that the two readings correspond to two different parse trees over the same words."},
  {id:"fq_amb4", d:"difficult",
   q:"Q1-style, 2 marks. Find EVERY ambiguity in: “The chairman asked the secretary to book the room near the hall she prefers.”",
   a:"THREE types — list them with interpretations:\n1. LEXICAL (POS disambiguation) — 'book' is a VERB here (to reserve), but the word form is also a noun. Also 'hall' vs the possibility of a proper name. State the verb reading and note the noun reading exists.\n2. SYNTACTIC (PP-attachment) — 'near the hall' can attach to 'the room' (the room that is near the hall) or to 'book' (do the booking near the hall). And the relative clause 'she prefers' can modify 'the room' or 'the hall'.\n   Reading A: book [the room near the hall] that she prefers.\n   Reading B: book [the room] near [the hall she prefers].\n3. ANAPHORIC — 'she' can refer to the SECRETARY or to some other female referent from earlier discourse (it cannot be the chairman only if we assume gender, which is itself an assumption).\nWrite them numbered, with the readings under each. Naming all three is what distinguishes a 2/2 from a 1/2."},
  {id:"fq_amb5", d:"difficult",
   q:"A student labels “I deposited money in the bank” as LEXICAL and another labels it SEMANTIC. Using the class identifier, decide who is right and how you would answer in the exam.",
   a:"Run the identifier:\nStep 1 — is one WORD causing the confusion? Yes: 'bank' has two senses. That supports LEXICAL.\nStep 2 — different grammatical structures? No; there is exactly one parse tree.\nStep 3 — grammar clear but the whole sentence still has multiple meanings? Yes. That supports SEMANTIC, and this is the box the class notes put this very sentence in (notes p.3).\nWHO IS RIGHT: both labels are defensible, and the class's own worked example files it under SEMANTIC. The distinction the notes draw is that lexical ambiguity is diagnosed when a word's ambiguity is the whole story, while semantic ambiguity covers a sentence that still carries two meanings once words and structure are settled.\nWHAT TO WRITE: “Semantic ambiguity (arising from the lexical ambiguity of 'bank'). Reading A: a financial institution. Reading B: the sloping land beside a river.” Naming the source AND giving both readings covers you whichever label the examiner had in mind — and the readings are what carry the marks."},
  {id:"fq_amb6", d:"difficult",
   q:"For each, name the type and give both readings — then say which single type is hardest to resolve automatically and why: (a) “Flying planes can be dangerous.” (b) “The police arrested the demonstrators because they feared violence.” (c) “Is that a dagger which I see before me?”",
   a:"(a) SYNTACTIC/SEMANTIC. Reading A: the act of flying planes is dangerous (gerund). Reading B: planes that are flying are dangerous (participle modifying 'planes').\n(b) ANAPHORIC, resolved by world knowledge. Reading A: 'they' = the police (police fear violence, so they arrest). Reading B: 'they' = the demonstrators. The class's 'city police' minimal pair shows that swapping 'feared' for 'advocated' flips the referent with NO grammatical change.\n(c) PRAGMATIC. Literal: a yes/no question about whether an object is a dagger. Intended: an exclamation of horror / a rhetorical question, not a request for information.\nHARDEST TO RESOLVE AUTOMATICALLY: (c) PRAGMATIC. The notes mark pragmatic ambiguity “most diff to resolve”, because the evidence needed — the speaker's intention — is not in the text at all. (a) can be attacked with a PCFG or a lexicalized parser and (b) with a coreference model trained on world knowledge, but (c) requires modelling communicative intent, which needs situational context no parser has access to."},
  {id:"fq_amb7", d:"difficult",
   q:"A support chatbot logs three failures: (i) “I need to cancel my subscription to the newsletter and the premium plan” — it cancelled only the newsletter. (ii) “Tell my manager I'll be late” — it replied “OK, you'll be late.” (iii) “Can I get a refund?” — it replied “Yes.” and stopped. Classify each and rank them by how expensive they are to fix.",
   a:"(i) SYNTACTIC — SCOPE ambiguity over the coordination. Reading A: cancel [my subscription to [the newsletter and the premium plan]] (both). Reading B: cancel [my subscription to the newsletter] and [the premium plan] (also both) versus cancel [my subscription to the newsletter] only. The bot took the narrowest scope.\n(ii) PRAGMATIC — a SPEECH ACT was misread. Literally the user states a fact; the intended act is a REQUEST that the bot relay a message. The bot performed acknowledgement instead of delegation.\n(iii) PRAGMATIC — the literal yes/no reading was taken over the intended request to initiate a refund. Same family as the class's “Can you open the window?”.\nCOST RANKING, cheapest first:\n1. (i) SYNTACTIC scope — cheapest. It is a parsing problem with a finite set of candidate bracketings; a lexicalized parser or a coordination-scope heuristic plus a confirmation prompt (“cancel both?”) fixes it, and the fix is verifiable.\n2. (iii) PRAGMATIC but conventional — 'Can I…' is a CONVENTIONALISED indirect request. A modest intent classifier with a list of such patterns catches it reliably. Medium cost.\n3. (ii) PRAGMATIC and non-conventional — most expensive. Recognising that stating a fact about oneself to a bot constitutes a request to inform a third party requires modelling the user's goals and the bot's capabilities, not a phrase list.\nThe general point (LO 1.4): syntactic ambiguity has bounded, enumerable alternatives; pragmatic ambiguity does not."}]
},
{
 id:"f_pcfg", m:"m3", q:"Q1", marks:2, topic:"3.3", title:"PCFG — Probability of a Parse Tree",
 why:"Named in the class notes' Q1 list, given its own practice slide, AND asked verbatim in the previous paper with a published rubric. The rubric rewards the annotated tree as much as the arithmetic.",
 pattern:{
  src:"practice.pptx slide 8",
  q:"Compute the probability of the parse tree of the input string “The storm caused a flood”, given the following partial PCFG:\n\n  S  -> NP VP        0.80\n  NP -> DT NN        0.30\n  VP -> VB NP        0.40\n  NN -> storm 0.25 | flood 0.15\n  VB -> caused 0.35 | reduced 0.45\n  DT -> the 0.25 | a 0.30",
  steps:[
   "Draw and ANNOTATE the tree — the previous paper's rubric gives marks for 'correct parse tree, correct annotations and correct computation':\n\n                 S (0.80)\n              /          \\\n        NP (0.30)         VP (0.40)\n         /     \\           /       \\\n   DT(0.25)  NN(0.25)  VB(0.35)   NP (0.30)\n      |         |         |        /      \\\n     The      storm    caused  DT(0.30)  NN(0.15)\n                                  |          |\n                                  a        flood",
   "List every rule application — a rule is counted once per USE:\n  S  -> NP VP    0.80\n  NP -> DT NN    0.30   (subject)\n  DT -> the      0.25\n  NN -> storm    0.25\n  VP -> VB NP    0.40\n  VB -> caused   0.35\n  NP -> DT NN    0.30   (object — the SAME rule, used a SECOND time)\n  DT -> a        0.30\n  NN -> flood    0.15",
   "Nine factors for nine rule applications. Count them against the tree before multiplying.",
   "P = 0.80 × 0.30 × 0.25 × 0.25 × 0.40 × 0.35 × 0.30 × 0.30 × 0.15",
   "Step through: 0.80×0.30 = 0.24 · ×0.25 = 0.06 · ×0.25 = 0.015 · ×0.40 = 0.006\n              ×0.35 = 0.0021 · ×0.30 = 0.00063 · ×0.30 = 0.000189 · ×0.15 = 0.00002835"],
  answer:"P(tree) = 0.80 × 0.30 × 0.25 × 0.25 × 0.40 × 0.35 × 0.30 × 0.30 × 0.15 = 0.00002835 = 2.835 × 10⁻⁵\n\nNote that NP -> DT NN is used TWICE (subject and object), so 0.30 appears twice. Omitting the second use is the single commonest error and inflates the answer by 1/0.30 ≈ 3.3×."},
 questions:[
  {id:"fq_pcfg1", d:"easy",
   q:"A parse tree uses exactly: S -> NP VP (0.9), NP -> N (0.5), N -> birds (0.4), VP -> V (0.6), V -> fly (0.7). Compute P(tree).",
   a:"P = 0.9 × 0.5 × 0.4 × 0.6 × 0.7 = 0.0756 = 7.56 × 10⁻².\nFive rule applications, five factors — count them against the tree before multiplying."},
  {id:"fq_pcfg2", d:"medium",
   q:"PREVIOUS PAPER. Using S->NP VP 0.75, NP->DT NN 0.25, VP->VB NP 0.35, NN->mouse 0.25|cat 0.1|dog 0.4, VB->chased 0.3|dodged 0.5, DT->the 0.2|a 0.35, compute P for “The mouse chased the cat”.",
   a:"Rules used (nine applications):\n S -> NP VP 0.75 · NP -> DT NN 0.25 · DT -> the 0.2 · NN -> mouse 0.25\n VP -> VB NP 0.35 · VB -> chased 0.3 · NP -> DT NN 0.25 · DT -> the 0.2 · NN -> cat 0.1\nP = 0.75 × 0.25 × 0.2 × 0.25 × 0.35 × 0.3 × 0.25 × 0.2 × 0.1 = 0.000004922 = 4.922 × 10⁻⁶.\nThis is the official key's exact figure and the order in which it listed the factors."},
  {id:"fq_pcfg3", d:"medium",
   q:"Using the storm grammar, compute P for “A flood reduced the storm” and say why it differs from the pattern answer.",
   a:"Rules used:\n S -> NP VP 0.80 · NP -> DT NN 0.30 · DT -> a 0.30 · NN -> flood 0.15\n VP -> VB NP 0.40 · VB -> reduced 0.45 · NP -> DT NN 0.30 · DT -> the 0.25 · NN -> storm 0.25\nP = 0.80 × 0.30 × 0.30 × 0.15 × 0.40 × 0.45 × 0.30 × 0.25 × 0.25\n  = 0.80×0.30 = 0.24 · ×0.30 = 0.072 · ×0.15 = 0.0108 · ×0.40 = 0.00432\n  · ×0.45 = 0.001944 · ×0.30 = 0.0005832 · ×0.25 = 0.0001458 · ×0.25 = 0.00003645\nP = 3.645 × 10⁻⁵.\nWHY IT DIFFERS: the tree SHAPE is identical, so the structural rules contribute the same product. The difference is entirely LEXICAL — 'reduced' (0.45) is more probable than 'caused' (0.35) and 'a' (0.30) than 'the' (0.25), while 'flood' (0.15) is less probable than 'storm' (0.25). Net effect: 3.645e-5 against 2.835e-5, so this sentence is the more probable of the two under this grammar."},
  {id:"fq_pcfg4", d:"difficult",
   q:"Using the storm grammar, a student computes P = 9.45 × 10⁻⁵ for “The storm caused a flood”. Identify the omission exactly and show the arithmetic that proves it.",
   a:"Correct answer is 2.835 × 10⁻⁵. The student's 9.45 × 10⁻⁵ is larger by a factor of 9.45/2.835 = 3.333… = 1/0.30.\nA missing factor of 0.30 means exactly ONE application of a rule with probability 0.30 was omitted. Two candidates carry 0.30: NP -> DT NN and DT -> a.\nThe diagnostic: the tree has TWO noun phrases (subject 'The storm', object 'a flood'), so NP -> DT NN must appear TWICE. The student counted it once.\n Check: 0.80 × 0.30 × 0.25 × 0.25 × 0.40 × 0.35 × 0.30 × 0.15 (eight factors, NP counted once)\n      = 0.00009450 ✓ — this reproduces the student's number exactly.\nRULE: count a rule once per USE, not once per grammar. Method: count the rule applications in your drawn tree (here 9), then check you have exactly that many factors before multiplying."},
  {id:"fq_pcfg5", d:"difficult",
   q:"Extend the storm grammar with NP -> NP PP 0.20, PP -> Prep NP 1.0, Prep -> near 1.0, and renormalise NP. For “The storm caused a flood near the town” (NN -> town 0.20) there are two parse trees. Compute both and say which the PCFG prefers.",
   a:"RENORMALISE NP first: the productions of NP must sum to 1. With NP -> DT NN 0.30 and NP -> NP PP 0.20 the total is 0.50, so scale by 2: NP -> DT NN 0.60, NP -> NP PP 0.40. (State this — an unnormalised PCFG is not a probability model.)\n\nTREE 1 — PP attaches to the OBJECT NOUN PHRASE ('a flood near the town'):\n S(0.80) · NP(0.60) DT(the 0.25) NN(storm 0.25) · VP(0.40) VB(caused 0.35)\n · NP -> NP PP (0.40) · inner NP(0.60) DT(a 0.30) NN(flood 0.15)\n · PP(1.0) Prep(near 1.0) · NP(0.60) DT(the 0.25) NN(town 0.20)\n P1 = 0.80×0.60×0.25×0.25×0.40×0.35×0.40×0.60×0.30×0.15×1.0×1.0×0.60×0.25×0.20\n    = 0.80×0.60=0.48 ·×0.25=0.12 ·×0.25=0.03 ·×0.40=0.012 ·×0.35=0.0042\n      ·×0.40=0.00168 ·×0.60=0.001008 ·×0.30=0.0003024 ·×0.15=0.00004536\n      ·×0.60=0.000027216 ·×0.25=0.000006804 ·×0.20=0.0000013608\n P1 ≈ 1.361 × 10⁻⁶\n\nTREE 2 — PP attaches to the VP ('caused ... near the town'). This needs a VP -> VP PP rule, which the grammar does NOT have. So under this grammar only ONE tree exists.\n\nANSWER: with the rules as given, the PP can only attach inside the NP, so the grammar is NOT ambiguous for this sentence and P = 1.361 × 10⁻⁶.\nThe examinable insight: a PCFG can only prefer between attachments it can GENERATE. Add VP -> VP PP and the ambiguity appears; the preference is then fixed by the two rule probabilities and is the SAME for every sentence — which is the well-known limitation that lexicalization exists to fix."},
  {id:"fq_pcfg6", d:"difficult",
   q:"Check whether the storm grammar is a valid PCFG. If it is not, say exactly what is wrong and what the examiner expects you to do about it.",
   a:"The rule for a valid PCFG: for EVERY non-terminal, the probabilities of all its productions must sum to 1.\n S  -> NP VP 0.80                      sum = 0.80  ✗ (0.20 unaccounted)\n NP -> DT NN 0.30                      sum = 0.30  ✗\n VP -> VB NP 0.40                      sum = 0.40  ✗\n NN -> storm 0.25 | flood 0.15         sum = 0.40  ✗\n VB -> caused 0.35 | reduced 0.45      sum = 0.80  ✗\n DT -> the 0.25 | a 0.30               sum = 0.55  ✗\nNo non-terminal sums to 1, so this is NOT a complete PCFG.\nWHY THAT IS FINE: both the practice slide and the previous paper call it a PARTIAL PCFG — only the rules needed for the given sentence are listed, and the remaining probability mass belongs to productions that were not printed.\nWHAT THE EXAMINER EXPECTS: compute the parse-tree probability from the rules given, exactly as normal. Adding one line — “this is a partial PCFG; the listed productions do not sum to 1 because the unused rules are omitted” — shows you know the constraint without derailing the computation. Do NOT try to renormalise a partial grammar; that changes the answer the key expects."},
  {id:"fq_pcfg7", d:"difficult",
   q:"A PCFG trained on newswire gives P(tree_A) = 6.2 × 10⁻⁷ and P(tree_B) = 4.1 × 10⁻⁷ for a sentence, and picks A. A linguist says B is correct. Give three reasons the PCFG can be systematically wrong here.",
   a:"1. RULE-LEVEL, NOT WORD-LEVEL PROBABILITIES. A vanilla PCFG attaches probabilities to rules such as VP -> VB NP PP and NP -> NP PP, not to the words filling them. So for EVERY sentence with this shape it makes the same attachment choice, regardless of whether the verb is 'saw' (takes instruments) or 'ate' (does not). FIX: lexicalization — annotate non-terminals with head words, VP(saw), NP(man).\n2. TRAINING-DOMAIN BIAS. The probabilities are maximum-likelihood estimates from a newswire treebank. If the test sentence comes from another genre, the rule frequencies are simply wrong for it — a systematic, not random, error. FIX: retrain or adapt on in-domain trees.\n3. INDEPENDENCE ASSUMPTION. A PCFG assumes each rule expansion is independent of everything outside its own node. Real syntax is not: the probability that an NP expands as a pronoun depends heavily on whether it is the subject, and the probability of a PP attachment depends on how many PPs already attached. FIX: parent annotation (NP^S vs NP^VP), or a discriminative reranker that scores whole trees with global features.\nAlso valid: the probabilities are close (6.2 vs 4.1, a ratio of only 1.5), so the model is barely committed — a reranker or a small feature change would flip it. Reporting that margin is itself good analysis (LO 3.4)."}]
},
{
 id:"f_zipf", m:"m2", q:"Q1", marks:2, topic:"2.2", title:"Zipf's Law and Zipf's Other Law",
 why:"Named in the class notes' Q1 list and given its own practice slide. The practice slide tests the OTHER law (meanings vs rank), which students revise least.",
 pattern:{
  src:"practice.pptx slide 9",
  q:"In a corpus, the number of meanings associated with the words “bat” and “pitch” are 9 and 18, respectively. Estimate the ratio RANK(bat) : RANK(pitch).",
  steps:[
   "This is ZIPF'S OTHER LAW, not the rank–frequency law. State the relation first:\n   m ∝ 1/√r      (a word with more meanings has a smaller rank number, i.e. is more common)",
   "Therefore  m_bat / m_pitch = √(r_pitch) / √(r_bat) = √( r_pitch / r_bat ).",
   "Substitute: 9/18 = 1/2 = √( r_pitch / r_bat ).",
   "Square both sides: r_pitch / r_bat = 1/4.",
   "So r_bat / r_pitch = 4, i.e. RANK(bat) : RANK(pitch) = 4 : 1."],
  answer:"RANK(bat) : RANK(pitch) = 4 : 1\n\nSANITY CHECK — always do this: 'pitch' has MORE meanings (18 > 9), so by m ∝ √f it must be the MORE FREQUENT word, and a more frequent word has a SMALLER rank number. Our answer gives rank(pitch) as 1 part against rank(bat) as 4 parts, so pitch is indeed higher up the frequency list. ✓\nIf your ratio comes out the other way round, you inverted the square root."},
 questions:[
  {id:"fq_zipf1", d:"easy",
   q:"The rank-1 word of a corpus occurs 8,000 times. Using f·r = K, estimate the frequency of the rank-5 and rank-40 words.",
   a:"K = f × r = 8,000 × 1 = 8,000.\nRank 5:  f = 8,000/5 = 1,600.\nRank 40: f = 8,000/40 = 200."},
  {id:"fq_zipf2", d:"medium",
   q:"A word of rank 15 occurs 600 times. (a) Find K. (b) What rank has a word occurring 250 times? (c) A word occurs 9,000 times — is Zipf's estimate of its rank plausible?",
   a:"(a) K = 15 × 600 = 9,000.\n(b) r = K/f = 9,000/250 = 36.\n(c) r = 9,000/9,000 = 1, so Zipf places it at rank 1. Plausible in shape, but this is exactly where the law fits WORST: the top few ranks are systematically more frequent than 1/r predicts, so a real rank-1 word would usually occur more than K/1. Mention that deviation — it is the analysis mark."},
  {id:"fq_zipf3", d:"medium",
   q:"Words A and B have 4 and 16 meanings respectively. Find RANK(A):RANK(B), and state which word is more frequent and why.",
   a:"m ∝ 1/√r  =>  m_A/m_B = √(r_B/r_A)  =>  4/16 = 1/4 = √(r_B/r_A)  =>  r_B/r_A = 1/16.\nSo r_A : r_B = 16 : 1.\nB is the MORE FREQUENT word: it has four times the meanings, and by the companion relation m ∝ √f more meanings goes with higher frequency — polysemy grows with use. Consistently, B has the smaller rank number (1 part vs 16)."},
  {id:"fq_zipf4", d:"difficult",
   q:"Word X has 25 meanings and rank 4. Word Y has rank 100. (a) Estimate Y's number of meanings. (b) If X occurs 20,000 times, estimate Y's frequency. (c) Are (a) and (b) consistent with m ∝ √f?",
   a:"(a) m ∝ 1/√r  =>  m_X/m_Y = √(r_Y/r_X) = √(100/4) = √25 = 5.\n So m_Y = m_X/5 = 25/5 = 5 meanings.\n(b) f·r = K  =>  K = 20,000 × 4 = 80,000, so f_Y = 80,000/100 = 800.\n(c) Check m ∝ √f: m_X/m_Y should equal √(f_X/f_Y) = √(20,000/800) = √25 = 5.\n We computed m_X/m_Y = 25/5 = 5 ✓ — the two laws are consistent, as they must be, since m ∝ 1/√r and f ∝ 1/r together give m ∝ √f."},
  {id:"fq_zipf5", d:"difficult",
   q:"Zipf's law is used to argue for stop-word removal. Using K = 50,000 over a 500,000-token corpus, estimate what share of all tokens the top 10 ranks carry, and evaluate the argument.",
   a:"Frequencies by Zipf: f(r) = 50,000/r.\n r=1: 50,000 · r=2: 25,000 · r=3: 16,667 · r=4: 12,500 · r=5: 10,000\n r=6: 8,333 · r=7: 7,143 · r=8: 6,250 · r=9: 5,556 · r=10: 5,000\nSum ≈ 146,449 tokens out of 500,000 = about 29%.\nEVALUATION — the argument is HALF right:\n FOR: ten word types account for roughly 29% of all running text. Removing them cuts index size and processing cost enormously for a trivial loss of types, and those words (the, of, and…) carry almost no topical information — this is also why TF-IDF drives their weight to zero automatically.\n AGAINST: 'almost no information' is task-dependent. Stop-words are essential for phrase search (“to be or not to be” is entirely stop-words), for POS tagging and parsing (function words carry the syntax), for authorship attribution (function-word rates are the classic signal), and for sentiment where 'not' is a stop-word in many default lists and reverses polarity.\nCONCLUSION: remove stop-words for bag-of-words retrieval and topic modelling; keep them for any task that depends on syntax, negation or exact phrasing."},
  {id:"fq_zipf6", d:"difficult",
   q:"A student computes K from the rank-2 word (f = 3,000) and predicts the rank-1 word at 6,000; the true count is 14,000. A second student concludes the corpus 'violates Zipf'. Assess both.",
   a:"The student's arithmetic is right: K = 2 × 3,000 = 6,000, so f(1) = 6,000/1 = 6,000.\nThe prediction is nonetheless far below the true 14,000 — a factor of 2.3.\nIS THE CORPUS 'VIOLATING' ZIPF? No, and the second student has misunderstood what the law is. Zipf's law is an EMPIRICAL REGULARITY, not a physical constraint. It fits the middle of the rank range well and is known to fit badly at both extremes: the top handful of ranks are consistently MORE frequent than 1/r predicts, and the long tail is flatter than predicted.\nBETTER MODEL: Mandelbrot's correction f = K/(r + ρ)^a, which adds a shift ρ and an exponent a and fits the head of the distribution far better.\nMETHODOLOGICAL POINT: K should be estimated from a mid-range rank (or fitted over many ranks by least squares on a log–log plot), never from rank 1 or 2 where the deviation is largest. Estimating K from rank 2 and then extrapolating to rank 1 uses the law precisely where it is weakest.\nEXAM ANSWER: apply f·r = K as taught, then add the one-line caveat about deviation at the head. That caveat is the analysis mark."},
  {id:"fq_zipf7", d:"difficult",
   q:"Heaps' law: a corpus of 250,000 tokens has 18,000 types. (a) Find K taking β = 0.5. (b) Predict |V| at 1,000,000 tokens. (c) The true value turns out to be 41,000. Recompute β from the two real data points and comment.",
   a:"(a) |V| = K·N^β  =>  18,000 = K × 250,000^0.5 = K × 500  =>  K = 36.\n(b) At N = 1,000,000: |V| = 36 × 1,000,000^0.5 = 36 × 1,000 = 36,000.\n(c) The true value is 41,000, so the β = 0.5 assumption under-predicted by 5,000 types (12%).\n Recompute β from the two points: 41,000/18,000 = (1,000,000/250,000)^β\n  2.278 = 4^β  =>  β = log(2.278)/log(4) = 0.3576/0.6021 = 0.594.\n β ≈ 0.59 — still inside the stated 0.4–0.6 band, at the top of it.\nCOMMENT: a higher β means the vocabulary keeps growing faster, which is typical of corpora rich in proper nouns, typos, code-mixing or user-generated text. Practical consequence: the vocabulary is NOT saturating, so an <UNK> policy and smoothing matter more, and a fixed vocabulary cap will discard proportionally more of the tail as the corpus grows.\nRemember the class note: Heaps is formula-only in this course — expect to state it and interpret it rather than compute, but be able to do this if asked."}]
},
{
 id:"f_morph", m:"m2", q:"Q1", marks:2, topic:"2.4", title:"Inflectional vs Derivational Morphology",
 why:"A practice slide of its own (“identify the morphological operation / classify into inflectional and derivational”) and a previous-paper question with an official key.",
 pattern:{
  src:"practice.pptx slide 10 + previous paper Q1(e)",
  q:"Write the inflectional morphemes identified in the following discourse:\n\n“Them that asked no questions, cleverer not told lies.”",
  steps:[
   "Test each word: does the suffix add GRAMMATICAL information while keeping the word class the same (INFLECTIONAL), or does it create a NEW word, often of a different class (DERIVATIONAL)?",
   "asked    = ask + -ed     verb stays a verb, adds PAST TENSE      -> inflectional",
   "questions= question + -s noun stays a noun, adds PLURAL          -> inflectional",
   "cleverer = clever + -er  adjective stays an adjective, COMPARATIVE -> inflectional",
   "told     = tell -> told  past tense of 'tell'                    -> inflectional (the official key writes this as '-ed in told')",
   "lies     = lie + -s      noun stays a noun, PLURAL               -> inflectional",
   "'Them', 'that', 'no', 'not' carry no inflectional suffix."],
  answer:"OFFICIAL KEY — five inflectional morphemes:\n  -ed in “asked”      (past tense)\n  -s  in “questions”  (plural)\n  -er in “cleverer”   (comparative)\n  -ed in “told”       (past tense)\n  -s  in “lies”       (plural)\n\nNote that 'told' is the irregular (suppletive) past of 'tell' and carries no visible -ed; the key still lists it, so list it too. If you want the extra line, say: “told realises past tense by stem change rather than by suffixation, but the morphological FUNCTION is the same inflection.”"},
 questions:[
  {id:"fq_mor1", d:"easy",
   q:"Classify each as inflectional or derivational: cats, teacher, walked, happiness.",
   a:"cats      = cat + -s      -> INFLECTIONAL (plural; still a noun)\nteacher   = teach + -er     -> DERIVATIONAL (verb -> noun; a new dictionary word)\nwalked    = walk + -ed      -> INFLECTIONAL (past tense; still a verb)\nhappiness = happy + -ness   -> DERIVATIONAL (adjective -> noun)\nThe test: did the word CLASS change, and is the result a new dictionary entry? If yes, derivational."},
  {id:"fq_mor2", d:"medium",
   q:"“The organizers quickly finalised the arrangements for the singers.” List every morpheme and classify each as inflectional or derivational.",
   a:"organizers  = organize + -er (DERIVATIONAL, verb -> noun) + -s (INFLECTIONAL, plural)\n              — note the ORDER: derivation applies first, inflection last.\nquickly     = quick + -ly (DERIVATIONAL, adjective -> adverb)\nfinalised   = final + -ise (DERIVATIONAL, adjective -> verb) + -ed (INFLECTIONAL, past tense)\narrangements= arrange + -ment (DERIVATIONAL, verb -> noun) + -s (INFLECTIONAL, plural)\nsingers     = sing + -er (DERIVATIONAL) + -s (INFLECTIONAL)\nGENERAL RULE worth stating: derivational suffixes attach closer to the root and inflectional suffixes go on the outside — you never get *organiz-s-er."},
  {id:"fq_mor3", d:"medium",
   q:"'-er' appears in both 'cleverer' and 'teacher'. Explain why one is inflectional and the other derivational.",
   a:"CLEVERER = clever + -er. 'clever' is an ADJECTIVE and 'cleverer' is still an ADJECTIVE; the suffix adds the grammatical category COMPARATIVE DEGREE. No new dictionary word is created — a dictionary lists 'clever', not 'cleverer'. Therefore INFLECTIONAL.\nTEACHER = teach + -er. 'teach' is a VERB and 'teacher' is a NOUN; the suffix creates a new lexeme with its own dictionary entry and its own meaning (the agent who teaches). Therefore DERIVATIONAL.\nTHE LESSON: you cannot classify a suffix by its FORM. The same string '-er' is two different morphemes. Classification depends on what the suffix DOES to the word class and whether it creates a new lexeme — always state the input and output class in your answer."},
  {id:"fq_mor4", d:"difficult",
   q:"An information-retrieval system strips both inflectional and derivational suffixes. Give one query where this helps and one where it causes a wrong result, and state the policy you would adopt.",
   a:"HELPS: a user searches 'run'. Stripping inflection matches documents containing run, runs, running, ran — all the same concept, so RECALL rises with no loss of precision. This is the standard, safe case.\nCAUSES A WRONG RESULT: a user searches 'organic'. Stripping derivation reduces organic -> organ, so the query now matches documents about organ transplants and church organs. Precision collapses. The classic pair is university/universe -> univers.\nPOLICY: strip INFLECTIONAL suffixes only (plural, tense, degree), because they never change the concept, and leave DERIVATIONAL suffixes intact, because they create genuinely different words.\nPRACTICALLY: Porter cannot make this distinction — it is purely suffix-based with no lexicon, so it strips both. Use a LEMMATIZER (dictionary + POS) if the distinction matters, or index both the stemmed and unstemmed forms in separate fields and rank exact matches higher. State the recall/precision trade-off explicitly: stemming raises recall and lowers precision."},
  {id:"fq_mor5", d:"difficult",
   q:"Identify the morphological OPERATION in each and classify where applicable: (a) brunch (b) unhappiness (c) mice (d) TV (e) blackboard (f) flu.",
   a:"(a) brunch = breakfast + lunch -> BLENDING (parts of two words fused). A word-formation process, so derivational in effect, though not affixation.\n(b) unhappiness = un- + happy + -ness -> DERIVATION twice over: prefix un- (adjective -> adjective, negation) and suffix -ness (adjective -> noun). No inflection present.\n(c) mice = mouse pluralised by stem change -> INFLECTIONAL (plural), realised by SUPPLETION / internal vowel change rather than a suffix. Same category as 'told'.\n(d) TV = television -> CLIPPING/ACRONYM (initialism). A word-formation process, not affixation.\n(e) blackboard = black + board -> COMPOUNDING (two free morphemes joined). Note the meaning is not compositional — a blackboard need not be black.\n(f) flu = influenza -> CLIPPING (a fragment of the full word becomes the word).\nSUMMARY: only (c) is inflectional. (b) is pure derivation by affixation. (a), (d), (e), (f) are word-formation processes — blending, clipping, compounding — which the syllabus lists alongside affixation as ways of combining or creating morphemes."},
  {id:"fq_mor6", d:"difficult",
   q:"Marathi encodes gender in the verb: जातो (jaato, 'goes', masculine) vs जाते (jaate, 'goes', feminine). Is this inflectional or derivational, and what does it imply for building a stemmer for Marathi?",
   a:"INFLECTIONAL. The word class does not change (verb stays a verb) and no new lexeme is created — जातो and जाते are two grammatical forms of the same dictionary entry 'जाणे' (to go). The suffix realises the grammatical features PERSON, NUMBER and GENDER, exactly as -s and -ed do in English, only richer.\nIMPLICATIONS FOR A MARATHI STEMMER:\n1. A PORTER-STYLE stemmer will not transfer. Porter is a hand-written list of ENGLISH suffix rules (-sses, -ies, -ed, -ing). Marathi's inflectional endings are different in form and far more numerous, because one root crosses gender × number × person × tense.\n2. The number of surface forms per root is large, so a lookup table is impractical and always incomplete — the low-annotated-resource problem from Module 1.\n3. The right tool is a FINITE-STATE TRANSDUCER, which encodes the morphological RULES and maps surface form <-> root + features in both directions. It generalises to roots never seen, and its output (root plus feature bundle) is what downstream stages actually need.\n4. Because the inflection is regular and productive, an FST is a good fit; keep a small exception lexicon for irregular stems.\nThis question links Module 1's 'morphological richness' challenge to the Module 2 solution — say that connection explicitly."},
  {id:"fq_mor7", d:"difficult",
   q:"Build a morphological parser for English plurals. State the three components it needs, and trace it on 'foxes', 'geese' and 'boxs'.",
   a:"THREE COMPONENTS (syllabus 2.4):\n1. LEXICON — the list of stems and affixes with their word classes: fox(N), goose(N), box(N), plural suffix -s.\n2. MORPHOTACTICS — the rules for which morphemes may combine and in what order: Noun + PLURAL is legal; PLURAL + Noun is not.\n3. ORTHOGRAPHIC (spelling-change) RULES — e-insertion after a sibilant (x, s, z, sh, ch), y -> ie, consonant doubling, and the irregular/suppletive forms.\nTRACES:\n'foxes' -> lexicon finds stem 'fox'; morphotactics allows Noun+PLURAL; the orthographic rule 'insert e after a sibilant before -s' explains the surface e.\n  ANALYSIS: fox + N + PL ✓\n'geese' -> no suffix is present. The orthographic/irregular component must hold goose -> geese as a SUPPLETIVE plural in an exception list, because no rule derives it.\n  ANALYSIS: goose + N + PL ✓ (via the exception lexicon)\n'boxs' -> lexicon finds 'box' and morphotactics allows Noun+PLURAL, BUT the orthographic rule requires e-insertion after the sibilant x, so the legal surface form is 'boxes'.\n  RESULT: REJECTED as a misspelling — the parser both analyses and VALIDATES.\nWHY AN FST: running the same transducer in reverse GENERATES 'foxes' from fox+N+PL, which an FSA (accept/reject only) cannot do. That bidirectionality is the examinable advantage."}]
}
];
