<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NLP Exam Prep — CEPEC7032</title>
<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --ink:#1c2230; --ink-soft:#4a5164; --border:#dde1e8;
  --accent:#2c5f8a; --accent-soft:#eaf1f7; --accent-dark:#1d4a6b; --good:#1f8a56; --bad:#c0392b;
  --warn:#b8860b; --couldnt:#c1440e; --attempt:#8a7a1f; --high:#b8860b; --med:#6b7280; --low:#9aa1ac;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --radius:8px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171c; --panel:#1c2028; --ink:#e7e9ee; --ink-soft:#a7adba; --border:#2c313c;
   --accent:#6fa8dc; --accent-soft:#1e2e3d; --good:#3fbf80; --bad:#e0665b; --warn:#d9a441; }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;}
a{color:var(--accent);}
header.topbar{background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
.topbar-inner{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.brand{font-weight:700;font-size:1.05rem;white-space:nowrap;}
.brand small{display:block;font-weight:400;color:var(--ink-soft);font-size:.72rem;}
nav.maintabs{display:flex;gap:4px;flex-wrap:wrap;}
nav.maintabs button{background:none;border:1px solid transparent;color:var(--ink-soft);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:.9rem;font-weight:600;}
nav.maintabs button:hover{background:var(--accent-soft);}
nav.maintabs button.active{background:var(--accent);color:#fff;}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px;}
.view{display:none;}
.view.active{display:block;}
h1{font-size:1.5rem;margin:.2rem 0 1rem;}
h2{font-size:1.2rem;margin:1.6rem 0 .6rem;border-bottom:2px solid var(--accent-soft);padding-bottom:6px;}
h3{font-size:1.02rem;margin:1.1rem 0 .4rem;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);}
.grid{display:grid;gap:12px;}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;text-align:center;}
.stat .num{font-size:1.5rem;font-weight:800;color:var(--accent);}
.stat .label{font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
.progressbar{background:var(--border);border-radius:20px;height:10px;overflow:hidden;margin-top:6px;}
.progressbar > div{background:var(--accent);height:100%;transition:width .3s;}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 16px;border-bottom:1px solid var(--border);padding-bottom:0;}
.subtabs button{background:none;border:none;border-bottom:3px solid transparent;color:var(--ink-soft);padding:8px 12px;cursor:pointer;font-size:.88rem;font-weight:600;}
.subtabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
.subview{display:none;}
.subview.active{display:block;}
button, .btn{font-family:inherit;font-size:.85rem;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--ink);cursor:pointer;font-weight:600;}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
button.good{background:var(--good);border-color:var(--good);color:#fff;}
button.bad{background:var(--bad);border-color:var(--bad);color:#fff;}
button.warn{background:var(--warn);border-color:var(--warn);color:#fff;}
button.ghost{background:none;}
button:disabled{opacity:.45;cursor:default;}
button.small{padding:3px 8px;font-size:.75rem;}
.pill{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
.pill.high{background:#f7e6b8;color:#7a5b00;}
.pill.medium{background:#e6e9ee;color:#4a5164;}
.pill.low{background:#eef0f3;color:#8a90a0;}
@media (prefers-color-scheme: dark){
  .pill.high{background:#4a3c10;color:#f2cf6b;}
  .pill.medium{background:#2c313c;color:#a7adba;}
  .pill.low{background:#22262e;color:#7a8090;}
}
.pill.easy{background:#d9f0e2;color:#1f6b41;}
.pill.medium-diff{background:#fdeecb;color:#8a5a00;}
.pill.hard{background:#fbdada;color:#9c2b1f;}
.pill.exam-level{background:#e3d8f7;color:#5a3d99;}
.pill.challenge{background:#1c2230;color:#fff;}
@media (prefers-color-scheme: dark){
  .pill.easy{background:#173a26;color:#5fd493;}
  .pill.medium-diff{background:#3a2c0d;color:#f2c15c;}
  .pill.hard{background:#3d1712;color:#f08d80;}
  .pill.exam-level{background:#2c2140;color:#c3a8f7;}
}
.marks-tag{font-size:.7rem;color:var(--ink-soft);font-weight:700;}
.qa-card .q{font-weight:700;margin-bottom:6px;}
.qa-card .a{display:none;padding-top:8px;border-top:1px dashed var(--border);margin-top:8px;}
.qa-card .a.show{display:block;}
.qa-card .meta{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap;}
.exam-box{background:var(--accent-soft);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:.87rem;}
.exam-box b{color:var(--accent);}
.mistake-box{background:rgba(192,57,43,.08);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:.87rem;}
.mistake-box b{color:var(--bad);}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.toolbar select, .toolbar input[type=text]{padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--ink);font-size:.85rem;}
.checklist-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.checklist-item:last-child{border-bottom:none;}
.checklist-item input{margin-top:4px;width:16px;height:16px;}
.checklist-item.done label{color:var(--ink-soft);text-decoration:line-through;}
.flashcard-wrap{max-width:560px;margin:0 auto;}
.flashcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;min-height:220px;max-height:60vh;overflow-y:auto;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 26px 16px;cursor:pointer;box-shadow:var(--shadow);font-size:1.05rem;}
.flashcard.is-answer{text-align:left;align-items:flex-start;white-space:pre-line;font-size:.95rem;}
.flashcard .side-label{position:absolute;top:10px;left:14px;font-size:.68rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
.flashcard-outer{position:relative;}
.flashcard-controls{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap;}
.flashcard-status{text-align:center;color:var(--ink-soft);font-size:.8rem;margin-top:8px;}
.num-topic{margin-bottom:22px;}
.step-block{background:var(--accent-soft);border-radius:6px;padding:10px 12px;margin:8px 0;font-size:.9rem;}
.step-block b{color:var(--accent);}
.practice-q{border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:8px;}
.practice-q .qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.practice-q .status-btns{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.solution{display:none;background:var(--accent-soft);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:.87rem;white-space:pre-wrap;}
.solution.show{display:block;}
.quiz-q{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.quiz-opt{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;}
.quiz-opt.correct{background:rgba(31,138,86,.15);border-color:var(--good);}
.quiz-opt.incorrect{background:rgba(192,57,43,.15);border-color:var(--bad);}
.quiz-feedback{margin-top:8px;font-size:.87rem;padding:8px 10px;border-radius:6px;}
.quiz-feedback.correct{background:rgba(31,138,86,.12);color:var(--good);}
.quiz-feedback.incorrect{background:rgba(192,57,43,.12);color:var(--bad);}
table.cov{width:100%;border-collapse:collapse;font-size:.82rem;}
table.cov th, table.cov td{border:1px solid var(--border);padding:6px 8px;text-align:left;}
table.cov th{background:var(--accent-soft);}
.status-ok{color:var(--good);font-weight:700;}
.formula-box{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);padding:10px 14px;margin:10px 0;font-size:.95rem;overflow-x:auto;}
.diagram-box{border:1px dashed var(--border);border-radius:6px;padding:10px;margin:8px 0;background:var(--accent-soft);font-size:.85rem;}
.weak-badge{display:inline-flex;gap:4px;}
/* ---- status system: Done / Marked for Review / (unmarked = unattempted) ---- */
.status-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
button.st-done{background:var(--good);border-color:var(--good);color:#fff;}
button.st-review{background:var(--warn);border-color:var(--warn);color:#fff;}
.st-tag:empty{display:none;}
/* ---- topic tick-off ---- */
.tickbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.tickbox{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;
 padding:3px 9px 3px 6px;border-radius:20px;border:1px solid var(--border);background:var(--panel);
 color:var(--ink-soft);cursor:pointer;user-select:none;white-space:nowrap;}
.tickbox:hover{border-color:var(--accent);color:var(--accent);}
.tickbox input{width:14px;height:14px;margin:0;cursor:pointer;accent-color:var(--good);}
.tickbox.on{background:rgba(31,138,86,.13);border-color:var(--good);color:var(--good);}
.tickbox .tk{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;}
.st-tag.tick{background:rgba(31,138,86,.10);color:var(--good);font-style:italic;}
.tickhint{font-size:.74rem;color:var(--ink-soft);}

/* ---- global search ---- */
.searchwrap{display:flex;align-items:center;gap:4px;margin-left:auto;}
.searchwrap input[type=search]{padding:6px 10px;border-radius:20px;border:1px solid var(--border);
 background:var(--bg);color:var(--ink);font-size:.85rem;font-family:inherit;width:210px;max-width:42vw;}
.searchwrap input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px;width:280px;}
.hit{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 13px;margin-bottom:8px;}
.hit .hit-h{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:5px;}
.hit .hit-t{font-size:.89rem;line-height:1.45;}
.hit mark{background:rgba(184,134,11,.35);color:inherit;padding:0 2px;border-radius:2px;}
.searchsec{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
 color:var(--ink-soft);margin:16px 0 7px;}
/* ---- MSE focus ---- */
.qtag{display:inline-block;font-size:.7rem;font-weight:800;padding:2px 9px;border-radius:20px;
 background:var(--accent);color:#fff;letter-spacing:.03em;}
.qtag.Q2{background:#6b4fa0;} .qtag.Q3{background:#1f6b7a;}
.mtag{display:inline-block;font-size:.7rem;font-weight:800;padding:2px 9px;border-radius:20px;
 background:var(--accent-soft);color:var(--accent);border:1px solid var(--border);}
.pill.d-easy{background:#d9f0e2;color:#1f6b41;}
.pill.d-medium{background:#fdeecb;color:#8a5a00;}
.pill.d-difficult{background:#fbdada;color:#9c2b1f;}
@media (prefers-color-scheme: dark){
 .pill.d-easy{background:#173a26;color:#5fd493;}
 .pill.d-medium{background:#3a2c0d;color:#f2c15c;}
 .pill.d-difficult{background:#3d1712;color:#f08d80;}
}
.focus-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
 padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow);border-left:4px solid var(--accent);}
.focus-card.Q2{border-left-color:#6b4fa0;} .focus-card.Q3{border-left-color:#1f6b7a;}
.focus-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
.pattern-box{border:1px solid var(--border-2,var(--border));border-radius:6px;padding:11px 13px;margin:10px 0;
 background:var(--accent-soft);}
.pattern-box .pq{font-weight:700;font-size:.89rem;white-space:pre-wrap;margin-bottom:6px;}
.focus-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-soft);margin-bottom:12px;}
.sylrow{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);}
.sylrow:last-child{border-bottom:none;}
.sylrow .st{flex:1;font-size:.85rem;line-height:1.45;}
.sylrow .sb{width:88px;flex:0 0 auto;}
.sylrow .sp{font-size:.75rem;font-weight:800;color:var(--accent);min-width:38px;text-align:right;font-variant-numeric:tabular-nums;}
@media(max-width:680px){ .searchwrap{width:100%;margin-left:0;} .searchwrap input[type=search]{width:100%;max-width:none;} }

.st-tag{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
.st-tag.done{background:rgba(31,138,86,.15);color:var(--good);}
.st-tag.review{background:rgba(184,134,11,.18);color:var(--warn);}
/* ---- syllabus scope tags ---- */
.pill.scope-in{background:rgba(31,138,86,.13);color:var(--good);}
.pill.scope-partial{background:rgba(184,134,11,.18);color:var(--warn);}
.pill.scope-out{background:rgba(192,57,43,.15);color:var(--bad);}
.pill.notes{background:rgba(44,95,138,.15);color:var(--accent);}
.pill.lo{background:var(--accent-soft);color:var(--accent);}
.pill.kind{background:var(--accent-soft);color:var(--ink-soft);}
.scope-note{font-size:.8rem;padding:7px 10px;border-radius:6px;margin:8px 0;background:rgba(184,134,11,.12);border-left:3px solid var(--warn);}
/* ---- dashboard ---- */
.dash-hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
.ring{--p:0;width:104px;height:104px;border-radius:50%;flex:0 0 auto;
 background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--border) 0);
 display:flex;align-items:center;justify-content:center;}
.ring>div{width:80px;height:80px;border-radius:50%;background:var(--panel);
 display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring .rv{font-size:1.4rem;font-weight:800;color:var(--accent);line-height:1;}
.ring .rl{font-size:.6rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.chipstat{display:flex;gap:16px;flex-wrap:wrap;}
.chipstat div{min-width:78px;}
.chipstat .n{font-size:1.25rem;font-weight:800;line-height:1.1;}
.chipstat .l{font-size:.67rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
.modrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.modrow:last-child{border-bottom:none;}
.modrow .mname{flex:1;min-width:150px;font-weight:600;font-size:.9rem;}
.modrow .mbar{flex:2;min-width:140px;}
.modrow .mpct{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;min-width:44px;text-align:right;}
/* ---- LO page ---- */
.lo-card{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);}
.lo-card.strong{border-left:4px solid var(--good);}
.lo-card.mid{border-left:4px solid var(--warn);}
.lo-card.weak{border-left:4px solid var(--bad);}
.lo-card.none{border-left:4px solid var(--border);}
.lo-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px;}
.lo-text{font-size:.9rem;font-weight:600;margin:0 0 7px;line-height:1.45;}
.lo-form{font-size:.83rem;background:var(--accent-soft);border-radius:6px;padding:7px 10px;margin-bottom:8px;}
.lo-links{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid var(--border);
 background:var(--panel);color:var(--ink-soft);cursor:pointer;font-family:inherit;max-width:100%;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap;}
.chip:hover{background:var(--accent-soft);color:var(--accent);}
/* ---- solved (class notes) ---- */
.solved-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow);}
.method-box{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:4px;
 padding:10px 13px;margin:10px 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem;
 line-height:1.55;white-space:pre-wrap;overflow-x:auto;}
.classq{border:1px solid var(--border);border-radius:6px;padding:11px 13px;margin:10px 0;background:var(--bg);}
.classq .cq{font-weight:700;font-size:.89rem;white-space:pre-wrap;margin-bottom:7px;}
.classq ol.cqsteps{margin:8px 0;padding-left:1.3rem;font-size:.85rem;}
.classq ol.cqsteps li{margin-bottom:6px;white-space:pre-wrap;}
.ansbox{background:rgba(31,138,86,.12);border:1px solid rgba(31,138,86,.3);color:var(--good);border-radius:6px;
 padding:9px 12px;margin:9px 0;font-weight:600;font-size:.87rem;white-space:pre-wrap;}
.watchbox{background:rgba(192,57,43,.08);border-left:3px solid var(--bad);border-radius:4px;padding:9px 12px;margin:9px 0;font-size:.85rem;white-space:pre-wrap;}
.watchbox b{color:var(--bad);}
.blueprint{font-size:.85rem;}
.blueprint li{margin-bottom:4px;}
.small-muted{font-size:.79rem;color:var(--ink-soft);}
@media(max-width:640px){ .chipstat{gap:12px;} .ring{width:88px;height:88px;} .ring>div{width:68px;height:68px;} }

/* ---- Class Notes ---- */
.nb-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px;}
.nb-head h3{margin:0;font-size:1.05rem;color:var(--accent);}
.nb-page{font-size:.7rem;color:var(--ink-soft);font-weight:700;white-space:nowrap;background:var(--accent-soft);padding:2px 8px;border-radius:20px;}
.nb-p{margin:.5rem 0;font-size:.92rem;}
ul.nb-list, ol.nb-list{margin:.5rem 0;padding-left:1.4rem;font-size:.92rem;}
ul.nb-list li, ol.nb-list li{margin-bottom:.35rem;}
.nb-formula{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:4px;padding:10px 14px;margin:10px 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.84rem;line-height:1.55;white-space:pre;overflow-x:auto;}
.nb-flow{background:var(--accent-soft);border-radius:6px;padding:10px 14px;margin:10px 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem;line-height:1.5;white-space:pre;overflow-x:auto;}
.nb-note{background:var(--accent-soft);border-radius:6px;padding:9px 12px;margin:10px 0;font-size:.86rem;}
.nb-note b{color:var(--accent);}
.nb-warn{background:rgba(193,68,14,.10);border-left:3px solid var(--couldnt);border-radius:4px;padding:9px 12px;margin:10px 0;font-size:.86rem;}
.nb-warn b{color:var(--couldnt);}
.nb-hi{background:rgba(184,134,11,.22);padding:0 3px;border-radius:3px;}
.nb-scroll{overflow-x:auto;margin:10px 0;}
table.nb-t{border-collapse:collapse;font-size:.82rem;margin:8px 0;min-width:100%;}
table.nb-t th, table.nb-t td{border:1px solid var(--border);padding:5px 9px;text-align:left;vertical-align:top;white-space:nowrap;}
table.nb-t th{background:var(--accent-soft);font-weight:700;}
.nb-ex{border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:12px 0;background:var(--panel);}
.nb-q{font-size:.9rem;margin-bottom:8px;white-space:pre-wrap;}
.nb-qlabel{display:inline-block;background:var(--accent);color:#fff;font-size:.68rem;font-weight:800;padding:1px 7px;border-radius:20px;margin-right:6px;vertical-align:1px;}
.nb-a{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:.87rem;line-height:1.6;}
.nb-a.show{display:block;}
.nb-a .nb-t{white-space:normal;}
pre.nb-tree{background:var(--accent-soft);border-radius:5px;padding:9px 12px;margin:8px 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem;line-height:1.45;white-space:pre;overflow-x:auto;}
.pill.notes{background:#e0edf7;color:#1d4a6b;}
@media (prefers-color-scheme: dark){ .pill.notes{background:#1e3346;color:#8fc4ea;} }
.collapsible > .cbody{display:none;}

 q:"List and explain the five types of ambiguity in NLP with an example each.",

{id:"m1t13", topic:"1.2", marks:5, priority:"high", flashcard:false,
 q:"Explain structural (syntactic) ambiguity using Scope ambiguity and Prepositional Phrase (PP) attachment ambiguity.",

   {id:"m1n1p2", difficulty:"easy", q:"A corpus has 50 words. 'the' appears 10 times. What is P(the)?", answer:"P(the) = 10/50 = 0.20"},
   {id:"m1n1p3", difficulty:"easy", q:"In a 100-word corpus, 'run' appears 4 times. What is P(run)?", answer:"P(run) = 4/100 = 0.04"},
   {id:"m1n1p4", difficulty:"basic", q:"Corpus of 40 words: cat=4, sat=2, mat=2. Using the unigram (independence) approximation, estimate P(\"cat sat mat\").", answer:"P(cat)=4/40=0.10, P(sat)=2/40=0.05, P(mat)=2/40=0.05. P(sentence)=0.10×0.05×0.05=0.00025"},
   {id:"m1n1p5", difficulty:"basic", q:"Corpus of 25 words: I=5, like=3, NLP=1. Estimate the unigram probability of \"I like NLP\".", answer:"P(I)=5/25=0.20, P(like)=3/25=0.12, P(NLP)=1/25=0.04. P=0.20×0.12×0.04=0.00096"},
   {id:"m1n1p6", difficulty:"basic", q:"Why does the unigram approximation give the same probability to \"cat sat mat\" and \"mat sat cat\"?", answer:"Because the unigram (independence) model multiplies individual word probabilities regardless of order — it has no notion of which word follows which. Both scramblings use the same 3 words so they get the identical product. This is exactly the weakness that bigram/trigram models (Module 2) fix."},
   {id:"m1n1p7", difficulty:"moderate", q:"Corpus of 60 words: the=12, quick=3, fox=2, jumps=1. Estimate P(\"the quick fox jumps\") using unigram approximation.", answer:"P(the)=12/60=0.20, P(quick)=3/60=0.05, P(fox)=2/60=0.0333, P(jumps)=1/60=0.0167. Product ≈ 0.20×0.05×0.0333×0.0167 ≈ 0.00000556"},
   {id:"m1n1p8", difficulty:"moderate", q:"If a word never appeared in the training corpus, what unigram probability would it get, and why is this a problem?", answer:"P(word)=0/N=0, so the ENTIRE sentence's probability becomes 0 the moment one unseen word appears — this is the 'zero-probability problem', solved in Module 2 by smoothing techniques (Laplace, Good-Turing)."},
   {id:"m1n1p9", difficulty:"moderate", q:"Corpus of 30 words: sun=3, rises=2, east=1. Compute P(\"sun rises east\") and compare it to P(\"east rises sun\") under the unigram model.", answer:"P(sun)=3/30=0.10, P(rises)=2/30=0.0667, P(east)=1/30=0.0333. Both orderings give the identical product ≈ 0.10×0.0667×0.0333 ≈ 0.000222, since unigram ignores order."},
   {id:"m1n1p10", difficulty:"difficult", q:"A corpus has 200 words. The 4-word sentence \"data drives smart decisions\" has individual counts data=8, drives=2, smart=4, decisions=2. Compute the unigram sentence probability, then explain in one line why a bigram model would likely give a very different (probably higher, order-aware) score for the correctly-ordered version.", answer:"P=(8/200)×(2/200)×(4/200)×(2/200) = 0.04×0.01×0.02×0.01 = 0.00000008. A bigram model would instead multiply P(drives|data)·P(smart|drives)·P(decisions|smart) style conditional probabilities — if this exact word sequence is more common than a random word co-occurrence, the bigram score for the correctly-ordered sentence would typically be higher (more realistic) than the order-blind unigram product."},
   {id:"m1n1p11", difficulty:"difficult", q:"Two 3-word test sentences use the same 3 words in different orders. Under a unigram model, which one gets a higher probability — and what does this reveal about the model's limitation?", answer:"Neither — they get EXACTLY the same probability, since unigram multiplies individual word probabilities with no regard to sequence. This reveals unigram models cannot distinguish grammatical from ungrammatical word order — a key motivation for bigram/trigram context models."},
   {id:"m1n1p12", difficulty:"exam-level", q:"Explain, using the chain rule of probability, why P(sentence) = P(w1)·P(w2|w1)·P(w3|w1,w2)·... is the exact (non-approximated) formula, and why the unigram model used above is a simplification of it.", answer:"By the chain rule, P(w1,w2,w3,...) = P(w1)·P(w2|w1)·P(w3|w1,w2)·...·P(wn|w1..wn-1) exactly, with no independence assumption. The unigram model approximates each conditional P(wi|w1..wi-1) ≈ P(wi) alone — i.e., it assumes each word is independent of all previous words. This is a simplification for tractability; real N-gram models (Module 2) use a limited history window (previous 1 or 2 words) as a middle ground between full chain-rule context and no context at all."},
   {id:"m1n1p13", difficulty:"exam-level", q:"A corpus of 500 words has 'NLP' appearing 5 times. In a NEW 100-word test document, if the empirical proportion held exactly, how many times would you expect 'NLP' to appear, and what unigram probability would you use for it (assume you re-estimate P from the ORIGINAL 500-word corpus, not the test document)?", answer:"P(NLP) from training corpus = 5/500 = 0.01. Expected count in a new 100-word document = 0.01 × 100 = 1 occurrence. The probability USED for scoring remains P(NLP)=0.01 (estimated from the training corpus, not recomputed from the test document)."},
   {id:"m1n1p14", difficulty:"challenge", q:"Why can't we reliably use unigram sentence probability alone to detect whether a sentence is grammatically well-formed? Give a concrete counterexample using probabilities.", answer:"Because unigram probability is order-blind and purely frequency-based. Example: if 'colourless', 'green', 'ideas', 'sleep', 'furiously' are all individually common words, their unigram product could be non-trivial even though the sentence is semantically anomalous (Chomsky's example) — and a scrambled ordering of the SAME words gets the identical score, despite being equally (un)grammatical. Grammaticality needs syntactic (structural) information, which unigram probability cannot capture — this is exactly why the pipeline has a separate Syntactic stage."}
  ]
 },
 {
  id:"m1n2", title:"Bag-of-Words Vectorization", topic:"Math Seeds",
  concept:"Bag-of-Words (BoW) converts text into a numeric vector using a fixed vocabulary, ignoring grammar and word order — only presence/count of each vocabulary word matters. This is the simplest possible word-representation model and is a warm-up for Module 2's full treatment of BoW and TF-IDF.",
  formula:"Given vocabulary V = [t1, t2, ..., tn], a document D is represented as vector [c1, c2, ..., cn] where ci = count of term ti in D (or 1/0 for presence-only BoW).",
  workedExample:{
   title:"Build a BoW vector for a short review",
   steps:[
    "Vocabulary (fixed, agreed in advance): [\"good\",\"bad\",\"movie\",\"acting\",\"boring\"]",
    "Document: \"good movie, good acting\"",
    "Step 1 — Tokenize: [good, movie, good, acting]",
    "Step 2 — Count each vocabulary word in the document: good=2, bad=0, movie=1, acting=1, boring=0",
    "Step 3 — Write the vector in vocabulary order: [2, 0, 1, 1, 0]",
    "This vector can now be fed into a simple classifier (e.g. counting positive vs negative words) — but note it has LOST the word order and the fact that 'good' modifies 'movie' vs 'acting' — a key limitation discussed further with TF-IDF and embeddings."
   ]
  },
  practice:[
   {id:"m1n2p1", difficulty:"easy", q:"Vocabulary=[\"cat\",\"dog\"]. Document=\"cat cat dog\". Give the BoW count vector.", answer:"[2, 1]"},
   {id:"m1n2p2", difficulty:"easy", q:"Vocabulary=[\"good\",\"bad\"]. Document=\"bad bad bad\". Give the BoW vector.", answer:"[0, 3]"},
   {id:"m1n2p3", difficulty:"easy", q:"Vocabulary=[\"a\",\"b\",\"c\"]. Document=\"a c a\". Give the BoW vector.", answer:"[2, 0, 1]"},
   {id:"m1n2p4", difficulty:"basic", q:"Vocabulary=[\"nlp\",\"is\",\"fun\",\"hard\"]. Document=\"nlp is fun nlp is fun\". Give the BoW vector.", answer:"[2, 2, 2, 0]"},
   {id:"m1n2p5", difficulty:"basic", q:"Vocabulary=[\"great\",\"terrible\",\"movie\"]. Document=\"terrible movie, just terrible\". Give the BoW vector.", answer:"[0, 2, 1]"},
   {id:"m1n2p6", difficulty:"basic", q:"Using PRESENCE-only (binary) BoW instead of counts, vocabulary=[\"the\",\"cat\",\"sat\"], document=\"the cat the cat sat\", give the binary vector.", answer:"[1, 1, 1] (binary BoW records presence, not frequency, so repeats don't change the value)"},
   {id:"m1n2p7", difficulty:"moderate", q:"Vocabulary=[\"win\",\"lose\",\"draw\",\"match\"]. Document=\"win the match, win again\" (ignore 'the' and 'again' — not in vocabulary). Give the BoW vector.", answer:"[2, 0, 0, 1] — words outside the fixed vocabulary ('the','again') are simply ignored/dropped."},
   {id:"m1n2p8", difficulty:"moderate", q:"Two documents: D1=\"good good bad\", D2=\"bad bad good\", vocabulary=[\"good\",\"bad\"]. Are the BoW vectors of D1 and D2 the same or different? Compute both and explain.", answer:"D1 = [2,1], D2 = [1,2] — DIFFERENT, because BoW counts each word regardless of order, but the two documents have different actual word counts (D1 has 2 'good'/1 'bad'; D2 has 1 'good'/2 'bad'). Note this is different from the earlier point about order-invariance: BoW is invariant to ORDER of the SAME multiset of words, not to different word counts."},
   {id:"m1n2p9", difficulty:"moderate", q:"Vocabulary=[\"happy\",\"sad\",\"angry\"]. Document A=\"happy sad\" and Document B=\"sad happy\". Are their BoW vectors identical? Why?", answer:"Yes, identical: both give [1,1,0]. This demonstrates BoW's core limitation — it discards word order, so 'happy sad' and 'sad happy' are indistinguishable to a BoW model even though they could carry different meaning."},
   {id:"m1n2p10", difficulty:"difficult", q:"Vocabulary=[\"not\",\"good\",\"bad\"]. Document 1=\"not good\" (meaning negative), Document 2=\"good not bad\" (meaning positive, i.e. \"not bad\"=good). Compute both BoW vectors and explain why a plain BoW-based classifier could easily misclassify one of these.", answer:"D1 vector=[1,1,0], D2 vector=[1,1,1]. A naive BoW classifier that just counts 'good' vs 'bad' presence could misread D1 (\"not good\" = negative) as positive because it contains 'good', since BoW cannot capture that 'not' negates the following word — it has no sense of syntactic scope. This is why sentiment systems need more than raw BoW (e.g. n-grams, or semantic/syntactic stages)."},
   {id:"m1n2p11", difficulty:"exam-level", q:"Given vocabulary size |V|=5000 and a short 10-word document, describe one practical problem with the BoW vector for this document, and name the representation from Module 2 designed to address word-importance (not just word-presence).", answer:"Problem: the vector will be extremely SPARSE — almost all 5000 dimensions will be 0 since the document only has ~10 words, wasting memory/compute and providing little discriminative signal for common words like 'the'. TF-IDF (Term Frequency–Inverse Document Frequency, Module 2, 2.8) addresses word-importance by downweighting words that appear in many documents (like 'the') and upweighting words that are frequent in this document but rare elsewhere."},
   {id:"m1n2p12", difficulty:"exam-level", q:"Explain why BoW vectors for two documents about completely different topics but using completely different vocabulary words would have very low similarity, and what similarity measure is typically used to compare two BoW/TF-IDF vectors.", answer:"If the two documents share almost no vocabulary words, most corresponding vector positions will have at least one zero, so their dot product (and hence cosine similarity) will be near zero. Cosine similarity — cos(θ) = (A·B)/(|A||B|) — is the standard measure used to compare BoW/TF-IDF vectors, since it normalizes for document length and measures the angle between the two count vectors rather than raw magnitude."},
   {id:"m1n2p13", difficulty:"challenge", q:"A classifier is trained using BoW features on a corpus where 'good' appears in 90% of ALL documents regardless of actual sentiment (e.g. as part of a boilerplate phrase 'have a good day' in every email). Explain why raw term-frequency BoW would incorrectly treat 'good' as a strong signal, and how this connects to the motivation for TF-IDF's 'inverse document frequency' term.", answer:"Raw term-frequency BoW only looks at how often a word appears WITHIN a document, not how many OTHER documents also contain it — so a boilerplate word appearing in 90% of documents still gets a high count/weight in each one, even though its presence carries almost no discriminative information (since it's everywhere). TF-IDF fixes exactly this by multiplying term frequency by inverse document frequency (log(N/df)), which drives the weight of a word that appears in nearly every document toward zero — this is covered in full with worked numericals in Module 2 (2.8)."}
  ]
 }
];

{id:"m2t1", topic:"2.1", marks:3, priority:"high", flashcard:true,
 q:"Distinguish between Lexeme, Token, and Type.",
 a:"Lexeme: the abstract dictionary-entry unit of meaning — e.g. RUN is one lexeme covering 'run','ran','running'. Token: a single occurrence of a word in a running text — 'run', 'ran', 'running' are 3 separate tokens. Type: a unique token FORM in the vocabulary — 'the the the' = 3 tokens but 1 type. Key insight: NLP systems work at the TOKEN level, not the lexeme level — that's exactly why 'run' and 'running' are treated as different unless morphological analysis (2.4) maps them back together.",
 examAnswer:"State all 3 definitions with the RUN example, then add the 1-line 'NLP works at token level' insight — that closing insight is what the professor explicitly emphasized.",
 mistakes:"Don't confuse Type with Lexeme — 'cats' and 'cat' are 2 different types but may reduce to 1 lexeme after morphological analysis."
},
{id:"m2t2", topic:"2.1", marks:5, priority:"medium", flashcard:false,
 q:"Explain why word tokenization is difficult across languages, with examples.",
 a:"Chinese/Japanese: no spaces between words at all — e.g. 莎拉波娃现在居住在美国东南部的佛罗里达 must be machine-segmented into 莎拉波娃/现在/居住/在/美国/东南部/的/佛罗里达 ('Sharapova now lives in US southeastern Florida'). Japanese further mixes multiple scripts (Katakana, Hiragana, Kanji, Romaji) in one sentence. Sanskrit: sandhi joins words together in writing (e.g. a long verse string) requiring segmentation into meaningful word units — a much harder problem than English spacing. English itself has issues: possessives (Finland's → Finland+'s or Finlands?), clitics (I'm → I am), multi-word entities (San Francisco = 1 or 2 tokens?), hyphens (co-, multi-). French: L'ensemble — is 'L' or 'L'' a token? German: compounds aren't segmented at all, e.g. Lebensversicherungsgesellschaftsangestellter ('life insurance company employee') needs a compound splitter.",
 examAnswer:"Give at least 3 language examples (Chinese/Japanese no-space segmentation, Sanskrit sandhi, German compounding) plus 1 English-specific issue (possessives/clitics/hyphens) — breadth across languages is what scores full marks here.",
 mistakes:"Don't treat this as purely an English problem — the question specifically tests cross-lingual awareness; German/Chinese/Sanskrit examples are what distinguish a top answer."
},
{id:"m2t3", topic:"2.2", marks:5, priority:"high", flashcard:true,
 q:"State Zipf's Law and explain its practical implication for NLP preprocessing.",
 a:"Zipf's Law: the frequency (f) of a word is inversely proportional to its rank (r) in a frequency-sorted list: f ∝ 1/r, i.e. there is a constant k such that f·r = k. So the 50th most common word occurs with roughly 3× the frequency of the 150th most common word. Numeric grounding: rank 1 ('the') ≈ 7% of all words, rank 2 ('of') ≈ 3.5%, rank 3 ('and') ≈ 2.8%, rank 10 ('in') ≈ 1%. Implication: a handful of words dominate any text, which is exactly why stop-word removal works — the top 100 words cover roughly 50% of all text, so removing them eliminates half the text using only 100 rules.",
 examAnswer:"State the formula (f∝1/r, f·r=k) + the rank/frequency grounding numbers + the stop-word-removal implication as the closing 'why it matters' line.",
 mistakes:"Don't forget the constant-product form f·r=k — this is exactly what numerical questions test (given one rank/frequency pair, predict another)."
},
{id:"m2t4", topic:"2.2", marks:3, priority:"medium", flashcard:true,
 q:"What is 'Zipf's Other Law'? How does it relate to the first law?",
 a:"Zipf's other law states a correlation between the number of meanings of a word and its frequency: the number of meanings (m) of a word obeys m ∝ √f. Combined with the first law (f∝1/r), this gives m ∝ 1/√r — i.e. more frequent (lower-rank) words tend to have proportionally more meanings (polysemy).",
 examAnswer:"Give the formula m∝√f, then derive m∝1/√r by substituting Zipf's first law — showing the derivation step is what separates a full-marks answer.",
 mistakes:"Don't confuse this with Heaps' Law (vocabulary growth) — 'Zipf's other law' is specifically about polysemy (meanings), not vocabulary size."
},
{id:"m2t5", topic:"2.2", marks:3, priority:"high", flashcard:true,
 q:"State Heaps' Law and its implication for vocabulary design.",
 a:"Heaps' Law: vocabulary size grows as a power function of corpus size: |V| = K × N^β, where |V| = vocabulary size, N = number of tokens, and K, β are corpus-specific constants (β ≈ 0.4–0.6, typically ≈0.5 for English). As N doubles, |V| grows by roughly 40%. Implication: vocabulary never saturates — this is the 'open vocabulary problem': you can never assume you've seen every word, motivating techniques like the <UNK> token and subword tokenization (BPE, used in BERT/GPT) to handle unseen words.",
 examAnswer:"Formula |V|=K·N^β + the β≈0.5 fact + the open-vocabulary-problem implication, connecting to <UNK>/subword tokenization if asked for depth.",
 mistakes:"Don't say vocabulary grows linearly with corpus size — it grows sub-linearly (a power law with β<1), which is the entire point of the law."
},
{id:"m2t6", topic:"2.2", marks:3, priority:"high", flashcard:true,
 q:"Define Type-Token Ratio (TTR) and interpret what a high vs low value means.",
 a:"TTR = Number of Types / Number of Tokens. It measures lexical diversity — how often, on average, a new word form appears in a text. TTR > 0.70 → high lexical diversity (many unique words, few repeats). 0.50–0.70 → moderate diversity. TTR < 0.50 → low diversity (many repeated words, limited vocabulary). Caveat: TTR is NOT a valid measure of text complexity by itself, because it varies with text length (longer texts naturally have lower TTR since common words repeat) — for a fair comparison, a running average is computed over consecutive fixed-size chunks (e.g. 1000-word windows) of the text.",
 examAnswer:"Give the formula, the 3-band interpretation table (>0.70 / 0.50–0.70 / <0.50), and the important caveat that raw TTR isn't comparable across different text lengths.",
 mistakes:"A very common mistake: treating TTR as directly comparable between a 100-word text and a 10,000-word text — TTR shrinks as length grows, so this comparison is invalid without chunk-normalization."
},
{id:"m2t7", topic:"2.3", marks:5, priority:"high", flashcard:false,

 a:"Sentence Segmentation (decide where sentences begin/end) → Word Tokenization (segment text into words) → Stemming/Lemmatization (reduce to base form) → POS Tagging (assign part-of-speech) → Stop-word Removal (drop low-information words) → Dependency Parsing (find grammatical relations) → Noun Phrase / Chunking (group flat POS-tagged tokens into phrases) → Named Entity Recognition (identify people/places/organizations) → Coreference Resolution (resolve pronouns to entities). This maps to the pipeline diagram: Text Document (Input) → [Sentence Segmentation | Tokenization | POS Tagging | Lemmatization | Stop Words | Dependency Parsing | Noun Phrases | NER | Coreference Resolution] → Data Structures Representing Parsed Text (Output).",

{id:"m2t8", topic:"2.3", marks:3, priority:"medium", flashcard:false,
 q:"What makes sentence segmentation difficult? How is it typically solved?",
 a:"Sentence segmentation is the problem of deciding where sentences begin and end. '!' and '?' are fairly unambiguous sentence-enders, but the period '.' is highly ambiguous — it's also used for abbreviations (Dr., Mr.) and numbers (2.3%, 7.9). Solution approach: build a binary classifier — for each '.' encountered, decide EndOfSentence vs NotEndOfSentence. Such classifiers can be hand-written rules, regular expressions, or machine-learning classifiers.",
 examAnswer:"Definition + the specific period-ambiguity examples (abbreviations, decimal numbers) + the binary-classifier framing (EndOfSentence/NotEndOfSentence).",
 mistakes:"Don't say sentence segmentation is 'just splitting on periods' — the entire point of the question is that periods are ambiguous and need a classifier."
},
{id:"m2t9", topic:"2.3", marks:3, priority:"medium", flashcard:false,
 q:"Distinguish Stemming from Lemmatization at the preprocessing-overview level (full algorithmic detail is in 2.6).",
 a:"Stemming: crude chopping of affixes using fixed rules, without context — e.g. automate(s), automatic, automation all reduce to 'automat'. Faster, rule-based, less accurate, can produce non-words. Lemmatization: reduces inflections/variants to the correct dictionary base form (the 'lemma') using knowledge of the language/context — e.g. am/are/is → be; car/cars/car's/cars' → car. Slower, dictionary-based, more accurate, always returns a real word. Contrast example: 'ability' — stemming gives 'abil' (wrong), lemmatization gives 'ability' unchanged (correct, since it's already a base form).",
 examAnswer:"1-line definition of each + the ability/abil contrast example — this exact example appears on the professor's slide and is highly quotable.",
 mistakes:"Don't say stemming is 'lemmatization but faster' — they use fundamentally different methods (rule-based affix-stripping vs dictionary lookup), not just different speeds."
},
{id:"m2t10", topic:"2.3", marks:3, priority:"low", flashcard:false,
 q:"What is Chunking? Illustrate with the sentence 'the book has many chapters'.",
 a:"Chunking identifies and classifies the flat, non-overlapping segments of a sentence that form the basic non-recursive phrases (e.g. noun phrases) corresponding to major parts of speech in wide-coverage grammars. For \"the/DT book/NN has/VBZ many/JJ chapter/NNS\": chunking groups (the DT, book NN) into one NP chunk and (many JJ, chapter NNS) into another NP chunk, leaving 'has VBZ' outside any chunk (since verbs aren't grouped into NP chunks) — i.e. Sentence → [NP(the, book), has, NP(many, chapter)].",
 examAnswer:"Definition + draw/describe the tree: Sentence branches into NP(the/DT, book/NN), has/VBZ (standalone), NP(many/JJ, chapter/NNS).",

},
{id:"m2t11", topic:"2.3", marks:3, priority:"low", flashcard:false,
 q:"Define Dependency Parsing, NER, and Coreference Resolution.",
 a:"Dependency Parsing: examines the dependencies (direct grammatical relationships) between phrases/words of a sentence to determine its grammatical structure — each linguistic unit connects to another via a labeled 'dependency' (e.g. nsubj, dobj, det). Named Entity Recognition (NER): identifies entities such as places, names, and objects in text. Coreference Resolution: resolves pronouns (he, they, etc.) to the correct entities they refer to.",
 examAnswer:"3 crisp definitions; for dependency parsing, be ready to draw a small labeled arc diagram (e.g. 'I prefer the morning flight through Denver' with nsubj/root/dobj/det/nmod/case arcs) if asked for depth.",

{id:"m2t12", topic:"2.4", marks:5, priority:"high", flashcard:true,
 q:"Define Morpheme, and distinguish Free vs Bound morphemes with examples.",
 a:"A morpheme is the smallest indivisible unit of semantic content and grammatical function — the minimal unit of a language which has meaning (lexical or grammatical) and cannot be divided into smaller units; the minimal building block of meaning. Free morphemes can stand alone as words and function independently — e.g. cat, boat, on, in (carry most of the 'semantic content'). Bound morphemes can occur only in combination with a root — e.g. -s, -er, -ing, -ment (never appear as standalone words). Example: 'badly' = free morpheme 'bad' + bound morpheme '-ly'.",
 examAnswer:"Definition of morpheme + free vs bound with 2 examples each + the 'badly = bad + ly' composed-word example to show how they combine.",
 mistakes:"Don't say bound morphemes 'have no meaning' — they DO carry meaning (e.g. -s = plural), they just cannot stand alone as words."
},
{id:"m2t13", topic:"2.4", marks:5, priority:"high", flashcard:true,
 q:"Differentiate Inflectional Morphology from Derivational Morphology, with examples.",
 a:"Inflectional morphology: modifies a word to express grammatical categories (number, tense, case, gender) WITHOUT changing its grammatical category (part of speech) or basic meaning — e.g. cat→cats, walk→walked. English has only 8 inflectional affixes: -s (3rd person sg. present, e.g. 'she waits'), -ed (past tense), -ing (progressive), -en (past participle), -s (plural), -'s (possessive), -er (comparative), -est (superlative). Inflected words are not separate dictionary entries. Derivational morphology: creates a NEW word, often changing its grammatical category — e.g. happy(Adj)→happiness(Noun), compute(V)→computerization(N). A very common English derivation is nominalization (forming nouns from verbs/adjectives, e.g. via -ation, -ee, -er, -ness).",
 examAnswer:"Two-column comparison: Inflectional (same category, grammatical marking, 8 affixes, not a new dictionary word) vs Derivational (new category, new dictionary word, e.g. -ation/-ness/-al/-able) — reproduce the 8 inflectional affixes list if asked for full marks.",
 mistakes:"The single most common mistake: calling category-changing suffixes 'inflectional'. If the part of speech changes (verb→noun, adjective→noun), it is ALWAYS derivational, never inflectional — this rule alone answers most exam questions on this topic."
},
{id:"m2t14", topic:"2.4", marks:5, priority:"medium", flashcard:false,
 q:"Explain the 4 types of affixes with cross-linguistic examples.",
 a:"1. Prefix — precedes the stem: English un-, anti- (un-happy); Sanskrit a-, ati-, pra-. 2. Suffix — follows the stem: English -ity, -ation (talk-ing); Hindi -taa, -ke, -ka. 3. Circumfix — wraps around the stem (both before and after): German past participles, e.g. sagen (to say) → gesagt (said), adding ge- at the start and -t at the end simultaneously. 4. Infix — inserted INSIDE the stem: Sanskrit vid (to know) → vindati (he knows), where 'n' is inserted inside the root.",
 examAnswer:"Name all 4 types with the stem-position rule (before/after/around/inside) and one example each — the German circumfix (gesagt) and Sanskrit infix (vindati) examples are the most distinctive/quotable.",
 mistakes:"Don't confuse circumfix with 'prefix + suffix both used somewhere in the word' — a circumfix is specifically ONE discontinuous morpheme wrapping around the stem, not two separate affixes."
},
{id:"m2t15", topic:"2.4", marks:5, priority:"medium", flashcard:false,
 q:"List the four methods of combining morphemes into words, and the morphological processes involved.",
 a:"Four methods: (1) Inflection, (2) Derivation, (3) Compounding, (4) Cliticization. Morphological processes: Concatenation — adding continuous affixes (hope+less), with phonological (shoe+s→[z], a sound change) or graphemic (happy+er→happier, a spelling change) sub-changes. Reduplication — doubling part/all of the word, e.g. Sanskrit pac (cook)→papāca (cooked, perfect form); Telugu phrasal reduplication. Suppletion — an irregular relation between word forms, e.g. go–went, good–better. Morpheme-internal change — the word changes internally, e.g. sing-sang-sung, man-men, goose-geese.",
 examAnswer:"List the 4 combination methods, then the 4 processes with one example each — suppletion (go/went) and internal change (sing/sang/sung) are the two most commonly tested since they look similar but are technically different processes.",
 mistakes:"Don't conflate Suppletion with Morpheme-internal change — suppletion uses an entirely unrelated word form (go/went), while internal change modifies the SAME root's internal vowel/sound (sing/sang/sung)."
},
{id:"m2t16", topic:"2.4", marks:3, priority:"low", flashcard:false,
 q:"Distinguish Compounding, Blending, and Clipping as word-formation processes.",
 a:"Compounding: combining two or more whole words — bitter-sweet (Adj+Adj→Adj), rain-bow (N+N→N), pick-pocket (V+N→V), over-do (P+V→V). Blending: parts of two different words combined — breakfast+lunch→brunch, smoke+fog→smog, motor+hotel→motel. Clipping: shortening a longer word — Doctor→doc, Laboratory→lab, Advertisement→ad, Examination→exam, Refrigerator→fridge.",
 examAnswer:"3 named processes with 2 examples each — compounding keeps both full words, blending merges PARTS of both words, clipping just shortens ONE word.",
 mistakes:"Don't confuse Blending with Compounding — compounding joins two COMPLETE words (rainbow), blending only uses PARTS of each word (brunch = br(eakfast)+(l)unch)."
},
{id:"m2t17", topic:"2.4", marks:5, priority:"high", flashcard:false,
 q:"What three components are needed to build a morphological parser?",
 a:"1. Lexicon — the list of stems and affixes with basic information about them (e.g. whether a stem is a Noun-stem or Verb-stem). 2. Morphotactics — the model of morpheme ORDERING: which classes of morphemes can follow other classes inside a word (e.g. the fact that the English plural morpheme follows the noun, not precedes it, is a morphotactic fact). 3. Orthographic rules — spelling rules modeling changes when morphemes combine (e.g. the y→ie rule that changes city+-s to cities, not citys).",
 examAnswer:"Name all 3 (Lexicon / Morphotactics / Orthographic rules) with the specific example given for each — 'plural follows noun' for morphotactics and 'city+s→cities' for orthographic rules are the professor's own quoted examples.",
 mistakes:"Don't merge Morphotactics and Orthographic rules — morphotactics is about ORDERING legality (which affix can follow which), while orthographic rules are about SPELLING changes at the join point. They're tested as separate concepts."
},
{id:"m2t18", topic:"2.4", marks:3, priority:"medium", flashcard:true,
 q:"Give the 4 morphology-mapping tasks: Lemmatization, Morphological Analysis, Tagging, and Generation. How do they differ?",
 a:"Lemmatization: word → lemma (e.g. saw → {see, saw} — ambiguous, ignores context). Morphological Analysis: word → set of (lemma+tag) pairs (e.g. saw → {⟨see,verb.past⟩, ⟨saw,noun.sg⟩} — enumerates all readings). Tagging: word → single tag, USING context to disambiguate (e.g. 'Peter saw her' → only ⟨see,verb.past⟩, since context rules out the noun reading). Generation: the reverse direction, lemma+tag → word (e.g. see+verb.past → saw).",
 examAnswer:"A 4-row table: Task | Direction | Example — the key differentiator to state explicitly is that Tagging (unlike plain Morphological Analysis) uses SURROUNDING CONTEXT to pick just one answer.",
 mistakes:"Don't say Morphological Analysis and Tagging are the same — Morphological Analysis returns ALL possible readings (ambiguous), Tagging returns exactly ONE reading (disambiguated via context)."
},
{id:"m2t19", topic:"2.5", marks:5, priority:"high", flashcard:true,
 q:"Give the formal definition of a Deterministic Finite Automaton (DFA), and define the language it accepts.",
 a:"A DFA is a quintuple M = (Q, Σ, δ, q0, F) where: Q = finite set of internal states; Σ = finite input alphabet; δ: Q×Σ→Q = transition function; q0∈Q = initial state; F⊆Q = set of final/accepting states. The extended transition function δ*: Q×Σ*→Q gives the state reached after reading an entire string: δ*(q,ε)=q and δ*(q,wa)=δ(δ*(q,w),a). The language accepted by M is L(M) = {w∈Σ* | δ*(q0,w)∈F} — i.e. all strings that drive the automaton from the start state to some accepting state.",
 examAnswer:"State the quintuple exactly (Q,Σ,δ,q0,F) with each symbol's meaning, then give L(M)'s set-builder definition using δ* — both the quintuple AND the L(M) formula are commonly asked separately.",
 mistakes:"Don't forget δ is a function into Q (not a relation) — that's precisely what makes it DETERMINISTIC (exactly one next state per state+symbol pair, unlike an NFA)."
},
{id:"m2t20", topic:"2.5", marks:3, priority:"medium", flashcard:false,
 q:"State the theorem connecting Regular Expressions, Regular Languages, and Finite State Automata.",
 a:"A language L is regular if and only if there exists a deterministic finite automaton M such that L=L(M) — equivalently, if and only if there exists an FSA A such that L=L(A). Regular expressions describe exactly the regular languages: for every regular expression E there is a DFA A with L(E)=L(A), and for every DFA A there is a regular expression E with L(A)=L(E). There are simple, efficient algorithms for translating a regular expression to an equivalent automaton and vice versa.",
 examAnswer:"State the iff theorem in both directions (RE↔FSA↔Regular Language), and mention that efficient conversion algorithms exist both ways.",
 mistakes:"Don't state this as a one-directional fact ('every regex has an automaton') — the theorem is explicitly bidirectional (iff), and exam questions often test the reverse direction (automaton → regex)."
},
{id:"m2t21", topic:"2.5", marks:5, priority:"medium", flashcard:false,
 q:"What is a Finite-State Transducer (FST)? How does it differ from an FSA?",
 a:"An FST is a type of FSA that maps between TWO sets of symbols — a two-tape automaton that recognizes or generates PAIRS of strings, one from each alphabet, defining a relation between sets of strings. Unlike an FSA (which just accepts/rejects single strings over one alphabet), an FST's transitions are labeled with input:output pairs (e.g. 'aa:b' means 'read aa, write b'). FSTs are the natural tool for morphological analysis, since morphology is fundamentally a MAPPING (e.g. surface form ↔ underlying stem+tag), not just a yes/no acceptance question.",
 examAnswer:"Define FST as a two-tape/relation-defining FSA, contrast with plain FSA (accept/reject single strings vs. map pairs), and be ready to draw a small FST diagram with x:y labeled transitions if asked.",
 mistakes:"Don't describe an FST as 'just an FSA with two states' — the defining property is the input:output labeled transition, not the number of states.",
 diagram:"Draw 2 states q0, q1: q0 has a self-loop labeled 'aa:b'; arcs q0→q1 labeled 'b:a' and 'b:b'; q1 has a self-loop labeled 'b:ε'; and an arc q1→q0 labeled 'a:ba'. Label format is always 'input:output'."
},
{id:"m2t22", topic:"2.6", marks:5, priority:"high", flashcard:true,
 q:"Explain the Porter Stemmer's core notation: consonant/vowel, C/V, and the measure m.",
 a:"A consonant is any letter other than A,E,I,O,U, and also Y when NOT preceded by a consonant (so in 'TOY' the consonants are T,Y; in 'TRY' they are T,R). A list of consonants is denoted C, a list of vowels is denoted V. Any word has the form [C]VCVC...[V], which can be written [C](VC)^m[V] where m is called the MEASURE of the word — m=0 for short words like TR, EE, Y; m=1 for TROUBLE, OATS, IVY; m=2 for TROUBLES, PRIVATE, OATEN. Rules are conditioned on m (e.g. '(m>0) ATION → ATE' only applies if the stem before ATION has measure > 0), and where multiple rules could match, only the rule with the LONGEST matching suffix is applied.",
 examAnswer:"Define consonant/vowel (with the Y-exception), the [C](VC)^m[V] form, give 2-3 example words at different m values, and state the longest-match precedence rule.",
 mistakes:"Don't forget the Y-exception — Y counts as a CONSONANT when it starts a syllable/is not preceded by a consonant (as in 'Y' or 'YACHT'), and as a VOWEL otherwise (as in 'TOY', 'SYZYGY') — this trips up most students."
},
{id:"m2t23", topic:"2.6", marks:5, priority:"high", flashcard:false,
 q:"Trace the Porter Stemmer's Step 1a and Step 1b rules with examples.",
 a:"Step 1a (plurals): SSES→SS (caresses→caress); IES→I (ponies→poni); SS→SS (caress→caress, unchanged); S→delete (cats→cat). Step 1b (verb endings, condition-gated): (m>0) EED→EE (feed→feed, agreed→agree); (*v*, i.e. stem contains a vowel) ED→delete (plastered→plaster, bled→bled); (*v*) ING→delete (motoring→motor, sing→sing). If the ED/ING rule fires, a cleanup pass applies: AT→ATE (conflated→conflate), BL→BLE (troubled→trouble), IZ→IZE (sized→size), double-consonant-not-L/S/Z → single letter (hopping→hop, tanned→tan), and (m=1 and *o) → add E (filing→file).",
 examAnswer:"Give the Step 1a rule table (4 rules) and Step 1b rule table (3 main rules + cleanup) with at least 2 examples each — being asked to 'trace a word through Porter's algorithm' means applying exactly these tables in order.",
 mistakes:"Don't apply Step 1b's ED/ING deletion without checking the (*v*) condition first — 'sing' is NOT stemmed to 's' because there's no vowel in the stem 'S' before -ING once ING is notionally removed... more precisely, the rule only fires if the remaining stem after removing the suffix contains a vowel."
},
{id:"m2t24", topic:"2.6", marks:3, priority:"medium", flashcard:true,
 q:"Why was the Snowball (Porter2) algorithm created, and what R1/R2 notation does it use instead of Porter's measure m?",
 a:"Snowball was created (~2001 by Martin Porter, same author) to fix known flaws/mis-strippings in the original 1980 Porter algorithm, to extend stemming beyond English to 20+ languages via a shared rule-writing framework, and to separate linguistic rules (readable Snowball-language files) from generated code (previously tangled in C). R1/R2 replace measure m: R1 = the region of the word AFTER the first non-vowel that follows a vowel; R2 = apply the same rule again, but within R1 (i.e. the region after the first non-vowel-following-a-vowel INSIDE R1). Roughly, 'suffix in R1' ≈ Porter's m>0, and 'suffix in R2' ≈ Porter's m>1. Example: for 'beautiful', R1='iful', R2='ul'.",
 examAnswer:"3 named reasons for creation (fix flaws / multilingual / separate rules from code) + the R1/R2 definitions with the beautiful→R1='iful',R2='ul' worked example.",
 mistakes:"Don't describe R1/R2 as 'the same as m, just renamed' — they are regions (substrings) of the word, not a single integer count like m; R1⊇R2 as nested suffix regions, which changes how rule-application 'in R1' vs 'in R2' is checked."
},
{id:"m2t25", topic:"2.6", marks:5, priority:"high", flashcard:true,
 q:"Compare Porter, Snowball, and Lemmatization across type, lexicon use, output, and best-use case.",
 a:"Porter: rule-based stemming, no lexicon, no grammar/POS use, output = a stem (may be a non-word, e.g. 'ability'→'abil'), English-only, moderate speed/accuracy, best for search/IR. Snowball (Porter2): rule-based stemming, no lexicon, no grammar use, output = a stem (may be non-word), works across 20+ languages, slightly more accurate than Porter, best for multilingual search/IR. Lemmatization: dictionary+rule-based, USES a lexicon, often uses grammar/POS, output = a real dictionary word (lemma), language-specific, slower but precise, handles irregular forms correctly (e.g. 'was'→'be', 'mice'→'mouse'), best for tasks where meaning/grammar matters (QA, grammar checking, display).",
 examAnswer:"A comparison table across: Type | Uses lexicon? | Output (stem vs real word) | Languages | Speed vs Accuracy | Best for — with the 'was'→'be'/'wa' and 'mice'→'mouse'/'mice' contrast examples to show stemmers failing on irregulars.",
 mistakes:"Don't say Snowball 'uses a dictionary' — it is still purely rule-based like Porter; only Lemmatization uses a lexicon/dictionary. This is the #1 confusion point in this topic."
},
{id:"m2t26", topic:"2.7", marks:5, priority:"high", flashcard:true,
 q:"Derive the N-gram (Markov) approximation to sentence probability from the chain rule.",
 a:"Exact chain rule: P(w1,w2,...,wn) = P(w1)·P(w2|w1)·P(w3|w1,w2)·...·P(wn|w1,...,wn-1). This needs impossibly much data (we may never see enough occurrences of a full long history to estimate each conditional). Markov assumption: approximate each conditional using only the previous k words: P(wi|w1,...,wi-1) ≈ P(wi|wi-k,...,wi-1). Special cases: Unigram (k=0, zero-order Markov): P(w1...wn) ≈ ∏P(wi). Bigram (k=1, first-order Markov): P(wi|w1...wi-1) ≈ P(wi|wi-1). An N-gram model uses only N-1 words of prior context and is therefore an (N-1)-order Markov model.",
 examAnswer:"Write the exact chain rule first, state WHY it's impractical (sparse data), then the Markov approximation formula, then name unigram=0th-order, bigram=1st-order, trigram=2nd-order — this exact derivation chain is the professor's own handwritten summary slide, reproduce it faithfully.",
 mistakes:"Don't skip the 'why do we need the approximation' step (data sparsity) — a full-marks answer explains the MOTIVATION for Markov, not just states the formula."
},
{id:"m2t27", topic:"2.7", marks:3, priority:"high", flashcard:true,
 q:"Give the Maximum Likelihood Estimate (MLE) formula for bigram probability.",
 a:"P(wi|wi-1) = count(wi-1,wi) / count(wi-1) — the count of the bigram (wi-1,wi) divided by the count of wi-1 appearing as the first word of any bigram. This is the 'value that makes the observed training data most probable' (hence Maximum Likelihood).",
 examAnswer:"Write the formula exactly, and be ready to apply it immediately to a small given corpus (this is the most frequently numerically-tested formula in the whole syllabus).",
 mistakes:"Don't divide by the TOTAL corpus size — you divide by count(wi-1) specifically (how often the conditioning word appears), not by the total number of words/bigrams in the corpus."
},
{id:"m2t28", topic:"2.7", marks:3, priority:"medium", flashcard:false,
 q:"What is the Out-Of-Vocabulary (OOV) problem, and how does the <UNK> token solve it?",
 a:"Closed vocabulary tasks assume every possible word is known in advance (rare in practice, e.g. a fixed voice-command set). Open vocabulary tasks allow new, unseen words at test time — called OOV words — which is the realistic setting for natural language. Without handling, an OOV word gets probability 0, collapsing the ENTIRE sentence's probability to 0. Solution: fix a lexicon L of size V, replace any training word not in L with a special <UNK> token during normalization, and train <UNK>'s probability like any normal word (accumulating counts from all rare/replaced words). At test time, any unseen word is mapped to <UNK> and scored using its learned probability — giving a principled nonzero probability to novel words instead of crashing to zero.",
 examAnswer:"Define OOV + closed vs open vocabulary, then explain <UNK> training (replace rare words in training) and testing (map unseen words to <UNK>) as two separate steps.",
 mistakes:"Don't say <UNK> 'ignores' unknown words — it explicitly ASSIGNS them a learned nonzero probability (the accumulated probability mass of all words replaced during training), it does not skip them."
},
{id:"m2t29", topic:"2.7", marks:5, priority:"high", flashcard:true,
 q:"Why is smoothing needed in N-gram language models? Name the two smoothing techniques covered and when to use consistent smoothing.",
 a:"Smoothing is needed because Maximum Likelihood Estimation assigns probability 0 to any n-gram never seen in training — and since sentence probability is a PRODUCT of n-gram probabilities, even one zero collapses the whole sentence to probability 0 (the 'zero-probability problem'). Two techniques: Laplace (Add-1) Smoothing — adds 1 to every count; Good-Turing Smoothing — reassigns probability mass based on the counts of low-frequency n-grams (N1, N2, ...). Consistency rule (professor's own FAQ): if comparing two sentences, always use the SAME method (both smoothed, or both unsmoothed) for a fair comparison — if either sentence could contain an unseen n-gram, smooth BOTH.",
 examAnswer:"State the zero-probability problem first (with the 'product of probabilities' reasoning), name both techniques, then the consistency rule as the exam 'gotcha' most students miss.",
 mistakes:"A key misconception the professor explicitly corrects: adding an unseen word to the vocabulary does NOT fix the zero-probability problem by itself, since its count is still 0 — only smoothing (redistributing probability mass) gives it a nonzero value."
},
{id:"m2t30", topic:"2.7", marks:5, priority:"high", flashcard:true,
 q:"Give the Laplace (Add-1) smoothing formulas for unigram and bigram probability.",
 a:"Unigram: P(w) = (c(w)+1) / (N+|V|), where N = total token count, |V| = vocabulary size. Bigram: P(wi|wi-1) = (c(wi-1,wi)+1) / (c(wi-1)+|V|). It adds 1 to every n-gram count (assumes a uniform prior over the vocabulary), guaranteeing every possible n-gram gets a nonzero probability, at the cost of shifting some probability mass away from frequently-seen n-grams.",
 examAnswer:"Write both formulas exactly (unigram AND bigram — they're often asked as two separate parts), and be ready to immediately apply them to a small worked corpus.",
 mistakes:"Don't forget the '+|V|' in the denominator — students often add 1 only to the numerator and forget the vocabulary-size correction in the denominator, which breaks the resulting distribution's normalization."
},
{id:"m2t31", topic:"2.7", marks:5, priority:"high", flashcard:true,
 q:"Explain Good-Turing smoothing, including the meaning of Nc and the reassignment formula.",
 a:"Nc = the 'frequency of frequency c' — the count of how many distinct n-grams occurred EXACTLY c times in the corpus. Good-Turing reassigns probability mass using these counts: the probability mass for all UNSEEN events is P*GT(unseen) = N1/N (the fraction of the corpus made up of things seen exactly once, reserved for things never seen). For an item seen c times, its Good-Turing-adjusted count is c* = (c+1)·N(c+1)/Nc, and its adjusted probability is P*GT = c*/N. Intuition (the fishing analogy): if you've caught 10 carp, 3 perch, 2 whitefish, 1 trout, 1 salmon, 1 eel (18 fish total, N1=3 species seen once), the chance the NEXT catch is a totally new species is estimated as N1/N = 3/18 — using the rate of 'singleton' species as a proxy for the rate of undiscovered species.",
 examAnswer:"Define Nc precisely, give both formulas (P*GT(unseen)=N1/N, and c*=(c+1)Nc+1/Nc), and use the fishing analogy to explain WHY N1/N estimates the unseen-event mass — examiners like the intuition explained, not just the formula quoted.",
 mistakes:"Common misconception the professor explicitly flags: N1/N is the TOTAL probability mass for ALL unseen events combined, NOT the probability of any one specific unseen event — don't divide it further per unseen word unless the question asks you to split it evenly."
},
{id:"m2t32", topic:"2.7", marks:5, priority:"high", flashcard:true,
 q:"Define Perplexity. What does a lower perplexity mean, and how does it relate to the branching factor?",
 a:"Perplexity of a language model on a test set W=w1...wN is the inverse probability of the test set, normalized by the number of words: PP(W) = P(w1...wN)^(-1/N) = the N-th root of 1/P(W). Using the chain rule, for a bigram model: PP(W) = Nth-root of ∏(1/P(wi|wi-1)). Perplexity is the WEIGHTED AVERAGE BRANCHING FACTOR of the language — the effective number of equally-likely next-word choices at each point. LOWER perplexity = better model (it is less 'surprised' by the test data, i.e. it assigns the actual words higher probability). This is an INTRINSIC evaluation (judges the model directly, without a downstream task) contrasted with EXTRINSIC evaluation (judges via a real task's accuracy, e.g. spelling correction or MT accuracy) — extrinsic is more reliable but expensive/slow.",
 examAnswer:"Formula + 'lower is better' stated explicitly (this is a direct fact-recall line professors like to test) + the branching-factor interpretation + intrinsic vs extrinsic evaluation distinction.",
 mistakes:"THE most common trap: assuming a SMALLER sentence probability P(W) means a BETTER model. It's the OPPOSITE — since PP(W)=P(W)^(-1/N), a smaller P(W) gives a LARGER (worse) perplexity. Always double check the inverse relationship before concluding which model is 'better'."
},
{id:"m2t33", topic:"2.8", marks:3, priority:"medium", flashcard:false,
 q:"Define Bag-of-Words (BoW) as a text representation technique, and list its properties.",
 a:"BoW is a statistical text representation technique that represents a document using the frequency or presence of words from a predefined vocabulary, ignoring word order and grammatical structure. Properties: represents text using word counts or presence; builds a vocabulary from the corpus; each document becomes a numerical vector; word order is ignored; grammar/meaning are not directly represented; produces a sparse vector when the vocabulary is large (see Module 1's worked BoW numerical for a full example).",
 examAnswer:"Definition + the properties list (numerical vector, order-ignoring, sparse for large vocab) — for full BoW vector construction practice, see Module 1's numericals, which cover the same technique in depth.",
 mistakes:"Don't claim BoW captures any word relationships or grammar — its defining limitation (tested repeatedly) is that it discards order entirely."
},
{id:"m2t34", topic:"2.8", marks:5, priority:"high", flashcard:true,
 q:"Define TF-IDF and give its formula. Why is it an improvement over raw Bag-of-Words counts? [Note: supplemented from standard NLP textbook material, as the professor's slides only gave a one-line definition.]",
 a:"TF-IDF (Term Frequency–Inverse Document Frequency) assigns a numerical weight to a word based on how frequently it occurs in a particular document (TF) and how RARELY it occurs across the entire document collection (IDF). Term Frequency: tf(t,d) = count of term t in document d (sometimes log-scaled: 1+log10(count) if count>0, else 0). Inverse Document Frequency: idf(t) = log10(N / df(t)), where N = total number of documents, df(t) = number of documents containing term t. TF-IDF weight: tfidf(t,d) = tf(t,d) × idf(t). Improvement over raw BoW: a plain frequency count treats a word appearing in EVERY document (like 'the', or a boilerplate phrase) as important just because it's frequent within one document — TF-IDF fixes this by multiplying by idf, which drives the weight of words appearing in most/all documents toward zero (log(N/N)=log(1)=0), while boosting words that are frequent in THIS document but rare elsewhere (the actually discriminative words).",
 examAnswer:"Both formulas (tf and idf) exactly, the combined tf-idf formula, and the 'why' — a word in every document gets idf≈0 regardless of its raw frequency, fixing BoW's blindness to document-level importance.",
 mistakes:"Don't forget idf uses a LOGARITHM of N/df, not a plain ratio — and don't forget it's the INVERSE (rare-across-corpus words get HIGH idf, common-across-corpus words get LOW/zero idf) — reversing this is the most common exam error."
},
{id:"m2t35", topic:"Self-Learning", marks:5, priority:"medium", flashcard:true,
 q:"Explain the Edit Distance (Levenshtein Distance) between two strings, with its recurrence relation. [Supplemented from standard NLP textbook material — not covered in the professor's slides.]",
 a:"Edit distance is the minimum number of single-character edit operations — insertion, deletion, substitution — needed to transform one string into another. Using dynamic programming, define D(i,j) = edit distance between the first i characters of string 1 and the first j characters of string 2. Recurrence: D(i,0)=i, D(0,j)=j (base cases — all insertions/deletions), and D(i,j) = min[ D(i-1,j)+1 (deletion), D(i,j-1)+1 (insertion), D(i-1,j-1)+cost (substitution, cost=0 if characters match, else 1 or 2 depending on convention) ]. The final answer is D(len1,len2), read off the bottom-right cell of the DP table.",
 examAnswer:"State the 3 operation types, the DP table recurrence exactly (with base cases), and be ready to fill a small DP table by hand for two short strings (e.g. 'cat' vs 'cut').",
 mistakes:"Don't forget the base-case row/column (D(i,0)=i, D(0,j)=j) — many students jump straight to the recurrence and get the table's first row/column wrong, cascading errors through the whole table."
},
{id:"m2t36", topic:"Self-Learning", marks:3, priority:"medium", flashcard:true,
 q:"What is the Noisy Channel Model, and how is it used for spelling correction? [Supplemented from standard NLP textbook material.]",
 a:"The Noisy Channel Model treats a misspelled/observed word x as if the intended correct word w was sent through a 'noisy channel' that introduced an error. To recover the best correction, we compute: argmax over w of P(w|x) = argmax over w of P(x|w)·P(w) (via Bayes' rule, dropping the constant P(x)). P(w) is the LANGUAGE MODEL probability (prior — how likely is w as an English word/phrase, estimated via N-grams). P(x|w) is the CHANNEL/ERROR MODEL probability (how likely is this specific typo/error given the intended word w, often estimated from edit-distance-based confusion probabilities). The model picks the candidate correction w that best balances 'a real, common word/phrase' against 'a plausible typo of what was actually typed'.",
 examAnswer:"State the Bayes' rule decomposition (argmax P(x|w)P(w)) and explain what each of the two terms represents (channel/error model vs. language model prior) — this is the standard way the model is tested.",
 mistakes:"Don't drop the P(w) language-model prior and just pick the closest-edit-distance candidate — the whole point of the noisy channel model is combining BOTH the error likelihood AND how common the candidate word is in the language."
},
];

 concept:"TTR measures the lexical diversity of a text — how much of the vocabulary is 'fresh' versus repeated. Tokens = total word occurrences (including repeats); Types = number of DISTINCT word forms.",
 formula:"TTR = Number of Types / Number of Tokens\nInterpretation: TTR > 0.70 = high lexical diversity; 0.50–0.70 = moderate; < 0.50 = low diversity.\nRelative frequency / probability of a word: P(w) = Frequency of w / Total Tokens.",

  steps:[

   "Step 1 — Count Total Tokens: 40 (given/counted by tokenizing every word occurrence).",
   "Step 2 — Count Total Types (unique words, case-insensitive): 37.",
   "Step 3 — Apply the TTR formula: TTR = 37/40 = 0.925.",
   "Step 4 — Interpret: since TTR (0.925) > 0.70, this passage has HIGH lexical diversity — very few repeated words.",
