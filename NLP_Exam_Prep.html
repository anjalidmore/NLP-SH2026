 practice:[
  {id:"sp_m2t1", difficulty:"easy", kind:"numerical", src:"notes",
   q:"“To be or not to be, that is the question.” Compute tokens, types, TTR, and type(to).",
   answer:"Tokens: to, be, or, not, to, be, that, is, the, question -> N = 10.\nDistinct: to, be, or, not, that, is, the, question -> |V| = 8.\nTTR = 8/10 = 0.80.\ntype(to) = 2, so per-word TTR(to) = 2/10 = 0.2. (type(be) = 2 as well.)"},
  {id:"sp_m2t2", difficulty:"easy", kind:"numerical", src:"notes",
   q:"“Never give up. Never ever give up.” Compute N, |V|, TTR and type(never).",
   answer:"Tokens: never, give, up, never, ever, give, up -> N = 7.\nDistinct: never, give, up, ever -> |V| = 4.\nTTR = 4/7 ≈ 0.571.\ntype(never) = 2 -> TTR(never) = 2/7 ≈ 0.286."},
  {id:"sp_m2t3", difficulty:"basic", kind:"numerical", src:"notes",
   q:"“The sun rises in the east and the sun sets in the west.” Compute N, |V|, TTR, P(the) and P(sun).",
   answer:"Tokens: the, sun, rises, in, the, east, and, the, sun, sets, in, the, west -> N = 13.\nDistinct: the, sun, rises, in, east, and, sets, west -> |V| = 8.\nTTR = 8/13 ≈ 0.615.\nP(the) = 4/13 ≈ 0.308.  P(sun) = 2/13 ≈ 0.154."},
  {id:"sp_m2t4", difficulty:"basic", kind:"numerical", src:"notes",
   q:"Class-style code-mixing variant. “Aaj main college gaya, college mein exam tha, phir main ghar aaya.” Compute tokens, type(main), type(college).",
   answer:"Aaj(1) main(2) college(3) gaya(4) college(5) mein(6) exam(7) tha(8) phir(9) main(10) ghar(11) aaya(12) -> N = 12.\ntype(main) = 2 (positions 2 and 10).\ntype(college) = 2 (positions 3 and 5).\nNote 'mein' is counted as a SEPARATE type from 'main' — the class convention. |V| = 10, TTR = 10/12 ≈ 0.833."},
  {id:"sp_m2t5", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"“I can't believe it's not butter — it's state-of-the-art!” Give the token count under (a) whitespace tokenization and (b) the class's clitic-splitting convention, and say which number you would write in the exam.",
   answer:"(a) Whitespace: I | can't | believe | it's | not | butter | — | it's | state-of-the-art! -> 8 word tokens (9 if the dash counts).\n(b) Clitic-splitting (class convention on the 'state-of-the-art' example): I | ca + n't | believe | it + 's | not | butter | it + 's | state | of | the | art -> 13 tokens.\nIn the exam: state the convention in one line, then count. Both are correct arithmetic; only an unstated convention is wrong. If the question later asks for stemming or an N-gram model, prefer the splitting convention — that is what the downstream stages assume."},
  {id:"sp_m2t6", difficulty:"moderate", kind:"interpret", src:"notes",
   q:"A 100-token abstract has TTR 0.72; the full 5,000-token paper has TTR 0.21. Has the paper's vocabulary shrunk? Explain the effect and name the empirical law that describes it.",
   answer:"No. Vocabulary GREW: 0.72 × 100 = 72 types in the abstract, 0.21 × 5,000 = 1,050 types in the paper.\nTTR falls mechanically with length because function words (the, of, is, and) repeat without limit while new content words arrive ever more slowly. TTR is therefore only comparable between texts of similar length.\nThe law describing this is HEAPS' LAW: |V| = K × N^β with β ≈ 0.4–0.6, i.e. vocabulary grows as a fractional power of length, so types/tokens must decline.\nCheck against Heaps: 1050/72 ≈ 14.6 while (5000/100)^0.5 ≈ 7.07 — the same sub-linear shape."},
  {id:"sp_m2t7", difficulty:"difficult", kind:"numerical", src:"notes",
   q:"A corpus has N = 4,000 tokens and TTR = 0.15. (a) How many types? (b) 3,000 new tokens are added and TTR drops to 0.12. How many types now, and how many NEW types were added? (c) What fraction of the new tokens were previously unseen words?",
   answer:"(a) |V| = 0.15 × 4,000 = 600 types.\n(b) New N = 7,000, so |V| = 0.12 × 7,000 = 840 types. New types added = 840 − 600 = 240.\n(c) 240 new types out of 3,000 new tokens = 8% — so 92% of the new text reused words already seen.\nInterpretation: TTR fell even though the vocabulary grew by 40%, which is the Heaps'-law effect in numbers."},
  {id:"sp_m2t8", difficulty:"difficult", kind:"scenario", src:"notes",
   q:"You must flag AI-generated student essays. Someone proposes 'flag any essay with TTR below 0.4'. Give two reasons this rule is unsound and one defensible way to use TTR here.",
   answer:"Reason 1 — LENGTH CONFOUND: TTR falls with length, so the rule punishes long essays and passes short ones regardless of authorship. A 300-word essay and a 3,000-word essay cannot share a threshold.\nReason 2 — GENRE CONFOUND: a technical essay legitimately repeats its key terms; a narrative does not. Low TTR may mean 'about one topic', not 'machine-written'.\nDefensible use: compare TTR only within a fixed window (e.g. standardised TTR over successive 100-token chunks, then average), and use it as ONE feature among several rather than a hard threshold — with a decision made against a human-written baseline of the same length and genre.\nThis is an LO 2.3 answer: the mark is for interpreting the statistic, not computing it."},
  {id:"sp_m2t9", difficulty:"exam-level", kind:"numerical", src:"notes",
   q:"Q1-style, 2 marks. “Data science needs data, and good data needs good cleaning.” Compute tokens, types, whole-text TTR, TTR(data) and TTR(good). Show the sum check.",
   answer:"Tokens: data, science, needs, data, and, good, data, needs, good, cleaning -> N = 10.\nType counts: data:3, science:1, needs:2, and:1, good:2, cleaning:1. Sum = 3+1+2+1+2+1 = 10 ✓.\n|V| = 6, so TTR = 6/10 = 0.60.\nTTR(data) = 3/10 = 0.30.  TTR(good) = 2/10 = 0.20.\nBox: N=10, |V|=6, TTR=0.6."}]
},
{
 id:"s_m2_zipf", title:"Zipf's Law, Zipf's Other Law and Heaps' Law", topic:"2.2", marks:2,
 lo:["LO 2.1","LO 2.3"], src:"NLP Notes p.7", tag:"Named for Q1 in the class MSE brief (2 marks)",
 idea:"Zipf's law is a rank–frequency relationship: multiply a word's rank by its frequency and you get (roughly) a constant. Almost every exam question is one application of f·r = K.",
 method:"ZIPF'S LAW              f ∝ 1/r      =>   f · r = K\n  f = frequency of a word, r = its rank, K = a constant for that corpus\n  Two words in the SAME corpus therefore satisfy   f1·r1 = f2·r2\n\nZIPF'S OTHER LAW        m ∝ 1/√r      and     m ∝ √f\n  m = number of MEANINGS a word has\n  So   m1/m2 = √(r2/r1)   =>   r1/r2 = (m2/m1)²\n\nHEAPS' LAW              |V| = K × N^β      with β ≈ 0.4–0.6\n  |V| = vocabulary size, N = tokens\n\nCLASS NOTE, written in the margin of p.7:\n  “No sums about this — just the formula for Heaps.”\n  Learn Heaps' formula and what it means; expect the NUMERICAL to be Zipf.",
 classQs:[
  {q:"In a corpus, the word at rank r₁ = 20 has frequency f₁ = 1896. What is the frequency of the word at rank r₂ = 8?",
   steps:[
    "Zipf: f · r = K, and K is the same for every word in one corpus.",
    "K = f₁ · r₁ = 1896 × 20 = 37,920.",
    "f₂ = K / r₂ = 37,920 / 8.",
    "f₂ = 4,740."],
   answer:"f₂ = 4,740",
   watch:"Sanity check the direction: rank 8 is MORE common than rank 20, so its frequency must be HIGHER. If your answer came out smaller you inverted the relationship."},
  {q:"Zipf's other law. Word 1 has m₁ = 20 meanings, word 2 has m₂ = 30 meanings. Find the ratio of their ranks r₁ : r₂.",
   steps:[
    "m ∝ 1/√r, so m₁/m₂ = √r₂ / √r₁ = √(r₂/r₁).",
    "20/30 = 2/3 = √(r₂/r₁).",
    "Square both sides: r₂/r₁ = 4/9.",
    "Therefore r₁ : r₂ = 9 : 4."],
   answer:"r₁ : r₂ = 9 : 4",
   watch:"More meanings means MORE common means a SMALLER rank number. Word 2 has more meanings (30 > 20), so word 2 must have the smaller rank — and indeed r₂ = 4 parts against r₁ = 9 parts. Use that check; the inverse-square-root inversion is where marks are lost."}],
 practice:[
  {id:"sp_m2z1", difficulty:"easy", kind:"numerical", src:"notes",
   q:"The most frequent word in a corpus (rank 1) occurs 12,000 times. Using Zipf's law, estimate the frequency of the rank-4 word and the rank-100 word.",
   answer:"K = f·r = 12,000 × 1 = 12,000.\nRank 4:   f = 12,000/4 = 3,000.\nRank 100: f = 12,000/100 = 120."},
  {id:"sp_m2z2", difficulty:"easy", kind:"numerical", src:"notes",
   q:"A word of rank 50 has frequency 400. Find K, and the rank of a word that occurs 1,000 times.",
   answer:"K = 50 × 400 = 20,000.\nr = K/f = 20,000/1,000 = 20. The word sits at rank 20."},
  {id:"sp_m2z3", difficulty:"basic", kind:"numerical", src:"notes",
   q:"In a corpus, 'the' (rank 1) occurs 6,000 times. Estimate the frequency of the rank-3 and rank-30 words, and comment on what this says about the shape of the distribution.",
   answer:"K = 6,000. Rank 3 -> 2,000. Rank 30 -> 200.\nComment: a 10× increase in rank causes a 10× drop in frequency, so a handful of words carry an enormous share of the tokens and a very long tail occurs only once or twice. This is why stop-word removal is cheap and effective, and why zero counts are unavoidable — motivating smoothing (2.7.2)."},
  {id:"sp_m2z4", difficulty:"basic", kind:"numerical", src:"notes",
   q:"Heaps' Law. A corpus of 1,000,000 tokens has a vocabulary of 30,000. Taking β = 0.5, find K. Then predict |V| for 4,000,000 tokens.",
   answer:"|V| = K·N^β  =>  30,000 = K × 1,000,000^0.5 = K × 1,000  =>  K = 30.\nFor N = 4,000,000: |V| = 30 × 4,000,000^0.5 = 30 × 2,000 = 60,000.\nInterpretation: 4× the text gives only 2× the vocabulary — sub-linear growth.\n(The class notes say Heaps is formula-only, so expect to be asked to STATE it and interpret it rather than compute — but this is the computation if it comes.)"},
  {id:"sp_m2z5", difficulty:"moderate", kind:"numerical", src:"notes",
   q:"Zipf's other law. Word A has 9 meanings; word B has 3 meanings. What is r_A : r_B? Which word would you expect to be more frequent?",
   answer:"m ∝ 1/√r  =>  m_A/m_B = √(r_B/r_A)  =>  9/3 = 3 = √(r_B/r_A)  =>  r_B/r_A = 9.\nSo r_A : r_B = 1 : 9.\nWord A has the smaller rank number, so word A is the MORE frequent word — consistent with m ∝ √f: more meanings goes with higher frequency (polysemy grows with use)."},
  {id:"sp_m2z6", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"A student computes K from a rank-5 word (f = 800) and uses it to predict the rank-1 word's frequency as 4,000. The true count is 9,500. Is Zipf's law wrong? Explain.",
   answer:"The law is not 'wrong'; it is an EMPIRICAL approximation that is known to fit badly at the extremes.\nThe prediction K = 5 × 800 = 4,000, so rank 1 -> 4,000, is the correct application of the formula.\nReal corpora deviate at both ends: the top few ranks (the, of, and) are more frequent than Zipf predicts, and the long tail of hapax legomena is flatter than predicted. A better fit uses f = K/(r+ρ)^a (Mandelbrot's correction) rather than the plain 1/r.\nExam-safe answer: apply f·r = K as taught, then add one line acknowledging the deviation at the head of the distribution — that line is the analysis mark (LO 2.3)."},
  {id:"sp_m2z7", difficulty:"difficult", kind:"scenario", src:"notes",
   q:"You are sizing a vocabulary for a bigram model. Zipf says the top 150 words cover ~50% of tokens. You cap the vocabulary at 5,000 types and map the rest to <UNK>. Give one benefit and two concrete risks, referring to the laws.",
   answer:"Benefit: the bigram table is |V|² entries, so capping at 5,000 gives 25M cells instead of (say) 50,000² = 2.5 billion — a 100× saving, and the discarded words are, by Zipf, extremely rare individually.\nRisk 1 — the tail is large IN AGGREGATE. Heaps' law says vocabulary keeps growing with N, so the discarded types are numerous even if each is rare; a domain-specific test set can hit <UNK> constantly and the model becomes uninformative exactly where content words live.\nRisk 2 — <UNK> absorbs probability mass and distorts the model: P(<UNK>) becomes artificially large, so perplexity looks better than the model deserves and comparisons across different vocabulary caps become meaningless.\nMitigation: fix the vocabulary and the <UNK> policy before comparing models, and report perplexity only for models sharing that vocabulary."},
  {id:"sp_m2z8", difficulty:"exam-level", kind:"numerical", src:"notes",
   q:"Q1-style, 2 marks. In a corpus the rank-12 word occurs 500 times. (a) Estimate the frequency of the rank-4 word. (b) Estimate the rank of a word occurring 250 times. (c) State Heaps' law and what β controls.",
   answer:"(a) K = 12 × 500 = 6,000; f = 6,000/4 = 1,500.\n(b) r = 6,000/250 = 24.\n(c) |V| = K × N^β, β ≈ 0.4–0.6. β controls how fast the vocabulary grows with corpus size: β = 1 would mean every new token is a new word; β ≈ 0.5 means quadrupling the text only doubles the vocabulary.\nShow the formula, the substitution and box each answer — the brief lists all three as mandatory."}]
},
{
 id:"s_m2_porter", title:"Porter Stemmer — the Measure m and the Rules", topic:"2.6", marks:2,
 lo:["LO 2.2"], src:"NLP Notes p.8–9 (5/8)", tag:"Named for Q1 in the class MSE brief (2 marks)",
 idea:"Second item on the Q1 list. Almost every Porter question is: write the C/V pattern of a word, collapse it, and read off m. Get the consonant/vowel rules right and the rest is bookkeeping.",
 method:"Every word is written in the form   [C] (VC)^m [V]\n\n  C = a sequence of one or more consonants\n  V = a sequence of one or more vowels\n  m = the MEASURE = how many complete VC pairs appear in the middle\n\nProcedure:\n  1. Write c or v under every letter.\n  2. Collapse runs: ccc -> C, vv -> V.\n  3. Strip an optional leading C and an optional trailing V.\n  4. Count the remaining VC pairs -> that is m.\n\nVOWEL RULE: a, e, i, o, u are vowels. 'y' is a VOWEL when it follows a\nconsonant (happy -> the final y is a vowel), otherwise a consonant\n(as in 'youth', where y starts the word).\n\nRULES USED IN CLASS\n  Step 1a  SSES -> SS      (caresses -> caress)\n           IES  -> I\n           SS   -> SS\n           S    -> (nothing)\n  Step 1b  (m>0)  EED -> EE          feed -> feed, agreed -> agree\n           (*v*)  ED  -> (nothing)   plastered -> plaster, bled -> bled\n           (*v*)  ING -> (nothing)   motoring -> motor, sing -> sing\n  Step 1c  (*v*)  Y   -> I           happy -> happi, sky -> sky\n\n  (*v*) means 'the stem contains a vowel'. That single condition is why\n  'bled' and 'sing' are NOT stripped — remove -ed/-ing and nothing with a\n  vowel is left.",
 classQs:[
  {q:"Compute the measure m of “youthfulness” (class spelling: youthfullnesses).",
   steps:[
    "Letters:  y o u t h f u l n e s s\nPattern:  c v v c c c v c c v c c",
    "Collapse runs:  C(y) V(ou) C(thf) V(u) C(ln) V(e) C(ss)",
    "Written out:  C VC VC VC  — leading C stripped, no trailing V.",
    "Count the VC pairs: (V C)(V C)(V C) plus the class's fourth pair for the longer form 'youthfullnesses'.",
    "The class recorded m = 4 for the spelling they used."],
   answer:"m = 4 (for the class's 'youthfullnesses'; for the standard spelling 'youthfulness' the collapse gives C VC VC VC, m = 3).",
   watch:"'y' at the START of the word is a CONSONANT — youth begins with c. Get that wrong and every subsequent pair shifts."},
  {q:"Compute m for “pseudopseudohypoparathyroidism”.",
   steps:[
    "Mark every letter c/v, remembering that 'y' after a consonant is a vowel (as in -thyroid-).",
    "Collapse the runs into alternating C and V blocks.",
    "Strip the optional leading C and trailing V, then count the VC pairs.",
    "The class's count: m = 11."],
   answer:"m = 11",
   watch:"For a long word, do NOT try to do it in your head. Write the letters out with c/v underneath, then collapse. The examiner gives marks for the visible C/V line."},
  {q:"Apply the Step 1b rules: feed, agreed, plastered, bled, motoring, sing.",
   steps:[
    "feed -> rule (m>0) EED -> EE. Here the stem before EED is 'f', which has m = 0, so the rule does NOT fire. Result: feed.",
    "agreed -> stem before EED is 'agr', m > 0, so EED -> EE. Result: agree.",
    "plastered -> rule (*v*) ED -> ''. Stem 'plaster' contains vowels. Result: plaster.",
    "bled -> stem before ED is 'bl', which contains NO vowel, so the rule does not fire. Result: bled.",
    "motoring -> rule (*v*) ING -> ''. Stem 'motor' has vowels. Result: motor.",
    "sing -> stem before ING is 's', no vowel, rule does not fire. Result: sing."],
   answer:"feed -> feed · agreed -> agree · plastered -> plaster · bled -> bled · motoring -> motor · sing -> sing",
   watch:"bled and sing are the whole point of these examples: the (*v*) condition is what stops the stemmer destroying short words. If your answer strips them you have ignored the condition."}],
 practice:[
  {id:"sp_m2p1", difficulty:"easy", kind:"numerical", src:"notes",
   q:"Compute m for: tree, trees, trouble.",
   answer:"tree:    t r e e -> c c v v -> C V. No VC pair remains after stripping the leading C and trailing V, so m = 0.\ntrees:   t r e e s -> c c v v c -> C V C -> one VC pair, m = 1.\ntrouble: t r o u b l e -> c c v v c c v -> C V C V -> one VC pair (trailing V stripped), m = 1."},
  {id:"sp_m2p2", difficulty:"easy", kind:"numerical", src:"notes",
   q:"Compute m for: oats, trap, private.",
   answer:"oats:    v v c c -> V C -> m = 1 (no leading C).\ntrap:    c c v c -> C V C -> m = 1.\nprivate: p r i v a t e -> c c v c v c v -> C V C V C V -> strip leading C and trailing V -> V C V C -> m = 2."},
  {id:"sp_m2p3", difficulty:"basic", kind:"numerical", src:"notes",
   q:"PREVIOUS-PAPER QUESTION. Compute the measure m for: Pyrotechnique, acronymania, gyroscope, pylorus.",
   answer:"Remember: initial 'p' is a consonant and 'y' after a consonant is a VOWEL.\npyrotechnique: p y r o t e c h n i q u e -> c v c v c v c c c v c v v -> C V C V C V C V C V -> strip leading C, trailing V -> V C V C V C V C -> m = 4.\nacronymania: a c r o n y m a n i a -> v c c v c v c v c v v -> V C V C V C V C V -> strip trailing V -> V C V C V C V C -> m = 4.\ngyroscope: g y r o s c o p e -> c v c v c c v c v -> C V C V C V C V -> strip leading C and trailing V -> V C V C V C -> m = 3.\npylorus: p y l o r u s -> c v c v c v c -> C V C V C V C -> strip leading C -> V C V C V C -> m = 3.\nShow the c/v line for each — that is where the marks are."},
  {id:"sp_m2p4", difficulty:"basic", kind:"application", src:"notes",
   q:"Apply Step 1a to: caresses, ponies, caress, cats.",
   answer:"caresses -> SSES -> SS  =>  caress\nponies   -> IES  -> I   =>  poni\ncaress   -> SS   -> SS  =>  caress (unchanged, the rule protects it)\ncats     -> S    -> ''  =>  cat\nThe rules are tried in that ORDER and only the first matching rule fires — that is why 'caress' is not reduced to 'care'."},
  {id:"sp_m2p5", difficulty:"moderate", kind:"application", src:"notes",
   q:"Apply Step 1b and then 1c to: happy, sky, flying, cried, hopping.",
   answer:"happy  -> 1b does not apply; 1c (*v*) Y -> I: stem 'happ' has a vowel => happi.\nsky    -> 1c (*v*) Y -> I: stem 'sk' has NO vowel, so the rule does not fire => sky.\nflying -> 1b (*v*) ING -> '': stem 'fly' contains a vowel (y after a consonant) => fly.\ncried  -> 1b (*v*) ED -> '': stem 'cri' has a vowel => cri. (Porter's clean-up step then may restore forms; at 1b the answer is 'cri'.)\nhopping -> 1b (*v*) ING -> '' gives 'hopp'; the follow-up rule for a double consonant reduces it => hop.\nThe pattern being tested: 'sky' vs 'happy' is exactly the (*v*) condition."},
  {id:"sp_m2p6", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"A student stems 'university' and 'universe' and gets 'univers' for both, then concludes the stemmer works well. Critique this.",
   answer:"It is an OVER-STEMMING error, not a success. 'university' and 'universe' are semantically unrelated, yet they are conflated into one index term — so a search for 'universe' returns university documents.\nThe general trade-off: over-stemming merges words that should stay apart (university/universe, organization/organ); under-stemming fails to merge words that should be joined (ran/run, better/good — neither is caught by any Porter rule, because Porter is purely SUFFIX-based and has no dictionary).\nThe fix, and the examinable contrast: LEMMATIZATION uses a dictionary and part-of-speech information to return a real word ('ran' -> 'run'), at higher computational cost. Porter is fast and crude; lemmatization is slow and correct."},
  {id:"sp_m2p7", difficulty:"difficult", kind:"tricky", src:"notes",
   q:"Why does the rule (m>0) EED -> EE leave 'feed' alone but change 'agreed' to 'agree'? What design goal does the m>0 condition serve in general?",
   answer:"For 'feed', the part before EED is 'f' — pattern C only, so m = 0 and the condition (m>0) fails; the rule does not fire and 'feed' survives intact.\nFor 'agreed', the part before EED is 'agr' — pattern V C after stripping, m = 1 > 0, so the rule fires and gives 'agree'.\nDesign goal: the m condition is a LENGTH GUARD. It prevents the stemmer from eating short words down to meaningless fragments. Porter has no dictionary, so 'm' is its only proxy for 'is there enough word left to still mean something'. The same guard is why 'bled' and 'sing' survive Step 1b via the (*v*) condition.\nOne-line version for the exam: the measure m stops the stemmer from destroying short stems."},
  {id:"sp_m2p8", difficulty:"exam-level", kind:"numerical", src:"notes",
   q:"Q1-style, 2 marks. Compute m for 'relational' and 'conditional', and state what Porter's Step 4 would do to each given the rule (m>1) AL -> ''.",
   answer:"relational: r e l a t i o n a l -> c v c v c v v c v c -> C V C V C V C -> strip leading C -> V C V C V C -> m = 3.\nconditional: c o n d i t i o n a l -> c v c c v c v v c v c -> C V C V C V C -> strip leading C -> V C V C V C -> m = 3.\nBoth have m = 3 > 1, so the rule (m>1) AL -> '' fires for both:\n  relational -> relation ... and 'ational' -> 'ate' at Step 2 would in fact give 'relate'.\n  conditional -> condition.\nThe examinable half is the m computation and the check that m > 1 before firing the rule."}]
},
{
 id:"s_m2_fst", title:"FSA vs FST for Morphology (and the DFA definition)", topic:"2.5", marks:3,
 lo:["LO 2.4"], src:"NLP Notes p.7–8",
 idea:"The examinable question is not 'what is an automaton' but 'why is an FST preferable to an FSA for morphological analysis' — the notes write it out as a heading.",
 method:"A DFA is the 5-tuple   M = (Q, Σ, δ, q₀, F)\n  Q  = finite set of states          Σ  = input alphabet\n  δ  = transition function           q₀ = start state\n  F  = set of final/accepting states\nClass example:  M = ({q₀, q₁, q₂}, {0,1}, δ, q₀, {q₁})\n\nFSA (acceptor)   — RECOGNIZES whether a word belongs to a language.\n                   One tape. Answer: yes / no.\nFST (transducer) — REPRESENTS THE MAPPING between the surface form and\n                   its morphological representation. Two tapes.\n                   Answer: a structured analysis.\n\nWHY FST FOR MORPHOLOGY (the notes' own wording):\n  morphological analysis often requires a MAPPING between the surface\n  word and its morphological representation:\n        cats  ->  cat + PLURAL\n  An FSA can only tell you that 'cats' is a legal English word.\n  An FST can tell you WHAT IT IS MADE OF — and, run backwards, can\n  GENERATE 'cats' from cat+PLURAL. FSTs are bidirectional; FSAs are not.",
 classQs:[
  {q:"Why is an FST preferable to an FSA for morphological analysis?",
   steps:[
    "State what each machine does: an FSA is a recognizer over one tape; an FST relates two tapes.",
    "State what morphology needs: a mapping from the surface form to the lexical/morphological form.",
    "Give the class's example: cats -> cat + plural.",
    "Close with the property an FSA cannot offer: bidirectionality (the same FST analyses AND generates)."],
   answer:"An FSA only RECOGNIZES whether a word belongs to a language — it returns yes/no. Morphological analysis needs a MAPPING between the surface word and its morphological representation, e.g. cats -> cat + PLURAL, which requires two tapes. An FST represents exactly that relationship, and because the relation is symmetric the same transducer can be run in reverse to GENERATE the surface form from the analysis. That analysis-plus-generation capability is what an FSA structurally cannot provide.",
   watch:"Do not answer 'an FST is more powerful'. The examinable point is the two-tape MAPPING and the cat+plural example."},
  {q:"Define the DFA of the class example formally.",
   steps:[
    "Give the 5-tuple in order.",
    "Fill in the class's values."],
   answer:"M = (Q, Σ, δ, q₀, F) where Q = {q₀, q₁, q₂}, Σ = {0, 1}, δ is the transition function shown by the state diagram, q₀ is the start state and F = {q₁} is the set of accepting states.",
   watch:"Write the tuple in the standard order and name every component. Marks are given per component."}],
 practice:[
  {id:"sp_m2f1", difficulty:"easy", kind:"concept", src:"notes",
   q:"State the 5-tuple of a DFA and say which single component changes when you convert an FSA into an FST.",
   answer:"DFA: M = (Q, Σ, δ, q₀, F) — states, input alphabet, transition function, start state, final states.\nAn FST adds an OUTPUT alphabet and outputs on its transitions, becoming a 6-tuple (Q, Σ, Γ, δ, q₀, F) where Γ is the output alphabet and each transition is labelled input:output rather than just input. So the change is: transitions carry a pair, not a symbol — that is what makes it a relation between two tapes instead of a set of strings."},
  {id:"sp_m2f2", difficulty:"basic", kind:"application", src:"notes",
   q:"Write the FST transitions (as input:output pairs) that analyse the English regular plural, and show them applied to 'dogs' and to 'foxes'.",
   answer:"Lexical form -> surface form, written surface:lexical for analysis:\n  d:d o:o g:g s:+PLURAL          =>  dogs   -> dog + PLURAL\n  f:f o:o x:x e:ε s:+PLURAL      =>  foxes  -> fox + PLURAL\nThe 'e' maps to epsilon (the empty string) because English inserts an epenthetic 'e' after a sibilant — an FST handles this with an ε on one tape, which is exactly the sort of thing an FSA cannot express.\nRun in reverse, the same machine GENERATES 'foxes' from fox+PLURAL."},
  {id:"sp_m2f3", difficulty:"basic", kind:"application", src:"notes",
   q:"Design (in words) an FSA that accepts words of the form: an optional 'un-', a stem from {happy, kind, fair}, and an optional '-ness'. Which strings does it accept, and what can it NOT tell you?",
   answer:"States: q0 -start-> optional 'un' -> q1 -stem-> q2 -optional 'ness'-> q3 (accepting; q2 also accepting).\nAccepts: happy, kind, fair, unhappy, unkind, unfair, happiness, kindness, fairness, unhappiness, unkindness, unfairness.\nWhat it CANNOT tell you: that 'unhappiness' decomposes as un + happy + ness, i.e. which morphemes are present and what each contributes. It returns only accept/reject. To recover the decomposition you need an FST whose second tape emits un+ADJ+happy+NESS."},
  {id:"sp_m2f4", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"A student says 'I'll just use an FSA and list every inflected form of every verb.' Give two reasons this fails for a morphologically rich language such as Marathi or Turkish.",
   answer:"Reason 1 — COMBINATORIAL BLOW-UP. In an agglutinative or richly inflected language a single root can produce hundreds or thousands of surface forms (person, number, gender, tense, case, honorific). Enumerating them is impractical, and the list is stale the moment a new root enters the language.\nReason 2 — NO ANALYSIS AND NO GENERATION. Even if the list were complete, the FSA still only says yes/no. The system cannot answer 'what is the root and what are the features?', which is what every downstream stage (lemmatization, tagging, translation) actually needs. Nor can it generate the correct form for a feature bundle it has never seen.\nAn FST encodes the RULES rather than the list, so it covers unseen roots and works in both directions."},
  {id:"sp_m2f5", difficulty:"difficult", kind:"scenario", src:"notes",
   q:"You must build a search engine for Marathi documents. Would you use a Porter-style stemmer, an FST morphological analyser, or a dictionary lemmatizer? Justify with reference to the Module 1 Indian-language challenges.",
   answer:"FST morphological analyser is the right primary choice.\nWhy not Porter: Porter is a hand-written suffix-stripping algorithm tuned to ENGLISH suffixes. Marathi's morphology is far richer and encodes gender, number and case in the verb — a suffix list built for -ing/-ed/-s does not transfer.\nWhy not a plain dictionary lemmatizer: it needs an entry for every surface form. Given Marathi's productive morphology the dictionary would be enormous and would still miss unseen forms — and the Module 1 challenge of LOW ANNOTATED RESOURCES means such a dictionary probably does not exist.\nWhy FST: it encodes morphological RULES, so it generalises to unseen roots, produces a root + feature analysis usable for indexing, and runs in reverse for query expansion. It also handles the script/Unicode issues cleanly at the symbol level.\nPractical answer: FST analyser as the backbone, with a small exception dictionary for irregular forms."},
  {id:"sp_m2f6", difficulty:"exam-level", kind:"concept", src:"notes",
   q:"Distinguish INFLECTIONAL from DERIVATIONAL morphology with two examples each, and say which one an information-retrieval system usually wants to strip.",
   answer:"INFLECTIONAL: adds grammatical information; the word class does NOT change and no new dictionary word is created.\n  cat -> cats (number) · walk -> walked (tense) · big -> bigger (degree)\nDERIVATIONAL: creates a NEW word, very often changing the word class.\n  teach (V) -> teacher (N) · happy (Adj) -> happiness (N) · nation (N) -> national (Adj)\nIR normally strips INFLECTIONAL endings only, so 'cats' and 'cat' match. Stripping derivational suffixes is risky because it merges genuinely different concepts ('nation' vs 'national' may be fine, but 'universe' vs 'university' is not).\nPrevious-paper style: in “Them that asked no questions, cleverer not told lies”, the OFFICIAL KEY lists five: -ed in asked (past tense), -s in questions (plural), -er in cleverer (comparative), -ed in told (past tense), -s in lies (plural). Note the key counts 'told' as carrying -ed even though it is the irregular (suppletive) past of 'tell' — follow the key and list all five."}]
},

 id:"s_m2_regex", title:"Regular Expressions over Text", topic:"2.5", marks:2,
 lo:["LO 2.4","LO 2.2"], src:"Previous paper — IA-1 SH-25 Q1(d)",
 idea:"A real previous-paper question: given a regex and a sentence, list every word that matches. Work character by character; do not eyeball it.",
 method:"Pieces that appear in the exam regexes:\n  \\b        word boundary\n  [A-Za-z]  one letter\n  [^aeiou]  one character that is NOT a lower-case vowel (so a consonant, but\n            also uppercase letters and digits)\n  *         zero or more of the previous item\n  {2}       exactly two of the previous item\n  [a-z]     one lower-case letter\n\nMETHOD: read the regex left to right into a sentence of English first\n(“any letters, then two non-vowels in a row, then any lower-case letters”),\nthen test each word against that sentence. The usual trap is a quantifier\nthat can match ZERO characters.",
 classQs:[
  {q:"PREVIOUS PAPER. R = \\b[A-Za-z]*[^aeiou]{2}[a-z]*\\b — list the words matched in: “Dolly on a trolley got a seat by golly. Guss on a bus got a seat without fuss.”",
   steps:[
    "Translate the regex: a whole word made of (any letters)(two consecutive non-vowels)(any lower-case letters).",
    "Since both * can match zero characters, the requirement is simply: THE WORD CONTAINS TWO CONSECUTIVE NON-VOWEL CHARACTERS.",
    "Test each word for a double non-vowel run:\n  Dolly  -> 'll'  ✓        on -> no      a -> no\n  trolley-> 'll'  ✓        got -> no     seat -> no\n  by     -> 'by' — b and y are both non-vowels in [^aeiou] ✓\n  golly  -> 'll'  ✓        Guss -> 'ss' ✓   bus -> no\n  without-> 'th' ✓         fuss -> 'ss' ✓",
    "Note that y is NOT in the set aeiou, so it counts as a non-vowel here."],
   answer:"OFFICIAL ANSWER KEY: { Dolly, trolley, golly, Guss, without, fuss }.\nNot matched: on, a, got, seat, bus — none contains two consecutive non-vowel characters.",
   watch:"Two things. (1) Strictly, 'by' ALSO satisfies the pattern, because y is not in [aeiou] and both leading and trailing [A-Za-z]*/[a-z]* can match zero characters — but the official key does not list it. Write the six words from the key; if you want the extra mark, add a one-line note that 'by' matches under a literal reading of [^aeiou]. (2) Because the quantifiers can match zero characters, the double non-vowel may sit at the very start or very end of the word — do not assume it must be in the middle."}],
 practice:[
  {id:"sp_m2r1", difficulty:"easy", kind:"application", src:"notes",
   q:"Which words match \\b[a-z]*ing\\b in: “The singing bird was flying and doing nothing during spring.”",
   answer:"Matches must be entirely lower-case and end in 'ing': singing, flying, doing, nothing, during, spring.\n'The' does not match (capital T, and no 'ing').\nNote the trap: 'nothing', 'during' and 'spring' match the PATTERN even though '-ing' is not a suffix there. A regex matches characters, not morphemes — which is exactly why morphological analysis needs an FST and not just a regex."},
  {id:"sp_m2r2", difficulty:"basic", kind:"application", src:"notes",
   q:"Which words match \\b[A-Z][a-z]*\\b in: “Riya met Sam in Mumbai on Monday with 3 friends.”",
   answer:"One capital followed by zero or more lower-case letters, as a whole word: Riya, Sam, Mumbai, Monday.\nAlso 'The'-type words would match if present. '3' does not match (not a letter).\nThis is the classic cheap NAMED-ENTITY heuristic — and its failure mode is the first word of every sentence, which is capitalised without being a name."},
  {id:"sp_m2r3", difficulty:"moderate", kind:"application", src:"notes",
   q:"Write a regex that matches Indian mobile numbers of the form +91 followed by exactly 10 digits, optionally with a space or hyphen after +91. Then say which of these match: +919876543210, +91 9876543210, +91-98765 43210, 919876543210.",
   answer:"Regex: \\+91[ -]?[0-9]{10}\\b\n  \\+   escaped plus sign\n  [ -]? optional single space or hyphen\n  [0-9]{10} exactly ten digits\nMatches: +919876543210 ✓ · +91 9876543210 ✓\nDoes not match: +91-98765 43210 ✗ (there is a space in the middle of the digits, so the run of 10 digits is broken) · 919876543210 ✗ (no leading +).\nTo also accept the third, allow internal separators: \\+91[ -]?[0-9]{5}[ -]?[0-9]{5}\\b."},
  {id:"sp_m2r4", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"A student writes \\b[A-Za-z]+@[A-Za-z]+\\.com\\b to find e-mail addresses and it misses 'anjali.more@vit.ac.in' and 'r_k99@gmail.com'. List every reason and give a better pattern.",
   answer:"Reasons it fails:\n1. The local part allows only letters — it excludes the dot in 'anjali.more', the underscore in 'r_k', and the digits in '99'.\n2. The domain allows only ONE label before .com, so 'vit.ac.in' (two dots) cannot match.\n3. The TLD is hard-coded to .com, so .in, .org, .ac.in are all excluded.\n4. The unescaped assumption that \\. is the only dot — the pattern has no way to repeat sub-domains.\nBetter: \\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b\nGeneral lesson: a regex encodes exactly the surface forms you thought of. Every unlisted character is a silent miss — which is why regexes belong in preprocessing, with a validation step after."},
  {id:"sp_m2r5", difficulty:"difficult", kind:"scenario", src:"notes",
   q:"You are writing a SENTENCE SEGMENTER using the regex [.!?]\\s+ to split. Give three inputs where it breaks and say what preprocessing knowledge is needed instead.",
   answer:"Breaks on:\n1. Abbreviations — “Dr. Sharma met Mr. Patel.” splits after 'Dr.' and 'Mr.', producing three fragments instead of one sentence.\n2. Decimals and versions — “The rate rose to 7.5 percent.” splits inside the number.\n3. Ellipsis / quoted speech — “He said ‘Stop!’ and left.” splits inside the quotation, and “Wait… what?” splits on the ellipsis.\nAlso: initials (A. P. J. Abdul Kalam) and URLs (www.vit.ac.in).\nWhat is needed instead: an abbreviation LEXICON, a rule that a following token starting with a lower-case letter usually means no boundary, digit-context rules for decimals, and quotation-aware handling — i.e. sentence segmentation is a classification problem over candidate boundaries, not a regex split.\nThis is why the pipeline lists sentence segmentation as a named preprocessing TASK (2.3) rather than a one-line regex."}]
}
];
