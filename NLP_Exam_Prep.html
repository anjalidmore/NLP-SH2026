 practice:[
  {id:"m2n1p1", difficulty:"easy", q:"A text has 50 tokens and 40 types. Compute TTR and classify its diversity.", answer:"TTR = 40/50 = 0.80. Since 0.80 > 0.70, this is HIGH lexical diversity."},
  {id:"m2n1p2", difficulty:"easy", q:"A text has 100 tokens and 55 types. Compute TTR and classify.", answer:"TTR = 55/100 = 0.55. Since 0.50 ≤ 0.55 ≤ 0.70, this is MODERATE lexical diversity."},
  {id:"m2n1p3", difficulty:"easy", q:"A text has 60 tokens and 21 types. Compute TTR and classify.", answer:"TTR = 21/60 = 0.35. Since 0.35 < 0.50, this is LOW lexical diversity."},
  {id:"m2n1p4", difficulty:"basic", q:"\"She sells sea shells on the sea shore.\" Count tokens and types, then compute TTR.", answer:"Tokens = 8 (She, sells, sea, shells, on, the, sea, shore). Types = 7 (she, sells, sea, shells, on, the, shore — 'sea' repeats). TTR = 7/8 = 0.875 → HIGH diversity."},
  {id:"m2n1p5", difficulty:"basic", q:"In a 200-token corpus, the word 'data' appears 8 times. Compute P(data).", answer:"P(data) = 8/200 = 0.04"},
  {id:"m2n1p6", difficulty:"basic", q:"A text has 120 tokens and its TTR is 0.65. How many types does it have?", answer:"Types = TTR × Tokens = 0.65 × 120 = 78 types."},
  {id:"m2n1p7", difficulty:"moderate", q:"\"The point that I am going to point from my point of view is the point that you will definitely point from your point of view if you understand my point.\" Count tokens and types (treat 'point' as repeating), then compute TTR and classify.", answer:"Tokens = 27. 'point' appears 6 times; other words: the(3), that(2), I(2), am(1), going(1), to(1), from(1), my(2), of(2), view(2), is(1), you(2), will(1), definitely(1), your(1), if(1), understand(1) — Types ≈ 18 (the, point, that, I, am, going, to, from, my, of, view, is, you, will, definitely, your, if, understand). TTR = 18/27 ≈ 0.667 → MODERATE diversity (this passage is deliberately repetitive, illustrating why TTR drops with repeated key terms)."},
  {id:"m2n1p8", difficulty:"moderate", q:"Two texts: Text A has 50 tokens/45 types (TTR=0.90); Text B has 5000 tokens/500 types (TTR=0.10). Is it fair to conclude Text B has much 'poorer vocabulary' than Text A? Explain.", answer:"No — this comparison is invalid. TTR shrinks naturally as text length grows because common function words (the, is, a) keep repeating while types grow more slowly (Heaps' Law). A fair comparison requires computing a RUNNING AVERAGE TTR over equal-sized chunks (e.g. every 1000 tokens) of both texts, not comparing raw TTR across very different lengths."},
  {id:"m2n1p9", difficulty:"moderate", q:"A corpus has 47 tokens and 39 types (a Hindi-script example sentence about smart farming). Compute TTR and classify.", answer:"TTR = 39/47 ≈ 0.83 → HIGH lexical diversity (>0.70)."},
  {id:"m2n1p10", difficulty:"difficult", q:"A 1000-word document is split into two consecutive 500-word chunks for running-TTR analysis. Chunk 1: 500 tokens, 320 types. Chunk 2: 500 tokens, 210 types. Compute each chunk's TTR and interpret what the DROP between chunks suggests about the document's later half.", answer:"Chunk 1 TTR = 320/500 = 0.64 (moderate). Chunk 2 TTR = 210/500 = 0.42 (low). The drop suggests the second half of the document reuses vocabulary from the first half much more (e.g. it may be repeating key terms, summarizing, or being more repetitive/formulaic) rather than introducing new content."},
  {id:"m2n1p11", difficulty:"difficult", q:"\"Don't judge the state-of-the-art model by its size; the model's size doesn't define the model.\" Count tokens and types carefully (treat \"state-of-the-art\" as one hyphenated token, and \"model's\" as distinct from \"model\"), then compute TTR.", answer:"Tokens ≈ 15: Don't, judge, the, state-of-the-art, model, by, its, size, the, model's, size, doesn't, define, the, model. Types ≈ 11: don't, judge, the, state-of-the-art, model, by, its, size, model's, doesn't, define ('the' ×3, 'model' ×2 [as base form model — but note model's is a distinct type since apostrophe-s changes the token form], 'size' ×2 repeat). TTR ≈ 11/15 ≈ 0.733 → borderline HIGH diversity. This question intentionally tests careful tokenization of hyphens and possessives, which change the token/type count depending on convention."},
  {id:"m2n1p12", difficulty:"exam-level", q:"Explain why TTR alone cannot distinguish 'a text that repeats one theme using varied vocabulary' from 'a text that repeats the exact same words' — both could show similar token counts but very different TTRs. Which one would have the higher TTR, and why?", answer:"A text describing one theme with VARIED vocabulary (synonyms, related terms) would introduce many distinct word forms even while discussing one topic, giving a HIGHER TTR (more types per token). A text that literally repeats the same words over and over would have a LOWER TTR (few types, many repeated tokens), even discussing multiple sub-topics. TTR measures LEXICAL variety, not topical breadth — a text can be topically narrow but lexically rich (high TTR), or topically broad but lexically repetitive (low TTR)."},
  {id:"m2n1p13", difficulty:"challenge", q:"A corpus of 90 tokens has an overall TTR of 0.50. If 30 of those tokens are the single word 'the' (all counted as the same type), what is the MAXIMUM possible number of additional distinct types among the remaining 60 tokens, and does this change your estimate of the text's true lexical richness excluding function words?", answer:"Total types = TTR × Tokens = 0.50 × 90 = 45 types. Since 'the' contributes exactly 1 of those 45 types (regardless of its 30 occurrences), the remaining 60 non-'the' tokens can contain AT MOST 44 distinct types (45 − 1). If those 60 tokens were maximally diverse (44 unique types among 60 tokens), the CONTENT-WORD TTR (excluding 'the') would be 44/60 ≈ 0.733 — much HIGHER than the raw overall TTR of 0.50. This shows that a single very-frequent function word can drag down overall TTR substantially, and computing TTR after stop-word removal often gives a more meaningful lexical-richness picture."}
 ]
},
{
 id:"m2n2", title:"Zipf's Law (Rank–Frequency & Meaning–Frequency)", topic:"2.2 Empirical Laws",
 concept:"Zipf's Law states that a word's frequency is inversely proportional to its rank in a frequency-sorted list: frequent words are VERY frequent, and frequency drops off sharply as rank increases. A companion law ('Zipf's other law') links word frequency to its number of meanings — more frequent words tend to have more meanings.",
 formula:"Zipf's Law: f ∝ 1/r  ⟹  f · r = k (a constant for the corpus). Given one (rank, frequency) pair, k = f₁·r₁, and any other rank's frequency = k / r₂.\nZipf's Other Law: number of meanings m ∝ √f, and combined with the first law, m ∝ 1/√r. So for two words: m₁/m₂ = √(r₂)/√(r₁), i.e. r₁/r₂ = (m₂/m₁)².",
 workedExample:{
  title:"Predict a word's frequency from another word's known rank/frequency, then apply Zipf's other law",
  steps:[
   "Part A: In a corpus, a word has rank 20 and frequency 1896. Find the best-guess frequency of a word with rank 8.",
   "Step 1 — Compute the constant: k = f × r = 1896 × 20 = 37,920.",
   "Step 2 — Apply k to the new rank: f(rank 8) = k / 8 = 37,920 / 8 = 4,740.",
   "Part B: Word 'rose' has 20 meanings, word 'tie' has 30 meanings. Find RANK(rose):RANK(tie).",
   "Step 3 — Using m·√r = k' (from m ∝ 1/√r), we get m₁·√r₁ = m₂·√r₂, so √r₂/√r₁ = m₁/m₂ = 20/30.",
   "Step 4 — Square both sides: r₂/r₁ = (20/30)² = 400/900. So r₁:r₂ (rose:tie) = 900:400 = 9:4."
  ]
 },
 practice:[
  {id:"m2n2p1", difficulty:"easy", q:"A word has rank 1 and frequency 5000. Using f·r=k, find k.", answer:"k = 5000 × 1 = 5000"},
  {id:"m2n2p2", difficulty:"easy", q:"Given k=6000, find the frequency of the word at rank 3.", answer:"f = k/r = 6000/3 = 2000"},
  {id:"m2n2p3", difficulty:"easy", q:"A word at rank 10 has frequency 500. Predict the frequency at rank 5.", answer:"k = 500×10 = 5000. f(rank 5) = 5000/5 = 1000"},
  {id:"m2n2p4", difficulty:"basic", q:"Given the words the=4000, an=2000, Alice=1300, and=1000 with unknown ranks, sort them in descending frequency and assign ranks 1–4.", answer:"the(4000)=rank1, an(2000)=rank2, Alice(1300)=rank3, and(1000)=rank4"},
  {id:"m2n2p5", difficulty:"basic", q:"A word at rank 50 has frequency 200. What frequency does Zipf's Law predict for rank 150?", answer:"k=200×50=10000. f(150)=10000/150≈66.7 — confirming the professor's own numeric grounding example that rank-50 frequency should be ~3× rank-150 frequency (200 vs 66.7, ratio≈3)."},
  {id:"m2n2p6", difficulty:"basic", q:"A word has 16 meanings. Using Zipf's other law (m∝√f), if another word has 4 meanings, what is the ratio f₁:f₂ (frequency of word 1 to word 2)?", answer:"m∝√f ⟹ f∝m². f₁:f₂ = 16²:4² = 256:16 = 16:1"},
  {id:"m2n2p7", difficulty:"moderate", q:"A word at rank 25 has frequency 800. Using f·r=k, find the frequency at rank 100, and verify whether this matches the claim 'rank-25 frequency is 4× rank-100 frequency'.", answer:"k=800×25=20000. f(100)=20000/100=200. Ratio f(25):f(100) = 800:200 = 4:1 — yes, confirmed exactly (since rank ratio is 100/25=4, frequency ratio is also 4, by the inverse proportionality)."},
  {id:"m2n2p8", difficulty:"moderate", q:"Word A has rank 12 and 25 meanings. Word B has rank 27. Using m∝1/√r, estimate word B's number of meanings.", answer:"m∝1/√r ⟹ mA·√rA = mB·√rB ⟹ 25×√12 = mB×√27 ⟹ mB = 25×√12/√27 = 25×√(12/27) = 25×√(4/9) = 25×(2/3) ≈ 16.67 meanings"},
  {id:"m2n2p9", difficulty:"moderate", q:"Two words have ranks in ratio 4:9. Using Zipf's other law, what is the ratio of their number of meanings?", answer:"m∝1/√r, so m₁:m₂ = 1/√r₁ : 1/√r₂ = √r₂:√r₁ = √9:√4 = 3:2 (the word with SMALLER rank/higher frequency has MORE meanings, in ratio 3:2)."},
  {id:"m2n2p10", difficulty:"difficult", q:"A corpus has the top-5 word frequencies: rank1=3500, rank2=1750, rank3=?, rank4=875, rank5=700. Assuming perfect Zipf behavior (f·r=k), find k and the missing rank-3 frequency, and check if rank1 and rank2 are consistent with the same k.", answer:"From rank1: k=3500×1=3500. Check rank2: 3500/2=1750 ✓ matches given. Check rank4: 3500/4=875 ✓ matches given. Check rank5: 3500/5=700 ✓ matches given. So k=3500 throughout, and rank3 = 3500/3 ≈ 1166.7."},
  {id:"m2n2p11", difficulty:"difficult", q:"If word X has twice the number of meanings of word Y, and Y is at rank 36, at approximately what rank is X (using m∝1/√r)?", answer:"mX=2mY. mX/mY=2=√rY/√rX ⟹ √rX=√rY/2=√36/2=6/2=3 ⟹ rX=9. So X is at approximately rank 9."},
  {id:"m2n2p12", difficulty:"exam-level", q:"Explain why Zipf's Law predicts that 'stop word removal' is such an efficient preprocessing step, using the fact that rank-1 word 'the' occupies ~7% of all word occurrences.", answer:"Because frequency drops off as 1/rank, the top-ranked words capture a disproportionate SHARE of total word occurrences — 'the' alone is ~7% of ALL tokens in a typical English corpus, and the top ~100 words together cover roughly 50% of all text. So removing just a short list of ~100 stop words eliminates about HALF the raw text volume, even though 100 words is a tiny fraction of the full vocabulary (which can be tens of thousands of types) — this asymmetry (few word TYPES, huge token SHARE) is exactly what Zipf's Law predicts and is why stop-word removal is computationally so efficient."},
  {id:"m2n2p13", difficulty:"challenge", q:"A corpus is claimed to follow Zipf's Law exactly with k=10000. A student observes rank-2 frequency=4800 and rank-8 frequency=1300. Are both observations consistent with a SINGLE constant k? If not, which one deviates, and estimate the corpus's actual local k near each rank.", answer:"Predicted f(2)=10000/2=5000, but observed is 4800 — a deviation of 200 (4% off). Predicted f(8)=10000/8=1250, observed is 1300 — a deviation of 50 (4% off). Neither matches k=10000 exactly, but both deviate similarly (~4%), suggesting the TRUE k is slightly different from 10000: local k near rank2 ≈ 4800×2=9600; local k near rank8 ≈ 1300×8=10400. Since real corpora only approximate Zipf's Law (it's empirical, not a physical law), small deviations like this are expected and don't invalidate the overall trend — but a large, consistent deviation would suggest checking for corpus-specific effects (e.g. domain-specific vocabulary, small sample size)."}
 ]
},

  {id:"m2n4p10", difficulty:"difficult", q:"A corpus has: count(natural,language)=45, count(natural)=90, count(language,processing)=38, count(language)=76. Compute P(processing|language) and P(language|natural), then the bigram-chain probability P(natural,language,processing) using these two conditionals plus an assumed P(natural)=0.02.", answer:"P(language|natural)=45/90=0.5. P(processing|language)=38/76=0.5. P(natural,language,processing) ≈ P(natural)×P(language|natural)×P(processing|language) = 0.02×0.5×0.5 = 0.005"},
  {id:"m2n4p11", difficulty:"difficult", q:"In a corpus, 'bank' is followed by 'account' 15 times and by 'river' 3 times, out of 50 total occurrences of 'bank' as the first word of a bigram (the rest are followed by other words). Compute P(account|bank) and P(river|bank), and explain what these two numbers reveal about word-sense frequency in THIS particular corpus.", answer:"P(account|bank)=15/50=0.30. P(river|bank)=3/50=0.06. This reveals that in this corpus, 'bank' overwhelmingly co-occurs with FINANCIAL contexts (account) rather than geographical ones (river) — a bigram model would strongly favor the financial-institution sense of 'bank' whenever predicting the next word, illustrating how N-gram statistics implicitly encode (one aspect of) word-sense frequency without any explicit sense-tagging."},
  {id:"m2n4p12", difficulty:"exam-level", q:"Explain why P(w|<s>) values across ALL words that can start a sentence must sum to exactly 1 (given a fixed training corpus), and verify this using the Sam-I-am corpus (P(I|<s>)=2/3, P(Sam|<s>)=1/3).", answer:"Because <s> is followed by EXACTLY ONE word in each of the N training sentences, and MLE probabilities are counts normalized by count(<s>) — so summing count(<s>,w) over ALL words w that ever follow <s> gives exactly count(<s>) (every sentence-start is counted once), making the sum of P(w|<s>) over all such w equal to count(<s>)/count(<s>)=1. Verification: 2/3 + 1/3 = 3/3 = 1 ✓ (since in the Sam-I-am corpus, every sentence starts with either 'I' or 'Sam', no other options)."},
  {id:"m2n4p13", difficulty:"challenge", q:"A 4-gram model estimates P(w4|w1,w2,w3) = count(w1,w2,w3,w4)/count(w1,w2,w3). If count(about,five,minutes,from)=9, count(about,five,minutes)=15, and separately count(about,five,minutes,late)=2, compute P(from|about,five,minutes) and P(late|about,five,minutes), and verify whether these two probabilities (plus any other possible continuations) could plausibly sum to 1.", answer:"P(from|...)=9/15=0.60. P(late|...)=2/15≈0.133. Sum so far = 0.733, leaving 0.267 (4/15) probability mass for ALL OTHER words that follow 'about five minutes' in the corpus (e.g. 'ago', 'walk', etc.) — this is entirely plausible since count(about,five,minutes)=15 must be fully accounted for by ALL words that ever follow this trigram context, of which 'from' and 'late' are just two of possibly several continuations."}
 ]
},
{
 id:"m2n5", title:"Laplace (Add-1) Smoothing", topic:"2.7.2 Smoothing",
 concept:"Raw MLE assigns probability 0 to any n-gram unseen in training, which collapses an entire sentence's probability to 0 if even one n-gram is missing. Laplace smoothing fixes this by pretending every possible n-gram was seen at least once — add 1 to every count, and correct the denominator by the vocabulary size so probabilities still sum to 1.",
 formula:"Unigram: P(w) = (c(w)+1) / (N+|V|)\nBigram: P(wi|wi-1) = (c(wi-1,wi)+1) / (c(wi-1)+|V|)\nwhere N = total tokens, |V| = vocabulary size (number of distinct word types).",
 workedExample:{
  title:"Fix the zero-probability problem for 'CHER READ A BOOK' using Add-1 smoothing",
  steps:[
   "Corpus: JOHN READ MOBY DICK / MARY READ A DIFFERENT BOOK / SHE READ A BOOK BY CHER. Assume vocabulary size |V|=11, total tokens N=11 (using bullet '•' for sentence boundary).",
   "Step 1 — Without smoothing: P(CHER READ A BOOK) = P(CHER|•)·P(READ|CHER)·P(A|READ)·P(BOOK|A)·P(•|BOOK). Since CHER never starts a sentence and 'CHER READ' never occurs, both count(•,CHER)=0 and count(CHER,READ)=0 → the product = 0.",
   "Step 2 — Apply Add-1 to each factor: P(CHER|•) = (0+1)/(11+3) [using vocabulary-appropriate denominator per position] = 1/14. Note: exact denominators depend on how many distinct words follow each context; the professor's slide uses '11+3','11+1', etc. for the different positions.",
   "Step 3 — Continue multiplying the remaining (already-nonzero) factors with their own +1 numerator and +|V| denominator adjustments: (1+2)/(11+3) for P(A|READ), (1+1)/(11+2) for P(BOOK|A), (1+1)/(11+2) for P(•|BOOK).",
   "Step 4 — Final result: P(CHER READ A BOOK) ≈ 0.00003 — nonzero (unlike the unsmoothed 0), though still much smaller than P(JOHN READ A BOOK) ≈ 0.0001 computed the same way, correctly reflecting that CHER is rare as a sentence-starter in this corpus."
  ]
 },
 practice:[
  {id:"m2n5p1", difficulty:"easy", q:"Vocabulary size |V|=10. A bigram (w1,w2) has count(w1,w2)=3 and count(w1)=20. Compute the Add-1 smoothed P(w2|w1).", answer:"(3+1)/(20+10) = 4/30 ≈ 0.133"},
  {id:"m2n5p2", difficulty:"easy", q:"Vocabulary size |V|=50. An unseen bigram has count(w1,w2)=0 and count(w1)=100. Compute the Add-1 smoothed probability.", answer:"(0+1)/(100+50) = 1/150 ≈ 0.0067"},
  {id:"m2n5p3", difficulty:"easy", q:"|V|=8, count(w)=5, N=40 (unigram case). Compute Add-1 smoothed P(w).", answer:"(5+1)/(40+8) = 6/48 = 0.125"},
  {id:"m2n5p4", difficulty:"basic", q:"Naive Bayes spam filter: vocabulary V=8, total SPAM tokens=20. Word 'meeting' has count=0 in SPAM. Compute the Add-1 smoothed P(meeting|SPAM).", answer:"(0+1)/(20+8) = 1/28 ≈ 0.0357"},
  {id:"m2n5p5", difficulty:"basic", q:"Same spam filter setup. Word 'free' has count=6 in SPAM (N=20,V=8). Compute Add-1 smoothed P(free|SPAM).", answer:"(6+1)/(20+8) = 7/28 = 0.25"},
  {id:"m2n5p6", difficulty:"basic", q:"Sentiment classifier: POSITIVE class has N=25 tokens, V=10. Word 'terrible' has count=0. Compute Add-1 smoothed P(terrible|POSITIVE).", answer:"(0+1)/(25+10) = 1/35 ≈ 0.0286"},
  {id:"m2n5p7", difficulty:"moderate", q:"Same sentiment setup (N=25,V=10). Word 'great' has count=8. Compute the ratio of smoothed P(great|POSITIVE) to smoothed P(terrible|POSITIVE), and interpret.", answer:"P(great)=(8+1)/35=9/35≈0.257. P(terrible)=(0+1)/35=1/35≈0.0286. Ratio ≈ 9:1 — even after smoothing gives 'terrible' a nonzero floor, 'great' remains far more strongly associated with POSITIVE, correctly preserving the SIGNAL while avoiding a hard zero."},
  {id:"m2n5p8", difficulty:"moderate", q:"Classify the test review 'The product is great but terrible and broken' using Add-1-smoothed Naive Bayes with POSITIVE stats (N=25,V=10): great=8,terrible=0,broken=0. Compute the (unnormalized) product of smoothed probabilities for just great, terrible, broken.", answer:"P(great)=(8+1)/35=9/35. P(terrible)=(0+1)/35=1/35. P(broken)=(0+1)/35=1/35. Product = (9/35)×(1/35)×(1/35) = 9/42875 ≈ 0.00021 — this small but nonzero value can now be compared against the equivalent NEGATIVE-class product to make a classification decision (the actual comparison needs the NEGATIVE class stats too, not given here, but the mechanic is: compute both class products and pick the larger)."},
  {id:"m2n5p9", difficulty:"moderate", q:"Two words in the same context: word A has count=10, word B has count=2, context count=30, |V|=15. Compute both smoothed probabilities and their ratio; compare to the UNSMOOTHED ratio.", answer:"Smoothed: P(A)=(10+1)/(30+15)=11/45≈0.244. P(B)=(2+1)/45=3/45≈0.067. Smoothed ratio ≈ 3.67:1. Unsmoothed: P(A)=10/30≈0.333, P(B)=2/30≈0.067, ratio=5:1. Smoothing COMPRESSES the ratio between frequent and rare events (moving probability mass from frequent to rare/unseen events), which is smoothing's intended trade-off."},
  {id:"m2n5p10", difficulty:"difficult", q:"A bigram model has |V|=1000. Context word 'the' has count(the)=5000. An unseen bigram (the, xylophone) has count=0. A frequent bigram (the, cat) has count=50. Compute both smoothed probabilities and explain why the vocabulary term (+1000) barely affects the frequent bigram's probability but matters a lot for rare contexts.", answer:"P(xylophone|the)=(0+1)/(5000+1000)=1/6000≈0.000167. P(cat|the)=(50+1)/(5000+1000)=51/6000=0.0085. Since count(the)=5000 is already large relative to |V|=1000, the '+1000' denominator shift is a modest (20%) relative change — it matters much more when the base count(context) is SMALL relative to |V| (e.g. a rare context word with count(w)=5 and |V|=1000 would see its denominator more than double), which is exactly the scenario where smoothing needs to do the most 'work'."},
  {id:"m2n5p11", difficulty:"exam-level", q:"Explain, using the John/Mary/Cher example's ratios, why Laplace/Add-1 smoothing is often criticized as 'too aggressive' for large vocabularies, and what alternative (from this syllabus) addresses that criticism.", answer:"Add-1 smoothing adds the SAME +1 to every possible n-gram, including the enormous number of n-grams that were never observed — for a large vocabulary (|V| in the tens of thousands), this means most of the added 'fake' probability mass is redistributed to n-grams that are genuinely implausible, taking too much probability away from n-grams that WERE actually observed (e.g. compare P(JOHN...)≈0.0001 smoothed vs an unsmoothed ≈0.06 — a huge relative drop). Good-Turing smoothing (2.7.2) addresses this by redistributing probability mass based on the ACTUAL observed frequency-of-frequencies (N1, N2, ...) rather than a flat +1 for everything, giving a more data-driven (less crude) estimate of how much mass unseen events should really receive."},
  {id:"m2n5p12", difficulty:"challenge", q:"Derive what value of |V| would make the smoothed and unsmoothed probabilities of a bigram with count(w1,w2)=4, count(w1)=40 differ by less than 5% (approximately), and explain the implication for choosing |V| in practice.", answer:"Unsmoothed: 4/40=0.10. Smoothed: (4+1)/(40+|V|)=5/(40+|V|). Set 5/(40+|V|) ≈ 0.95×0.10=0.095 ⟹ 40+|V| ≈ 5/0.095 ≈ 52.6 ⟹ |V|≈12.6, so |V|≤~13 keeps the shift under 5%. Implication: Add-1 smoothing's distortion grows directly with vocabulary size relative to the context count — for realistic NLP vocabularies (thousands to millions of types), the distortion is often far larger than 5%, which is precisely why Add-1/Laplace smoothing, despite being simple to teach and compute, is rarely used in state-of-the-art systems; it mainly serves as the pedagogical baseline for understanding WHY smoothing is needed before moving to more sophisticated methods (Good-Turing, Kneser-Ney, etc.)."}
 ]
},
{
 id:"m2n6", title:"Good-Turing Smoothing", topic:"2.7.2 Smoothing",
 concept:"Good-Turing smoothing redistributes probability mass using the 'frequency of frequencies': how many distinct items were seen exactly c times (denoted Nc). It uses N1 (items seen exactly once) as an estimate of how much probability mass should be reserved for things never seen at all, and adjusts the count of low-frequency items downward slightly to make room.",
 formula:"Nc = number of distinct n-grams (or species/items) that occurred exactly c times.\nProbability mass reserved for ALL unseen events: P*GT(unseen) = N1 / N (N = total count of all observed items).\nAdjusted ('Good-Turing discounted') count for an item seen c times: c* = (c+1) × N(c+1) / Nc\nAdjusted probability for that item: P*GT = c* / N",
 workedExample:{
  title:"The classic 'fishing' example — estimate probabilities for a new species and for a species seen once",
  steps:[
   "You go fishing and catch: 10 carp, 3 perch, 2 whitefish, 1 trout, 1 salmon, 1 eel — total N=18 fish across 6 species.",
   "Step 1 — Count frequency-of-frequencies: species seen exactly once (trout, salmon, eel) → N1=3. Species seen exactly twice (whitefish) → N2=1. (carp=10, perch=3 are higher counts, not needed for this calculation.)",
   "Step 2 — Probability the NEXT catch is a totally NEW species (e.g. catfish or bass, never caught before): P*GT(unseen) = N1/N = 3/18 ≈ 0.167.",
   "Step 3 — Adjusted count for a species seen exactly once, e.g. 'trout' (c=1): c* = (c+1)×N(c+1)/Nc = (1+1)×N2/N1 = 2×(1/3) = 2/3.",
   "Step 4 — Adjusted probability for trout: P*GT(trout) = c*/N = (2/3)/18 = 2/54 = 1/27 ≈ 0.037 — notice this is LESS than the raw MLE estimate of 1/18≈0.056, because some of trout's 'share' has been redistributed to reserve probability for unseen species."
  ]
 },
 practice:[
  {id:"m2n6p1", difficulty:"easy", q:"A corpus has N1=5 items seen once, out of N=50 total observations. What is P*GT(unseen)?", answer:"P*GT(unseen) = N1/N = 5/50 = 0.10"},
  {id:"m2n6p2", difficulty:"easy", q:"N1=8, N=200. Find the total probability mass reserved for unseen events.", answer:"8/200 = 0.04"},
  {id:"m2n6p3", difficulty:"easy", q:"Given N1=3, N2=1 (as in the fishing example), find c* for an item seen exactly once (c=1).", answer:"c* = (1+1)×N2/N1 = 2×1/3 = 2/3 ≈ 0.667"},
  {id:"m2n6p4", difficulty:"basic", q:"A corpus: N1=6, N2=2, N=40. Compute the Good-Turing adjusted count c* for an item seen once, then its adjusted probability.", answer:"c* = (1+1)×N2/N1 = 2×2/6 = 4/6 ≈ 0.667. P*GT = c*/N = 0.667/40 ≈ 0.0167"},
  {id:"m2n6p5", difficulty:"basic", q:"For an item seen exactly twice (c=2), with N2=4 and N3=1, find c*.", answer:"c* = (c+1)×N(c+1)/Nc = (2+1)×N3/N2 = 3×1/4 = 0.75"},
  {id:"m2n6p6", difficulty:"basic", q:"A fishing trip catches 20 fish of 7 species: 4 species seen once (N1=4), 2 species seen twice (N2=2), 1 species seen many times. What's the chance the next catch is a brand new (8th) species?", answer:"P*GT(unseen) = N1/N = 4/20 = 0.20"},
  {id:"m2n6p7", difficulty:"moderate", q:"N1=3, N2=1, N=18 (the classic fishing numbers). Compute the RAW (unsmoothed MLE) probability of catching a specific once-seen species (say, salmon) versus the Good-Turing adjusted probability, and state which is larger.", answer:"Raw MLE: P(salmon)=1/18≈0.0556. Good-Turing: c*=(1+1)×N2/N1=2×1/3=0.667, P*GT=0.667/18≈0.037. The RAW estimate (0.0556) is LARGER than the Good-Turing adjusted estimate (0.037) — Good-Turing 'discounts' seen-once items to free up probability mass for unseen species."},
  {id:"m2n6p8", difficulty:"moderate", q:"A corpus has N0 (unseen, by definition not directly counted) and N1=10, N=500 observed tokens. If the vocabulary of KNOWN word types is 2000 and only 1800 of them were actually observed, does N1=10 change based on the size of the unobserved 200? Explain briefly, then give P*GT(unseen).", answer:"No — N1 counts only ITEMS ACTUALLY OBSERVED exactly once; it does not depend on how many types were never observed at all (that count isn't directly used in the N1/N formula). P*GT(unseen) = N1/N = 10/500 = 0.02, representing the total probability mass shared among ALL unseen events (which could be the 200 unobserved known types, or entirely novel words), regardless of exactly how many distinct unseen items there are."},
  {id:"m2n6p9", difficulty:"moderate", q:"Given N1=4, N2=2, N3=1, N=30, find c* for c=1 and c=2, and comment on the trend.", answer:"c=1: c*=(1+1)×N2/N1=2×2/4=1.0. c=2: c*=(2+1)×N3/N2=3×1/2=1.5. Trend: as c increases from 1 to 2, c* increases from 1.0 to 1.5 (less than the RAW count of 2, showing discounting), illustrating that Good-Turing discounts higher counts LESS aggressively in relative terms as the frequency-of-frequency data (Nc) becomes sparser at higher c."},
  {id:"m2n6p10", difficulty:"difficult", q:"A corpus has N1=0 (no items seen exactly once — every observed item appears 2+ times). What does Good-Turing predict for P*GT(unseen), and why might this be a problem in practice?", answer:"P*GT(unseen) = N1/N = 0/N = 0 — Good-Turing would predict that unseen events have ZERO probability mass reserved, which is clearly wrong in an open-vocabulary setting (new words/n-grams WILL appear). This is a known practical weakness of naive Good-Turing: when N1=0 (or Nc=0 for some needed c), the formula breaks down or gives degenerate results, requiring smoothing OF the Nc counts themselves (e.g. via Simple Good-Turing, which fits a smooth curve to the Nc values) before applying the main formula."},
  {id:"m2n6p11", difficulty:"exam-level", q:"Compare Laplace (Add-1) and Good-Turing smoothing conceptually: which one's 'unseen probability estimate' is directly grounded in observed data patterns, and which one assumes a fixed uniform prior?", answer:"Laplace/Add-1 assumes a UNIFORM prior — it treats every possible unseen n-gram as equally likely by adding a flat +1, regardless of any pattern in the actual data. Good-Turing is DATA-GROUNDED — it estimates the unseen-event probability mass (N1/N) directly from how often LOW-frequency events occurred in the training data itself, making it more responsive to the actual sparsity structure of the corpus (a corpus with many singleton events will reserve more mass for unseen events than one with few singletons)."},
  {id:"m2n6p12", difficulty:"challenge", q:"In the fishing example (N1=3,N2=1,N=18), suppose you catch 100 more fish and now N1=8, N2=3, N=118 (new total). Recompute P*GT(unseen) and c* for a once-seen species, and explain the DIRECTION of change compared to the original small sample.", answer:"New P*GT(unseen) = N1/N = 8/118 ≈ 0.068 (compared to original 3/18≈0.167 — the reserved-for-unseen probability mass DECREASED as more data was collected, which makes sense: with more observations, we've 'discovered' more of the underlying species distribution, so less of the corpus should be devoted to hypothetical unseen species). New c* for c=1: (1+1)×N2/N1 = 2×3/8 = 0.75 (compared to original 0.667 — a similar order of magnitude, since the RELATIVE proportions of N1,N2 didn't change drastically)."}
 ]
},
{
 id:"m2n7", title:"Perplexity", topic:"2.7.3 Evaluation Metrics",
 concept:"Perplexity measures how well a language model predicts a test set — it is the inverse of the test set's probability, normalized (Nth-rooted) by the number of words, so perplexity doesn't grow or shrink just because the test sentence is longer or shorter. Lower perplexity means the model assigned a HIGHER probability to what actually happened, i.e. a better model.",
 formula:"PP(W) = P(w1,w2,...,wN)^(-1/N) = Nth-root of [1/P(W)]\nFor a bigram model (via chain rule expansion): PP(W) = Nth-root of ∏ᵢ [1/P(wi|wi-1)]\nSpecial case — uniform vocabulary of size |V| with equal word probabilities: PP = |V| (perplexity equals vocabulary size when every word is equally likely).",
 workedExample:{
  title:"Compute perplexity for a uniform 100-word vocabulary, then for a real bigram sentence",
  steps:[
   "Part A — Uniform vocabulary: a toy language has 100 equally-likely words, so P(wi)=1/100 for every word.",
   "Step 1 — For a sentence of N words, P(W) = (1/100)^N (each word contributes 1/100).",
   "Step 2 — PP(W) = P(W)^(-1/N) = [(1/100)^N]^(-1/N) = (1/100)^(-1) = 100. So perplexity exactly equals vocabulary size when all words are equally probable — this is the 'worst case' upper bound for that vocabulary.",
   "Part B — Bigram sentence: 'You Gave Him' scored against a bigram model gives P(W) = P(you|<s>)·P(gave|you)·P(him|gave)·P(</s>|him) = (1/8)×(1/3)×(1/4)×(1/3).",
   "Step 3 — Multiply: (1/8)×(1/3)×(1/4)×(1/3) = 1/288 ≈ 0.00347.",
   "Step 4 — N=4 (four words: You, Gave, Him, plus the implicit boundary transitions counted as 4 probability factors). PP(W) = (0.00347)^(-1/4) = (1/0.00347)^(1/4) ≈ (288)^0.25 ≈ 4.12"
  ]
 },
 practice:[
  {id:"m2n7p1", difficulty:"easy", q:"A uniform vocabulary has 50 equally-likely words. What is the perplexity of any sentence under this model?", answer:"PP = |V| = 50 (uniform vocabulary case)"},
  {id:"m2n7p2", difficulty:"easy", q:"A uniform vocabulary has 1000 words. What is the perplexity?", answer:"PP = 1000"},
  {id:"m2n7p3", difficulty:"easy", q:"Model A has perplexity 40, Model B has perplexity 120 on the same test set. Which model is better?", answer:"Model A is better — LOWER perplexity means a better model."},
  {id:"m2n7p4", difficulty:"basic", q:"A test sentence has N=3 words, and P(W)=0.001. Compute PP(W).", answer:"PP = (0.001)^(-1/3) = 1000^(1/3) = 10"},
  {id:"m2n7p5", difficulty:"basic", q:"A test sentence has N=2 words and P(W)=0.01. Compute PP(W).", answer:"PP = (0.01)^(-1/2) = 100^(1/2) = 10"},
  {id:"m2n7p6", difficulty:"basic", q:"A test sentence has N=5 words and P(W)=0.00032. Compute PP(W) (note 0.00032 = (1/5)^5... verify).", answer:"PP = (0.00032)^(-1/5) = (1/0.00032)^(1/5) = (3125)^(1/5) = 5 (since 5^5=3125)"},
  {id:"m2n7p7", difficulty:"moderate", q:"Model A gives P(W)=0.00008 for a 5-word sentence. Model B gives P(W)=0.00002 for the same sentence. Compute both perplexities and determine which model is actually better — beware the trap of assuming 'smaller P(W) = better'.", answer:"PP_A = (0.00008)^(-1/5) = (12500)^0.2 ≈ 6.58. PP_B = (0.00002)^(-1/5) = (50000)^0.2 ≈ 8.70. Since PP_A < PP_B, Model A is actually BETTER (lower perplexity), even though Model A's raw probability (0.00008) is LARGER, not smaller — a claim that 'Model B is better because its probability is smaller' is WRONG; perplexity is inversely related to probability, so a SMALLER P(W) always gives a HIGHER (worse) perplexity for the same N."},
  {id:"m2n7p8", difficulty:"moderate", q:"Continuing the previous question: the phrase in question is 'patient feels weak' (part of a longer 5-word medical sentence). Give one limitation of using a UNIGRAM model here and suggest a better N-gram choice.", answer:"A unigram model treats each word independently and cannot capture that 'feels weak' is a much more natural/likely continuation than an unrelated word after 'feels' — it ignores word ORDER and local context entirely. A bigram or trigram model would be more appropriate, since it conditions each word on the immediately preceding word(s), capturing common phrase patterns like 'feels weak' that a unigram model is blind to."},
  {id:"m2n7p9", difficulty:"moderate", q:"A bigram model gives P(w1|<s>)=1/10, P(w2|w1)=1/5, P(w3|w2)=1/2, P(</s>|w3)=1/4 for a 3-word test sentence (N=3, counting only the 3 real words, not boundary tokens as separate N). Compute P(W) and PP(W).", answer:"P(W) = (1/10)×(1/5)×(1/2)×(1/4) = 1/400 = 0.0025. PP(W) = (0.0025)^(-1/3) = (400)^(1/3) ≈ 7.37"},
  {id:"m2n7p10", difficulty:"difficult", q:"Using the 'To summarise...' recursive passage (a real practice exercise from the professor's slides), a bigram model gives extremely small probabilities for longer repeated phrases because of compounding repetition. If P(W)=1×10⁻¹² for an N=12 word test phrase, compute PP(W).", answer:"PP(W) = (10⁻¹²)^(-1/12) = (10¹²)^(1/12) = 10^(12/12) = 10^1 = 10"},
  {id:"m2n7p11", difficulty:"difficult", q:"A language model's perplexity on Test Set 1 is 25; on Test Set 2 (different domain), its perplexity is 400. What does this comparison suggest about the model's training domain, and is it valid to conclude the model is 'bad' overall?", answer:"This suggests the model was likely TRAINED on data similar to Test Set 1's domain (hence predicting it well, low perplexity) but is poorly matched to Test Set 2's domain (much higher perplexity — it finds Test Set 2's word sequences far more 'surprising'). It is NOT valid to conclude the model is bad overall — perplexity is only meaningful when comparing models on the SAME test set, or interpreting one model's perplexity RELATIVE to its expected domain; a domain mismatch, not a bad model, likely explains the large gap."},
  {id:"m2n7p12", difficulty:"exam-level", q:"Explain the relationship between perplexity and the 'branching factor' of a language, and why a language model with perplexity 50 is described as being 'as confused as if it had to choose uniformly among 50 words' at each step.", answer:"Perplexity is defined as the WEIGHTED AVERAGE BRANCHING FACTOR — the effective number of equally-likely choices the model faces at each word position. A perplexity of 50 means that, on average, the model behaves as if it were choosing the next word from a uniform distribution over 50 equally-likely options at every position (even though the real distribution isn't uniform) — this gives an intuitive, comparable 'difficulty' score: lower perplexity = fewer effective choices = more confident, accurate predictions; higher perplexity = the model is more 'spread out'/uncertain, as if guessing among more options."},
  {id:"m2n7p13", difficulty:"challenge", q:"If Model A (trained on 1 million words) has perplexity 60 on a test set, and Model B (identical architecture, trained on 100 million words) has perplexity 35 on the SAME test set, what does this suggest about the relationship between training data size and perplexity, and is there a limit to how much perplexity can keep decreasing?", answer:"This suggests more training data generally REDUCES perplexity (better probability estimates, fewer zero/near-zero counts needing heavy smoothing, better generalization) — consistent with the general NLP principle that N-gram models improve with more data. However, perplexity cannot decrease indefinitely: it is bounded below by the TRUE entropy of the language itself (a fundamental limit related to how inherently unpredictable/creative natural language is) — even a perfect model with infinite training data cannot achieve a perplexity of 1 (which would mean the language is fully deterministic/predictable), since natural language inherently contains genuine ambiguity and creative variation."}
 ]
},
{
 id:"m2n8", title:"TF-IDF (Term Frequency–Inverse Document Frequency)", topic:"2.8 Word Representation Models",
 concept:"TF-IDF scores how important a word is to a specific document within a larger collection. A word that appears often in ONE document but rarely across OTHERS gets a high score (it's distinctive); a word appearing in almost every document (like 'the') gets pushed toward zero, regardless of its raw frequency, because it carries little discriminative information. [Note: this topic was only briefly defined in the professor's slides — formulas and worked examples here are supplemented from standard NLP textbook material, per the syllabus requirement.]",
 formula:"Term Frequency: tf(t,d) = count of term t in document d\nInverse Document Frequency: idf(t) = log10(N / df(t)), where N = total number of documents in the collection, df(t) = number of documents containing term t at least once\nTF-IDF weight: tfidf(t,d) = tf(t,d) × idf(t)",
 workedExample:{
  title:"Compute TF-IDF for the word 'car' in a 3-document collection",
  steps:[
   "Collection: Doc1 = \"the car is red\" (4 words). Doc2 = \"the car is fast and the car is loud\" (9 words). Doc3 = \"the dog is brown\" (4 words). N=3 documents total.",
   "Step 1 — Compute tf('car', Doc2): 'car' appears 2 times in Doc2 → tf = 2.",
   "Step 2 — Compute df('car'): 'car' appears in Doc1 and Doc2, but NOT Doc3 → df('car') = 2.",
   "Step 3 — Compute idf('car'): idf = log10(N/df) = log10(3/2) = log10(1.5) ≈ 0.176.",
   "Step 4 — Compute tfidf('car', Doc2): tf × idf = 2 × 0.176 ≈ 0.352.",
   "Step 5 — Compare with 'the': tf('the',Doc2)=3, but df('the')=3 (appears in ALL 3 documents) → idf('the')=log10(3/3)=log10(1)=0 → tfidf('the',Doc2)=3×0=0. Even though 'the' is MORE frequent than 'car' in Doc2 (3 vs 2), its TF-IDF weight is exactly 0, correctly reflecting that 'the' carries no document-distinguishing information, while 'car' (weight≈0.352) is flagged as meaningfully characteristic of Doc2."
  ]
 },
 practice:[
  {id:"m2n8p1", difficulty:"easy", q:"A word appears in 5 out of 10 total documents. Compute its idf.", answer:"idf = log10(10/5) = log10(2) ≈ 0.301"},
  {id:"m2n8p2", difficulty:"easy", q:"A word appears in all 20 documents of a collection. Compute its idf.", answer:"idf = log10(20/20) = log10(1) = 0"},
  {id:"m2n8p3", difficulty:"easy", q:"A word appears in exactly 1 out of 100 documents. Compute its idf.", answer:"idf = log10(100/1) = log10(100) = 2"},
  {id:"m2n8p4", difficulty:"basic", q:"A word has tf=4 in a document, and idf=0.5. Compute its tf-idf weight.", answer:"tfidf = 4 × 0.5 = 2.0"},
  {id:"m2n8p5", difficulty:"basic", q:"Collection of 50 documents; a word appears in 25 of them, with tf=3 in the document being scored. Compute tf-idf.", answer:"idf = log10(50/25) = log10(2) ≈ 0.301. tfidf = 3 × 0.301 ≈ 0.903"},
  {id:"m2n8p6", difficulty:"basic", q:"In a 4-document collection, word 'python' appears in Doc1 (tf=5) and Doc4 (tf=2), never in Doc2/Doc3. Compute tf-idf for 'python' in Doc1.", answer:"df('python')=2. idf=log10(4/2)=log10(2)≈0.301. tfidf(Doc1)=5×0.301≈1.505"},
  {id:"m2n8p7", difficulty:"moderate", q:"Collection of 8 documents. Word A appears in 2 docs (tf=6 in the doc being scored); Word B appears in 6 docs (tf=6 in the same doc, same raw frequency as A). Compute and compare their tf-idf weights.", answer:"idf(A)=log10(8/2)=log10(4)≈0.602 → tfidf(A)=6×0.602≈3.61. idf(B)=log10(8/6)≈log10(1.333)≈0.125 → tfidf(B)=6×0.125≈0.75. Despite IDENTICAL raw term frequency (tf=6 for both), Word A gets a much HIGHER tf-idf weight because it's rarer across the collection (more discriminative) — this demonstrates the entire purpose of the idf factor."},
  {id:"m2n8p8", difficulty:"moderate", q:"A 100-document collection. A stopword-like term appears in 95 documents. Compute its idf and explain why this word will almost always get a low tf-idf score regardless of tf.", answer:"idf = log10(100/95) = log10(1.053) ≈ 0.022 — a very small idf value close to 0. Since tfidf=tf×idf, even a HIGH tf (the word appearing many times in a document) gets multiplied by this tiny idf, keeping the final weight low — this is precisely how TF-IDF automatically down-weights near-universal words without needing a manually curated stop-word list."},
  {id:"m2n8p9", difficulty:"moderate", q:"Word X: tf=10, appears in 3 of 12 documents. Word Y: tf=2, appears in 1 of 12 documents. Compute both tf-idf weights and determine which word is considered MORE distinctive/important by this measure.", answer:"idf(X)=log10(12/3)=log10(4)≈0.602 → tfidf(X)=10×0.602≈6.02. idf(Y)=log10(12/1)=log10(12)≈1.079 → tfidf(Y)=2×1.079≈2.158. Word X has the higher tf-idf weight (6.02 > 2.158) despite appearing in more documents than Y, because X's much higher TERM FREQUENCY (10 vs 2) outweighs Y's higher IDF (rarity) — showing tf-idf balances BOTH factors, not just rarity alone."},
  {id:"m2n8p10", difficulty:"difficult", q:"A 200-document corpus. Term Z has df=50 in the whole corpus. In Document 17, Z occurs 3 times out of that document's 150 total words. Compute (a) raw term frequency, (b) idf, (c) tf-idf, and (d) explain how this differs from a simple relative-frequency (tf/document-length) approach.", answer:"(a) tf=3 (raw count, not normalized by document length in this formula variant). (b) idf=log10(200/50)=log10(4)≈0.602. (c) tfidf=3×0.602≈1.806. (d) A simple relative-frequency approach (3/150=0.02) only reflects how prominent Z is WITHIN Document 17, completely ignoring how common/rare Z is across the WHOLE corpus — two words with the same relative frequency within a document could have very different tf-idf weights depending on their document frequency df, which relative-frequency alone cannot capture."},
  {id:"m2n8p11", difficulty:"exam-level", q:"Explain why TF-IDF is described as an improvement over plain Bag-of-Words counts for tasks like document search/retrieval, using a concrete boilerplate-phrase scenario.", answer:"Plain BoW counts treat frequency as the only signal — a boilerplate phrase like 'thank you for your email' appearing in EVERY email in a corpus would have HIGH BoW counts for 'thank','you','email' in every document, making these words look 'important' by pure frequency, even though they carry zero information for distinguishing one email from another. TF-IDF fixes this: since these words appear in nearly ALL documents (df≈N), their idf≈log(N/N)≈0, driving their tf-idf weight toward 0 regardless of how often they repeat — while a rare, document-specific term (e.g. a project codename appearing in just 2 emails) gets a HIGH idf and thus a high tf-idf weight, correctly surfacing it as the more search/retrieval-relevant term."},
  {id:"m2n8p12", difficulty:"challenge", q:"A collection grows from N=10 documents to N=1000 documents (100× growth), and a particular rare term's document frequency grows proportionally from df=1 to df=100 (staying at the same RELATIVE rarity, 10% of documents). Does the term's idf value change? Compute both to verify.", answer:"Original: idf=log10(10/1)=log10(10)=1. New: idf=log10(1000/100)=log10(10)=1. The idf value is UNCHANGED (still exactly 1) because idf depends on the RATIO N/df, and this ratio stayed the same (10× in both cases) even though the absolute numbers grew — this confirms idf is a scale-invariant measure of RELATIVE rarity, not absolute document count, which is why TF-IDF remains meaningful as a corpus grows in size as long as the word's relative prevalence pattern stays consistent."}
 ]
},
{
 id:"m2n9", title:"Edit Distance (Levenshtein Distance)", topic:"Self-Learning: Edit Distance & Noisy Channel Model",
 concept:"Edit distance counts the minimum number of single-character insertions, deletions, and substitutions needed to turn one string into another — useful for spell-checking, DNA sequence comparison, and fuzzy string matching. Computed efficiently via a dynamic-programming table. [Supplemented from standard NLP textbook material, since this self-learning topic was not covered in the professor's slides.]",
 formula:"D(i,j) = edit distance between the first i characters of string 1 and first j characters of string 2.\nBase cases: D(i,0)=i, D(0,j)=j\nRecurrence: D(i,j) = min[ D(i-1,j)+1 (delete), D(i,j-1)+1 (insert), D(i-1,j-1)+cost (substitute; cost=0 if chars match, else 1) ]\nAnswer = D(len1, len2), the bottom-right cell of the completed table.",
 workedExample:{
  title:"Compute the edit distance between 'CAT' and 'CUT'",
  steps:[
   "Build a DP table with rows for '' ,C,A,T (string 1) and columns for '',C,U,T (string 2).",
   "Step 1 — Base cases: D(0,0)=0, D(1,0)=1, D(2,0)=2, D(3,0)=3 (row: deleting all of string 1 so far); D(0,1)=1, D(0,2)=2, D(0,3)=3 (column: inserting all of string 2 so far).",
   "Step 2 — D(1,1) [C vs C]: chars match (cost=0) → D(1,1)=min(D(0,1)+1, D(1,0)+1, D(0,0)+0) = min(2,2,0) = 0.",
   "Step 3 — D(2,1) [A vs C]: chars differ (cost=1) → D(2,1)=min(D(1,1)+1, D(2,0)+1, D(1,0)+1) = min(1,3,2) = 1.",
   "Step 4 — D(2,2) [A vs U]: chars differ → D(2,2)=min(D(1,2)+1, D(2,1)+1, D(1,1)+1) = min(D(1,2)+1, 2, 1) = 1 (since D(1,1)+1=1 is the minimum path via substitution here needs care: D(1,2) [C vs CU, i.e. C vs 'CU' prefix] = 1, so min(1+1,2,1)=1).",
   "Step 5 — Continue filling: the final answer works out to D(3,3)=1 — CAT and CUT differ by exactly ONE substitution (A→U), matching the intuitive answer."
  ]
 },
 practice:[
  {id:"m2n9p1", difficulty:"easy", q:"Compute the edit distance between 'cat' and 'cats' (one insertion needed).", answer:"1 (insert 's' at the end)"},
  {id:"m2n9p2", difficulty:"easy", q:"Compute the edit distance between 'dog' and 'dig'.", answer:"1 (substitute 'o'→'i')"},
  {id:"m2n9p3", difficulty:"easy", q:"Compute the edit distance between 'test' and 'test' (identical strings).", answer:"0"},
  {id:"m2n9p4", difficulty:"basic", q:"Compute the edit distance between 'kitten' and 'sitten' (just the first letter differs).", answer:"1 (substitute 'k'→'s')"},
  {id:"m2n9p5", difficulty:"basic", q:"Compute the edit distance between 'ab' and 'ba'.", answer:"2 (e.g. delete 'a' then insert 'a' at the end, OR substitute both characters — either way, minimum is 2 single-character edits)"},
  {id:"m2n9p6", difficulty:"basic", q:"Compute the edit distance between 'flaw' and 'lawn'.", answer:"2 (delete 'f' at the start, insert 'n' at the end — 2 edits transform flaw→law→lawn)"},
  {id:"m2n9p7", difficulty:"moderate", q:"Compute the edit distance between 'kitten' and 'sitting' (the classic textbook example).", answer:"3 (substitute k→s: sitten; substitute e→i: sittin; insert g at end: sitting — 3 edits total)"},
  {id:"m2n9p8", difficulty:"moderate", q:"Compute the edit distance between 'intention' and 'execution' (another classic textbook pair — assume substitution cost=1).", answer:"5 (this is the standard Jurafsky & Martin textbook example: the minimum edit distance is 5 using 1 deletion, 3 substitutions, and 1 insertion, following the full DP table computation)"},
  {id:"m2n9p9", difficulty:"moderate", q:"A user types 'recieve' intending 'receive'. What is the edit distance, and what single operation explains it?", answer:"Edit distance = 2 (this is a transposition of 'ie'/'ei' — under the BASIC Levenshtein model, which has no dedicated transposition operation, this requires 2 edits: e.g. delete 'i' after 'rec', giving 'receve', then insert 'i' before the final 've': recieve→receve→receive is one path of 2 edits; some extended models like Damerau-Levenshtein count adjacent transpositions as a SINGLE edit, giving distance 1 instead — a good discussion point on model choice)."},
  {id:"m2n9p10", difficulty:"difficult", q:"Explain why edit distance alone is not sufficient for spelling correction, and what additional model (from this syllabus) combines with it.", answer:"Edit distance only measures STRING SIMILARITY — it can tell you that 'teh' is edit-distance 1 from both 'the' and 'ten', but cannot tell you which correction is more LIKELY given how English is actually used. The Noisy Channel Model combines edit-distance-based error probabilities (P(x|w), the channel/error model) WITH a language model prior P(w) (how common each candidate word/phrase actually is), so that even if two candidates are equally close in edit distance, the one that is a more common/plausible word (or fits the surrounding context better) is preferred."},
  {id:"m2n9p11", difficulty:"difficult", q:"Two candidate corrections for a misspelled word both have edit distance 1 from the typo. Candidate A is a common English word; Candidate B is a rare/obscure word. Under the Noisy Channel Model, which is more likely to be selected as the correction, and why?", answer:"Candidate A is more likely to be selected, because the Noisy Channel Model picks argmax P(x|w)·P(w) — with equal edit distance (roughly equal P(x|w), the channel/error probability), the decision is dominated by P(w), the LANGUAGE MODEL prior probability of each candidate word. A common word has a much higher P(w) than a rare/obscure one, so it wins even though both are equally 'close' in edit distance."},
  {id:"m2n9p12", difficulty:"exam-level", q:"Fill in enough of the DP table to compute the edit distance between 'ab' and 'abc', and explain the general pattern for when one string is a PREFIX of the other.", answer:"D(2,3) for 'ab' vs 'abc': since 'ab' is an exact prefix of 'abc', the edit distance equals the LENGTH DIFFERENCE = 3-2 = 1 (a single insertion of 'c' at the end). General pattern: whenever one string is a prefix of the other, the minimum edit distance is always exactly |length1 − length2|, since only insertions (or only deletions) are needed — no substitutions are required at all."},
  {id:"m2n9p13", difficulty:"challenge", q:"If substitutions are given a COST of 2 (instead of 1) as in some variants of Levenshtein distance (reflecting that a substitution is 'really' a delete+insert), how does the edit distance between 'cat' and 'cut' change compared to the standard cost-1 substitution model?", answer:"With substitution cost=2: since 'cat'→'cut' needs exactly one substitution (a→u), the cost becomes 2 (equivalent to treating the substitution as a delete+insert pair) instead of 1 under the standard model. This variant (sometimes called the 'Levenshtein distance with substitution weight 2', used in some of Jurafsky's own examples) generally produces edit distances closer to what you'd get if you were ONLY allowed insertions and deletions (no direct substitution operation) — it changes the RELATIVE cost-effectiveness of substituting a character versus deleting-then-inserting, which can change which edit sequence is 'cheapest' for longer strings with multiple differences."}
 ]
});

 {heading:"Empirical Laws — 3 formulas to know cold", points:[
  "Zipf's Law: f·r = k (frequency × rank = constant). Given one pair, solve for the other.",
  "Zipf's Other Law: m ∝ 1/√r (meanings vs rank) — combine as m₁/m₂ = √(r₂/r₁).",
  "Heaps' Law: |V| = K·N^β, β≈0.5 — vocabulary grows sub-linearly, never saturates.",
  "TTR = Types/Tokens. >0.70 high, 0.50–0.70 moderate, <0.50 low diversity."
 ]},
 {heading:"Inflectional vs Derivational — the ONE rule", points:[
  "If part-of-speech changes → Derivational. If it stays the same → Inflectional.",
  "English has exactly 8 inflectional affixes: -s(3sg), -ed(past), -ing(progressive), -en(past participle), -s(plural), -'s(possessive), -er(comparative), -est(superlative).",
  "4 affix positions: Prefix (before), Suffix (after), Circumfix (wraps around, e.g. German ge-...-t), Infix (inside, e.g. Sanskrit vindati)."
 ]},
 {heading:"Porter Stemmer — the trace-through checklist", points:[

  "Always apply the LONGEST matching rule at each step.",
  "Rules are gated by measure m: e.g. (m>0) for step 2/3, (m>1) for step 4.",
  "Remember Y is a consonant UNLESS preceded by a consonant (TOY: T,Y both consonants; SYZYGY: S,Z,G consonants)."
 ]},
