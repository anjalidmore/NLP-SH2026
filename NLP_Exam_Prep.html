},
{id:"m3t3", topic:"3.1", marks:5, priority:"high", flashcard:false,
 q:"Explain why POS tagging is fundamentally a disambiguation task, using the WSJ/Brown ambiguity statistics and the 'refuse/permit' example.",
 a:"Tagging is a disambiguation task because many words have more than one possible POS, and the goal is to find the correct tag for the CURRENT context. Statistics (WSJ corpus): only 14% of word TYPES are ambiguous (2+ tags), but because ambiguous words tend to be common function words, they account for 55% of all word TOKENS. Classic example: 'They refuse to permit us to obtain refuse permit' — 'refuse' and 'permit' each appear twice with DIFFERENT POS tags depending on position (refuse=VBP then NN; permit=VB then NN) — same word form, different tag, purely from context.",
 examAnswer:"State the type-vs-token ambiguity split (14% types ambiguous but 55%+ of tokens are ambiguous instances) + the refuse/permit sentence with both taggings shown explicitly.",
 mistakes:"Don't say 'most words are ambiguous' — only 14% of TYPES are; the key insight is that the FEW ambiguous types are so common that they dominate real text (TOKENS)."
},
{id:"m3t4", topic:"3.1", marks:5, priority:"high", flashcard:true,
 q:"Give the 'assured to back the silver coin' example and explain what it motivates.",
 a:"For the sentence 'assured to back the silver coin', each word has multiple possible tags: assured(3: VBD,VBN,JJ), to(1: TO), back(4: RB,NN,JJ,VB), the(2: NN,DET), silver(3: NN,JJ,VB), coin(2: NN,VB). Total possible tag sequences = 3×1×4×2×3×2 = 144. This combinatorial explosion motivates why brute-force enumeration of all tag sequences is infeasible, and why a Dynamic Programming approach (Viterbi) is needed instead of checking all 144 possibilities individually.",
 examAnswer:"Show the per-word tag-count table, compute the product (144), and explicitly state this motivates Viterbi/dynamic programming over brute force — this exact multiplication is a common short-numerical question.",
 mistakes:"Don't forget to multiply ALL word tag-counts together (not add them) — the combinatorial explosion is the entire point of the example."
},
{id:"m3t5", topic:"3.1", marks:5, priority:"high", flashcard:true,
 q:"List the components of an HMM and explain how the emission and transition matrices are built from a tagged corpus.",
 a:"HMM components: Initial probabilities (π), Transition probabilities (A), Emission probabilities (B). Building the matrices: (1) Emission matrix — identify unique tokens (N) and POS tags (M) in the corpus, assign the correct tag to every token, arrange as an N×M matrix giving P(word|tag) via Bayes' rule counting. (2) Transition matrix — using the tags found, build an M×M matrix using the BIGRAM concept (how often tag_j follows tag_i), giving P(tag_i|tag_{i-1}).",
 examAnswer:"Name all 3 probability types (π, A, B), then explain the emission matrix (N×M, word-given-tag) and transition matrix (M×M, tag-given-previous-tag, bigram-based) construction procedures separately.",
 mistakes:"Don't swap emission and transition — Emission = P(word|tag) [uses the token×tag data], Transition = P(tag|previous tag) [uses only the tag sequence, bigram-style]."
},
{id:"m3t6", topic:"3.1", marks:5, priority:"high", flashcard:true,
 q:"Give the HMM decoding formula (the fundamental equation for finding the best tag sequence).",
 a:"T̂ = argmax_T P(T|W) = argmax_T P(W|T)P(T) = argmax_T [∏ᵢ P(wordᵢ|tagᵢ)] × [∏ᵢ P(tagᵢ|tagᵢ₋₁)] — derived via Bayes' Rule (Posterior = Prior × Likelihood / Marginal, dropping the constant marginal P(W) since it doesn't affect the argmax). The first product is the EMISSION term (how likely each word given its tag); the second is the TRANSITION term (how likely each tag given the previous tag).",
 examAnswer:"Write the full derivation chain (Bayes' rule → drop marginal → split into emission product × transition product) — this exact formula is the backbone of the entire HMM POS tagging numerical questions.",
 mistakes:"Don't forget WHY the marginal P(W) is dropped — it's constant across all candidate T's, so it doesn't affect which T maximizes the expression."
},
{id:"m3t7", topic:"3.1", marks:5, priority:"high", flashcard:true,
 q:"What is the Viterbi Algorithm? Give its 3 phases and the core recurrence.",
 a:"Viterbi is a decoding algorithm for HMMs — an application of Dynamic Programming that finds the most probable sequence of hidden states given a sequence of observations. It does NOT create the HMM's probabilities (those come from the HMM itself: A, B, π) — it USES them to find the best path. Three phases: Initialization — viterbi[s,1] = πₛ × bₛ(o₁). Recursion — viterbi[s,t] = maxₛ' [viterbi[s',t-1] × a(s',s) × bₛ(oₜ)], with a backpointer recording which s' achieved the max. Termination — bestpathprob = maxₛ viterbi[s,T]; trace back via backpointers to recover the full best path.",
 examAnswer:"State all 3 phases (Init/Recursion/Termination) with their exact formulas, and explicitly note 'HMM=probability model, Viterbi=best-path/decoding algorithm' as the closing distinction line.",
 mistakes:"Don't forget the backpointer array — without it, you can find the BEST PROBABILITY but not recover the actual best TAG SEQUENCE, which is usually what the question actually asks for."
},
{id:"m3t8", topic:"3.1", marks:5, priority:"high", flashcard:true,
 q:"List the 4 issues/limitations of HMM-based POS tagging and their stated solutions.",
 a:"1. Unknown Words — words unseen in training have no emission probability, breaking Viterbi decoding; solution: use morphological signals (capitalization → proper noun, '-ed' suffix → past tense). 2. Limited Context — Viterbi uses a first-order (bigram) Markov model, insufficient for cases like 'is passed' [past participle] vs 'she passed' [past tense] when modified by an adverb ('is absolutely passed'); solution: use higher-order n-grams. 3. Performance — big sentences are processed slowly. 4. Limited word features; solution: use a feature-rich classifier — this directly motivates MEMM/MaxEnt (bridges to 3.2).",
 examAnswer:"List all 4 issues with their stated solutions — issue #4's solution ('use a feature-rich classifier') is the exact bridge sentence into MEMM, so mentioning it shows syllabus-level understanding of module structure.",
 mistakes:"Don't confuse 'Limited Context' (first-order Markov insufficient) with 'Limited word features' (issue #4) — they sound similar but have different solutions (higher-order n-grams vs. feature-rich classifiers)."
},
{id:"m3t9", topic:"3.2", marks:5, priority:"high", flashcard:true,
 q:"Contrast HMM and MEMM's core formulas and their generative-vs-discriminative distinction.",
 a:"HMM: T̂=argmax_T P(T|W) computed INDIRECTLY via P(W|T)P(T) (generative — models how tags GENERATE words). MEMM: T̂=argmax_T ∏ᵢP(tᵢ|wᵢ,tᵢ₋₁), computing the posterior P(T|W) DIRECTLY (discriminative — trained to discriminate among tag sequences given words). Diagram distinction: HMM arrows point DOWNWARD (tag→word, tags generate observations); MEMM arrows point UPWARD (word→tag, tags conditioned on observations). Viterbi adapts trivially: HMM uses V[j][t]=max V[i][t-1]×A[i][j]×B[j][t]; MEMM replaces the prior×likelihood (A,B) with the direct posterior: v_t(j)=max v_{t-1}(i)×P(sⱼ|sᵢ,oₜ).",
 examAnswer:"State both formulas side by side + the generative(HMM)-vs-discriminative(MEMM) label + the arrow-direction diagram distinction — this contrast is THE central concept examiners test for 3.2.",
 mistakes:"Don't say MEMM 'replaces HMM' — MEMM specifically ADDRESSES HMM's limited-features issue by allowing arbitrary overlapping features (not just word|tag and tag|tag), which HMM's independence assumptions can't support."
},
{id:"m3t10", topic:"3.2", marks:5, priority:"medium", flashcard:false,
 q:"What feature templates does a basic MEMM POS tagger use, conditioning on what information?",
 a:"An MEMM conditions on the observation word itself, neighboring words, and previous tags (and combinations thereof). Feature templates: ⟨tᵢ,wᵢ₋₂⟩, ⟨tᵢ,wᵢ₋₁⟩, ⟨tᵢ,wᵢ⟩, ⟨tᵢ,wᵢ₊₁⟩, ⟨tᵢ,wᵢ₊₂⟩ (word-context features), ⟨tᵢ,tᵢ₋₁⟩, ⟨tᵢ,tᵢ₋₂,tᵢ₋₁⟩ (tag-history features), and combined features like ⟨tᵢ,tᵢ₋₁,wᵢ⟩, ⟨tᵢ,wᵢ₋₁,wᵢ⟩, ⟨tᵢ,wᵢ,wᵢ₊₁⟩.",
 examAnswer:"List the feature template categories (word-context / tag-history / combined) with at least 2-3 example templates each — being asked to 'instantiate features for a specific word' means substituting the actual sentence's words/tags into these templates.",
 mistakes:"Don't limit features to just the current word — the whole point of MEMM (vs. HMM) is that it can use ARBITRARY overlapping context (neighboring words AND tags simultaneously), which is impossible in a standard HMM."
},
{id:"m3t11", topic:"3.2", marks:5, priority:"high", flashcard:true,
 q:"Give the MaxEnt (log-linear) classifier formula and explain how it combines features.",
 a:"MaxEnt belongs to the family of exponential/log-linear classifiers: p(c|x) = (1/Z)·exp(Σᵢ wᵢfᵢ) — it extracts a set of binary features from the input, combines them LINEARLY (each feature multiplied by its learned weight, then summed), and uses this sum as an exponent, normalized by Z (a normalizing constant ensuring probabilities sum to 1). Example features for tagging: 'this word ends in -ed', 'the previous word was an adverb'.",
 examAnswer:"Write the formula exactly (p(c|x)=(1/Z)exp(Σwᵢfᵢ)) and explain each symbol (fᵢ=binary feature, wᵢ=learned weight, Z=normalizer) — be ready to apply this formula in a beam-search numerical (see Module 3 Numericals: MEMM Beam Search).",
 mistakes:"Don't forget the exponential — MaxEnt is NOT simply a weighted sum classifier; the weighted sum becomes an EXPONENT, which is what makes probabilities always positive and enables the softmax-like normalization."
},
{id:"m3t12", topic:"3.2", marks:3, priority:"medium", flashcard:true,
 q:"What is a Conditional Random Field (CRF)? Give the standard formula and name one advantage over MEMM. [Note: the professor's slides only covered feature functions and training steps, not the CRF probability formula itself — this answer is supplemented from standard NLP textbook material.]",
 a:"A CRF models the conditional probability of an entire label sequence Y given the observation sequence X directly: P(Y|X) = (1/Z(X))·exp(Σᵢ Σⱼ λⱼfⱼ(yᵢ₋₁,yᵢ,X,i)), where fⱼ are feature functions (e.g. f₁=1 if the current label is ADVERB and the word ends in '-ly'; f₂=1 if the previous label is ADJECTIVE and the current label is NOUN), λⱼ are learned weights, and Z(X) normalizes over ALL possible label sequences for X (not just word-by-word, avoiding MEMM's 'label bias problem' where MEMM's per-position local normalization can favor states with fewer outgoing transitions regardless of observation evidence).",
 examAnswer:"Give the formula, define feature functions with the 2 example feature functions from the syllabus (ends-in-ly→ADVERB; ADJECTIVE→NOUN transition), and name the label bias problem as CRF's key advantage over MEMM.",
 mistakes:"Don't confuse CRF's GLOBAL normalization (over the whole sequence via Z(X)) with MEMM's LOCAL per-position normalization — this difference is exactly what fixes the label bias problem."
},
{id:"m3t13", topic:"3.2", marks:3, priority:"medium", flashcard:false,
 q:"What are the 3 steps of 'working with a CRF' (the training procedure)?",
 a:"Step 1: Take tagged corpora, extract each sentence, and for each word fill a table of features (identifying the associated tag). Step 2: Divide records into training and testing data — the feature set for each word becomes the X vector of attributes, and its tag becomes the class Y. Step 3: Use any classifier to train the model on this X→Y mapping, then test it.",
 examAnswer:"3 numbered steps: feature extraction from tagged corpus → train/test split with X=features,Y=tag → train and evaluate a classifier.",
 mistakes:"Don't describe CRF training as fundamentally different from a standard supervised-learning pipeline — the professor's own framing casts it exactly as feature-extraction + train/test split + classifier training, like any other ML task."
},
{id:"m3t14", topic:"3.2", marks:3, priority:"medium", flashcard:true,
 q:"What is BiLSTM-CRF, and why combine a BiLSTM with a CRF layer for sequence labeling? [Note: entirely absent from the professor's slides — supplemented from standard NLP literature.]",
 a:"A BiLSTM-CRF combines a Bidirectional LSTM (which reads the sentence left-to-right AND right-to-left, producing a context-aware vector representation for each word) with a CRF output layer (which models dependencies BETWEEN adjacent output labels, e.g. enforcing that an 'I-PER' tag cannot follow an 'O' tag in BIO-tagging schemes). The BiLSTM alone would predict each word's label independently given its context vector, ignoring label-sequence constraints; the CRF layer on top fixes this by jointly scoring the whole label sequence, capturing both rich neural context (from the BiLSTM) and structured label transitions (from the CRF) — a widely-used architecture for NER and POS tagging before pure transformer-based taggers became dominant.",
 examAnswer:"Explain BOTH halves separately (BiLSTM=context-aware word representations; CRF=structured label-sequence scoring) then explain WHY combining them helps (neural context + valid label transitions) — this 2-part explanation is what a full-marks answer needs.",
 mistakes:"Don't describe BiLSTM-CRF as 'just an LSTM with more layers' — the CRF component is doing something qualitatively different (sequence-level label scoring), not just adding more neural depth."
},
{id:"m3t15", topic:"3.3", marks:5, priority:"high", flashcard:true,
 q:"Give the formal 4-tuple definition of a Context-Free Grammar (CFG).",
 a:"A CFG is defined by 4 parameters: N (a set of non-terminal symbols/variables), Σ or T (a set of terminal symbols, disjoint from N), R (a set of production rules of the form A→β, where A is a non-terminal and β is a string of symbols from (Σ∪N)*), and S (a designated start symbol). CFGs are also called Phrase-Structure Grammars, equivalent to Backus-Naur Form (BNF). Terminals correspond to actual words (introduced via the lexicon); non-terminals express clusters/generalizations (e.g. NP, VP). A CFG can be read two ways: as a device for GENERATING sentences (rewrite left symbol with right-hand string), or as a device for ASSIGNING STRUCTURE to a given sentence (parsing).",
 examAnswer:"State the 4-tuple (N,Σ,R,S) with each symbol's meaning, then the terminal-vs-non-terminal distinction, then the 'generator vs structure-assigner' dual reading — all 3 parts are commonly asked together.",
 mistakes:"Don't forget that S is a DESIGNATED non-terminal (a member of N, not separate) — S ∈ N, it's just the special start symbol."
},
{id:"m3t16", topic:"3.3", marks:5, priority:"high", flashcard:true,
 q:"What is a Probabilistic Context-Free Grammar (PCFG)? Give the rule-probability formula and the full-parse probability formula.",
 a:"A PCFG (also called Stochastic CFG/SCFG, Booth 1969) augments each CFG rule with a probability: A→β [p], where p=P(A→β)=P(RHS|LHS). Normalization constraint: for a fixed non-terminal A, Σ_β P(A→β)=1 (all of A's possible expansions must sum to 1). Rule probabilities are estimated from a corpus: P(A→β) = Count(A→β)/Count(A). The probability of an ENTIRE parse tree T is the PRODUCT of all rule probabilities used at every non-terminal node: P(T,S) = ∏ᵢ P(RHSᵢ|LHSᵢ). Since a parse tree includes all words of the sentence, P(S|T)=1, so P(T,S)=P(T)P(S|T)=P(T) — the joint probability of tree-and-sentence equals just the tree's probability.",
 examAnswer:"Give both formulas (rule probability estimation from counts, AND the product-of-all-rules formula for a full parse) plus the P(T,S)=P(T) simplification with its 1-line derivation — this derivation step is often asked separately.",
 mistakes:"Don't forget the normalization constraint (probabilities of ALL of A's rules must sum to 1) — a common numerical trap gives you rule probabilities that DON'T sum to 1, testing whether you notice the inconsistency."
},
{id:"m3t17", topic:"3.3", marks:3, priority:"medium", flashcard:false,
 q:"Why is probabilistic parsing (PCFG) needed — what problem does it solve that plain CFG parsing cannot?",
 a:"Plain CFG parsing can find ALL valid parse trees for an ambiguous sentence but cannot rank them — it has no way to say which parse is more LIKELY/plausible. PCFG solves this by assigning a probability to each complete parse tree (product of the rule probabilities used), so among multiple valid parses, the parser can select the one with the HIGHEST probability as the most likely interpretation — directly addressing the 'parsing ambiguity is explosive' problem (e.g. PP-attachment sentences with Catalan-number-many parses).",
 examAnswer:"State the CFG limitation (can't rank/disambiguate) + PCFG's fix (probability-weighted ranking) + connect to the PP-attachment/Catalan-number ambiguity explosion as the motivating scenario.",
 mistakes:"Don't say PCFG 'reduces the number of parses' — it doesn't eliminate any valid parse, it just RANKS them by probability so the best one can be selected."
},
{id:"m3t18", topic:"3.3", marks:3, priority:"medium", flashcard:false,
 q:"Explain the 'parsing ambiguity is explosive' phenomenon using the telescope/hill/Texas example and Catalan numbers.",
 a:"As prepositional phrases are added to a sentence, the number of valid parse trees grows explosively (following the Catalan number sequence): 'I saw the man with the telescope' → 2 parses. Adding 'on the hill' → 5 parses. Adding 'in Texas' → 14 parses. Adding 'at noon' → 42 parses. Adding 'on Monday' → 132 parses. Each additional PP can attach to multiple different earlier constituents, and these attachment choices combine multiplicatively (not additively) as more PPs are added — the professor's own term for this growth pattern is 'Catalan number'.",
 examAnswer:"Reproduce the exact sequence (2,5,14,42,132 parses for 1,2,3,4,5 PPs) and name it as following Catalan-number growth — the numbers themselves are a favorite fact-recall/short-answer target.",
 mistakes:"Don't say the ambiguity grows 'linearly' with each added phrase — it grows combinatorially (each new PP can attach almost anywhere already-established structure allows), which is precisely why it's called 'explosive'."
},
{id:"m3t19", topic:"3.4", marks:5, priority:"high", flashcard:true,
 q:"Distinguish Top-Down parsing from Bottom-Up parsing.",
 a:"Top-Down (goal-directed search): starts from the start symbol S and expands downward using grammar rules until reaching POS categories/words at the leaves — 'searches for a parse tree by trying to build upon the root node S down to the leaf nodes'. Bottom-Up (data-directed search): starts with the actual input words and builds UPWARD by applying grammar rules, looking for places where a rule's right-hand-side matches the parse-in-progress, combining pieces into higher-level structures until reaching S.",
 examAnswer:"1-line definition of each with the direction stated explicitly (S→words vs words→S), then name one algorithm of each type (Top-down: Predictive/Earley; Bottom-up: Shift-Reduce/CKY).",
 mistakes:"Don't describe these as 'the same algorithm run in different orders' — they explore fundamentally different search spaces and hit different kinds of dead-ends (top-down can generate structures that don't match the actual words; bottom-up can build local structures that never combine into a full S)."
},
{id:"m3t20", topic:"3.4", marks:3, priority:"medium", flashcard:false,
 q:"What are the 4 general parsing challenges named by the professor?",
 a:"Ambiguity (multiple valid parses for the same sentence), Repeated substructure (the same sub-phrase can be re-derived redundantly without caching), Recursion (grammar rules can recurse, e.g. Nominal→Nominal Noun, requiring care to avoid infinite loops), and Space and time complexity (naive parsing can be exponential; this motivates dynamic-programming approaches like CKY and Earley, which achieve O(n³) time).",
 examAnswer:"Name all 4 challenges — Ambiguity/Repeated substructure/Recursion/Space-time complexity — and connect 'repeated substructure' + 'space-time complexity' directly to why dynamic programming (caching/memoization) is the standard solution.",
 mistakes:"Don't conflate Ambiguity with Recursion — ambiguity is about MULTIPLE valid interpretations; recursion is about a grammar rule referencing itself (directly or indirectly), a structural property of the grammar itself."
},
{id:"m3t21", topic:"3.4", marks:5, priority:"high", flashcard:true,
 q:"Define the Earley Parser and its 3 types of chart entries.",
 a:"The Earley parser is a top-down parser that uses a dynamic programming table, similar to CKY — but unlike CKY it does NOT require the grammar to be in Chomsky Normal Form. Chart entries use 'dotted rules' like [0:1] VP→VP.PP, where the dot separates the completed (known) part of the rule from the incomplete (not yet attempted) part, and the bracketed numbers give the word-span covered so far. Three entry types: Scan (for consuming an actual word, advancing the dot past a terminal), Predict (for expanding a non-terminal, adding new dotted rules for its possible expansions), Complete (when a rule's dot has reached the end, advancing the dot in any rule waiting for that completed non-terminal).",
 examAnswer:"Define the dotted-rule notation precisely (dot = boundary between known/unknown), name all 3 entry types with what each does, and note the key CKY-difference (no CNF requirement) — this last point is commonly tested as a comparison question.",
 mistakes:"Don't say Earley requires CNF like CKY does — this is the single most commonly confused fact between the two dynamic-programming parsers."
},
{id:"m3t22", topic:"3.4", marks:5, priority:"high", flashcard:true,
 q:"Describe the Shift-Reduce parsing procedure and its 4 steps.",
 a:"Shift-Reduce is a bottom-up parser using a stack. Steps: Initialize (empty stack, full input string). Shift (push the next input symbol onto the stack). Reduce (if the top-of-stack symbols match a production rule's RHS, replace them with the rule's LHS non-terminal). Repeat until the input is fully consumed AND the stack contains exactly the start symbol (success) — if no valid shift/reduce sequence completes the parse, the parser must BACKTRACK to try a different reduction choice at an earlier decision point.",
 examAnswer:"Name all 4 steps (Init/Shift/Reduce/Repeat-until-success) and explicitly mention backtracking is needed when a reduction choice leads to a dead end — the professor's own worked example ('book that flight') explicitly flags a 'Choice #1 of 2' backtracking point.",
 mistakes:"Don't forget Shift-Reduce does NOT require CNF (unlike CKY) — but it DOES need backtracking support, which CKY (being exhaustive/dynamic-programming) does not."
},
{id:"m3t23", topic:"3.4", marks:5, priority:"high", flashcard:true,
 q:"What is the CKY (Cocke-Kasami-Younger) algorithm? What grammar form does it require, and why?",
 a:"CKY is a bottom-up, dynamic-programming parsing algorithm requiring the grammar to be in Chomsky Normal Form (CNF) — every rule must be of the form A→BC (exactly 2 non-terminals) or A→a (a single terminal). This restriction is needed because CKY's core operation is testing whether a word-span can be SPLIT INTO EXACTLY TWO smaller spans, each independently derivable — a binary-branching assumption that CNF guarantees. CKY builds a chart where cell [i,j] holds all non-terminals that can derive the words spanning positions i to j, filled bottom-up (shorter spans first). It generates multiple parse trees when the sentence is genuinely ambiguous (a cell can validly contain more than one non-terminal reading).",
 examAnswer:"Define CKY, state the CNF requirement with the A→BC | A→a form explicitly, and explain WHY (binary splitting needs guaranteed 2-way branching) — the 'why CNF' reasoning is what separates rote memorization from real understanding here.",
 mistakes:"Don't forget any CFG not generating the empty string CAN be converted to CNF — CNF is not a limitation on which LANGUAGES can be parsed, only on the RULE FORM, and conversion is always possible via a systematic procedure."
},
{id:"m3t24", topic:"3.4", marks:5, priority:"medium", flashcard:false,
 q:"List the 4-step procedure for converting a CFG into Chomsky Normal Form (CNF).",
 a:"1. Copy all rules that already conform to CNF (A→BC or A→a) unchanged into the new grammar. 2. Convert terminals appearing WITHIN longer rules to dummy non-terminals (e.g. NP→The Nominal becomes NP→Det Nominal plus a new rule Det→The). 3. Convert unit-productions (rules like A→B with only one non-terminal on the right) by substitution. 4. Binarize all remaining rules with more than 2 symbols on the right-hand side, introducing dummy non-terminals as needed (e.g. NP→Det Noun PP becomes Nominal→Noun PP plus NP→Det Nominal).",
 examAnswer:"Name all 4 steps in order and be ready to apply steps 2 and 4 to a small given rule (e.g. convert 'NP → Det Noun PP' to CNF) — this is the most commonly tested application of this procedure.",
 mistakes:"Don't skip unit-production elimination (step 3) — a rule like 'NP → Nominal' (a single non-terminal) is NOT in CNF form (A→BC needs exactly 2 symbols, A→a needs exactly 1 terminal) and must be resolved by substitution before binarization."
},
{id:"m3t25", topic:"3.4", marks:3, priority:"medium", flashcard:true,
 q:"Distinguish Dependency Parsing from Constituency Parsing.",
 a:"Constituency parsing focuses on grouping words into nested PHRASES (constituents like NP, VP), building a TREE with S at the root and internal nodes for each phrase type. Dependency parsing focuses on the head-dependent RELATIONS between individual words directly (e.g. nsubj, obj, det), building a tree/graph where the ROOT is the main verb, not an abstract S symbol. Example ('The boy ate an apple'): Constituency = S→NP(Det:the,N:boy)+VP(V:ate,NP(Det:an,N:apple)). Dependency = ate=ROOT; boy→nsubj(ate); apple→obj(ate); the→det(boy); an→det(apple).",
 examAnswer:"A 4-row comparison table (Focus | Structure | Example | Root) exactly as the professor's slide presents it — Constituency's root is 'S'; Dependency's root is the MAIN VERB, this contrast is the most commonly tested single fact.",
 mistakes:"Don't say dependency parsing has 'no structure' just because it lacks phrase nodes — it has its own well-defined structure (a labeled directed graph/tree of head-dependent arcs), just a different KIND of structure than constituency trees."
},
{id:"m3t26", topic:"3.5", marks:3, priority:"medium", flashcard:true,
 q:"What is a Recurrent Neural Network (RNN), and why is it suited to sequence data like language? [Note: entirely absent from the professor's slides — supplemented from standard NLP/deep learning material, since the syllabus explicitly requires it.]",
 a:"An RNN processes a sequence one element at a time, maintaining a HIDDEN STATE vector that is updated at each step: hₜ = f(Wₓhₓₜ + Wₕₕhₜ₋₁ + b), combining the current input xₜ with the previous hidden state hₜ₋₁. This hidden state acts as a compressed 'memory' of everything seen so far in the sequence, letting the network's prediction at each step depend on prior context — unlike a plain feedforward network, which has no notion of order or memory across positions. RNNs are naturally suited to language because sentences are inherently sequential (word order matters), and the same weights are reused (shared) at every timestep, so the model can generalize to sequences of any length.",
 examAnswer:"Give the recurrence formula, define the hidden state as the sequential 'memory', and state why weight-sharing across timesteps lets RNNs handle variable-length sequences — these 3 points cover the standard definition question.",
 mistakes:"Don't describe an RNN as 'just multiple copies of the same feedforward network' without mentioning the hidden-state connection BETWEEN timesteps — that recurrent connection carrying information forward is the defining feature."
},
{id:"m3t27", topic:"3.5", marks:5, priority:"high", flashcard:true,
 q:"What problem do plain RNNs suffer from, and how does LSTM solve it? [Supplemented from standard textbook material.]",
 a:"Plain RNNs suffer from the VANISHING (and exploding) GRADIENT problem — when back-propagating errors through many timesteps, gradients can shrink exponentially, making it very hard for the network to learn LONG-DISTANCE dependencies (e.g. connecting a verb to its subject many words earlier). LSTM (Long Short-Term Memory) solves this with a more complex cell containing a separate CELL STATE (a 'memory highway' that information can flow through largely unchanged) plus 3 gates: Forget gate (decides what to discard from the cell state), Input gate (decides what new information to add), Output gate (decides what to output as the hidden state). These gates are learned, sigmoid-activated vectors that control information flow, allowing gradients to flow through many timesteps without vanishing.",
 examAnswer:"Name the vanishing gradient problem explicitly as the motivation, then name all 3 LSTM gates (Forget/Input/Output) with what each controls, and mention the separate cell-state 'highway' concept.",
 mistakes:"Don't say LSTM 'has no gradient problems at all' — it substantially MITIGATES vanishing gradients over long sequences compared to plain RNNs, but doesn't eliminate the issue for extremely long sequences (which is part of the motivation for attention/transformers)."
},
{id:"m3t28", topic:"3.5", marks:3, priority:"medium", flashcard:true,
 q:"What is a GRU (Gated Recurrent Unit), and how does it compare to LSTM? [Supplemented from standard textbook material.]",
 a:"A GRU is a simplified alternative to LSTM using only 2 gates instead of 3: a Reset gate (controls how much past information to forget when computing a new candidate hidden state) and an Update gate (controls how much of the previous hidden state to keep versus replace with the new candidate). GRUs merge the LSTM's separate cell-state and hidden-state into a single hidden state. Comparison: GRUs have fewer parameters (faster to train, less prone to overfitting on smaller datasets) and often perform comparably to LSTM, but LSTM's extra cell-state/gate structure can capture more complex long-range dependencies on larger datasets.",
 examAnswer:"Name both gates (Reset/Update), state the key structural simplification (single hidden state, no separate cell state), and give the practical trade-off (fewer parameters/faster vs. LSTM's extra capacity).",
 mistakes:"Don't say GRU has MORE gates than LSTM — it's the opposite: GRU (2 gates) is a SIMPLIFICATION of LSTM (3 gates), not an extension."
},
{id:"m3t29", topic:"3.5", marks:5, priority:"high", flashcard:true,
 q:"What is the Attention Mechanism? Give the Query/Key/Value framing and explain why it improved on plain RNN/LSTM sequence models. [Supplemented from standard textbook material.]",
 a:"Attention lets a model, at each output step, look back at ALL positions of the input sequence and assign a learned WEIGHT (how much to 'attend to' each input position) rather than relying on a single fixed-size hidden state to carry all information. Framed as Query/Key/Value: a Query vector (representing what we're looking for at this step) is compared against Key vectors (one per input position) via a similarity function (e.g. dot product), producing attention scores that are normalized (softmax) into weights; these weights combine the Value vectors (one per input position) into a weighted-sum context vector. This solves the RNN/LSTM bottleneck where a single fixed-size hidden state had to compress an ENTIRE long sequence's information, losing detail for long inputs — attention lets the model access any earlier position directly, regardless of distance.",
 examAnswer:"Define attention as a weighted combination over input positions, give the Query/Key/Value roles explicitly, and state the specific problem it fixes (fixed-size hidden-state bottleneck for long sequences).",
 mistakes:"Don't describe attention as 'just another type of RNN layer' — attention weights are computed FRESH at every step based on content similarity (Query·Key), not passed sequentially through a recurrent hidden state."
},
{id:"m3t30", topic:"3.5", marks:5, priority:"high", flashcard:true,
 q:"What is the Transformer architecture, and how does Self-Attention differ from the attention used in RNN-based models? [Supplemented from standard textbook material.]",
 a:"The Transformer is a sequence model built ENTIRELY on attention (no recurrence at all) — it processes all sequence positions in PARALLEL rather than one-at-a-time like an RNN, using Self-Attention: each position computes attention over ALL OTHER positions in the SAME sequence (not a separate encoder sequence), letting every word's representation be informed directly by every other word regardless of distance. Multi-Head Attention runs several attention computations in parallel with different learned projections, capturing different types of relationships simultaneously. Since there's no recurrence, Positional Encoding is added to give the model information about word ORDER (otherwise attention alone is order-agnostic). Encoder-Decoder stacks of these self-attention + feedforward layers form the full architecture (as used in models like BERT — encoder-only — and GPT — decoder-only).",
 examAnswer:"Define self-attention (every position attends to every other position in the SAME sequence) + name multi-head attention and positional encoding as the 2 key supporting mechanisms + state the key advantage (full parallelization, no recurrence, unlimited effective 'memory' range).",
 mistakes:"Don't confuse Self-Attention with the encoder-decoder cross-attention used in translation-style attention — self-attention specifically means a sequence attending to ITSELF, which is what enables Transformers to drop recurrence entirely."
},
{id:"m3t31", topic:"Self-Learning", marks:5, priority:"medium", flashcard:true,
 q:"What are BERT and GPT, and how do they differ in architecture and training objective? [Supplemented from standard textbook material — entirely absent from professor's slides.]",
 a:"BERT (Bidirectional Encoder Representations from Transformers) uses ONLY the Transformer ENCODER stack, trained with Masked Language Modeling (randomly mask some input words, predict them using BOTH left AND right context — bidirectional) plus Next Sentence Prediction. This makes BERT excel at UNDERSTANDING tasks (classification, NER, QA) since it sees full bidirectional context, but it's not naturally suited to text GENERATION. GPT (Generative Pre-trained Transformer) uses ONLY the Transformer DECODER stack, trained with standard (unidirectional, left-to-right) Language Modeling — predict the next word given only PRECEDING context. This makes GPT naturally suited to text GENERATION (it can be run autoregressively, feeding each generated word back in) but it cannot use future context the way BERT can.",
 examAnswer:"State the architecture difference (encoder-only vs decoder-only), the training-objective difference (masked bidirectional LM vs. standard unidirectional/causal LM), and the resulting task-suitability difference (understanding vs. generation) — all 3 axes are typically expected together.",
 mistakes:"Don't say 'BERT generates text' or 'GPT can't understand context' — BERT CAN be adapted for some generation with modification, and GPT DOES use rich context, just only from one direction (left-to-right, not bidirectional)."
},
];

  {id:"m3n1p1", difficulty:"easy", q:"In a corpus, tag NN appears 40 times total, and the word 'dog' is tagged NN 6 times. Find P(dog|NN).", answer:"P(dog|NN) = 6/40 = 0.15"},
  {id:"m3n1p2", difficulty:"easy", q:"Tag VB appears 25 times; it is followed by tag NN 10 times. Find P(NN|VB).", answer:"P(NN|VB) = 10/25 = 0.4"},
  {id:"m3n1p3", difficulty:"easy", q:"Out of 50 sentences, 30 start with tag DET. Find π(DET).", answer:"π(DET) = 30/50 = 0.6"},
  {id:"m3n1p4", difficulty:"basic", q:"Corpus: <s> Martin/N Justin/N can/M watch/V Will/N </s> <s> Spot/N will/M watch/V Martin/N </s>. Find P(watch|V).", answer:"count(V)=2 (both 'watch' occurrences are V), count('watch' as V)=2 → P(watch|V)=2/2=1.0"},
  {id:"m3n1p5", difficulty:"basic", q:"Same corpus. Find P(N|M) (transition from Modal to Noun).", answer:"M appears twice (can, will), both followed by V (watch), never directly by N → P(N|M)=0/2=0"},
  {id:"m3n1p6", difficulty:"basic", q:"Same corpus. Find P(M|N) (transition from Noun to Modal).", answer:"N appears as: Martin(→Justin,N), Justin(→can,M), Will(→end), Spot(→will,M), Martin(→end, at sentence 2 end). Count(N)=5 total N-tag occurrences with a following tag counted where applicable: Justin→can(M) and Spot→will(M) are 2 N→M transitions out of the N occurrences that have a following word (Martin→Justin(N→N) is another). So count(N→M)=2, count(N total, excluding sentence-final)=~4 applicable → P(M|N)≈2/4=0.5 (exact value depends on precisely which N tokens have a following tag; this illustrates the counting process)."},
  {id:"m3n1p7", difficulty:"moderate", q:"A 4-sentence corpus has tag counts: DET=8, N=10, V=6, Prep=2. DET is followed by N six times, and by nothing else observed. Compute P(N|DET) and explain what P(V|DET) would be under raw MLE.", answer:"P(N|DET)=6/8=0.75. P(V|DET)=0/8=0 under raw MLE (never observed) — this zero would need smoothing (Laplace/Good-Turing, Module 2) before being used in real HMM decoding, since a true 0 would make any tag sequence containing 'DET immediately followed by V' impossible regardless of other evidence."},
  {id:"m3n1p8", difficulty:"moderate", q:"In a corpus, word 'flies' is tagged NN 3 times and VB 7 times (total 'flies' occurrences=10). Tag NN occurs 50 times total in the corpus; tag VB occurs 30 times total. Compute P(flies|NN) and P(flies|VB), and state which tag is more strongly ASSOCIATED with 'flies' by these emission probabilities.", answer:"P(flies|NN)=3/50=0.06. P(flies|VB)=7/30≈0.233. Even though 'flies' appears more as VB in absolute terms (7 vs 3), the emission PROBABILITY comparison (0.06 vs 0.233) also favors VB — 'flies' is more strongly associated with VB under this emission model."},
  {id:"m3n1p9", difficulty:"moderate", q:"A corpus has 100 sentences; 60 begin with DET, 25 begin with PRP (pronoun), 15 begin with other tags. Compute π(DET) and π(PRP), and verify they are consistent with a valid probability distribution over sentence-initial tags (i.e., do all π values sum to 1 given the 3rd category)?", answer:"π(DET)=60/100=0.6. π(PRP)=25/100=0.25. Remaining 'other tags' π=15/100=0.15. Sum=0.6+0.25+0.15=1.0 ✓ — consistent, confirming these are valid initial-state probabilities partitioning all 100 sentences."},
  {id:"m3n1p10", difficulty:"difficult", q:"Using the 'hot lead cold feet' HMM (from the professor's slides): JJ→JJ(self)=0.1, JJ→NN=0.8, JJ→</s>=0.1 (sums to 1.0 for JJ's outgoing transitions). If a 4th transition JJ→VB were added with probability 0.05, what MUST happen to the other three JJ-outgoing probabilities, and why?", answer:"The other three probabilities MUST be reduced so the total (including the new 0.05 for JJ→VB) still sums to exactly 1.0 — e.g. if proportionally reduced, the new values would need to satisfy JJ→JJ + JJ→NN + JJ→</s> + JJ→VB = 1.0, i.e. the original 3 values (0.1+0.8+0.1=1.0) must together shrink to 0.95 to leave room for the new 0.05. This is because transition probabilities from any single state must form a valid probability distribution (sum to 1) over ALL possible next states/transitions from that state."},
  {id:"m3n1p11", difficulty:"difficult", q:"A corpus tags 'well' as RB (adverb) 8 times and as JJ (adjective) 2 times, out of tag totals RB=200 and JJ=50. A second word 'fast' is tagged RB 5 times and JJ 15 times, same tag totals. Compute all 4 emission probabilities and determine which word is more tag-AMBIGUOUS in terms of how close its two emission probabilities are to being tied.", answer:"P(well|RB)=8/200=0.04, P(well|JJ)=2/50=0.04 — EXACTLY tied (both 0.04)! P(fast|RB)=5/200=0.025, P(fast|JJ)=15/50=0.30 — very different (0.30 much larger). 'well' is far MORE ambiguous by this measure, since its two emission probabilities are identical, giving Viterbi no emission-based preference between RB and JJ for 'well' (the decision would then rest entirely on transition-probability context); 'fast' is much less ambiguous since JJ is clearly favored."},
  {id:"m3n1p12", difficulty:"exam-level", q:"Explain why the SAME raw count (e.g. count(word,tag)=4) can correspond to very different emission PROBABILITIES depending on the tag's total corpus frequency, using two tags with counts 4/20 and 4/400 for the same raw joint count.", answer:"P=count(word,tag)/count(tag). With count(tag)=20: P=4/20=0.20 (fairly strong association — this word accounts for 20% of ALL occurrences of that tag). With count(tag)=400: P=4/400=0.01 (weak association — this word is a tiny fraction of that (much more common) tag's occurrences). This shows emission probability is NOT just about the raw joint count — it's normalized by how common the TAG itself is, so the same absolute count can mean 'strongly characteristic' for a rare tag or 'barely relevant' for a very common tag."},
  {id:"m3n1p13", difficulty:"challenge", q:"Design a scenario (with made-up but internally consistent counts) where a word's HIGHEST emission probability tag is NOT the tag that would be chosen by the full Viterbi decoding for a specific sentence. Explain why this can happen.", answer:"Example: word 'back' has P(back|NN)=0.5 (highest emission) but P(back|VB)=0.3. In the sentence '...will back...', the TRANSITION probability P(VB|MD)=0.9 (modals are almost always followed by a base verb) while P(NN|MD)=0.05 (modals are rarely followed directly by a noun). Viterbi multiplies emission × transition × prior-path-probability at each step — even though NN has the higher STANDALONE emission probability for 'back', the much higher TRANSITION probability favoring VB after a modal can make the VB path's overall product LARGER, so Viterbi correctly selects VB despite NN 'winning' on emission probability alone. This illustrates why Viterbi considers the FULL joint probability (transition × emission along the whole path), not just any single factor in isolation."}
 ]
},
{
 id:"m3n2", title:"Viterbi Algorithm — Trellis Computation", topic:"3.1 POS Tagging (Viterbi)",
 concept:"Given an HMM's emission (B) and transition (A) matrices plus initial probabilities (π), the Viterbi algorithm finds the SINGLE most probable tag sequence for an observed word sequence, using dynamic programming instead of checking every possible tag combination.",
 formula:"Initialization: viterbi[s,1] = π(s) × B(s, o₁)\nRecursion: viterbi[s,t] = maxₛ' [ viterbi[s',t-1] × A(s',s) × B(s,oₜ) ], with backpointer[s,t] = argmaxₛ' of the same expression\nTermination: bestpathprob = maxₛ viterbi[s,T]; trace back via backpointers for the full tag sequence.",
 workedExample:{
  title:"Run Viterbi on 'Test passed' with states NN, VB",
  steps:[
   "Given: π(NN)=0.9, π(VB)=0.1. Emission: P(test|NN)=0.9, P(test|VB)=0.1, P(passed|NN)=0.08, P(passed|VB)=0.92. Transition: A(NN,NN)=0.05, A(NN,VB)=0.90, A(VB,NN)=0.45, A(VB,VB)=0.50.",
   "Step 1 — Initialization (word 'Test', t=1): viterbi[NN,1] = π(NN)×P(test|NN) = 0.9×0.9 = 0.81. viterbi[VB,1] = π(VB)×P(test|VB) = 0.1×0.1 = 0.01.",
   "Step 2 — Recursion (word 'passed', t=2), compute viterbi[NN,2]: candidates from NN: 0.81×A(NN,NN)×P(passed|NN) = 0.81×0.05×0.08 = 0.00324. From VB: 0.01×A(VB,NN)×P(passed|NN) = 0.01×0.45×0.08 = 0.00036. Max = 0.00324 (from NN) → viterbi[NN,2]=0.00324, backpointer=NN.",
   "Step 3 — Recursion, compute viterbi[VB,2]: from NN: 0.81×A(NN,VB)×P(passed|VB) = 0.81×0.90×0.92 = 0.6708. From VB: 0.01×A(VB,VB)×P(passed|VB) = 0.01×0.50×0.92 = 0.0046. Max = 0.6708 (from NN) → viterbi[VB,2]=0.6708, backpointer=NN.",
   "Step 4 — Termination: compare viterbi[NN,2]=0.00324 vs viterbi[VB,2]=0.6708 → best final state = VB (0.6708 is larger).",
   "Step 5 — Trace back: t=2 state=VB, backpointer says t=1 state=NN. So the best tag sequence is Test/NN, passed/VB, with path probability 0.6708 — matching the intuitive correct tagging (Test is a noun, passed is a verb here)."
  ]
 },

  {id:"m3n2p1", difficulty:"easy", q:"π(NN)=0.7, P(word1|NN)=0.6. Compute viterbi[NN,1].", answer:"viterbi[NN,1] = 0.7×0.6 = 0.42"},
  {id:"m3n2p2", difficulty:"easy", q:"π(VB)=0.3, P(word1|VB)=0.5. Compute viterbi[VB,1].", answer:"viterbi[VB,1] = 0.3×0.5 = 0.15"},
  {id:"m3n2p3", difficulty:"easy", q:"viterbi[NN,1]=0.4, A(NN,VB)=0.6, P(word2|VB)=0.5. This is the ONLY incoming path to VB at t=2. Compute viterbi[VB,2].", answer:"viterbi[VB,2] = 0.4×0.6×0.5 = 0.12"},
  {id:"m3n2p4", difficulty:"basic", q:"At t=2, two candidate paths into state NN: from NN(prev)=0.5×A(NN,NN)=0.2×P(word2|NN)=0.3, giving 0.5×0.2×0.3=0.03; from VB(prev)=0.2×A(VB,NN)=0.7×P(word2|NN)=0.3, giving 0.2×0.7×0.3=0.042. Which path wins, and what is viterbi[NN,2]?", answer:"The VB-origin path wins (0.042 > 0.03). viterbi[NN,2]=0.042, backpointer=VB."},
  {id:"m3n2p5", difficulty:"basic", q:"Using the 'hot lead cold feet' HMM setup (π(JJ)=0.7, π(NN)=0.25; P(hot|JJ)=0.4, P(hot|NN)=0.01), compute viterbi[JJ,1] and viterbi[NN,1] for the word 'hot'.", answer:"viterbi[JJ,1] = 0.7×0.4 = 0.28. viterbi[NN,1] = 0.25×0.01 = 0.0025"},
  {id:"m3n2p6", difficulty:"moderate", q:"Continuing the hot-lead HMM: viterbi[JJ,1]=0.28, viterbi[NN,1]=0.0025. Transitions: A(JJ,JJ)=0.1, A(JJ,NN)=0.8, A(NN,JJ)=0.45, A(NN,NN)=0.15. Emissions for 'lead': P(lead|JJ)=0.1, P(lead|NN)=0.55. Compute viterbi[NN,2] (both candidate paths).", answer:"From JJ: 0.28×A(JJ,NN)×P(lead|NN) = 0.28×0.8×0.55 = 0.1232. From NN: 0.0025×A(NN,NN)×P(lead|NN) = 0.0025×0.15×0.55 ≈ 0.000206. Max = 0.1232 (from JJ) → viterbi[NN,2]=0.1232, backpointer=JJ."},
  {id:"m3n2p7", difficulty:"moderate", q:"Same setup, compute viterbi[JJ,2] for 'lead' (emission P(lead|JJ)=0.1).", answer:"From JJ: 0.28×A(JJ,JJ)×P(lead|JJ) = 0.28×0.1×0.1 = 0.0028. From NN: 0.0025×A(NN,JJ)×P(lead|JJ) = 0.0025×0.45×0.1 ≈ 0.0001125. Max = 0.0028 (from JJ) → viterbi[JJ,2]=0.0028, backpointer=JJ."},
  {id:"m3n2p8", difficulty:"moderate", q:"After computing viterbi[JJ,2]=0.0028 and viterbi[NN,2]=0.1232 for the word 'lead', which tag does Viterbi currently favor for 'lead' at this point in the sequence, and does this match real-world usage of 'lead' (as in 'hot lead' meaning molten metal)?", answer:"Viterbi favors NN (0.1232 >> 0.0028) for 'lead' at this point. This matches real usage: in 'hot lead', 'lead' is the metal (a noun), not the verb 'to lead' — the model correctly identifies this given the JJ→NN transition being strongly favored (0.8) after an adjective like 'hot'."},
  {id:"m3n2p9", difficulty:"difficult", q:"For a 3-word sequence, viterbi[JJ,2]=0.05 and viterbi[NN,2]=0.12. For word 3 ('cold'), P(cold|JJ)=0.45, P(cold|NN)=0.02, with A(JJ,JJ)=0.1, A(NN,JJ)=0.45, A(JJ,NN)=0.8, A(NN,NN)=0.15. Compute viterbi[JJ,3] and viterbi[NN,3], and identify the best path INTO each.", answer:"viterbi[JJ,3]: from JJ: 0.05×0.1×0.45=0.00225; from NN: 0.12×0.45×0.45=0.0243. Max=0.0243 (from NN), backpointer=NN. viterbi[NN,3]: from JJ: 0.05×0.8×0.02=0.0008; from NN: 0.12×0.15×0.02=0.00036. Max=0.0008 (from JJ), backpointer=JJ."},
  {id:"m3n2p10", difficulty:"difficult", q:"Continuing the previous question with viterbi[JJ,3]=0.0243 (backpointer NN) and viterbi[NN,3]=0.0008 (backpointer JJ): if word 3 is the LAST word, what is the final best path probability and what does the FULL backtrace (all 3 tags) look like, given viterbi[NN,2]=0.12 had backpointer JJ at position 2 (from the earlier sub-question), and viterbi[JJ,1] was the initial best at position 1?", answer:"Final best = max(0.0243, 0.0008) = 0.0243, ending in state JJ at position 3. Backtrace: position 3 = JJ (backpointer says came from NN at position 2); position 2 = NN (its own backpointer, established when computing viterbi[NN,2], says it came from JJ at position 1); position 1 = JJ (the initial best state). Full best tag sequence: JJ, NN, JJ — matching 'hot'(JJ), 'lead'(NN), 'cold'(JJ) pattern, i.e. Viterbi correctly threads through the trellis via backpointers even though the LOCAL best-looking state changed at each step."},
  {id:"m3n2p11", difficulty:"exam-level", q:"Explain why Viterbi's time complexity is O(T×N²) where T=sequence length and N=number of states, rather than the exponential O(N^T) of brute-force enumeration.", answer:"Brute-force checks every possible tag sequence: there are N choices for EACH of the T positions, giving N^T total sequences — exponential in T. Viterbi instead computes, at each of the T timesteps, the best path INTO each of the N states by checking N possible predecessor states — that's N×N=N² work per timestep, times T timesteps = O(T×N²), which is LINEAR in T (polynomial overall) instead of exponential. This massive speedup is possible because Viterbi exploits the Markov property: the best path to any state at time t depends only on the best paths to each state at time t-1 (already computed and cached), not on re-deriving the entire history — this is exactly the 'dynamic programming' insight (cache and reuse sub-results) mentioned as motivating the algorithm."},
  {id:"m3n2p12", difficulty:"challenge", q:"A student claims: 'Since Viterbi always picks the locally best-looking transition at each step, it will always find the SAME answer as always picking each word's individually most-frequent tag.' Using the 'lead' example (where NN wins overall despite the transition structure), explain why this claim is FALSE.", answer:"This claim is false because Viterbi's decision at each state depends on the PRODUCT of (best path probability so far) × (transition probability) × (emission probability) — not on emission probability alone, and not on a greedy 'pick the single best next tag' rule independent of the accumulated path. A word's tag choice can be influenced by what tag came before it (via the transition term) even if that tag isn't the word's own most-common tag in isolation. The earlier example showed 'lead' being correctly tagged NN specifically because it followed JJ('hot') with a strong JJ→NN transition (0.8) — if the preceding context had been different, Viterbi could just as validly have favored a different tag for the same word, which a naive 'always pick the most frequent tag for this word' baseline could never do."}
 ]
},
];

 id:"m3n3", title:"MEMM Beam Search (MaxEnt Feature Scoring)", topic:"3.2 MEMM",
 concept:"MEMM tagging scores each candidate tag using a MaxEnt/log-linear formula based on which features are 'on' for that candidate, then multiplies scores across positions while keeping only the top-scoring partial paths at each step (a 'beam') to control the search space, similar in spirit to Viterbi but using arbitrary features instead of fixed emission/transition tables.",
 formula:"p(tag|context) = exp(Σ wᵢfᵢ) / Σ_all_candidate_tags exp(Σ wᵢfᵢ) — a softmax over the candidates that have some feature active, with weight=1 assumed for all active features unless stated otherwise. Combined path probability = p(tag_this_word) × (probability of the path so far). Beam search keeps only the top-K partial paths (K=beam size) after each word, discarding the rest.",
 workedExample:{
  title:"Full beam search for 'The complex record' (Beam Size=2, all feature weights=1)",
  steps:[
   "POS ambiguity: The→{Det,Noun}, complex→{Verb,Adj}, record→{Verb,Noun}. Features are listed for each candidate (see concept notes); assume weight=1 for every active feature.",
   "Step 1 — word 'The': F7 (W_{i+1}=complex, T_i=Det) active for Det; F8 (W_{i-1}=NULL, T_i=Noun) active for Noun. Both have exactly 1 active feature → p(Det|The) = exp(1)/[exp(1)+exp(1)] = 0.5; p(Noun|The) = 0.5.",
   "Step 2 — word 'complex', given The=Det (0.5): complex(Verb) has 0 active features → p(Verb|complex,Det-context) = exp(0)/[exp(0)+3exp(1)] ≈ 0.11 → combined = 0.11×0.5 = 0.055. complex(Adj) has 3 active features (F1,F4,F5) → p(Adj|...) = 3exp(1)/[3exp(1)+exp(0)] ≈ 0.89 → combined = 0.89×0.5 = 0.455.",
   "Step 2 (parallel) — word 'complex', given The=Noun (0.5): complex(Verb) has 1 active feature (F2) → p ≈ exp(1)/[2exp(1)+exp(1)] = 0.33 → combined = 0.33×0.5 = 0.165. complex(Adj) has 2 active features (F4,F5) → p ≈ 2exp(1)/[2exp(1)+exp(1)] = 0.66 → combined = 0.66×0.5 = 0.33.",
