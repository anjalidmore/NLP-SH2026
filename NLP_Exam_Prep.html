 id:"m3n7", title:"Shift-Reduce Parser Trace", topic:"3.4.2 Bottom-Up Parsers (Shift-Reduce)",
 concept:"A Shift-Reduce parser uses a stack and processes input left-to-right, choosing at each step to either SHIFT (push the next input word onto the stack) or REDUCE (if the top of the stack matches a rule's right-hand side, replace it with the rule's left-hand-side non-terminal). If a reduction choice leads to a dead end later, the parser must backtrack to try a different choice.",
 formula:"No formula — trace the stack and remaining input through 4 repeated steps: Initialize (empty stack, full input) → Shift (push next word) → Reduce (if top-of-stack matches a rule RHS, replace with LHS) → Repeat until input is empty AND stack contains only the start symbol (success).",

  steps:[
   "Grammar: S→NP VP | Aux NP VP | VP; NP→Det NOM; NOM→Noun | Noun NOM; VP→Verb | Verb NP. Lexicon: Det→that|this|a|the; Noun→book|flight|meal|man; Verb→book|include|read; Aux→does.",

   "Reduce NOM→Noun: Stack=(Verb, Det, NOM), Input=''.",
   "Reduce NP→Det NOM: Stack=(Verb, NP), Input=''.",
   "Reduce VP→Verb NP: Stack=(VP), Input=''.",

 },
 practice:[
  {id:"m3n7p1", difficulty:"easy", q:"What are the 2 core actions a Shift-Reduce parser alternates between?", answer:"Shift (push next input word onto the stack) and Reduce (replace a matching rule's RHS on the stack top with its LHS)."},
  {id:"m3n7p2", difficulty:"easy", q:"When is a Shift-Reduce parse considered SUCCESSFUL?", answer:"When the input is completely consumed AND the stack contains exactly the start symbol (e.g. just 'S')."},
  {id:"m3n7p3", difficulty:"easy", q:"Grammar: S→aA, A→b. Input='ab'. After Shift,Shift, the stack is (a,b). What reduction applies next?", answer:"Reduce A→b: stack becomes (a,A)"},
  {id:"m3n7p4", difficulty:"basic", q:"Continuing: stack=(a,A), input=''. What single reduction completes the parse?", answer:"Reduce S→aA: stack becomes (S) — input is empty and stack=start symbol → SUCCESS"},
  {id:"m3n7p5", difficulty:"basic", q:"Grammar: NP→Det Noun; Det→the; Noun→dog. Trace the full Shift-Reduce sequence for 'the dog'.", answer:"Shift 'the': stack=(the). Reduce Det→the: stack=(Det). Shift 'dog': stack=(Det,dog). Reduce Noun→dog: stack=(Det,Noun). Reduce NP→Det Noun: stack=(NP) — SUCCESS if NP is the start symbol."},
  {id:"m3n7p6", difficulty:"basic", q:"If, after some shifts, the stack top is (Verb, NP) and a rule VP→Verb NP exists, what reduction applies?", answer:"Reduce VP→Verb NP: the stack top (Verb, NP) is replaced by the single symbol VP."},
  {id:"m3n7p7", difficulty:"moderate", q:"In the 'book that flight' trace, what would happen differently if, at the FIRST reduction step, 'book' were reduced to Noun instead of Verb (the OTHER choice)?", answer:"Stack would become (Noun) instead of (Verb). Then Shift 'that': stack=(Noun,that). But there's no rule combining a bare Noun with a following Det in this grammar (NP requires Det NOM, in THAT order, not Noun-then-Det) — this path would get STUCK (no valid shift or reduce leads anywhere productive), forcing the parser to BACKTRACK to the original choice (reduce 'book' as Verb instead), which is exactly why the professor's slide flags this as 'Choice #1 of 2' — trying Noun first would be the alternate, failing branch."},
  {id:"m3n7p8", difficulty:"moderate", q:"Grammar: VP→Verb NP PP; PP→Prep NP; NP→Det Noun. For input 'saw the man with the telescope' (Verb=saw, Prep=with), after fully building NP='the man' and NP='the telescope' and PP='with the telescope', what's the LAST reduction needed to complete VP?", answer:"Reduce VP→Verb NP PP: combining Verb(saw) + NP(the man) + PP(with the telescope) into a single VP — this requires the stack to have exactly these 3 constituents adjacent at the top before the reduction can fire."},
  {id:"m3n7p9", difficulty:"moderate", q:"Explain why Shift-Reduce parsing does NOT require the grammar to be in Chomsky Normal Form, unlike CKY.", answer:"Shift-Reduce directly matches a rule's ENTIRE right-hand side (however many symbols it has) against the top of the stack — a rule like VP→Verb NP PP (3 symbols) can be reduced in ONE step just as easily as a 2-symbol rule, since the matching process just checks 'do the top N stack symbols equal this rule's N-symbol RHS', with no requirement that N=2. CKY's binary-chart-splitting mechanism specifically needs exactly 2-way splits (hence CNF), while Shift-Reduce has no such structural constraint."},
  {id:"m3n7p10", difficulty:"difficult", q:"A Shift-Reduce parser reaches stack=(NP, Verb, NP) with input=''. Rules available: VP→Verb NP, S→NP VP. Explain the ORDER in which reductions must be applied, and why applying them in the wrong order would fail.", answer:"Must first reduce the RIGHTMOST matching pair: Verb+NP (positions 2-3 of the stack) → VP→Verb NP, giving stack=(NP,VP). THEN reduce NP+VP → S→NP VP, giving stack=(S) — SUCCESS. If you tried to reduce the FIRST NP with the Verb first (treating stack positions 1-2 as if NP+Verb matched some rule), there is no such rule (NP+Verb isn't a valid RHS here) — reduction must always match a rule's RHS to the CURRENT TOP of the stack in the correct left-to-right symbol order, so premature/misordered reduction attempts simply don't apply and the parser must recognize which specific stack-top window actually matches an available rule."},
  {id:"m3n7p11", difficulty:"exam-level", q:"Compare the backtracking risk of Shift-Reduce parsing to the CKY algorithm's guarantee of finding ALL parses without backtracking. Why does Shift-Reduce need backtracking while CKY doesn't?", answer:"Shift-Reduce commits to ONE choice at each decision point (which rule to reduce with, or whether to shift vs reduce when both are possible — the 'shift-reduce conflict') — if that choice turns out wrong later, the parser has already discarded the alternative and must backtrack (undo reductions, try a different choice) to recover, potentially re-doing significant work. CKY, being a DYNAMIC PROGRAMMING algorithm, exhaustively fills its chart bottom-up, computing and STORING every possible non-terminal that can span every possible substring — it never 'commits' to one interpretation early, so it naturally handles ambiguity by keeping multiple valid non-terminals in the same cell (as seen in the 'flying planes' VP-vs-NP ambiguity), guaranteeing it finds every parse without ever needing to backtrack or redo work."}
 ]
},
{
 id:"m3n8", title:"CKY Algorithm — CNF Conversion & Chart Parsing", topic:"3.4.2 Bottom-Up Parsers (CKY)",
 concept:"CKY parses a CNF grammar (every rule is A→BC or A→a) by filling a triangular chart bottom-up: cell [i,j] holds every non-terminal that can generate the words spanning position i to j, built by trying every way to SPLIT that span into two adjacent smaller spans whose non-terminals combine via a grammar rule.",
 formula:"CNF form required: A→BC (exactly 2 non-terminals) or A→a (exactly 1 terminal).\nChart fill rule: non-terminal X is added to cell [i,j] if there exists a split point k (i<k<j) and a rule X→YZ such that Y is in cell [i,k] and Z is in cell [k,j].\nA full parse exists if the START SYMBOL appears in the top cell [0,n] (spanning the entire sentence).",
 workedExample:{
  title:"Build the CKY chart for 'a pilot likes flying planes'",
  steps:[
   "Grammar (CNF): S→NP VP; VP→VBG NNS; VP→VBZ VP; VP→VBZ NP; NP→DT NN; NP→JJ NNS; DT→a; NN→pilot; VBZ→likes; VBG→flying; JJ→flying; NNS→planes.",
   "Step 1 — Fill the diagonal (single-word spans) via lexical rules: [0,1]=DT(a), [1,2]=NN(pilot), [2,3]=VBZ(likes), [3,4]={VBG,JJ}(flying — ambiguous!), [4,5]=NNS(planes).",
   "Step 2 — Fill 2-word spans: [0,2]: split at k=1, combine DT(0,1)+NN(1,2) → matches NP→DT NN → [0,2]=NP ('a pilot'). [1,3]: NN+VBZ — no matching rule → empty. [2,4]: VBZ+{VBG,JJ} — no matching rule → empty. [3,5]: split at k=4, combine {VBG,JJ}(3,4)+NNS(4,5) → VBG+NNS matches VP→VBG NNS giving VP; JJ+NNS matches NP→JJ NNS giving NP → [3,5]={VP,NP} (BOTH readings valid — genuine ambiguity for 'flying planes').",
   "Step 3 — Fill 3-word spans: [0,3]: try splits k=1 (DT + [1,3]=empty → nothing) and k=2 (NP(0,2) + VBZ(2,3) → no rule combines NP+VBZ → nothing) → [0,3]=empty. [2,5]: split k=3: VBZ(2,3) + [3,5]={VP,NP} → VBZ+VP matches VP→VBZ VP giving VP; VBZ+NP matches VP→VBZ NP giving VP → [2,5]=VP (from BOTH sub-readings, giving 2 distinct derivations of the same VP span).",
   "Step 4 — Fill the full span [0,5]: split k=2: NP(0,2)=‘a pilot' + VP(2,5)='likes flying planes' → matches S→NP VP → [0,5]=S. PARSE FOUND (start symbol spans the whole sentence), and since [3,5] had 2 readings feeding into [2,5]'s VP (also achieved 2 ways), the FULL parse is ambiguous — there are 2 valid parse trees (S1: 'flying planes'=VP reading; S2: 'flying planes'=NP reading), both rooted at S spanning all 5 words."
  ]
 },
 practice:[
  {id:"m3n8p1", difficulty:"easy", q:"What are the two allowed CNF rule forms?", answer:"A→BC (exactly 2 non-terminals) and A→a (exactly 1 terminal)"},
  {id:"m3n8p2", difficulty:"easy", q:"Convert 'NP → The Nominal' (a mixed terminal+non-terminal rule) into CNF-compliant form.", answer:"Introduce a dummy non-terminal for the terminal: NP → Det Nominal, plus a new rule Det → The"},
  {id:"m3n8p3", difficulty:"easy", q:"In the CKY chart, what does cell [i,j] represent?", answer:"All non-terminals that can generate exactly the words spanning positions i through j."},
  {id:"m3n8p4", difficulty:"basic", q:"Convert the unit-production chain 'NP → Nominal' and 'Nominal → Noun' (assuming Noun→dog is already terminal-only) into a single CNF-compliant rule for NP over 'dog'.", answer:"Collapse the unit-productions by substitution: NP → dog (directly), removing the intermediate Nominal/unit-production chain — this is what Step 3 (unit-production elimination) of the CNF conversion procedure does."},
  {id:"m3n8p5", difficulty:"basic", q:"Binarize the 3-symbol rule 'NP → Det Noun PP' into CNF form.", answer:"Introduce a dummy non-terminal, e.g. Nominal → Noun PP, then NP → Det Nominal — now both rules are proper A→BC form."},
  {id:"m3n8p6", difficulty:"basic", q:"In the pilot-example chart, why is cell [1,3] (spanning 'pilot likes') empty?", answer:"Because [1,2]=NN(pilot) and [2,3]=VBZ(likes), and there is no grammar rule of the form X→NN VBZ in this grammar — no valid combination exists for this specific span, so it gets no non-terminal entry."},
  {id:"m3n8p7", difficulty:"moderate", q:"Using 'The flight includes a meal' with grammar S→NP VP; NP→Det N; VP→V NP; V→includes; Det→The|a; N→meal|flight — fill cell [0,2] (spanning 'The flight').", answer:"[0,1]=Det(The), [1,2]=N(flight). Split at k=1: Det+N matches NP→Det N → [0,2]=NP"},
  {id:"m3n8p8", difficulty:"moderate", q:"Continuing the same example, fill cell [3,5] (spanning 'a meal').", answer:"[3,4]=Det(a), [4,5]=N(meal). Split at k=4: Det+N matches NP→Det N → [3,5]=NP"},
  {id:"m3n8p9", difficulty:"moderate", q:"Continuing, fill cell [2,5] (spanning 'includes a meal') and then the full-sentence cell [0,5].", answer:"[2,3]=V(includes), [3,5]=NP(a meal, from above). Split at k=3: V+NP matches VP→V NP → [2,5]=VP. Full span [0,5]: split at k=2: NP(0,2)='The flight' + VP(2,5)='includes a meal' matches S→NP VP → [0,5]=S — PARSE SUCCEEDS, sentence fully covered by S."},
  {id:"m3n8p10", difficulty:"difficult", q:"For the ambiguous span [3,5] in the pilot example (both VP and NP valid for 'flying planes'), explain precisely HOW this ambiguity propagates to produce 2 DIFFERENT full parse trees, rather than the chart just picking one.", answer:"CKY doesn't 'pick' a single reading — it stores BOTH VP and NP as valid entries in cell [3,5], each with its own backpointer to how it was built (VBG+NNS via VP→VBG NNS, vs JJ+NNS via NP→JJ NNS). When cell [2,5] is computed, it checks span [2,3]=VBZ combined with EACH entry in [3,5] separately: VBZ+VP(3,5) satisfies VP→VBZ VP (one derivation), AND VBZ+NP(3,5) satisfies VP→VBZ NP (a second, different derivation) — BOTH produce a VP at [2,5], but via different rules/children, meaning [2,5] itself now has 2 distinct backpointer-traceable derivations even though it's labeled the same non-terminal (VP) both times. Tracing back from the final S at [0,5] through EACH distinct derivation path gives 2 separate complete parse trees — this is exactly how CKY 'generates multiple trees when the statement is ambiguous', as the professor's slides state."},
  {id:"m3n8p11", difficulty:"exam-level", q:"Explain why CKY's time complexity is O(n³) in terms of the chart-filling process (number of cells × work per cell).", answer:"There are O(n²) cells [i,j] in the triangular chart (roughly n²/2 distinct spans for a sentence of length n). For EACH cell [i,j], CKY must try every possible SPLIT POINT k between i and j to check for valid combinations — there are up to O(n) possible split points for a given span. So total work = O(n²) cells × O(n) split-points-per-cell = O(n³) — this cubic bound is why CKY (like Earley) is considered efficient/tractable for practical sentence lengths, versus the exponential blowup of naive unrestricted search."},
  {id:"m3n8p12", difficulty:"challenge", q:"A grammar produces a chart where cell [0,5] is EMPTY (no S entry) even though every individual word matched some POS tag correctly in the diagonal cells. What does this indicate, and what's the most likely grammatical cause?", answer:"This indicates the sentence's individual words are all recognized lexically (each word has a valid POS/terminal-rule match), but NO COMBINATION of those pieces, following the grammar's phrase-structure rules, successfully builds up to a complete S spanning the whole sentence — i.e., the words are individually valid but the sentence as a WHOLE is not grammatical according to this specific grammar (or the grammar is simply missing a necessary combining rule). Common causes: a required rule is missing from the grammar (e.g. no rule allows the specific VP+PP combination actually present), or the sentence uses a syntactic construction (e.g. a passive voice, or a rare word order) that the grammar's rule set doesn't cover — CKY's exhaustive bottom-up construction guarantees that if a valid derivation EXISTS in the grammar, it WILL be found; an empty top cell is definitive proof no such derivation exists for this grammar."}
 ]
},
);

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="class") e.className = attrs[k];
    else if(k==="html") e.innerHTML = attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c=>{ if(typeof c==="string") e.appendChild(document.createTextNode(c)); else if(c) e.appendChild(c); });
  return e;
}
function esc(s){ const d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }
function nl2br(s){ return esc(s).replace(/\n/g,"<br>"); }

/* ================= STATS HELPERS ================= */
function pct(a,b){ return b===0 ? 0 : Math.round((a/b)*100); }
function syllabusStats(m){
  const total = DATA.syllabus[m].length;
  const done = DATA.syllabus[m].filter(t=>PROGRESS.syllabus[m][t.id]).length;
  return {done,total,pct:pct(done,total)};
}
function theoryStats(m){
  const total = DATA.theory[m].length;
  const done = DATA.theory[m].filter(t=>PROGRESS.theory[m][t.id]).length;
  return {done,total,pct:pct(done,total)};
}
function allPracticeItems(m){
  const out=[]; (DATA.numericals[m]||[]).forEach(topic=>topic.practice.forEach(p=>out.push(p)));
  return out;
}
function numericalStats(m){
  const items = allPracticeItems(m);
  const st = PROGRESS.numericals[m];
  let correct=0, incorrect=0, couldnt=0, attempted=0;
  items.forEach(p=>{
    const s = st[p.id];
    if(s==="correct") correct++;
    else if(s==="incorrect") incorrect++;
    else if(s==="couldnt") couldnt++;
    else if(s==="attempted") attempted++;
  });
  return {total:items.length, correct, incorrect, couldnt, attempted, anyStatus: correct+incorrect+couldnt+attempted};
}
function moduleOverallPct(m){
  const s = syllabusStats(m), t = theoryStats(m), n = numericalStats(m);
  const parts = [s.pct, t.pct, n.total? pct(n.anyStatus, n.total) : 100];
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
}

function renderFlashcards(m){
  const wrap = el("div",{class:"flashcard-wrap"});
  let cards = DATA.theory[m].filter(q=>q.flashcard);
  const toolbar = el("div",{class:"toolbar"});
  const filterSel = el("select",{});
  [["all","All flashcards"],["revision","Needs Revision only"],["unseen","Not yet marked"]].forEach(([v,l])=>filterSel.appendChild(el("option",{value:v},[l])));
  toolbar.appendChild(filterSel);
  wrap.appendChild(toolbar);

  const holder = el("div",{});
  function getFiltered(){
    return cards.filter(c=>{
      const status = PROGRESS.flashcards[m][c.id];
      if(filterSel.value==="revision") return status==="revision";
      if(filterSel.value==="unseen") return !status;
      return true;
    });
  }
  let flipped = false;
  function draw(){
    holder.innerHTML = "";
    const filtered = getFiltered();
    if(!filtered.length){ holder.appendChild(el("p",{class:"small-muted"},["No flashcards match this filter — nice work!"])); return; }
    if(FLASH_IDX[m] >= filtered.length) FLASH_IDX[m]=0;
    const card = filtered[FLASH_IDX[m]];
    const outer = el("div",{class:"flashcard-outer"});
    const fc = el("div",{class:"flashcard"+(flipped?" is-answer":"")});
    fc.appendChild(el("div",{},[flipped ? card.a : card.q]));
    fc.addEventListener("click",()=>{ flipped=!flipped; draw(); });
    outer.appendChild(el("div",{class:"side-label"},[flipped?"Answer":"Question"]));
    outer.appendChild(fc);
    holder.appendChild(outer);
    holder.appendChild(el("div",{class:"flashcard-status"},[`Card ${FLASH_IDX[m]+1} of ${filtered.length}`+(PROGRESS.flashcards[m][card.id]?" · marked "+PROGRESS.flashcards[m][card.id]:"")]));
    const controls = el("div",{class:"flashcard-controls"});
    controls.appendChild(el("button",{onclick:()=>{FLASH_IDX[m]=(FLASH_IDX[m]-1+filtered.length)%filtered.length; flipped=false; draw();}},["◀ Previous"]));
    controls.appendChild(el("button",{class:"primary",onclick:()=>{flipped=!flipped; draw();}},["Flip"]));
    controls.appendChild(el("button",{onclick:()=>{FLASH_IDX[m]=(FLASH_IDX[m]+1)%filtered.length; flipped=false; draw();}},["Next ▶"]));
    controls.appendChild(el("button",{class:"good",onclick:()=>{PROGRESS.flashcards[m][card.id]="known"; saveProgress(); FLASH_IDX[m]=(FLASH_IDX[m]+1)%filtered.length; flipped=false; draw();}},["✓ Known"]));
    controls.appendChild(el("button",{class:"warn",onclick:()=>{PROGRESS.flashcards[m][card.id]="revision"; saveProgress(); FLASH_IDX[m]=(FLASH_IDX[m]+1)%filtered.length; flipped=false; draw();}},["↻ Needs Revision"]));
    holder.appendChild(controls);
  }
  filterSel.addEventListener("change",()=>{FLASH_IDX[m]=0; flipped=false; draw();});
  draw();
  wrap.appendChild(holder);
  const known = cards.filter(c=>PROGRESS.flashcards[m][c.id]==="known").length;
  const rev = cards.filter(c=>PROGRESS.flashcards[m][c.id]==="revision").length;
  wrap.appendChild(el("p",{class:"small-muted",style:"text-align:center;margin-top:14px"},[`${cards.length} flashcards total · ${known} known · ${rev} need revision · ${cards.length-known-rev} unseen`]));
  return wrap;
}

function renderQuizRunner(m,key){
  const wrap = el("div",{});
  wrap.appendChild(el("button",{class:"ghost small",onclick:()=>{ROUTE.sub[m]="quiz"; render();}},["← Back to quiz list"]));
  const qs = DATA.quiz[key];
  if(!QUIZ_STATE[key]) QUIZ_STATE[key]={answers:{},submitted:{}};
  const state = QUIZ_STATE[key];
  let scoreSoFar = 0, answeredCount = 0;
  qs.forEach((q,i)=>{ if(state.submitted[i]){ answeredCount++; if(state.submitted[i]==="correct") scoreSoFar++; } });
  wrap.appendChild(el("div",{class:"card"},[`Score so far: ${scoreSoFar}/${answeredCount} answered (${qs.length} total)`]));

  qs.forEach((q,i)=>{
    const qDiv = el("div",{class:"quiz-q"});
    qDiv.appendChild(el("div",{style:"font-weight:700;margin-bottom:6px"},[`${i+1}. ${q.q}`]));
    const submitted = state.submitted[i];
    if(q.type==="mcq"){
      q.options.forEach((opt,oi)=>{
        const btn = el("button",{class:"quiz-opt",onclick:()=>{
          if(state.submitted[i]) return;
          state.answers[i]=oi;
          state.submitted[i] = (oi===q.correct)?"correct":"incorrect";
          render();
        }},[opt]);
        if(submitted){
          if(oi===q.correct) btn.classList.add("correct");
          else if(oi===state.answers[i]) btn.classList.add("incorrect");
        }
        qDiv.appendChild(btn);
      });
    } else if(q.type==="tf"){
      [["True",true],["False",false]].forEach(([label,val])=>{
        const btn = el("button",{class:"quiz-opt",onclick:()=>{
          if(state.submitted[i]) return;
          state.answers[i]=val;
          state.submitted[i] = (val===q.correct)?"correct":"incorrect";
          render();
        }},[label]);
        if(submitted){
          if(val===q.correct) btn.classList.add("correct");
          else if(val===state.answers[i]) btn.classList.add("incorrect");
        }
        qDiv.appendChild(btn);
      });
    } else if(q.type==="multi"){
      const chosen = state.answers[i] || [];
      q.options.forEach((opt,oi)=>{
        const isChecked = chosen.includes(oi);
        const row = el("label",{style:"display:flex;gap:8px;align-items:center;padding:6px 4px;"});
        const cb = el("input",{type:"checkbox"});
        cb.checked = isChecked; cb.disabled = !!submitted;
        cb.addEventListener("change",()=>{
          let arr = state.answers[i]||[];
          if(cb.checked) arr = [...arr, oi]; else arr = arr.filter(x=>x!==oi);
          state.answers[i] = arr;
        });
        row.appendChild(cb); row.appendChild(document.createTextNode(opt));
        if(submitted){
          const correctSet = new Set(q.correct);
          if(correctSet.has(oi)) row.style.color = "var(--good)";
          else if(chosen.includes(oi)) row.style.color = "var(--bad)";
        }
        qDiv.appendChild(row);
      });
      if(!submitted){
        qDiv.appendChild(el("button",{class:"primary small",style:"margin-top:6px",onclick:()=>{
          const chosenArr = (state.answers[i]||[]).slice().sort();
          const correctArr = q.correct.slice().sort();
          const isCorrect = JSON.stringify(chosenArr)===JSON.stringify(correctArr);
          state.submitted[i] = isCorrect?"correct":"incorrect";
          render();
        }},["Submit Answer"]));
      }
    }
    if(submitted){
      qDiv.appendChild(el("div",{class:"quiz-feedback "+submitted},[
        (submitted==="correct"?"✓ Correct. ":"✗ Incorrect. ") + q.explanation
      ]));
    }
    wrap.appendChild(qDiv);
  });

  const allAnswered = qs.every((q,i)=>state.submitted[i]);
  wrap.appendChild(el("button",{class:"primary",disabled:!allAnswered,onclick:()=>{
    const total = qs.length;
    const score = qs.filter((q,i)=>state.submitted[i]==="correct").length;
    PROGRESS.quizScores[key] = {score,total,date:new Date().toLocaleDateString()};
    saveProgress();
    alert(`Quiz complete! Score: ${score}/${total} (${pct(score,total)}%)`);
    ROUTE.sub[m]="quiz";
    render();
  }},[allAnswered?"Finish & Save Score":"Answer all questions to finish"]));
  return wrap;
}

/* ---- Quick Revision ---- */
function renderRevision(m){
  const wrap = el("div",{});
  const content = DATA.revision && DATA.revision[m];
  if(!content){ wrap.appendChild(el("p",{class:"small-muted"},["Quick revision sheet coming soon for this module."])); return wrap; }
  content.forEach(sec=>{
    const card = el("div",{class:"card"});
    card.appendChild(el("h3",{},[sec.heading]));
    const list = el("ul",{});
    sec.points.forEach(pt=>list.appendChild(el("li",{html:nl2br(pt)})));
    card.appendChild(list);
    wrap.appendChild(card);
  });
  return wrap;
}

/* ================= FINAL MOCK ================= */
function renderMock(){
  const wrap = el("div",{});
  wrap.appendChild(el("h1",{},["Final 30-Mark Mock Test"]));
  wrap.appendChild(el("p",{class:"small-muted"},["Simulates the Mid-Semester Exam covering Modules 1–3. Answers are hidden until you submit the whole test. Timer is optional."]));

  if(!DATA.mock.length){ wrap.appendChild(el("p",{},["Mock test content coming soon."])); return wrap; }

  if(!MOCK_STATE.started){
    const card = el("div",{class:"card"});
    card.appendChild(el("p",{},[`Total: ${DATA.mock.reduce((s,q)=>s+q.marks,0)} marks across ${DATA.mock.length} questions. Recommended duration: 90 minutes (matches the real Mid-Sem exam duration).`]));
    const timerCb = el("label",{style:"display:flex;gap:6px;align-items:center;margin-bottom:10px"});
    const cb = el("input",{type:"checkbox"}); cb.checked=true;
    timerCb.appendChild(cb); timerCb.appendChild(document.createTextNode(" Enable 90-minute timer"));
    card.appendChild(timerCb);
    card.appendChild(el("button",{class:"primary",onclick:()=>{
      MOCK_STATE.started=true; MOCK_STATE.submitted=false; MOCK_STATE.answers={}; MOCK_STATE.selfMark={};
      MOCK_STATE.useTimer = cb.checked; MOCK_STATE.startTime = Date.now();
      render();
      if(MOCK_STATE.useTimer) startMockTimer();
    }},["Start Mock Test"]));
    wrap.appendChild(card);
    return wrap;
  }

  if(MOCK_STATE.useTimer && !MOCK_STATE.submitted){
    wrap.appendChild(el("div",{class:"card",id:"mockTimerBox"},[el("span",{class:"mock-timer",id:"mockTimerText"},["90:00"])]));
  }

  DATA.mock.forEach((q,i)=>{
    const qDiv = el("div",{class:"card"});
    qDiv.appendChild(el("div",{class:"badge-row"},[
      el("span",{class:"marks-tag"},[`Q${i+1} · ${q.marks} marks`]),
      el("span",{class:"small-muted"},[`Module ${q.module} · ${q.topic||""}`])
    ]));
    qDiv.appendChild(el("div",{style:"font-weight:700;margin:8px 0"},[q.q]));

    if(!MOCK_STATE.submitted){
      if(q.type==="mcq"){
        q.options.forEach((opt,oi)=>{
          const chosen = MOCK_STATE.answers[i]===oi;
          qDiv.appendChild(el("button",{class:"quiz-opt"+(chosen?" active":""),style:chosen?"border-color:var(--accent)":"",onclick:()=>{MOCK_STATE.answers[i]=oi; render();}},[opt]));
        });
      } else if(q.type==="numeric"){
        const inp = el("input",{type:"text",placeholder:"Your answer",style:"width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--ink)"});
        inp.value = MOCK_STATE.answers[i]||"";
        inp.addEventListener("input",()=>{MOCK_STATE.answers[i]=inp.value;});
        qDiv.appendChild(inp);
      } else { // long/theory — free response, self-graded after submit
        const ta = el("textarea",{rows:"4",style:"width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--ink);font-family:inherit"});
        ta.value = MOCK_STATE.answers[i]||"";
        ta.addEventListener("input",()=>{MOCK_STATE.answers[i]=ta.value;});
        qDiv.appendChild(ta);
      }
    } else {
      // submitted — show correctness / model answer
      if(q.type==="mcq"){
        q.options.forEach((opt,oi)=>{
          const btn = el("button",{class:"quiz-opt"},[opt]);
          if(oi===q.correct) btn.classList.add("correct");
          else if(oi===MOCK_STATE.answers[i]) btn.classList.add("incorrect");
          qDiv.appendChild(btn);
        });
        qDiv.appendChild(el("div",{class:"quiz-feedback "+(MOCK_STATE.answers[i]===q.correct?"correct":"incorrect")},[q.explanation||""]));
      } else if(q.type==="numeric"){
        const given = (MOCK_STATE.answers[i]||"").toString().trim();
        const isCorrect = q.acceptableAnswers ? q.acceptableAnswers.some(a=>a.toLowerCase()===given.toLowerCase()) : given.toLowerCase()===String(q.answer).toLowerCase();
        qDiv.appendChild(el("div",{class:"small-muted"},["Your answer: "+(given||"(blank)")]));
        qDiv.appendChild(el("div",{class:"solution show",html:"<b>Correct answer:</b> "+nl2br(String(q.answer))}));
        qDiv.appendChild(el("div",{class:"quiz-feedback "+(isCorrect?"correct":"incorrect")},[isCorrect?"✓ Correct":"✗ Incorrect"]));
        MOCK_STATE.selfMark[i] = isCorrect ? q.marks : 0;
      } else {
        qDiv.appendChild(el("div",{class:"small-muted"},["Your answer:"]));
        qDiv.appendChild(el("div",{style:"padding:8px;background:var(--accent-soft);border-radius:6px;margin:4px 0;white-space:pre-wrap"},[MOCK_STATE.answers[i]||"(blank)"]));
        qDiv.appendChild(el("div",{class:"solution show",html:"<b>Model Answer:</b> "+nl2br(q.answer)}));
        const markRow = el("div",{class:"status-btns"});
        [["full","Full Marks"],["half","Half Marks"],["zero","Zero"]].forEach(([val,label])=>{
          const active = MOCK_STATE.selfMark[i+"_grade"]===val;
          markRow.appendChild(el("button",{class:"small"+(active?" primary":""),onclick:()=>{
            MOCK_STATE.selfMark[i+"_grade"]=val;
            MOCK_STATE.selfMark[i] = val==="full"?q.marks:(val==="half"?q.marks/2:0);
            render();
          }},[label]));
        });
        qDiv.appendChild(markRow);
      }
    }
    wrap.appendChild(qDiv);
  });

  if(!MOCK_STATE.submitted){
    wrap.appendChild(el("button",{class:"primary",onclick:()=>{
      if(!confirm("Submit the mock test? You won't be able to change answers after this.")) return;
      MOCK_STATE.submitted = true;
      if(MOCK_STATE.timerId) clearInterval(MOCK_STATE.timerId);
      render();
    }},["Submit Mock Test"]));
  } else {
    const totalMarks = DATA.mock.reduce((s,q)=>s+q.marks,0);
    const scored = DATA.mock.reduce((s,q,i)=>{
      if(q.type==="mcq") return s + (MOCK_STATE.answers[i]===q.correct?q.marks:0);
      if(q.type==="numeric") return s + (MOCK_STATE.selfMark[i]||0);
      return s + (MOCK_STATE.selfMark[i]||0);
    },0);
    const correctCount = DATA.mock.filter((q,i)=>{
      if(q.type==="mcq") return MOCK_STATE.answers[i]===q.correct;
      if(q.type==="numeric") return MOCK_STATE.selfMark[i]===q.marks;
      return MOCK_STATE.selfMark[i]===q.marks;
    }).length;
    const unanswered = DATA.mock.filter((q,i)=>MOCK_STATE.answers[i]===undefined || MOCK_STATE.answers[i]==="").length;

    const summary = el("div",{class:"card"});
    summary.appendChild(el("h2",{},["Result"]));
    summary.appendChild(el("div",{class:"grid stats"},[
      makeStat(Math.round(scored*10)/10+"/"+totalMarks,"Marks Obtained"),
      makeStat(pct(scored,totalMarks)+"%","Percentage"),
      makeStat(String(correctCount),"Fully Correct"),
      makeStat(String(unanswered),"Unanswered")
    ]));
    // module-wise breakdown
    const byModule = {m1:{got:0,total:0},m2:{got:0,total:0},m3:{got:0,total:0}};
    DATA.mock.forEach((q,i)=>{
      byModule[q.module].total += q.marks;
      if(q.type==="mcq") byModule[q.module].got += (MOCK_STATE.answers[i]===q.correct?q.marks:0);
      else byModule[q.module].got += (MOCK_STATE.selfMark[i]||0);
    });
    summary.appendChild(el("h3",{},["Module-wise Performance"]));
    Object.entries(byModule).forEach(([mm,v])=>{
      if(v.total===0) return;
      summary.appendChild(el("div",{},[`${MODULE_TITLES[mm].split("—")[0].trim()}: ${v.got}/${v.total} (${pct(v.got,v.total)}%)`]));
    });
    const weakAreas = Object.entries(byModule).filter(([mm,v])=>v.total>0 && pct(v.got,v.total)<60).map(([mm])=>MODULE_TITLES[mm]);
    if(weakAreas.length){
      summary.appendChild(el("h3",{},["Weak Areas To Revise"]));
      weakAreas.forEach(w=>summary.appendChild(el("div",{},["🔴 "+w])));
    }
    summary.appendChild(el("button",{class:"primary",style:"margin-top:10px",onclick:()=>{
      PROGRESS.mock = {score:Math.round(scored*10)/10, total:totalMarks, date:new Date().toLocaleDateString()};
      saveProgress();
      alert("Saved to dashboard.");
    }},["Save Result to Dashboard"]));
    summary.appendChild(el("button",{class:"ghost",style:"margin-top:10px;margin-left:8px",onclick:()=>{
      if(confirm("Retake the mock test from scratch?")){ MOCK_STATE = {started:false, submitted:false, answers:{}, selfMark:{}, startTime:null, timerId:null}; render(); }
    }},["Retake Mock Test"]));
    wrap.appendChild(summary);
  }
  return wrap;
}
function startMockTimer(){
  const durationMs = 90*60*1000;
  MOCK_STATE.timerId = setInterval(()=>{
    const elapsed = Date.now()-MOCK_STATE.startTime;
    const remaining = Math.max(0, durationMs-elapsed);
    const mins = Math.floor(remaining/60000), secs = Math.floor((remaining%60000)/1000);
    const t = document.getElementById("mockTimerText");
    if(t) t.textContent = `${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
    if(remaining<=0){
      clearInterval(MOCK_STATE.timerId);
      if(!MOCK_STATE.submitted){ MOCK_STATE.submitted=true; render(); alert("Time's up! Your mock test has been auto-submitted."); }
    }
  },1000);
}

  wrap.appendChild(el("h1",{},["Syllabus Coverage Audit"]));
  wrap.appendChild(el("p",{class:"small-muted"},["Every official syllabus topic for Modules 1–3, and whether this site covers it with Theory, Numericals, Practice Questions, and Quiz content."]));
