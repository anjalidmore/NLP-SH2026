 id:"s_m2_ngram", title:"N-gram Probabilities — Unigram, Bigram, Trigram", topic:"2.7", marks:4,
 lo:["LO 2.1","LO 2.3"], src:"NLP Notes p.9–13 (6/8, 11/8)",
 idea:"Everything in 2.7 is one formula applied at different history lengths. The two things that decide your marks are (a) whether you include the sentence boundary markers and (b) whether you divide by the right denominator.",
 method:"Chain rule (exact):  P(w₁…wₙ) = Π P(wᵢ | w₁…wᵢ₋₁)\nMarkov assumption: the next word depends only on a LIMITED number of recent\nprevious words, not the entire history. That is what gives the N-gram model.\n\nUNIGRAM   P(wᵢ) = count(wᵢ) / N          N = total tokens\nBIGRAM    P(wᵢ | wᵢ₋₁) = c(wᵢ₋₁, wᵢ) / c(wᵢ₋₁)\nTRIGRAM   P(wᵢ | wᵢ₋₂, wᵢ₋₁) = c(wᵢ₋₂, wᵢ₋₁, wᵢ) / c(wᵢ₋₂, wᵢ₋₁)\n\n*** THE RULE WRITTEN IN RED IN THE CLASS NOTES (p.10) ***\n  ONLY IN UNIGRAM, WE DO NOT CONSIDER THE SENTENCE BOUNDARY\n  MARKERS <s> AND </s>.\n  For bigram and above, <s> and </s> ARE counted and ARE used.\n\nAlso from the margins:\n  “No numericals on 4-gram.”\n  “Since the class is not mentioned, we use bigram.”  (i.e. if a smoothing\n  question does not name a class/category, treat it as a bigram question.)",
 classQs:[
  {q:"Corpus: <s> I like NLP </s> · <s> I like Blockchain </s> · <s> Sam likes NLP </s>. (i) Compute the unigram probabilities. (ii) Compute the sentence probability of “I like NLP”.",
   steps:[
    "Step 1 — frequency table.\n  I: 2   like: 2   NLP: 2   Blockchain: 1   Sam: 1   likes: 1\n  <s>: 3   </s>: 3   <- counted, but NOT USED, because this is unigram.",
    "Step 2 — token count for a UNIGRAM model excludes the boundary markers:\n  N = 2 + 2 + 2 + 1 + 1 + 1 = 9.",
    "Step 3 — P(wᵢ) = c(wᵢ)/N:\n  P(I) = 2/9      P(like) = 2/9    P(NLP) = 2/9\n  P(Blockchain) = 1/9   P(Sam) = 1/9   P(likes) = 1/9\n  Check: 2/9+2/9+2/9+1/9+1/9+1/9 = 9/9 = 1 ✓",
    "Step 4 — sentence probability under the unigram model:\n  P(S) = P(I) × P(like) × P(NLP) = 2/9 × 2/9 × 2/9 = 8/729."],
   answer:"P(I)=P(like)=P(NLP)=2/9; P(Blockchain)=P(Sam)=P(likes)=1/9.\nP(“I like NLP”) = 8/729 ≈ 0.01097",
   watch:"N = 9, not 15. Counting the six boundary markers is the single most common error on this question, and the notes flag it in red. The probabilities must sum to 1 — use that check."},
  {q:"Same corpus. Compute the sentence probability of <s> I like NLP </s> using a BIGRAM model.",
   steps:[
    "Now the boundary markers ARE used. List the bigrams of the test sentence:\n  (<s>, I) · (I, like) · (like, NLP) · (NLP, </s>)",
    "P(I | <s>) = c(<s>, I)/c(<s>) = 2/3\n  (<s> is followed by I in sentences 1 and 2, and by Sam in sentence 3.)",
    "P(like | I) = c(I, like)/c(I) = 2/2 = 1",
    "P(NLP | like) = c(like, NLP)/c(like) = 1/2\n  ('like' is followed by NLP once and by Blockchain once.)",
    "P(</s> | NLP) = c(NLP, </s>)/c(NLP) = 2/2 = 1",
    "Multiply: P(S) = 2/3 × 1 × 1/2 × 1 = 1/3."],
   answer:"P(<s> I like NLP </s>) = 2/3 × 1 × 1/2 × 1 = 1/3 ≈ 0.33",
   watch:"Compare with the unigram answer of 0.011. The bigram probability is far higher because the model has learnt that this exact word ORDER is common — that is the whole argument for using context."},
  {q:"Corpus of 7 sentences: <s> I am Henry </s> · <s> I like college </s> · <s> Do Henry like college </s> · <s> Henry I am </s> · <s> Do I like Henry </s> · <s> Do I like college </s> · <s> I do like college </s>.\n(i) What is the most probable word after “Do”? (ii) After “<s> I like Henry”? (iii) Trigram: after “<s> Do I like”? (iv) Four-gram: after “<s> Do I like college”?",
   steps:[
    "Frequency table recorded in class: I = 6, am = 2, Henry = 5, like = 5, college = 3, Do = 4, <s> = 7, </s> = 7. Tokens = 39.",
    "(i) BIGRAM after 'Do' — c(Do) = 4:\n  P(Henry|Do) = c(Do,Henry)/c(Do) = 1/4 = 0.25\n  P(I|Do)     = c(Do,I)/c(Do)     = 2/4 = 0.50\n  P(like|Do)  = c(Do,like)/c(Do)  = 1/4 = 0.25\n  => 'I' is the most probable word after 'Do'.",
    "(ii) BIGRAM after 'Henry' — c(Henry) = 5:\n  P(</s>|Henry)  = 3/5\n  P(like|Henry)  = 1/5\n  P(I|Henry)     = 1/5\n  => '</s>' is most probable: the sentence most likely ENDS after Henry.",
    "(iii) TRIGRAM, history 'I like' — c(I, like) = 3:\n  P(college | I like) = c(I,like,college)/c(I,like) = 2/3\n  P(Henry   | I like) = c(I,like,Henry)/c(I,like)   = 1/3\n  => 'college' is most probable.",
    "(iv) FOUR-GRAM, history 'Do I like college':\n  P(</s> | Do I like college) = c(Do,I,like,college,</s>)/c(Do,I,like,college) = 1/1 = 1."],
   answer:"(i) I (0.5) · (ii) </s> (3/5) · (iii) college (2/3) · (iv) </s> with probability 1.",
   watch:"Two things. (a) The denominator is the count of the HISTORY, never the total tokens. (b) '</s>' is a legitimate prediction — do not skip it because it is not a word; part (ii) turns on exactly that."},
  {q:"Which sentence gets the higher probability under a bigram model built on the 7-sentence corpus above: S₁ = <s> I like college </s> or S₂ = <s> Do I like Henry </s>?",
   steps:[
    "S₁: P(I|<s>) × P(like|I) × P(college|like) × P(</s>|college)\n     = 3/7 × 3/6 × 3/5 × 3/3\n     = 3/7 × 1/2 × 3/5 × 1 = 9/70 ≈ 0.13",
    "S₂: P(Do|<s>) × P(I|Do) × P(like|I) × P(Henry|like) × P(</s>|Henry)\n     = 3/7 × 2/4 × 3/6 × 2/5 × 3/5\n     ≈ 0.0257"],
   answer:"P(S₁) ≈ 0.13 and P(S₂) ≈ 0.0257, so S₁ (“I like college”) is the more probable sentence.",
   watch:"S₂ is longer, and every extra factor is a number below 1, so longer sentences get lower probabilities almost automatically. If a question asks you to COMPARE sentences of different lengths, say this — it is why perplexity normalises by length."}],
 practice:[
  {id:"sp_m2n1", difficulty:"easy", kind:"numerical", src:"notes",
   q:"Corpus: <s> I love NLP </s> · <s> I love maths </s> · <s> You love NLP </s>. Compute all UNIGRAM probabilities. State N explicitly.",
   answer:"Boundary markers are excluded for unigram.\nCounts: I=2, love=3, NLP=2, maths=1, You=1. N = 9.\nP(I)=2/9, P(love)=3/9=1/3, P(NLP)=2/9, P(maths)=1/9, P(You)=1/9.\nCheck: 2+3+2+1+1 = 9 ✓ and the probabilities sum to 1 ✓"},
  {id:"sp_m2n2", difficulty:"easy", kind:"numerical", src:"notes",
   q:"Same corpus. Compute P(“I love NLP”) under the unigram model.",
   answer:"P = P(I)·P(love)·P(NLP) = (2/9)(3/9)(2/9) = 12/729 ≈ 0.01646."},
  {id:"sp_m2n3", difficulty:"basic", kind:"numerical", src:"notes",
   q:"Same corpus (<s> I love NLP </s> · <s> I love maths </s> · <s> You love NLP </s>). Compute P(<s> I love NLP </s>) using a BIGRAM model.",
   answer:"P(I|<s>)    = c(<s>,I)/c(<s>)     = 2/3\nP(love|I)   = c(I,love)/c(I)      = 2/2 = 1\nP(NLP|love) = c(love,NLP)/c(love) = 2/3\nP(</s>|NLP) = c(NLP,</s>)/c(NLP)  = 2/2 = 1\nP(S) = 2/3 × 1 × 2/3 × 1 = 4/9 ≈ 0.444"},
  {id:"sp_m2n4", difficulty:"basic", kind:"numerical", src:"notes",
   q:"Corpus: <s> the cat sat </s> · <s> the cat ran </s> · <s> the dog ran </s>. What is the most probable word after 'the'? After 'cat'?",
   answer:"c(the) = 3: P(cat|the) = 2/3, P(dog|the) = 1/3 -> 'cat' is most probable.\nc(cat) = 2: P(sat|cat) = 1/2, P(ran|cat) = 1/2 -> a TIE. Say so explicitly and note that a tie means the bigram model has no preference; a trigram (with the extra word of history) would be needed to break it."},
  {id:"sp_m2n5", difficulty:"moderate", kind:"numerical", src:"notes",
   q:"Class-corpus variant. Using the 7-sentence Henry/college corpus, compute the most probable word after the bigram history 'like' and after the trigram history 'Do I'.",
   answer:"After 'like' (bigram), c(like) = 5. 'like' is followed by: college (in s2, s6, s7) and Henry (in s5) and college (s3) — collecting: c(like,college) = 4, c(like,Henry) = 1.\nP(college|like) = 4/5 = 0.8, P(Henry|like) = 1/5 = 0.2 -> 'college'.\nAfter 'Do I' (trigram), c(Do,I) = 2 (sentences 5 and 6), and both are followed by 'like'.\nP(like | Do I) = 2/2 = 1 -> 'like', with certainty.\nNote how the trigram is sharper than the bigram — that is the value of more history, and also why trigram counts run out faster."},
  {id:"sp_m2n6", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"THE BOUNDARY-MARKER TRAP. For the corpus <s> a b </s> · <s> a c </s>, a student computes N = 8 and reports P(a) = 2/8. What did they do wrong, what is the right answer, and when WOULD 8 be right?",
   answer:"They counted the four boundary markers as tokens in a UNIGRAM model. The class rule (written in red, p.10): only in unigram, we do NOT consider <s> and </s>.\nCorrect: tokens are a, b, a, c so N = 4, and P(a) = 2/4 = 0.5.\nWhen would the markers matter? In a BIGRAM (or higher) model — there you need c(<s>) = 2 as the denominator of P(a|<s>) = 2/2 = 1, and c(b,</s>) as the numerator of P(</s>|b). So the markers are counted and used for bigram and above, and ignored for unigram.\nQuick check on the wrong answer: with N = 8 the unigram probabilities would sum to 8/8 only if the markers were treated as words, which makes P(<s>) = 0.25 — a meaningless quantity in a unigram model."},
  {id:"sp_m2n7", difficulty:"difficult", kind:"numerical", src:"notes",
   q:"Corpus: <s> she likes tea </s> · <s> she likes coffee </s> · <s> he likes tea </s> · <s> she drinks tea </s>. (a) P(“<s> she likes tea </s>”) under bigram. (b) Under trigram. (c) Explain the difference.",
   answer:"(a) BIGRAM:\n P(she|<s>)    = 3/4\n P(likes|she)  = 2/3   (she -> likes twice, she -> drinks once)\n P(tea|likes)  = 2/3   (likes -> tea twice, likes -> coffee once)\n P(</s>|tea)   = 3/3 = 1\n P = 3/4 × 2/3 × 2/3 × 1 = 12/36 = 1/3 ≈ 0.333\n\n(b) TRIGRAM:\n P(she | <s>)            = 3/4                (first word, bigram history)\n P(likes | <s>, she)     = c(<s>,she,likes)/c(<s>,she) = 2/3\n P(tea | she, likes)     = c(she,likes,tea)/c(she,likes) = 1/2\n P(</s> | likes, tea)    = c(likes,tea,</s>)/c(likes,tea) = 2/2 = 1\n P = 3/4 × 2/3 × 1/2 × 1 = 1/4 = 0.25\n\n(c) The trigram is LOWER here because its counts are sparser: 'she likes' occurs twice and is followed by tea only once, whereas the bigram pooled all three 'likes -> tea' events. More history means a sharper, better-informed model but far more zero and near-zero counts — the sparsity/context trade-off, and the reason smoothing becomes essential as N grows."},
  {id:"sp_m2n8", difficulty:"difficult", kind:"interpret", src:"notes",
   q:"Two bigram models are built on the same corpus, one with boundary markers and one without. The sentence-probability rankings of three test sentences come out different. Which model do you trust and why?",
   answer:"Trust the model WITH boundary markers.\nWithout <s>, the model has no way to score the first word — it must either drop P(w₁) entirely (which biases towards sentences whose first word is unusual, since that factor is missing) or fall back to a unigram for w₁ (which mixes two models).\nWithout </s>, the model assigns no cost to a sentence simply stopping, so it cannot distinguish a complete sentence from a truncated fragment, and the probabilities of all sentences of a given length no longer sum to 1 over the sentence space.\nBoth defects change RELATIVE rankings, which is exactly what the comparison depends on. This is why the class notes keep <s>/</s> for bigram and above, and drop them only for unigram — where there is no history to condition on anyway."},
  {id:"sp_m2n9", difficulty:"exam-level", kind:"numerical", src:"notes",
   q:"Q3-style, 5 marks. Corpus: <s> the students pass the test </s> · <s> the students wait for the result </s> · <s> teachers test students </s>. Using a BIGRAM model compute P(<s> the students test </s>) and comment on the result.",
   answer:"Bigrams needed: (<s>,the), (the,students), (students,test), (test,</s>).\nc(<s>) = 3, c(<s>,the) = 2  -> P(the|<s>) = 2/3\nc(the) = 4, c(the,students) = 2 -> P(students|the) = 2/4 = 1/2\nc(students) = 3, c(students,test) = 0 -> P(test|students) = 0/3 = 0\nc(test) = 2, c(test,</s>) = 1 -> P(</s>|test) = 1/2\nP(S) = 2/3 × 1/2 × 0 × 1/2 = 0.\n\nComment — this is the point of the question: ONE unseen bigram drives the WHOLE sentence probability to zero, even though every individual word was seen and the sentence is perfectly grammatical. This is the ZERO-PROBABILITY PROBLEM, and it is why Laplace or Good-Turing smoothing is required (2.7.2). Note that 'students test' is absent only because the corpus happens to contain 'teachers test students' in the other order."}]
},
{
 id:"s_m2_laplace", title:"Laplace (Add-One) Smoothing", topic:"2.7", marks:4,
 lo:["LO 2.3","LO 2.1"], src:"NLP Notes p.13–14 (11/8)", tag:"On the class 'lengthy / mandatory' list",
 idea:"Add 1 to every count so nothing has probability zero. The whole difficulty is the DENOMINATOR: what you add to the top forces what you add to the bottom.",
 method:"ZERO-PROBABILITY PROBLEM: if a sentence contains one zero-probability\nword or N-gram, its entire probability becomes zero. Smoothing is required\nto prevent zero probabilities for unseen words / N-grams.\n\nLAPLACE (ADD-ONE):\n  UNIGRAM   P(w) = ( c(w) + 1 ) / ( N + |V| )\n  BIGRAM    P(wᵢ | wᵢ₋₁) = ( c(wᵢ₋₁, wᵢ) + 1 ) / ( c(wᵢ₋₁) + |V| )\n\n  c = count · N = total tokens · |V| = vocabulary size (number of TYPES)\n\nWHY THE DENOMINATOR: you added 1 to each of |V| possible continuations,\nso you added |V| in total and must add |V| to the bottom to keep the\nprobabilities summing to 1.\n\nCLASS MARGIN NOTE: “since the class is not mentioned, we use bigram”.",
 classQs:[
  {q:"Corpus: <s> I am Sam </s> · <s> Sam I am </s> · <s> I do not like Sam </s>. Compute the smoothed probability of the test sentence <s> I am Sam </s>.",
   steps:[
    "Frequency table (as recorded in class): <s> = 3, </s> = 3, I = 3, am = 2, Sam = 3.\n  V = 6 (the vocabulary size used in class).",
    "P(I | <s>) = (c(<s>,I) + 1)/(c(<s>) + V) = (2+1)/(3+6) = 3/9 = 1/3",
    "P(am | I) = (c(I,am) + 1)/(c(I) + V) = (2+1)/(3+6) = 3/9 = 1/3",
    "P(Sam | am) = (c(am,Sam) + 1)/(c(am) + V) = (1+1)/(2+6) = 2/8 = 1/4",
    "P(</s> | Sam) = (c(Sam,</s>) + 1)/(c(Sam) + V) = (2+1)/(3+6) = 3/9 = 1/3",
    "P(S) = 1/3 × 1/3 × 1/4 × 1/3 = 1/108"],
   answer:"P(<s> I am Sam </s>) = 1/3 × 1/3 × 1/4 × 1/3 = 1/108 ≈ 0.009",
   watch:"The denominator changes for every term because c(wᵢ₋₁) changes. Students frequently reuse the first denominator throughout — check each one against its own history count."},
  {q:"Corpus: <s> I am here </s> · <s> I like it </s> · <s> I am happy </s>. Compute the smoothed probabilities of (i) P(here|I) (ii) P(it|I) (iii) P(happy|I) (iv) P(I|I).",
   steps:[
    "Frequency table: <s> = 3, </s> = 3, I = 3, am = 2, here = 1, like = 1, it = 1, happy = 1.\n  V = 6 and N = 9 as recorded in class.",
    "All four are BIGRAM questions (the class note: 'since the class is not mentioned, we use bigram').",
    "The history is 'I' in every case, so the denominator is always c(I) + V = 3 + 6 = 9.",
    "c(I, here) = 0 -> P(here|I) = (0+1)/9 = 1/9",
    "c(I, it)   = 0 -> P(it|I)   = (0+1)/9 = 1/9",
    "c(I, happy)= 0 -> P(happy|I)= (0+1)/9 = 1/9",
    "c(I, I)    = 0 -> P(I|I)    = (0+1)/9 = 1/9"],
   answer:"All four equal 1/9 ≈ 0.111.",
   watch:"Two lessons. (1) Every one of these bigrams is UNSEEN — without smoothing all four would be 0, and the smoothed value 1/9 is the mass Laplace hands to unseen events. (2) Because they are all unseen with the same history, they all get the SAME probability: Laplace cannot distinguish between plausible and implausible unseen continuations. That flatness is its main criticism, and is why Good-Turing exists."}],
 practice:[
  {id:"sp_m2l1", difficulty:"easy", kind:"numerical", src:"notes",
   q:"A corpus has N = 100 tokens and |V| = 20 types. The word 'data' occurs 5 times and 'quantum' never occurs. Give the Laplace-smoothed UNIGRAM probability of each.",
   answer:"P(data)   = (5+1)/(100+20) = 6/120 = 0.05\nP(quantum)= (0+1)/(100+20) = 1/120 ≈ 0.0083\nUnsmoothed, P(data) was 5/100 = 0.05 and P(quantum) was 0. Note that 'data' barely moved while 'quantum' went from impossible to merely unlikely — that is exactly what smoothing is for."},
  {id:"sp_m2l2", difficulty:"easy", kind:"numerical", src:"notes",
   q:"Corpus: <s> a b </s> · <s> a c </s>, with V = 5 (a, b, c, <s>, </s>). Compute the Laplace-smoothed P(b|a) and P(c|a).",
   answer:"c(a) = 2.\nP(b|a) = (c(a,b)+1)/(c(a)+V) = (1+1)/(2+5) = 2/7 ≈ 0.286\nP(c|a) = (1+1)/(2+5) = 2/7 ≈ 0.286\nUnsmoothed both were 1/2; smoothing pulled them down to make room for the unseen continuations (a,a), (a,<s>), (a,</s>), each of which now gets 1/7."},
  {id:"sp_m2l3", difficulty:"basic", kind:"numerical", src:"notes",
   q:"Corpus: <s> the cat sat </s> · <s> the cat ran </s> · <s> the dog sat </s>. Vocabulary V = 7 (the, cat, dog, sat, ran, <s>, </s>). Compute the Laplace-smoothed P(<s> the dog ran </s>).",
   answer:"Counts: c(<s>)=3, c(the)=3, c(dog)=1, c(ran)=1.\nP(the|<s>) = (3+1)/(3+7) = 4/10 = 0.4\nP(dog|the) = (1+1)/(3+7) = 2/10 = 0.2\nP(ran|dog) = (0+1)/(1+7) = 1/8 = 0.125   <- unseen bigram, rescued by smoothing\nP(</s>|ran)= (1+1)/(1+7) = 2/8 = 0.25\nP(S) = 0.4 × 0.2 × 0.125 × 0.25 = 0.0025\nWithout smoothing this sentence would have had probability 0 because 'dog ran' never occurs."},
  {id:"sp_m2l4", difficulty:"basic", kind:"numerical", src:"notes",
   q:"Class-corpus variant. Corpus: <s> I am here </s> · <s> I like it </s> · <s> I am happy </s> with V = 6, N = 9. Compute the smoothed P(am|I) and P(like|I), and compare with the unsmoothed values.",
   answer:"c(I) = 3, so the denominator is 3 + 6 = 9 for both.\nP(am|I)   = (2+1)/9 = 3/9 = 1/3 ≈ 0.333   [unsmoothed 2/3 ≈ 0.667]\nP(like|I) = (1+1)/9 = 2/9 ≈ 0.222          [unsmoothed 1/3 ≈ 0.333]\nBoth SEEN bigrams lost roughly half their probability mass. That mass was redistributed to the unseen continuations (each now 1/9). This over-aggressive discounting of frequent events is the standard criticism of add-one smoothing."},
  {id:"sp_m2l5", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"THE DENOMINATOR TRAP. For a bigram model a student writes P(wᵢ|wᵢ₋₁) = (c(wᵢ₋₁,wᵢ)+1)/(N+|V|), using total tokens N in the denominator. Show with the corpus <s> a b </s> · <s> a c </s> (N = 4, V = 5) why this is wrong.",
   answer:"Their formula: P(b|a) = (1+1)/(4+5) = 2/9, P(c|a) = 2/9, P(a|a) = 1/9, P(<s>|a) = 1/9, P(</s>|a) = 1/9.\nSum over all continuations of 'a' = 2/9+2/9+1/9+1/9+1/9 = 7/9 ≠ 1.\nA conditional distribution MUST sum to 1 over the possible next words. The correct denominator is c(wᵢ₋₁) + |V| = 2 + 5 = 7, giving 2/7+2/7+1/7+1/7+1/7 = 7/7 = 1 ✓\nRule to remember: the denominator must be the count of the HISTORY you conditioned on, plus |V|. N + |V| belongs only to the UNIGRAM formula, where the 'history' is the whole corpus."},
  {id:"sp_m2l6", difficulty:"moderate", kind:"interpret", src:"notes",
   q:"A bigram model is trained on 1,000,000 tokens with |V| = 50,000. A history word w occurs 4 times, and the bigram (w, x) occurs 3 times. Compute the unsmoothed and Laplace-smoothed P(x|w) and interpret the size of the change.",
   answer:"Unsmoothed: 3/4 = 0.75.\nLaplace:     (3+1)/(4+50,000) = 4/50,004 ≈ 0.00008.\nThe estimate collapsed by a factor of ~9,400.\nInterpretation: add-one adds |V| = 50,000 to a denominator that was only 4, so the observed evidence is swamped by the pseudo-counts. Laplace is only defensible when |V| is small relative to the counts; on a realistic vocabulary it destroys well-attested probabilities.\nThis is the standard motivation for better methods: add-k with k << 1, Good-Turing (which discounts based on the frequency of frequencies), or backoff/interpolation. Being able to say WHY Laplace fails here is an LO 2.3 answer."},
  {id:"sp_m2l7", difficulty:"difficult", kind:"numerical", src:"notes",
   q:"Corpus: <s> he runs fast </s> · <s> she runs slow </s> · <s> he walks fast </s>. V = 8 (he, she, runs, walks, fast, slow, <s>, </s>). Compute Laplace-smoothed P(<s> she walks fast </s>), and identify which factors were rescued from zero.",
   answer:"Counts: c(<s>)=3, c(she)=1, c(walks)=1, c(fast)=2.\nP(she|<s>)   = (1+1)/(3+8) = 2/11 ≈ 0.1818\nP(walks|she) = (0+1)/(1+8) = 1/9 ≈ 0.1111   <- RESCUED (unseen)\nP(fast|walks)= (1+1)/(1+8) = 2/9 ≈ 0.2222\nP(</s>|fast) = (2+1)/(2+8) = 3/10 = 0.30\nP(S) = 0.1818 × 0.1111 × 0.2222 × 0.30 ≈ 0.001346\nRescued: only 'she walks' was a zero bigram; without smoothing the whole sentence would score 0 despite being perfectly grammatical and using only seen words."},
  {id:"sp_m2l8", difficulty:"exam-level", kind:"numerical", src:"notes",
   q:"Q3-style, 5 marks. Corpus: <s> I like cake </s> · <s> I like tea </s> · <s> we like cake </s>. Take V = 7. (a) Compute unsmoothed P(<s> we like tea </s>). (b) Compute it with Laplace. (c) Explain the difference in one line.",
   answer:"Counts: c(<s>)=3, c(we)=1, c(like)=3, c(tea)=1.\n(a) UNSMOOTHED:\n P(we|<s>)   = 1/3\n P(like|we)  = 1/1 = 1\n P(tea|like) = 1/3\n P(</s>|tea) = 1/1 = 1\n P(S) = 1/3 × 1 × 1/3 × 1 = 1/9 ≈ 0.111\n(b) LAPLACE:\n P(we|<s>)   = (1+1)/(3+7) = 2/10 = 0.20\n P(like|we)  = (1+1)/(1+7) = 2/8 = 0.25\n P(tea|like) = (1+1)/(3+7) = 2/10 = 0.20\n P(</s>|tea) = (1+1)/(1+7) = 2/8 = 0.25\n P(S) = 0.20 × 0.25 × 0.20 × 0.25 = 0.0025\n(c) Every seen bigram was discounted to make room for unseen ones, so the smoothed probability is much lower — smoothing trades accuracy on seen events for the guarantee that no unseen event gets probability zero.\nWrite the formula, show each substitution, box both answers."}]
},
{
 id:"s_m2_nb", title:"Laplace Smoothing Applied — the Naive Bayes Classifier", topic:"2.7", marks:4,
 lo:["LO 2.3"], src:"NLP Notes p.15 (11/8)", scopeNote:true,
 idea:"The class used a spam filter and a sentiment classifier as APPLICATIONS of the add-one formula. The arithmetic is identical to the smoothing you already know; only the story changes.",
 method:"P(w | class) = ( count(w in class) + 1 ) / ( N + V )\n\n  N = total number of word tokens in that class\n  V = vocabulary size\n\nThen P(document | class) = Π P(wᵢ | class) over the words of the document,\nand you compare the score across classes.\n\nSCOPE NOTE: Naive Bayes itself is syllabus 4.2 (Module 4). It appears here\nbecause the class taught it as an application of Laplace smoothing (2.7.2).\nThe SMOOTHING ARITHMETIC is examinable for the MSE; the classifier theory\nbelongs to Module 4.",
 classQs:[
  {q:"Naive Bayes spam filter. Vocabulary size = 8, total tokens in SPAM = 20. SPAM counts: Free 6, Money 5, Win 4, Click 3, Prize 2, Meeting 0, Project 0, Launch 0. Test e-mail: “win free money meeting”. Compute P(email | SPAM).",
   steps:[
    "V = 8, N = 20, so every denominator is N + V = 28.",
    "P(win | SPAM)     = (4+1)/28 = 5/28",
    "P(free | SPAM)    = (6+1)/28 = 7/28 = 1/4",
    "P(money | SPAM)   = (5+1)/28 = 6/28",
    "P(meeting | SPAM) = (0+1)/28 = 1/28    <- would be ZERO without smoothing",
    "P(email | SPAM) = (5/28)(7/28)(6/28)(1/28) = 210/614,656"],
   answer:"P(email | SPAM) = 5/28 × 7/28 × 6/28 × 1/28 ≈ 3.42 × 10⁻⁴",
   watch:"'meeting' has count 0 in SPAM. Without add-one the entire product would be 0 and the classifier could never call this e-mail spam, no matter how many spam words it contained. That single word is the whole reason smoothing is in the syllabus."},
  {q:"Sentiment analysis of a product review. N = 25, V = 10. POSITIVE counts: great 8, love 6, excellent 5, perfect 4, amazing 2, terrible 0, refund 0, broken 0. Test review: “product broken please refund”. Compute P(review | POSITIVE).",
   steps:[
    "Every denominator is N + V = 25 + 10 = 35.",
    "'product' and 'please' are not in the listed vocabulary, so under the class's setup only the in-vocabulary words are scored (or they are treated as unseen, count 0).",
    "P(broken | POSITIVE) = (0+1)/35 = 1/35",
    "P(refund | POSITIVE) = (0+1)/35 = 1/35",
    "Taking the two out-of-list words as unseen as well: each contributes 1/35.",
    "P(review | POSITIVE) = (1/35)⁴ = 1/1,500,625 ≈ 6.66 × 10⁻⁷"],
   answer:"≈ 6.66 × 10⁻⁷ using all four words as unseen; ≈ 8.16 × 10⁻⁴ if only 'broken' and 'refund' are scored ((1/35)² ).\nEither is acceptable IF you state which words you scored. The conclusion is the same: the probability under POSITIVE is very small, so the review classifies as NEGATIVE.",
   watch:"State your out-of-vocabulary policy in one line before computing. Also: you must compare against P(review | NEGATIVE) to actually classify — a single class score means nothing on its own."}],
 practice:[
  {id:"sp_m2b1", difficulty:"easy", kind:"numerical", src:"notes",
   q:"SPAM class: N = 30 tokens, V = 10. count(offer) = 5, count(invoice) = 0. Compute the smoothed P(offer|SPAM) and P(invoice|SPAM).",
   answer:"Denominator = N + V = 40.\nP(offer|SPAM)   = (5+1)/40 = 6/40 = 0.15\nP(invoice|SPAM) = (0+1)/40 = 1/40 = 0.025"},
  {id:"sp_m2b2", difficulty:"basic", kind:"numerical", src:"notes",
   q:"HAM class: N = 40, V = 10, counts: meeting 8, project 6, free 1. Compute P(“free meeting project” | HAM).",
   answer:"Denominator = 50 for every term.\nP(free|HAM)    = (1+1)/50 = 2/50 = 0.04\nP(meeting|HAM) = (8+1)/50 = 9/50 = 0.18\nP(project|HAM) = (6+1)/50 = 7/50 = 0.14\nP = 0.04 × 0.18 × 0.14 = 0.001008 ≈ 1.008 × 10⁻³"},
  {id:"sp_m2b3", difficulty:"moderate", kind:"application", src:"notes",
   q:"Using the class SPAM figures (N=20, V=8) and the HAM figures from the previous question (N=40, V=10, meeting 8, project 6, free 1, win 0, money 0), classify the e-mail “win free money meeting” as SPAM or HAM. Show both scores.",
   answer:"SPAM (denominator 28): P = (5/28)(7/28)(6/28)(1/28) ≈ 3.42 × 10⁻⁴  [from the class example]\nHAM (denominator 50):\n P(win|HAM)     = (0+1)/50 = 0.02\n P(free|HAM)    = (1+1)/50 = 0.04\n P(money|HAM)   = (0+1)/50 = 0.02\n P(meeting|HAM) = (8+1)/50 = 0.18\n P ≈ 0.02 × 0.04 × 0.02 × 0.18 = 2.88 × 10⁻⁶\nSPAM score (3.42 × 10⁻⁴) > HAM score (2.88 × 10⁻⁶), so classify as SPAM.\nNote: strictly you should also multiply by the prior P(SPAM) and P(HAM); with equal priors the comparison above is complete. Say that line — it shows you know what 'naive Bayes' actually computes."},
  {id:"sp_m2b4", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"Why is the smoothed probability of an unseen word DIFFERENT in the SPAM class (1/28) and the HAM class (1/50), even though both words were never seen?",
   answer:"Because the denominator is class-specific: N + V uses the token count N OF THAT CLASS. SPAM has N = 20 and V = 8 giving 28; HAM has N = 40 and V = 10 giving 50.\nConsequence, and the examinable insight: a SMALLER class gives every unseen word a LARGER smoothed probability. So with add-one smoothing, sparse classes look artificially hospitable to unknown words, biasing the classifier towards the class with less training data.\nThat is a real defect, not a rounding detail — it is why the vocabulary V should be the SHARED vocabulary across all classes, and why better estimators are preferred when class sizes are unbalanced."},
  {id:"sp_m2b5", difficulty:"difficult", kind:"scenario", src:"notes",
   q:"A spam filter trained with add-one smoothing starts marking legitimate invoices as spam after the company begins receiving many new supplier e-mails. Diagnose using what you know about smoothing and the underlying counts.",
   answer:"Likely cause: VOCABULARY DRIFT plus a stale model. The new supplier e-mails contain words absent from the training data (supplier names, product codes, new terminology). Every such word gets the same tiny smoothed probability 1/(N+V) in BOTH classes, so it carries no discriminating signal — the decision falls back onto whatever few known words remain, which in an invoice may be generic commercial terms that also appear in spam ('offer', 'payment', 'free shipping').\nSecond factor: if the HAM class is smaller than the SPAM class, the denominator asymmetry above biases scores.\nFixes: retrain on recent mail so the new vocabulary is observed; use a shared vocabulary and matched class sizes; use log-probabilities and a decision threshold rather than a bare argmax; and consider an estimator that does not flatten all unseen words identically.\nLink to Module 1: this is the 'vocabulary drift' challenge — new words appear constantly and a fixed-vocabulary model degrades."}]
},
{
 id:"s_m2_goodturing", title:"Good-Turing Smoothing", topic:"2.7", marks:4,
 lo:["LO 2.3"], src:"NLP Notes p.16–18 (13/8)",
 idea:"Estimate how much probability to reserve for things you have NEVER seen by looking at how many things you have seen EXACTLY ONCE. Build the frequency-of-frequencies table first; everything else follows from it.",
 method:"Nc = the number of DISTINCT items that occur exactly c times\n     (the 'frequency of frequencies' table)\n\n1. Probability mass for UNSEEN items\n       P*_GT(0) = N₁ / N\n2. Adjusted (discounted) count for an item seen c times\n       c* = (c + 1) × N_(c+1) / N_c\n3. Smoothed probability of a seen item\n       P*_GT = c* / N\n\nORDER OF WORK, every time:\n  (a) build the Nc table   (b) read off N₁ for the unseen mass\n  (c) apply c* only to the item you were asked about",
 classQs:[
  {q:"UNIGRAM. Corpus counts: the 4, cat 3, dog 3, runs 2, sits 2, red 1, blue 1, big 1, small 1, house 1, car 1. N = 20. (a) Build the Nc table. (b) Total probability mass for unseen words. (c) Good-Turing probability of 'cat'.",
   steps:[
    "(a) Frequency-of-frequencies table — group the WORDS by their count:\n  occurs 1 time  : red, blue, big, small, house, car   -> N₁ = 6\n  occurs 2 times : runs, sits                          -> N₂ = 2\n  occurs 3 times : cat, dog                            -> N₃ = 2\n  occurs 4 times : the                                 -> N₄ = 1",
    "Check: 6(1) + 2(2) + 2(3) + 1(4) = 6 + 4 + 6 + 4 = 20 = N ✓",
    "(b) P*_GT(0) = N₁/N = 6/20 = 0.30, so 30% of the probability mass is reserved for words never seen.",
    "(c) 'cat' has c = 3:\n  c* = (c+1) × N_(c+1)/N_c = (3+1) × N₄/N₃ = 4 × (1/2) = 2\n  P(cat) = c*/N = 2/20 = 0.1"],
   answer:"(a) N₁=6, N₂=2, N₃=2, N₄=1.  (b) 30% reserved for unseen words.  (c) c*(cat) = 2 and P(cat) = 0.1 (down from the raw 3/20 = 0.15).",
   watch:"Nc counts DISTINCT WORDS, not occurrences. N₁ = 6 because six different words occur once — not because some word occurs six times. Also verify Σ c·Nc = N; that check catches almost every table error."},
  {q:"BIGRAM. Counts: “I like” 4, “I love” 3, “I want” 2, “I need” 2, “I play” 1, “I watch” 1, “I read” 1, “I study” 1. N = 15. (a) Nc table. (b) Mass for unseen bigrams. (c) Good-Turing probability of “I want”.",
   steps:[
    "(a) Group the BIGRAMS by their count:\n  occurs 1 time : I play, I watch, I read, I study -> N₁ = 4\n  occurs 2 times: I want, I need                   -> N₂ = 2\n  occurs 3 times: I love                           -> N₃ = 1\n  occurs 4 times: I like                           -> N₄ = 1",
    "Check: 4(1) + 2(2) + 1(3) + 1(4) = 4 + 4 + 3 + 4 = 15 = N ✓",
    "(b) P*_GT(0) = N₁/N = 4/15 ≈ 0.267, i.e. about 26.7% of the mass is reserved for unseen bigrams.",
    "(c) 'I want' has c = 2:\n  c* = (2+1) × N₃/N₂ = 3 × (1/2) = 1.5\n  P(I want) = c*/N = 1.5/15 = 0.1"],
   answer:"(a) N₁=4, N₂=2, N₃=1, N₄=1. (b) ≈ 26.7% reserved for unseen bigrams. (c) c* = 1.5, P(“I want”) = 0.1 (down from the raw 2/15 ≈ 0.133).",
   watch:"The class page listed N₃ and N₄ as 3 and 4 while writing the table — that is a transcription slip. Only ONE bigram occurs 3 times ('I love') and ONE occurs 4 times ('I like'), so N₃ = N₄ = 1, which is exactly what the next page uses to get c* = 3 × (1/2) = 1.5. Build the table from the definition and it comes out right."}],
 practice:[
  {id:"sp_m2g1", difficulty:"easy", kind:"numerical", src:"notes",
   q:"A corpus of N = 50 tokens has N₁ = 10 words occurring exactly once. What probability mass is reserved for unseen words?",
   answer:"P*_GT(0) = N₁/N = 10/50 = 0.20, i.e. 20% of the mass goes to words never seen in training."},
  {id:"sp_m2g2", difficulty:"easy", kind:"numerical", src:"notes",
   q:"Given N₂ = 8 and N₃ = 4, compute the adjusted count c* for a word seen twice.",
   answer:"c* = (c+1) × N_(c+1)/N_c = (2+1) × N₃/N₂ = 3 × (4/8) = 3 × 0.5 = 1.5.\nThe raw count 2 is discounted to 1.5 — the missing 0.5 is part of the mass handed to unseen events."},
  {id:"sp_m2g3", difficulty:"basic", kind:"numerical", src:"notes",
   q:"Counts: a 5, b 3, c 3, d 2, e 1, f 1, g 1. Build the Nc table, verify Σ c·Nc = N, and give the unseen mass.",
   answer:"N = 5+3+3+2+1+1+1 = 16.\nNc table: N₁ = 3 (e, f, g) · N₂ = 1 (d) · N₃ = 2 (b, c) · N₅ = 1 (a). N₄ = 0.\nCheck: 3(1) + 1(2) + 2(3) + 1(5) = 3 + 2 + 6 + 5 = 16 ✓\nUnseen mass P*_GT(0) = N₁/N = 3/16 = 0.1875 ≈ 18.75%."},
  {id:"sp_m2g4", difficulty:"basic", kind:"numerical", src:"notes",
   q:"Using the table from the previous question, compute c* and the Good-Turing probability for the word 'd' (count 2) and for 'b' (count 3).",
   answer:"'d' has c = 2: c* = 3 × N₃/N₂ = 3 × (2/1) = 6, so P(d) = 6/16 = 0.375.\n'b' has c = 3: c* = 4 × N₄/N₃ = 4 × (0/2) = 0, so P(b) = 0.\nThis is a deliberately awkward table and it exposes the method's weakness: a HOLE in the Nc table (N₄ = 0) drives c* to zero, and a small N₂ makes c* larger than c. Real implementations smooth the Nc values themselves (e.g. fit a curve, Simple Good-Turing) before applying the formula. Saying that is the analysis mark."},
  {id:"sp_m2g5", difficulty:"moderate", kind:"numerical", src:"notes",
   q:"Class-style variant. Corpus counts: the 5, of 4, and 3, in 3, cat 2, dog 2, sat 1, ran 1, hid 1, fled 1. (a) N and the Nc table. (b) Unseen mass. (c) c* and P for 'cat'. (d) c* and P for 'and'.",
   answer:"(a) N = 5+4+3+3+2+2+1+1+1+1 = 23.\n Nc: N₁ = 4 (sat, ran, hid, fled) · N₂ = 2 (cat, dog) · N₃ = 2 (and, in) · N₄ = 1 (of) · N₅ = 1 (the).\n Check: 4(1)+2(2)+2(3)+1(4)+1(5) = 4+4+6+4+5 = 23 ✓\n(b) P*_GT(0) = 4/23 ≈ 0.174 -> 17.4% reserved for unseen words.\n(c) 'cat', c = 2: c* = 3 × N₃/N₂ = 3 × (2/2) = 3, so P(cat) = 3/23 ≈ 0.130 (raw was 2/23 ≈ 0.087 — here the count went UP).\n(d) 'and', c = 3: c* = 4 × N₄/N₃ = 4 × (1/2) = 2, so P(and) = 2/23 ≈ 0.087 (raw 3/23 ≈ 0.130 — discounted).\nNote that c* can exceed c when N_(c+1) > N_c; the method redistributes rather than uniformly shrinking."},
  {id:"sp_m2g6", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"Compare, for the same corpus, how Laplace and Good-Turing decide the probability of an unseen word. Which uses evidence, and what is the practical consequence?",
   answer:"LAPLACE gives every unseen word (0+1)/(N+V) — a value that depends only on the corpus SIZE and the vocabulary size. It uses no evidence about how novel this corpus actually is, and it gives the same number to every unseen word.\nGOOD-TURING sets the total unseen mass to N₁/N — driven by how many words were seen EXACTLY ONCE, which is real evidence about the rate at which new words appear. A corpus full of hapax legomena (large N₁) is telling you it is far from exhausted, so more mass is reserved; a corpus where everything repeats reserves little.\nPractical consequence: on a large vocabulary Laplace over-reserves catastrophically (see the |V| = 50,000 case), while Good-Turing's reservation stays calibrated to observed novelty. Good-Turing's own weakness is the opposite: it needs a reliable Nc table, and Nc is itself noisy or zero for larger c — hence Simple Good-Turing smooths the Nc curve first."},
  {id:"sp_m2g7", difficulty:"difficult", kind:"interpret", src:"notes",
   q:"Corpus A: N = 10,000, N₁ = 3,000. Corpus B: N = 10,000, N₁ = 200. Both have the same vocabulary size. What does Good-Turing say about each, and which is the better training corpus for a language model?",
   answer:"A: unseen mass = 3,000/10,000 = 30%. B: unseen mass = 200/10,000 = 2%.\nA is telling you that a third of its probability mass belongs to words it has never seen — 3,000 of its types appeared exactly once, so it is nowhere near saturating its vocabulary. That is characteristic of diverse, open-domain or noisy text (or a very large latent vocabulary: names, typos, code-mixing).\nB has almost no hapax legomena, so it is repetitive and closed-domain — few surprises remain.\nWhich is better depends on the target: if the model must handle open-domain input, A is more representative but needs far more data before it is reliable; if the model serves a narrow domain matching B, B will give much lower perplexity in deployment. Answer the question by naming the deployment domain — an unqualified 'A is better' misses the point."},
  {id:"sp_m2g8", difficulty:"exam-level", kind:"numerical", src:"notes",
   q:"Q3-style, 5 marks. Bigram counts: “the cat” 4, “the dog” 3, “a cat” 2, “a dog” 2, “my cat” 1, “my dog” 1, “his cat” 1, “her dog” 1. (a) N and Nc. (b) Unseen bigram mass. (c) c* and P for “a cat”. (d) One sentence on what the reserved mass is for.",
   answer:"(a) N = 4+3+2+2+1+1+1+1 = 15.\n N₁ = 4 (my cat, my dog, his cat, her dog) · N₂ = 2 (a cat, a dog) · N₃ = 1 (the dog) · N₄ = 1 (the cat).\n Check: 4(1)+2(2)+1(3)+1(4) = 4+4+3+4 = 15 ✓\n(b) P*_GT(0) = N₁/N = 4/15 ≈ 0.267 -> 26.7%.\n(c) “a cat” has c = 2: c* = (2+1) × N₃/N₂ = 3 × (1/2) = 1.5, so P = 1.5/15 = 0.10 (raw was 2/15 ≈ 0.133).\n(d) The reserved 26.7% is the probability spread over every bigram that never occurred in training, so a test sentence containing a new bigram does not receive probability zero.\nShow the Nc table, the Σc·Nc check, the formula and box each answer."}]
},
{
 id:"s_m2_perplexity", title:"Perplexity — Evaluating a Language Model", topic:"2.7", marks:5,
 lo:["LO 2.1","LO 2.3"], src:"NLP Notes p.18–19 (18/8)", tag:"On the class 'lengthy / mandatory' list — including a TRIGRAM version",
 idea:"Perplexity is the length-normalised inverse probability of a test set: the model's average branching factor. LOWER IS BETTER. The one thing that decides your mark is what you use for N.",
 method:"Evaluation of a language model:\n  EXTRINSIC — plug it into a real task and measure the task.\n  INTRINSIC — measure the model itself: PERPLEXITY.  LOWER PERPLEXITY = BETTER MODEL.\n\nFor a test set W = w₁ w₂ … w_N :\n\n     PP(W) = P(w₁ w₂ … w_N)^(−1/N)  =  ᴺ√( 1 / P(W) )\n\n  N = the number of WORDS IN THE TEST SENTENCE.\n\nWATCH THE N: in the class's worked example the test sentence “She likes\nmangoes” has N = 3 even though FOUR bigram probabilities were multiplied\n(the <s> and </s> factors are included in P(W) but the boundary markers are\nnot counted as words in N). State your convention and stay consistent.\n\nFOUR STEPS, every time:\n  1. Rewrite the corpus with sentence boundaries.\n  2. List the bigrams of the TEST sentence.\n  3. Compute each bigram probability and multiply -> P(W).\n  4. PP(W) = ᴺ√(1/P(W)).",
 classQs:[
  {q:"Compute the perplexity of “She likes mangoes” using a bigram model over the corpus: She likes apples. She likes bananas. He likes mangoes. They eat fruits. She likes grapes.",
   steps:[
    "Step 1 — rewrite with boundaries:\n  <s> She likes apples </s>\n  <s> She likes bananas </s>\n  <s> He likes mangoes </s>\n  <s> They eat fruits </s>\n  <s> She likes grapes </s>",
    "Step 2 — bigrams of the test sentence:\n  (<s>, She) · (She, likes) · (likes, mangoes) · (mangoes, </s>)",
    "Step 3 — compute each:\n  P(She|<s>)     = c(<s>,She)/c(<s>)         = 3/5\n  P(likes|She)   = c(She,likes)/c(She)       = 3/3 = 1\n  P(mangoes|likes)= c(likes,mangoes)/c(likes)= 1/4\n  P(</s>|mangoes)= c(mangoes,</s>)/c(mangoes)= 1/1 = 1\n  P(W) = 3/5 × 1 × 1/4 × 1 = 3/20",
    "Step 4 — N = 3 (She, likes, mangoes):\n  PP(W) = (1/P(W))^(1/3) = (20/3)^(1/3) = (6.6667)^(1/3)",
    "PP(W) = 1.8821"],
   answer:"P(W) = 3/20 = 0.15 and PP(W) = ∛(20/3) = 1.8821",
   watch:"N = 3, not 4. The class counted the WORDS of the test sentence, not the number of probability factors. Also note P(likes|She) = 1 — 'likes' follows 'She' every single time, which is what pulls the perplexity so low."},
  {q:"Two unigram models are evaluated on “The patient feels very weak” (N = 5). Model A gives P_A(W) = 0.00008; Model B gives P_B(W) = 0.00002. Compute both perplexities and say which model is better.",
   steps:[
    "PP_A = (1/0.00008)^(1/5) = (12,500)^(0.2)",
    "PP_A ≈ 6.5975",
    "PP_B = (1/0.00002)^(1/5) = (50,000)^(0.2)",
    "PP_B ≈ 8.7055"],
   answer:"PP_A ≈ 6.60 and PP_B ≈ 8.71. Model A is better, because LOWER perplexity means the model was less 'surprised' by the test sentence.",
   watch:"The class's closing note: “unigram is not good enough, since it takes no word history — so bigram would be better for these types of questions.” If the question lets you choose the model, choose bigram and say why."}],
 practice:[
  {id:"sp_m2pp1", difficulty:"easy", kind:"numerical", src:"notes",
   q:"A test sentence of N = 4 words has P(W) = 1/16 under some model. Compute the perplexity.",
   answer:"PP = (1/P(W))^(1/N) = 16^(1/4) = 2.\nInterpretation: the model is, on average, choosing between 2 equally likely words at each position."},
  {id:"sp_m2pp2", difficulty:"easy", kind:"interpret", src:"notes",
   q:"Model X has perplexity 45 on a test set; Model Y has perplexity 120 on the SAME test set. Which is better and what does the number mean?",
   answer:"Model X, because lower perplexity is better.\nMeaning: perplexity is the model's average branching factor — X behaves as if it is choosing among about 45 equally likely next words at each position, Y among about 120. X is therefore less surprised by, i.e. better fitted to, the test data.\nCaveat worth adding: perplexities are only comparable on the SAME test set and the SAME vocabulary."},
  {id:"sp_m2pp3", difficulty:"basic", kind:"numerical", src:"notes",
   q:"PREVIOUS PAPER. Compute the perplexity of “We enjoy music” using a bigram model over: We enjoy sports. They play music. We love dancing. Students enjoy learning. Music makes life better.",
   answer:"Step 1 — corpus with boundaries (5 sentences):\n <s> We enjoy sports </s> · <s> They play music </s> · <s> We love dancing </s> · <s> Students enjoy learning </s> · <s> Music makes life better </s>\nStep 2 — test bigrams: (<s>,We) (We,enjoy) (enjoy,music) (music,</s>)\nStep 3 —\n P(We|<s>)      = c(<s>,We)/c(<s>) = 2/5\n P(enjoy|We)    = c(We,enjoy)/c(We) = 1/2\n P(music|enjoy) = c(enjoy,music)/c(enjoy) = 0/2 = 0   <- 'enjoy' is followed by sports and learning, never music\n P(</s>|music)  = c(music,</s>)/c(music) = 1/2  (case-insensitive: Music starts sentence 5, music ends sentence 2)\nP(W) = 2/5 × 1/2 × 0 × 1/2 = 0\nStep 4 — PP(W) = (1/0)^(1/3) = INFINITE (undefined).\nTHE ANSWER IS THE DIAGNOSIS: an unseen bigram makes P(W) = 0 and perplexity infinite, so the model must be SMOOTHED before perplexity is meaningful. With Laplace and V = 14: P(music|enjoy) = (0+1)/(2+14) = 1/16, and the perplexity becomes finite. Show the zero, name the cause, then redo it smoothed — that is the full-marks route."},
  {id:"sp_m2pp4", difficulty:"basic", kind:"numerical", src:"notes",
   q:"PREVIOUS PAPER. Compute the perplexity of “I like sweets” using a bigram model over: “I like many things to eat. I like cake. I like biscuits. And, yes, sweets. I do like them. I like jam. It is like sweets.”",
   answer:"Sentences with boundaries: <s> I like many things to eat </s> · <s> I like cake </s> · <s> I like biscuits </s> · <s> And yes sweets </s> · <s> I do like them </s> · <s> I like jam </s> · <s> It is like sweets </s>.\nTest bigrams: (<s>,I) (I,like) (like,sweets) (sweets,</s>)\n c(<s>) = 7, c(<s>,I) = 5      -> P(I|<s>) = 5/7\n c(I) = 5, c(I,like) = 4        -> P(like|I) = 4/5\n c(like) = 6, c(like,sweets) = 1 -> P(sweets|like) = 1/6\n c(sweets) = 2, c(sweets,</s>) = 2 -> P(</s>|sweets) = 2/2 = 1\nP(W) = 5/7 × 4/5 × 1/6 × 1 = 20/210 = 2/21 ≈ 0.0952\nN = 3, so PP(W) = (21/2)^(1/3) = (10.5)^(1/3) ≈ 2.1899.\nState your sentence-splitting decision for “And, yes, sweets.” — it changes c(sweets) and hence the last factor."},
  {id:"sp_m2pp5", difficulty:"moderate", kind:"numerical", src:"notes",
   q:"Compute the perplexity of “the cat ran” using a bigram model over: <s> the cat sat </s> · <s> the cat ran </s> · <s> the dog ran </s>.",
   answer:"Test bigrams: (<s>,the) (the,cat) (cat,ran) (ran,</s>)\n P(the|<s>) = 3/3 = 1\n P(cat|the) = 2/3\n P(ran|cat) = 1/2\n P(</s>|ran)= 2/2 = 1\nP(W) = 1 × 2/3 × 1/2 × 1 = 1/3\nN = 3 -> PP = 3^(1/3) ≈ 1.4422.\nVery low perplexity, because this corpus is tiny and the test sentence is almost a training sentence — a reminder that perplexity on training-like data is optimistic."},
  {id:"sp_m2pp6", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"THE N TRAP. For a 3-word test sentence a student multiplies four bigram factors and then takes the FOURTH root, getting PP = 1.606 instead of 1.882. Explain who is right and how to defend either answer.",
   answer:"The class convention takes N = the number of WORDS in the test sentence (3), giving PP = (20/3)^(1/3) = 1.8821.\nThe student took N = the number of probability FACTORS (4, because </s> was predicted too), giving (20/3)^(1/4) = 1.6062.\nBoth conventions exist in the literature: if you count </s> as a predicted token then it should also be counted in N, which is arithmetically consistent. What is NOT acceptable is mixing them — multiplying four factors and dividing by three is only correct under the class's stated convention.\nExam strategy: follow the class (N = words in the sentence), and write one line — “N = 3, the number of words in the test sentence; the </s> factor is included in P(W)” — so the examiner can see the convention you used."},
  {id:"sp_m2pp7", difficulty:"difficult", kind:"numerical", src:"notes",
   q:"TRIGRAM PERPLEXITY (named on the class 'lengthy' list). Corpus: <s> I like cake </s> · <s> I like tea </s> · <s> we like cake </s>. Compute the trigram perplexity of “I like cake”.",
   answer:"For a trigram model the first word uses a bigram history and the second a trigram history from <s>.\n P(I | <s>)          = c(<s>,I)/c(<s>) = 2/3\n P(like | <s>, I)    = c(<s>,I,like)/c(<s>,I) = 2/2 = 1\n P(cake | I, like)   = c(I,like,cake)/c(I,like) = 1/2\n P(</s> | like, cake)= c(like,cake,</s>)/c(like,cake) = 2/2 = 1\nP(W) = 2/3 × 1 × 1/2 × 1 = 1/3\nN = 3 -> PP(W) = 3^(1/3) ≈ 1.4422.\nCompare with the bigram model on the same corpus: P(I|<s>)=2/3, P(like|I)=2/2=1, P(cake|like)=2/3, P(</s>|cake)=2/2=1 giving P(W)=4/9 and PP=(9/4)^(1/3)≈1.3104. Here the BIGRAM has the lower perplexity because the trigram's counts are sparser — more context is not automatically better on a tiny corpus."},
  {id:"sp_m2pp8", difficulty:"difficult", kind:"interpret", src:"notes",
   q:"A team reports: unigram PP = 962, bigram PP = 170, trigram PP = 109 on a news test set; but in deployment on medical text the trigram model performs WORST. Explain.",
   answer:"On the news test set the ranking is the expected one — more context means better prediction, so perplexity falls as the order rises.\nIn deployment the domain changed. A trigram model is the most specialised: it depends on exact three-word sequences learnt from news, and almost none of those occur in medical text, so it backs off or hits smoothed near-zero probabilities constantly. The unigram model, which only needs individual words, degrades most gracefully.\nTwo named effects: (1) DOMAIN MISMATCH — perplexity is only meaningful on data drawn from the training distribution; (2) DATA SPARSITY — higher-order models have exponentially more parameters and therefore more zero counts on out-of-domain input.\nThe methodological point: intrinsic evaluation (perplexity on a held-out set) does not guarantee extrinsic performance. Retrain or adapt on in-domain medical text, and evaluate extrinsically on the real task."},
  {id:"sp_m2pp9", difficulty:"exam-level", kind:"numerical", src:"notes",
   q:"Q3-style, 5 marks. Corpus: <s> he likes tea </s> · <s> she likes tea </s> · <s> he likes coffee </s> · <s> she drinks coffee </s>. Compute the bigram perplexity of “she likes coffee”. Show all four steps.",
   answer:"Step 1 — corpus already has boundaries; c(<s>) = 4.\nStep 2 — test bigrams: (<s>,she) (she,likes) (likes,coffee) (coffee,</s>)\nStep 3 —\n P(she|<s>)      = c(<s>,she)/c(<s>)        = 2/4 = 1/2\n P(likes|she)    = c(she,likes)/c(she)       = 1/2\n P(coffee|likes) = c(likes,coffee)/c(likes)  = 1/3\n P(</s>|coffee)  = c(coffee,</s>)/c(coffee)  = 2/2 = 1\n P(W) = 1/2 × 1/2 × 1/3 × 1 = 1/12 ≈ 0.0833\nStep 4 — N = 3 words:\n PP(W) = (12)^(1/3) ≈ 2.2894\nBoxed: P(W) = 1/12, PP(W) ≈ 2.29. Interpretation: the model behaves as if choosing between roughly 2.3 words at each position — low, because the corpus is small and the sentence is close to the training data."}]
},
{
 id:"s_m2_bow", title:"Bag of Words (BoW) Vectors", topic:"2.8", marks:3,
 lo:["LO 2.6"], src:"NLP Notes p.20",
 idea:"Fix a vocabulary, then represent each document as a vector of counts over that vocabulary. Word order is discarded — which is both the point and the limitation.",
 method:"Statistical text representation technique. BoW represents sentences in\ndifferent forms of vectors.\n\nStep 1  Create the vocabulary — the union of all words across the documents,\n        in a FIXED order.\nStep 2  For each document, count each vocabulary word.\nStep 3  Write the counts in vocabulary order -> that is the vector.\n\nBinary/presence-only BoW writes 1/0 instead of counts.\nWords outside the fixed vocabulary are simply dropped.",
 classQs:[
  {q:"D₁ = “I love NLP”, D₂ = “I love machine learning”. Create the vocabulary and the BoW vectors.",
   steps:[
    "Step 1 — vocabulary (union of all words, fixed order):\n  [ I, love, NLP, machine, learning ]",
    "Step 2 — count of each vocabulary word in each document:\n  Doc | I | love | NLP | machine | learning\n  D₁  | 1 |  1   |  1  |    0    |    0\n  D₂  | 1 |  1   |  0  |    1    |    1",
    "Step 3 — read off the rows."],
   answer:"Vocabulary = [I, love, NLP, machine, learning]\nD₁ = [1, 1, 1, 0, 0]\nD₂ = [1, 1, 0, 1, 1]",
   watch:"Write the vocabulary out BEFORE the vectors, and keep the same order for every document. A vector is meaningless without the vocabulary that indexes it — always state both."}],
 practice:[
  {id:"sp_m2w1", difficulty:"easy", kind:"numerical", src:"notes",
   q:"D₁ = “good movie good acting”, D₂ = “bad movie”. Build the vocabulary and both count vectors.",
   answer:"Vocabulary = [good, movie, acting, bad]\nD₁ = [2, 1, 1, 0]\nD₂ = [0, 1, 0, 1]"},
  {id:"sp_m2w2", difficulty:"easy", kind:"numerical", src:"notes",
   q:"Using vocabulary [the, cat, sat, mat] give (a) the count vector and (b) the binary vector for “the cat sat on the mat”.",
   answer:"(a) Counts: the = 2, cat = 1, sat = 1, mat = 1 -> [2, 1, 1, 1]. ('on' is not in the vocabulary and is dropped.)\n(b) Binary: [1, 1, 1, 1] — presence only, so the repeat of 'the' does not show."},
  {id:"sp_m2w3", difficulty:"basic", kind:"numerical", src:"notes",
   q:"Three documents: D₁ = “I like NLP”, D₂ = “I like AI”, D₃ = “AI and NLP”. Build the vocabulary and all three BoW vectors.",
   answer:"Vocabulary = [I, like, NLP, AI, and]\nD₁ = [1, 1, 1, 0, 0]\nD₂ = [1, 1, 0, 1, 0]\nD₃ = [0, 0, 1, 1, 1]"},
  {id:"sp_m2w4", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"Vocabulary [not, good, bad]. D₁ = “not good”, D₂ = “good not bad”. Give both vectors and explain why a BoW sentiment classifier can misread one of them.",
   answer:"D₁ = [1, 1, 0]   D₂ = [1, 1, 1]\nD₁ means NEGATIVE ('not good') and D₂ means POSITIVE ('not bad' = good), but a classifier that simply counts 'good' vs 'bad' sees 'good' present in D₁ and may call it positive.\nCause: BoW has no notion of SCOPE — it cannot represent that 'not' negates the word after it, because word order and syntactic structure were discarded at step 3.\nStandard fix: use bigrams as features ('not good' becomes its own feature), or add a syntactic/semantic stage. This is precisely why the pipeline does not stop at word-level representation."},
  {id:"sp_m2w5", difficulty:"moderate", kind:"application", src:"notes",
   q:"D_A = “happy sad” and D_B = “sad happy”. Are the BoW vectors the same? What property does this demonstrate, and give one task where it is harmless and one where it is fatal.",
   answer:"Identical: with vocabulary [happy, sad] both are [1, 1].\nProperty: BoW is INVARIANT TO WORD ORDER — it represents the multiset of words, nothing more.\nHarmless: topic classification / spam detection, where the presence of certain words is the signal and order rarely matters.\nFatal: machine translation, question answering and sentiment with negation — 'the dog bit the man' and 'the man bit the dog' have identical BoW vectors but opposite meaning."},
  {id:"sp_m2w6", difficulty:"difficult", kind:"scenario", src:"notes",
   q:"Vocabulary size |V| = 5,000 and a typical document is 10 words. Name two practical problems with the resulting BoW matrix and name the Module 2 representation that addresses word IMPORTANCE.",
   answer:"Problem 1 — SPARSITY: each 5,000-dimensional vector has at most 10 non-zero entries (99.8% zeros), which wastes memory and gives very little signal per dimension. Similarity between two short documents is near zero simply because they share few positions.\nProblem 2 — COMMON WORDS DOMINATE: raw counts give high weight to 'the', 'is', 'of', which appear in every document and therefore carry no discriminating information; a nearest-neighbour search ends up ranking by function-word overlap.\nThe representation that fixes word importance is TF-IDF (2.8): it multiplies term frequency by inverse document frequency log(N/df), which drives the weight of a word appearing in nearly every document towards zero and raises the weight of words that are frequent HERE but rare elsewhere.\nAlso acceptable: cosine similarity to normalise for document length, and stop-word removal at preprocessing."}]
},
{
 id:"s_m2_tfidf", title:"TF-IDF", topic:"2.8", marks:4,
 lo:["LO 2.6","LO 2.3"], src:"NLP Notes p.20–21", tag:"Class note: “TF-IDF — don't do the whole table, word-specific only”",
 idea:"Weight a word by how often it appears HERE (TF) against how rare it is ACROSS documents (IDF). The class's explicit exam instruction: do not compute the entire table — compute only the words asked for.",
 method:"TF-IDF assigns a numerical weight to a word based on how frequently the\nword occurs in a particular document.\n\n     TF  = (number of occurrences of the word in the document)\n           ------------------------------------------------\n           (total number of words in the document)\n\n     IDF = log (  total number of sentences / documents\n                  --------------------------------------  )\n                  number of sentences containing the word\n\n     TF-IDF = TF × IDF\n\nThe class used log base 10, so log(3/2) = 0.1761 and log(3/1) = 0.4771.\n\nEXAM INSTRUCTION FROM THE NOTES:\n  “TF-IDF — don't do it for the whole table, do word-specific only.”\n  Read the question: if it names a word and a document, compute only that\n  cell. Computing all of them wastes the time the brief tells you to manage.",
 classQs:[
  {q:"Compute TF-IDF for the corpus D₁ = “I love NLP”, D₂ = “I love machine learning”, D₃ = “NLP is useful”.",
   steps:[
    "Step 1 — TF (occurrences ÷ document length):\n  D₁ (3 words): I = 1/3, love = 1/3, NLP = 1/3\n  D₂ (4 words): I = 1/4, love = 1/4, machine = 1/4, learning = 1/4\n  D₃ (3 words): NLP = 1/3, is = 1/3, useful = 1/3",
    "Step 2 — IDF (total documents = 3; count how many documents contain the word):\n  I        in 2 docs -> log(3/2) = 0.1761\n  love     in 2 docs -> log(3/2) = 0.1761\n  NLP      in 2 docs -> log(3/2) = 0.1761\n  machine  in 1 doc  -> log(3/1) = 0.4771\n  learning in 1 doc  -> log(3/1) = 0.4771\n  is       in 1 doc  -> log(3/1) = 0.4771\n  useful   in 1 doc  -> log(3/1) = 0.4771",
    "Step 3 — TF-IDF = TF × IDF, document by document:\n  D₁: I = 1/3 × 0.1761 = 0.0587 · love = 0.0587 · NLP = 0.0587\n  D₂: I = 1/4 × 0.1761 = 0.0440 · love = 0.0440 · machine = 1/4 × 0.4771 = 0.1193 · learning = 0.1193\n  D₃: NLP = 1/3 × 0.1761 = 0.0587 · is = 1/3 × 0.4771 = 0.1590 · useful = 0.1590"],
   answer:"TF-IDF(D₁) = [0.0587, 0.0587, 0.0587]  (I, love, NLP)\nTF-IDF(D₂) = [0.0440, 0.0440, 0.1193, 0.1193]  (I, love, machine, learning)\nTF-IDF(D₃) = [0.0587, 0.1590, 0.1590]  (NLP, is, useful)",
   watch:"Two checks. (1) A word appearing in EVERY document gets IDF = log(N/N) = log 1 = 0, so its TF-IDF is exactly 0 — that is the mechanism by which TF-IDF kills stop-words. (2) 'machine' and 'learning' outscore 'I' and 'love' in D₂ even though all four have the same TF, purely because they are rarer across the corpus. That contrast IS the interpretation mark."}],

  {id:"sp_m2ti3", difficulty:"basic", kind:"numerical", src:"notes",
   q:"WORD-SPECIFIC (as the class instructs). Corpus: D₁ = “data is the new oil”, D₂ = “data science uses data”, D₃ = “oil prices rise”. Compute TF-IDF of 'data' in D₂ and of 'oil' in D₁.",
   answer:"'data' in D₂: D₂ has 4 words and 'data' occurs twice -> TF = 2/4 = 0.5.\n 'data' appears in D₁ and D₂ -> df = 2, IDF = log(3/2) = 0.1761.\n TF-IDF = 0.5 × 0.1761 = 0.0881.\n'oil' in D₁: D₁ has 5 words, 'oil' occurs once -> TF = 1/5 = 0.2.\n 'oil' appears in D₁ and D₃ -> df = 2, IDF = log(3/2) = 0.1761.\n TF-IDF = 0.2 × 0.1761 = 0.0352.\nOnly these two cells were asked for, so only these two were computed."},
  {id:"sp_m2ti4", difficulty:"basic", kind:"numerical", src:"notes",
   q:"Corpus: D₁ = “I like NLP”, D₂ = “I like AI”, D₃ = “AI and NLP”. Compute the TF-IDF of 'I', 'NLP' and 'and' in D₁ or D₃ as appropriate.",
   answer:"'I' in D₁: TF = 1/3; df = 2 (D₁, D₂); IDF = log(3/2) = 0.1761; TF-IDF = 0.0587.\n'NLP' in D₁: TF = 1/3; df = 2 (D₁, D₃); IDF = 0.1761; TF-IDF = 0.0587.\n'and' in D₃: TF = 1/3; df = 1 (D₃ only); IDF = log(3/1) = 0.4771; TF-IDF = 0.1590.\nThe rare word 'and' scores nearly 3× the common ones — in a 3-document toy corpus, rarity dominates."},
  {id:"sp_m2ti5", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"Two words in the same document have the same TF, but their TF-IDF scores differ by a factor of 4. What must be true, and which word is more useful for retrieval?",
   answer:"Since TF-IDF = TF × IDF and the TFs are equal, the IDFs must differ by a factor of 4 — so the two words have very different document frequencies.\nIDF = log(N/df), so a 4× larger IDF means a much smaller df: the higher-scoring word appears in far fewer documents.\nThe higher-scoring (rarer) word is more useful for retrieval, because it discriminates between documents. The common word appears everywhere and cannot separate relevant from irrelevant results.\nConcretely with N = 1000: IDF = 3 needs df = 1, IDF = 0.75 needs df ≈ 178."},
  {id:"sp_m2ti6", difficulty:"moderate", kind:"interpret", src:"notes",
   q:"In a corpus of medical abstracts, 'patient' has a very LOW TF-IDF in every document while 'sarcoidosis' has a very high one. Is the system broken? What does this tell you about choosing a corpus?",
   answer:"Not broken — it is working exactly as designed. 'patient' appears in nearly every medical abstract, so its df ≈ N and IDF ≈ log(1) ≈ 0; 'sarcoidosis' appears in a handful, so its IDF is large.\nWhat it tells you: IDF is relative to THE COLLECTION, not to language in general. In a general news corpus 'patient' would be rare and score highly; in a medical corpus it has become a domain stop-word.\nPractical consequence: choose the collection deliberately. If you want to distinguish medical documents FROM NEWS, a mixed corpus is right. If you want to distinguish medical documents FROM EACH OTHER, a medical-only corpus is right — and then 'patient' correctly carries no weight."},
  {id:"sp_m2ti7", difficulty:"difficult", kind:"numerical", src:"notes",
   q:"Corpus of 4 documents. D₁ = “cricket match india win” (4 words). 'cricket' appears in 2 documents, 'india' in 4, 'win' in 1. Compute the TF-IDF of all three in D₁ and rank them as index terms.",
   answer:"Each word occurs once in a 4-word document, so TF = 1/4 = 0.25 for all three.\n cricket: IDF = log(4/2) = log 2 = 0.3010 -> TF-IDF = 0.25 × 0.3010 = 0.0753\n india:   IDF = log(4/4) = log 1 = 0      -> TF-IDF = 0\n win:     IDF = log(4/1) = log 4 = 0.6021 -> TF-IDF = 0.25 × 0.6021 = 0.1505\nRanking as index terms: win (0.1505) > cricket (0.0753) > india (0).\nInterpretation: identical TF, completely different weights — the ranking is driven entirely by IDF. 'india' is worthless as an index term in this collection because every document contains it."},
  {id:"sp_m2ti8", difficulty:"exam-level", kind:"numerical", src:"notes",
   q:"Q1/Q2-style. Corpus: D₁ = “the sun is hot”, D₂ = “the moon is cold”, D₃ = “the sun is bright”. Compute the TF-IDF of 'the', 'sun' and 'hot' in D₁. State what each result means.",
   answer:"D₁ has 4 words, each of the three occurs once, so TF = 1/4 = 0.25 for all.\n 'the': df = 3 of 3 -> IDF = log(3/3) = 0 -> TF-IDF = 0.\n   Means: a pure stop-word in this collection, no discriminating value.\n 'sun': df = 2 (D₁, D₃) -> IDF = log(3/2) = 0.1761 -> TF-IDF = 0.25 × 0.1761 = 0.0440.\n   Means: moderately useful — it separates D₁ and D₃ from D₂.\n 'hot': df = 1 (D₁ only) -> IDF = log(3/1) = 0.4771 -> TF-IDF = 0.25 × 0.4771 = 0.1193.\n   Means: the strongest index term for D₁ — unique to it.\nBox the three values and give the one-line interpretation for each; the class brief lists the final answer as mandatory."}]
}

 id:"s_m3_hmm", title:"HMM for POS Tagging — Emission and Transition Matrices", topic:"3.1", marks:5,
 lo:["LO 3.1","LO 3.3"], src:"NLP Notes p.23–25 (25/8)", tag:"Named for Q3 in the class MSE brief (5 marks) — and it was a previous-paper question",
 idea:"Two matrices, two formulas, one convention. Build the tag-count row totals FIRST; every denominator comes from them.",
 method:"An HMM tagger provides three things:\n  1st  EMISSION probabilities        2nd  STATE TRANSITION probabilities\n  3rd  INITIAL probability matrix (IPM / π)\n\nThe derivation (notes p.23–24):\n  T̂ = argmax_T P(T|W)                        ... (1)\n  Bayes: T̂ = argmax_T P(W|T)P(T)/P(W)         ... (2)\n  Drop P(W), the same for every candidate tag sequence:\n  T̂ = argmax_T P(W|T) · P(T)                  ... (3)\n         └ likelihood ┘  └ prior ┘\n  Chain rule + MARKOV (bigram) assumption on P(T):\n         P(T) = Π P(tᵢ | tᵢ₋₁)                ... (5)\n  Chain rule + LEXICAL assumption on P(W|T):\n         P(W|T) = Π P(wᵢ | tᵢ)                ... (7)\n  Substituting (5) and (7) into (3):\n\n      T̂ = argmax_T  Π  P(wᵢ | tᵢ) · P(tᵢ | tᵢ₋₁)\n                        └ emission ┘ └ transition ┘\n\nTHE TWO FORMULAS:\n      EMISSION    P(wᵢ | tᵢ)    = c(tᵢ, wᵢ) / c(tᵢ)\n      TRANSITION  P(tᵢ | tᵢ₋₁)  = c(tᵢ₋₁, tᵢ) / c(tᵢ₋₁)\n\nDenominators are always the TAG count, never the word count.\nEvery ROW of each matrix must sum to 1 — use that as your check.",
 classQs:[
  {q:"Compute the emission and transition probabilities for the corpus:\n<s> Book/V a/DET car/N </s>\n<s> Park/V the/DET car/N </s>\n<s> The/DET book/N is/V in/PREP the/DET car/N </s>\n<s> The/DET car/N is/V in/PREP a/DET park/N </s>",
   steps:[
    "Step 1 — count each TAG (these become every denominator):\n  V   = 4  (Book, Park, is, is)\n  DET = 6  (a, the, The, the, The, a)\n  N   = 6  (car, car, book, car, car, park)\n  PREP= 2  (in, in)\n  <s> = 4",
    "Step 2 — EMISSION matrix P(word | tag) = c(tag,word)/c(tag):\n\n         V(4)   DET(6)  N(6)   PREP(2)\n  book   1/4     0      1/6      0\n  a       0     2/6      0       0\n  car     0      0      4/6      0\n  park   1/4     0      1/6      0\n  is     2/4     0       0       0\n  in      0      0       0      2/2 = 1\n  the     0     4/6      0       0\n\n  Column check: each COLUMN sums to 1 (all the words a tag can emit).\n  V: 1/4+1/4+2/4 = 1 ✓  DET: 2/6+4/6 = 1 ✓  N: 1/6+4/6+1/6 = 1 ✓",
    "Step 3 — TRANSITION matrix P(tᵢ | tᵢ₋₁) = c(tᵢ₋₁,tᵢ)/c(tᵢ₋₁), rows = FROM, columns = TO:\n\n            N      V      DET    PREP   </s>\n  <s>(4)    0     2/4     2/4     0      0\n  N(6)      0     2/6      0      0     4/6\n  V(4)      0      0      2/4    2/4     0\n  DET(6)   6/6     0       0      0      0\n  PREP(2)   0      0      2/2     0      0\n\n  Row check: every row sums to 1 ✓"],
   answer:"Emission and transition matrices as above. Key entries: P(car|N) = 4/6, P(is|V) = 2/4, P(in|PREP) = 1, P(DET|<s>) = 2/4, P(N|DET) = 1, P(</s>|N) = 4/6.",
   watch:"Three habits that earn the marks: (1) write the tag counts as a row of denominators first; (2) label rows FROM and columns TO on the transition matrix; (3) check that every transition ROW sums to 1 and every emission COLUMN sums to 1. Do not mix the two directions — P(word|tag) is emission, P(tag|word) is not a thing in this model."},
  {q:"PREVIOUS PAPER. Same task for: <s> the/DT students/NN pass/V the/DT test/NN </s> · <s> the/DT students/NN wait/V for/P the/DT result/NN </s> · <s> teachers/NN test/V students/NN </s>",
   steps:[
    "Step 1 — tag counts:\n  DT = 4 (the ×4)\n  NN = 6 (students, test, students, result, teachers, students)\n  V  = 3 (pass, wait, test)\n  P  = 1 (for)\n  <s>= 3",
    "Step 2 — EMISSION P(word|tag):\n  P(the|DT) = 4/4 = 1\n  P(students|NN) = 3/6 = 1/2 · P(test|NN) = 1/6 · P(result|NN) = 1/6 · P(teachers|NN) = 1/6\n  P(pass|V) = 1/3 · P(wait|V) = 1/3 · P(test|V) = 1/3\n  P(for|P)  = 1/1 = 1\n  Column checks: NN 3/6+1/6+1/6+1/6 = 1 ✓ · V 1/3×3 = 1 ✓",
    "Step 3 — TRANSITION P(tᵢ|tᵢ₋₁):\n  From <s>(3): DT 2/3, NN 1/3\n  From DT(4): NN 4/4 = 1\n  From NN(6): V 2/6, </s> 3/6, NN 1/6\n     (students->pass, students->wait give V; test</s>, result</s>, students</s> give </s>;\n      teachers->test... note 'test' here is V, so NN->V; and V->NN for test->students)\n  From V(3): DT 2/3, P... — read them off sentence by sentence.\n  From P(1): DT 1/1 = 1"],
   answer:"Emission: P(the|DT)=1, P(students|NN)=1/2, P(test|NN)=P(result|NN)=P(teachers|NN)=1/6, P(pass|V)=P(wait|V)=P(test|V)=1/3, P(for|P)=1.\nTransition: P(DT|<s>)=2/3, P(NN|<s>)=1/3, P(NN|DT)=1, P(DT|P)=1, and the NN and V rows as traced above.",
   watch:"Note that 'test' is tagged NN in one sentence and V in another — that is the whole point of the corpus. Its emission probability appears in BOTH columns (1/6 under NN and 1/3 under V), and the transition matrix is what decides which reading wins in context."}],
 practice:[
  {id:"sp_m3h1", difficulty:"easy", kind:"numerical", src:"notes",
   q:"Corpus: <s> the/DT dog/N runs/V </s> · <s> the/DT cat/N sleeps/V </s>. Compute all emission probabilities.",
   answer:"Tag counts: DT = 2, N = 2, V = 2.\nP(the|DT) = 2/2 = 1\nP(dog|N)  = 1/2 · P(cat|N) = 1/2\nP(runs|V) = 1/2 · P(sleeps|V) = 1/2\nEach tag's column sums to 1 ✓"},
  {id:"sp_m3h2", difficulty:"easy", kind:"numerical", src:"notes",
   q:"Same corpus. Compute all transition probabilities including <s> and </s>.",
   answer:"c(<s>) = 2, c(DT) = 2, c(N) = 2, c(V) = 2.\nP(DT|<s>) = 2/2 = 1\nP(N|DT)   = 2/2 = 1\nP(V|N)    = 2/2 = 1\nP(</s>|V) = 2/2 = 1\nEvery row sums to 1 ✓. This corpus is perfectly regular, so every transition is deterministic."},
  {id:"sp_m3h3", difficulty:"basic", kind:"numerical", src:"notes",
   q:"Corpus: <s> he/PRO runs/V fast/ADV </s> · <s> she/PRO runs/V </s> · <s> he/PRO walks/V slow/ADV </s>. Compute (a) P(runs|V), (b) P(he|PRO), (c) P(V|PRO), (d) P(</s>|V), (e) P(ADV|V).",
   answer:"Tag counts: PRO = 3, V = 3, ADV = 2, <s> = 3.\n(a) P(runs|V) = 2/3\n(b) P(he|PRO) = 2/3\n(c) P(V|PRO) = 3/3 = 1  (every PRO is followed by a V)\n(d) P(</s>|V) = 1/3  (only 'she runs' ends after the verb)\n(e) P(ADV|V) = 2/3\nCheck the V row: ADV 2/3 + </s> 1/3 = 1 ✓"},
  {id:"sp_m3h4", difficulty:"basic", kind:"numerical", src:"notes",
   q:"Using the class corpus (Book/V a/DET car/N · Park/V the/DET car/N · The/DET book/N is/V in/PREP the/DET car/N · The/DET car/N is/V in/PREP a/DET park/N), compute P(book|N), P(book|V), P(park|N) and P(park|V). What do these four numbers tell you?",
   answer:"Tag counts: N = 6, V = 4.\nP(book|N) = 1/6 ≈ 0.167   P(book|V) = 1/4 = 0.25\nP(park|N) = 1/6 ≈ 0.167   P(park|V) = 1/4 = 0.25\nBoth 'book' and 'park' are AMBIGUOUS words — each can be emitted by two different tags. Emission alone slightly favours V for both. The tie is broken by the TRANSITION probabilities: after a DET, P(N|DET) = 1 and P(V|DET) = 0, so 'the book' must be tagged N regardless of the emission preference.\nThat interaction between emission and transition is the entire reason an HMM works."},
  {id:"sp_m3h5", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"A student computes emission as P(tag|word) = c(tag,word)/c(word) instead of P(word|tag) = c(tag,word)/c(tag). Using the class corpus, compute both for 'car' and explain which the HMM needs and why.",
   answer:"'car' occurs 4 times, always tagged N; c(N) = 6.\nCorrect emission P(car|N) = c(N,car)/c(N) = 4/6 ≈ 0.667.\nStudent's version P(N|car) = c(N,car)/c(car) = 4/4 = 1.\nThe HMM needs P(word|tag). Reason: the model is GENERATIVE — it imagines the tag sequence being produced first (by the transition model) and then each tag emitting a word. The decomposition T̂ = argmax P(W|T)·P(T) comes straight from Bayes' theorem, and P(W|T) is a product of P(wᵢ|tᵢ) terms.\nUsing P(tag|word) would be a DISCRIMINATIVE model — that is in fact what an MEMM/CRF does (3.2), and it is a different model with different properties, not a shortcut for the HMM.\nPractical symptom of the mistake: the columns will not sum to 1, and rare words get emission probability 1, dominating the trellis."},
  {id:"sp_m3h6", difficulty:"moderate", kind:"application", src:"notes",
   q:"Using the class corpus, a test sentence begins with the word 'book'. Should it be tagged N or V? Show the calculation for the FIRST word and state the general rule.",
   answer:"For the first word the score is P(tag | <s>) × P(book | tag).\nAs V: P(V|<s>) × P(book|V) = 2/4 × 1/4 = 0.125\nAs N: P(N|<s>) × P(book|N) = 0/4 × 1/6 = 0\nSo 'book' at the start of a sentence is tagged V.\nGeneral rule: the transition from <s> is doing the work — in this corpus a sentence never starts with a noun (it starts with V or DET), so the N reading is impossible no matter how good its emission probability is. A single zero in the transition matrix rules out an entire path, which is a strong argument for smoothing the HMM's counts too."},
  {id:"sp_m3h7", difficulty:"difficult", kind:"numerical", src:"notes",
   q:"Corpus: <s> time/N flies/V fast/ADV </s> · <s> flies/N fly/V </s> · <s> time/V flies/N </s>. Build the full emission and transition matrices and identify every ambiguous word.",
   answer:"Tag counts: N = 4 (time, flies, time-no wait) — count carefully:\n s1: time/N flies/V fast/ADV\n s2: flies/N fly/V\n s3: time/V flies/N\n N = time(s1), flies(s2), flies(s3) = 3\n V = flies(s1), fly(s2), time(s3) = 3\n ADV = fast = 1 · <s> = 3\nEMISSION P(word|tag):\n P(time|N) = 1/3 · P(flies|N) = 2/3\n P(flies|V) = 1/3 · P(fly|V) = 1/3 · P(time|V) = 1/3\n P(fast|ADV) = 1/1 = 1\n Columns: N 1/3+2/3 = 1 ✓ · V 1/3×3 = 1 ✓\nTRANSITION:\n From <s>(3): N 2/3 (s1, s2), V 1/3 (s3)\n From N(3): V 2/3 (s1 time->flies, s2 flies->fly), </s> 1/3 (s3 ends on flies/N)\n From V(3): ADV 1/3 (s1), </s> 1/3 (s2), N 1/3 (s3 time/V -> flies/N)\n From ADV(1): </s> 1/1 = 1\n Every row sums to 1 ✓\nAMBIGUOUS WORDS: 'time' (N and V) and 'flies' (N and V). 'fast' and 'fly' are unambiguous in this corpus.\nThis is the classic “Time flies like an arrow” ambiguity encoded as a tagging problem."},
  {id:"sp_m3h8", difficulty:"exam-level", kind:"numerical", src:"notes",
   q:"Q3-style, 5 marks. Corpus: <s> John/N eats/V rice/N </s> · <s> Mary/N eats/V bread/N </s> · <s> John/N cooks/V rice/N </s>. Give the full emission and transition matrices, with the row/column checks.",
   answer:"TAG COUNTS: N = 6 (John, rice, Mary, bread, John, rice), V = 3 (eats, eats, cooks), <s> = 3.\n\nEMISSION P(word|tag), columns must sum to 1:\n            N(6)     V(3)\n  John      2/6       0\n  rice      2/6       0\n  Mary      1/6       0\n  bread     1/6       0\n  eats       0       2/3\n  cooks      0       1/3\n  Check: N column 2/6+2/6+1/6+1/6 = 1 ✓ · V column 2/3+1/3 = 1 ✓\n\nTRANSITION P(to | from), rows must sum to 1:\n            N      V     </s>\n  <s>(3)   3/3=1   0      0\n  N(6)      0     3/6    3/6\n  V(3)     3/3=1   0      0\n  Check: <s> row = 1 ✓ · N row 1/2+1/2 = 1 ✓ · V row = 1 ✓\n\nInterpretation line worth adding: P(N|<s>) = 1 and P(N|V) = 1 mean this corpus is rigidly N V N, so the transition model alone almost determines the tagging."}]

{
 id:"s_m3_hmmtable", title:"HMM Enumeration — Scoring Every Tag Sequence", topic:"3.1", marks:5,
 lo:["LO 3.1","LO 3.3"], src:"NLP Notes p.25 (25/8)",
 idea:"When the sentence is short, you can simply enumerate every possible tag sequence, score each one, and pick the largest. This is what Viterbi replaces once the sentence gets long.",
 method:"Score of a tag sequence = π(X₀) · P(O₀|X₀) · P(X₀,X₁) · P(O₁|X₁) · P(X₁,E)\n\n  π(X₀)      initial probability of the first tag (the IPM)\n  P(Oᵢ|Xᵢ)   emission — probability the tag Xᵢ produced the observed word Oᵢ\n  P(Xᵢ,Xⱼ)   transition from tag Xᵢ to tag Xⱼ\n  P(X,E)     transition into the END state\n\nNumber of rows in the table = (number of tags)^(number of words).\nNORMALIZE at the end:  P̂ = Pᵣ / Σ Pᵣ  so the scores become probabilities.",
 classQs:[
  {q:"Generate the HMM table for the sentence “Test passed”, with IPM π = [NN 0.9, VB 0.1] and the transition/emission values from the class state graphs. Which tag sequence wins?",
   steps:[
    "There are 2 tags and 2 words, so 2² = 4 candidate sequences: NN NN, NN VB, VB NN, VB VB.",
    "For each, multiply: π(X₀) × P(O₀|X₀) × P(X₀,X₁) × P(O₁|X₁) × P(X₁,End).",
    "X₀ X₁ | π(X₀) | P(O₀|X₀) | P(X₀,X₁) | P(O₁|X₁) | P(X₁,E) | Pᵣ\n  NN NN |  0.9  |   0.9    |   0.05   |   0.08   |  0.05   | 0.000162\n  NN VB |  0.9  |   0.9    |   0.90   |   0.92   |  0.05   | 0.033534\n  VB NN |  0.1  |   0.1    |   0.45   |   0.08   |  0.05   | 0.000018\n  VB VB |  0.1  |   0.1    |   0.50   |   0.92   |  0.05   | 0.000230",
    "Σ Pᵣ ≈ 0.033944.",
    "Normalise: NN VB = 0.033534 / 0.033944 ≈ 0.988 — overwhelmingly the largest."],
   answer:"Output: [ ('test', 'NN'), ('passed', 'VB') ].\nThe NN-VB sequence takes about 98.8% of the total probability mass; the other three are negligible.",
   watch:"Two points. (1) Every row must use the SAME five factors — a missing P(X₁,E) term silently changes the ranking. (2) Enumeration is exponential: 2 tags and 2 words gives 4 rows, but 45 tags and 20 words gives 45²⁰ rows. That explosion is exactly why Viterbi exists, and saying so is worth a mark."}],
 practice:[
  {id:"sp_m3e1", difficulty:"easy", kind:"numerical", src:"notes",
   q:"With 3 possible tags and a 4-word sentence, how many tag sequences must enumeration score? With 45 tags and 10 words?",
   answer:"3⁴ = 81 sequences.\n45¹⁰ ≈ 3.4 × 10¹⁶ sequences — completely infeasible.\nThis is the motivation for Viterbi, which uses dynamic programming to reduce the work to O(N · T²) where N is the sentence length and T the number of tags: 10 × 45² = 20,250 operations instead of 10¹⁶."},
  {id:"sp_m3e2", difficulty:"basic", kind:"numerical", src:"notes",
   q:"Two tags {A, B}, π = [A 0.6, B 0.4]. Word w₁: P(w₁|A) = 0.5, P(w₁|B) = 0.2. Transitions P(A|A) = 0.7, P(B|A) = 0.3, P(A|B) = 0.4, P(B|B) = 0.6. Word w₂: P(w₂|A) = 0.1, P(w₂|B) = 0.8. Ignore the end transition. Score all four sequences and pick the winner.",
   answer:"A A: 0.6 × 0.5 × 0.7 × 0.1 = 0.021\nA B: 0.6 × 0.5 × 0.3 × 0.8 = 0.072\nB A: 0.4 × 0.2 × 0.4 × 0.1 = 0.0032\nB B: 0.4 × 0.2 × 0.6 × 0.8 = 0.0384\nWinner: A B with 0.072.\nNormalised: total = 0.1346, so P(A B) ≈ 0.535, P(B B) ≈ 0.285, P(A A) ≈ 0.156, P(B A) ≈ 0.024."},
  {id:"sp_m3e3", difficulty:"moderate", kind:"interpret", src:"notes",
   q:"In the class 'Test passed' table, NN VB scored 0.0335 while VB NN scored 0.000018 — a ratio of about 1,860:1. Trace WHICH factors created that gap.",
   answer:"Compare factor by factor:\n π: 0.9 vs 0.1 — a 9× advantage to starting with NN (the IPM says sentences here usually start with a noun).\n Emission of 'test': 0.9 as NN vs 0.1 as VB — another 9×.\n Transition: 0.90 (NN->VB) vs 0.45 (VB->NN) — 2×.\n Emission of 'passed': 0.92 as VB vs 0.08 as NN — 11.5×.\n End transition: 0.05 for both — no effect.\nCombined: 9 × 9 × 2 × 11.5 ≈ 1,863 ✓\nThe dominant contributors are the two EMISSION probabilities: 'test' looks like a noun and 'passed' looks strongly like a verb. The transition model agrees but contributes only a factor of 2. Being able to attribute the result to specific factors is the interpretation mark (LO 3.4)."},
  {id:"sp_m3e4", difficulty:"difficult", kind:"tricky", src:"notes",
   q:"A student normalises the four scores and reports P(NN VB) = 0.988, then claims 'the tagger is 98.8% accurate'. Correct this.",
   answer:"The two things are unrelated.\n0.988 is the model's POSTERIOR CONFIDENCE in one tag sequence for one sentence, given the model's own parameters. It is a statement about the model's internal belief, not about how often the model is right.\nACCURACY is an empirical quantity measured on held-out GOLD-STANDARD data: (correctly tagged tokens) / (total tokens), across many sentences.\nA model can be 98.8% confident and wrong — indeed a badly estimated HMM trained on a tiny corpus will be extremely confident, because zero and near-zero counts make the alternatives look impossible. Overconfidence from sparse data is a known HMM failure mode, and smoothing the emission/transition counts is the standard remedy.\nThis distinction (confidence vs accuracy) is a direct LO 3.4 'limitations and sources of error' answer."}]
