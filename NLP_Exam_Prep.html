  {t:"p", v:"W = w₁, w₂, w₃, … w<sub>N</sub> → the <b>words</b> in the corpus (<b>observed</b>)<br>T = t₁, t₂, t₃, … t<sub>N</sub> → the corresponding <b>tags</b> (<b>unknown</b>)"},
  {t:"flow", v:"ex:    I      love    pizza\n       w₁      w₂      w₃\n       ↓       ↓       ↓\n       t₁      t₂      t₃\n     [ PR  ·  VB  ·  NN ]"},
  {t:"p", v:"To find the unambiguous tag sequence given the word sequence, we have to find <b>T̂</b> (or T*) which is the <b>most probable tag sequence</b>. It is found from the argmax of the probability of T given W — i.e. among all the possible sequences of POS tags that the word sequence can take, the one with the max probability."},
  {t:"formula", v:"T̂ = argmax_T  P(T | W)        —(1)"},
  {t:"p", v:"<b>Apply Bayes' theorem</b> of conditional probability on eqn (1): &nbsp; P(x|y) = P(y|x)·P(x) / P(y)"},
  {t:"formula", v:"T̂ = argmax_T  P(W|T) P(T) / P(W)\n\nrewritten for n words:\n\nt̂₁ⁿ = argmax_{t₁ⁿ}  P(w₁ⁿ | t₁ⁿ) P(t₁ⁿ) / P(w₁ⁿ)        —(II)"},
  {t:"p", v:"<b>Simplify eqn (II) by dropping the denominator P(w₁ⁿ)</b> — because the set of words will be the same for all candidate tag sequences."},
  {t:"formula", v:"t̂₁ⁿ = argmax_{t₁ⁿ}  P(w₁ⁿ | t₁ⁿ) · P(t₁ⁿ)        —(III)\n                     └──────┬──────┘   └───┬───┘\n                        likelihood        prior prob\n                   (prob of the word     of the tag\n                    sequence for a        sequence\n                    given tag sequence)"},
  {t:"p", v:"<b>Apply the chain rule</b> on the prior P(t₁ⁿ):"},
  {t:"formula", v:"P(t₁ⁿ) = P(t₁) P(t₂|t₁) P(t₃|t₁t₂) … P(tₙ | t₁, t₂ … tₙ₋₁)        —(IV)"},
  {t:"p", v:"<b>Apply Markov's assumption</b> on eqn (IV):"},
  {t:"formula", v:"P(t₁ⁿ) = P(t₁) P(t₂|t₁) P(t₃|t₂) … P(tₙ|tₙ₋₁)\n\n       = ∏ᵢ₌₁ⁿ P(tᵢ | tᵢ₋₁)        —(V)   { Bigram Assumption }"},
  {t:"p", v:"<b>Apply the chain rule</b> on the likelihood P(w₁ⁿ | t₁ⁿ) from eqn (III):"},
  {t:"formula", v:"P(w₁ⁿ|t₁ⁿ) = P(w₁|t₁…tₙ) P(w₂|w₁,t₁…tₙ) … P(wₙ|w₁…wₙ₋₁, t₁…tₙ)   —(VI)"},
  {t:"p", v:"<b>Apply Markov's assumption</b> on eqn (VI):"},
  {t:"formula", v:"P(w₁ⁿ | t₁ⁿ) = ∏ᵢ₌₁ⁿ P(wᵢ | tᵢ)        —(VII)  { Lexical Prob. assumption }"},
  {t:"p", v:"<b>Substitute (V) &amp; (VII) into (III):</b>"},
  {t:"formula", v:"t̂₁ⁿ = argmax_{t₁ⁿ}  ∏ᵢ₌₁ⁿ  P(wᵢ | tᵢ) · P(tᵢ | tᵢ₋₁)\n                            └────┬────┘   └─────┬─────┘\n                            Emission prob   State transition prob"},
  {t:"formula", v:"P(wᵢ | tᵢ)   = c(tᵢ, wᵢ) / c(tᵢ)\n\nP(tᵢ | tᵢ₋₁) = c(tᵢ₋₁, tᵢ) / c(tᵢ₋₁)"},
  {t:"warn", v:"This whole derivation is a standing 5-mark answer. The examiner is looking for the numbered chain: <b>(1) argmax P(T|W) → Bayes → (III) drop P(W) → chain rule → Markov → emission × transition</b>. Label your equations exactly like this."}

></td></tr><tr><td></td><td></td><td>M</td><td>N</td><td>M</td><td></td></tr></table>1 × 2 × 2 × 2 = <b>8 possible paths</b><br><br>At each node keep only the <b>greater-value path</b> (prev prob × emission × transition), then read the surviving path back.<br><br><b>∴ &lt;s&gt; Justin[N] will[M] spot[V] Will[N] &lt;E&gt;</b><br><b>Path probability = 0.000374</b>"},

  {t:"ex",
   q:"Construct the CYK table &amp; parse tree for the input sentence <b>&ldquo;The flight includes a meal&rdquo;</b>.<br><br>S → NP VP ; NP → Det N ; VP → V NP ; V → includes ; Det → The ; Det → a ; N → meal ; N → flight",
   a:"<b>CYK chart</b> — cell (i,j) holds every non-terminal that can generate the span from word i to word j.<br><br><table class='nb-t'><tr><th></th><th>The</th><th>flight</th><th>includes</th><th>a</th><th>meal</th></tr><tr><th>The</th><td>Det</td><td><b>NP</b></td><td>—</td><td>—</td><td><b>S</b></td></tr><tr><th>flight</th><td></td><td>N</td><td>—</td><td>—</td><td>—</td></tr><tr><th>includes</th><td></td><td></td><td>V</td><td>—</td><td><b>VP</b></td></tr><tr><th>a</th><td></td><td></td><td></td><td>Det</td><td><b>NP</b></td></tr><tr><th>meal</th><td></td><td></td><td></td><td></td><td>N</td></tr></table><br><b>Reading order:</b> Det + N → NP (&ldquo;The flight&rdquo;) · Det + N → NP (&ldquo;a meal&rdquo;) · V + NP → VP (&ldquo;includes a meal&rdquo;) · NP + VP → <b>S</b> — the root is reached, so the string is accepted.<br><br><b>Parse tree</b><pre class='nb-tree'>            S\n          /   \\\n        NP      VP\n       /  \\    /   \\\n     Det  Noun V     NP\n      |    |   |    /   \\\n     The flight includes Det Noun\n                          |    |\n                          a   meal</pre>"},

{
 heading:"★ PCFG — Probabilistic Context Free Grammar", page:"p.31–p.32",
 blocks:[
  {t:"p", v:"<b>PCFG</b> = a CFG in which every production carries a probability. The probability of a parse tree is the <b>product of the probabilities of every rule used in it</b>."},
  {t:"ex",
   q:"Compute the probability of the parse tree of the input string <b>&lsquo;The mouse chased the cat.&rsquo;</b><br><br><b>Partial PCFG:</b><br>S → NP VP &nbsp;0.75<br>NP → DT NN &nbsp;0.25<br>VP → VB NP &nbsp;0.35<br>NN → mouse 0.25 / cat 0.1 / dog 0.4<br>VB → chased 0.3 / dodged 0.5<br>DT → the 0.2 / a 0.35",
   a:"<b>Parse tree with rule probabilities</b><pre class='nb-tree'>              S  0.75\n            /      \\\n     NP 0.25        VP 0.35\n     /    \\         /     \\\n  DT 0.2  NN 0.25 VB 0.3   NP 0.25\n   |        |       |      /     \\\n  The     mouse  chased  DT 0.2  NN 0.1\n                          |        |\n                         the      cat</pre><br><b>P = 0.75 × 0.25 × 0.2 × 0.25 × 0.35 × 0.3 × 0.25 × 0.2 × 0.1</b><br>= <b>4.92 × 10⁻⁶</b> &nbsp;(0.00000492)"},
  {t:"warn", v:"The notebook writes this final value as <b>0.00000792</b>. Multiplying out the nine factors it lists gives <b>0.00000492</b> — the leading digit looks like a 4 written over a 7 in the scan. Recompute rather than memorising the number, and always <b>show the chain of factors</b> so you get method marks even if the arithmetic slips."},
  {t:"ex",
   q:"Compute the probability of the parse tree for <b>&lsquo;A pilot likes flying planes&rsquo;</b>.<br><i>(the notebook marks &ldquo;q. in slide&rdquo; — the grammar comes from the lecture slides)</i>",
   a:"<b>Parse tree</b><pre class='nb-tree'>              S  1.0\n            /      \\\n     NP 0.3         VP 0.1\n     /    \\         /     \\\n  DT 0.1  NN 0.3  VB 0.4   NP\n   |        |       |      /   \\\n   A      pilot   likes  JJ 0.5  NNS 0.34\n                           |       |\n                        flying   planes</pre><br>P = 1 × 0.3 × 0.3 × 0.1 × 0.1 × 0.4 × 0.5 × 0.34<br><b>= 0.00000612</b> &nbsp;<i>(as recorded in the notebook)</i><br><br>The second reading — <b>&lsquo;flying planes&rsquo; as VP (planes that are flying)</b> vs <b>NP (the act of flying planes)</b> — is the classic PP/gerund attachment ambiguity, and a PCFG resolves it by picking whichever tree has the higher product."},
  {t:"note", v:"Cross-reference: PCFG is <b>MSE Q1(d) — 2 marks</b>. For 2 marks you need the definition + one short product, not a full chart."}
 ]
},

    answer:"Meaning form of Zipf's Law: m ∝ 1/√r\nSo m₁/m₂ = √r₂ / √r₁\n  20/30 = √(r₂/r₁)\nSquare both sides:\n  (20/30)² = r₂/r₁\n  400/900 = 4/9 = r₂/r₁\n∴ r₁ : r₂ = 9 : 4\n(Sanity check: fewer meanings ⇒ higher rank number ⇒ rarer word. The 30-meaning word has the smaller rank number, as expected.)"}

  addTo("m2","m2n4",[
   {id:"nb-m2-ng1", difficulty:"exam-level",
    q:"Corpus: <s> I like NLP </s> · <s> I like Blockchain </s> · <s> Sam likes NLP </s>\n(i) Calculate the unigram probability of each word. (ii) Calculate the unigram sentence probability of 'I like NLP'.",
    answer:"Step 1 — frequency table (unigram IGNORES the <s>/</s> markers):\n  I:2, like:2, NLP:2, Blockchain:1, Sam:1, likes:1\n  tokens N = 9\n\nStep 2 — P(wᵢ) = c(wᵢ)/N:\n  P(I) = 2/9, P(like) = 2/9, P(NLP) = 2/9\n  P(Blockchain) = 1/9, P(Sam) = 1/9, P(likes) = 1/9\n\n(ii) P(S) = ∏ P(wᵢ) = 2/9 × 2/9 × 2/9 = 8/729 ≈ 0.011"},
   {id:"nb-m2-ng2", difficulty:"exam-level",
    q:"Using the same corpus (<s> I like NLP </s> · <s> I like Blockchain </s> · <s> Sam likes NLP </s>), calculate the BIGRAM probability of the sentence <s> I like NLP </s>.",
    answer:"P(wᵢ|wᵢ₋₁) = c(wᵢ₋₁,wᵢ) / c(wᵢ₋₁)   — bigram DOES use the boundary markers.\n\nP(I | <s>)    = c(<s>,I)/c(<s>)    = 2/3\nP(like | I)   = c(I,like)/c(I)     = 2/2 = 1\nP(NLP | like) = c(like,NLP)/c(like)= 1/2\nP(</s> | NLP) = c(NLP,</s>)/c(NLP) = 2/2 = 1\n\nP(sentence) = 2/3 × 1 × 1/2 × 1 = 1/3 ≈ 0.33"},
   {id:"nb-m2-ng3", difficulty:"exam-level",
    q:"Corpus (7 sentences):\n<s> I am Henry </s> · <s> I like college </s> · <s> Do Henry like college </s> · <s> Henry I am </s> · <s> Do I like Henry </s> · <s> Do I like college </s> · <s> I do like college </s>\n\nWhat is the most probable next word for: (i) \"Do ___\" (bigram) and (ii) \"<s> I like Henry ___\" (bigram)?",
    answer:"Frequency table: I:6, am:2, Henry:5, like:5, college:3, Do:4, <s>:7, </s>:7 — tokens = 39\n\n(i) After 'Do':\n  P(Henry|Do) = c(Do,Henry)/c(Do) = 1/4 = 0.25\n  P(I|Do)     = c(Do,I)/c(Do)     = 2/4 = 0.50  ← highest\n  P(like|Do)  = c(Do,like)/c(Do)  = 1/4 = 0.25\n  ∴ 'I' is the most probable next word.\n\n(ii) After 'Henry':\n  P(</s>|Henry) = c(Henry,</s>)/c(Henry) = 3/5 = 0.60  ← highest\n  P(like|Henry) = 1/5 = 0.20\n  P(I|Henry)    = 1/5 = 0.20\n  ∴ '</s>' is most probable — the sentence ends."},
   {id:"nb-m2-ng4", difficulty:"exam-level",
    q:"On the same 7-sentence Henry/college corpus: (iii) most probable next word for \"<s> Do I like ___\" using a TRIGRAM, and (iv) for \"<s> Do I like college ___\" using a FOUR-GRAM.",
    answer:"(iii) Trigram: P(wᵢ|wᵢ₋₂,wᵢ₋₁) = c(wᵢ₋₂,wᵢ₋₁,wᵢ)/c(wᵢ₋₂,wᵢ₋₁)\n  History = (I, like); c(I,like) = 3\n  P(college | I,like) = c(I,like,college)/c(I,like) = 2/3  ← highest\n  P(Henry   | I,like) = c(I,like,Henry)/c(I,like)   = 1/3\n  ∴ 'college' is the most probable word.\n\n(iv) Four-gram: P(wᵢ|wᵢ₋₃,wᵢ₋₂,wᵢ₋₁) = c(wᵢ₋₃,wᵢ₋₂,wᵢ₋₁,wᵢ)/c(wᵢ₋₃,wᵢ₋₂,wᵢ₋₁)\n  P(</s> | Do,I,like,college) = c(Do,I,like,college,</s>)/c(Do,I,like,college) = 1/1 = 1\n  ∴ '</s>' with probability 1.\n\nNote the professor's remark: no calculation-heavy numericals will be set on tri-/four-gram — know the formula and this reasoning."},
   {id:"nb-m2-ng5", difficulty:"exam-level",
    q:"On the 7-sentence Henry/college corpus, which sentence gets the higher BIGRAM probability?\nS₁ = <s> I like college </s>\nS₂ = <s> Do I like Henry </s>",
    answer:"P(S₁) = P(I|<s>) × P(like|I) × P(college|like) × P(</s>|college)\n      = 3/7 × 3/6 × 3/5 × 3/3\n      = 3/7 × 1/2 × 3/5 × 1\n      = 9/70 ≈ 0.13\n\nP(S₂) = P(Do|<s>) × P(I|Do) × P(like|I) × P(Henry|like) × P(</s>|Henry)\n      = 3/7 × 2/4 × 3/6 × 2/5 × 3/5\n      ≈ 0.0257\n\n∴ S₁ (\"I like college\") has the higher probability.\nWhy: S₂ is longer, so it multiplies in one more fraction < 1 — longer sentences are systematically penalised by raw sentence probability. (This is exactly why perplexity normalises by length with the N-th root.)"}
  ]);

  addTo("m2","m2n5",[
   {id:"nb-m2-lap1", difficulty:"exam-level",
    q:"For the corpus below, compute the Laplace-smoothed probability of the test sentence.\nCorpus: <s> I am Sam </s> · <s> Sam I am </s> · <s> I do not like Sam </s>\nTest: <s> I am Sam </s>",
    answer:"Word|Freq: <s>:3, </s>:3, I:3, am:2, Sam:3 → V = types = 6\n\nP(wᵢ|wᵢ₋₁) = ( c(wᵢ₋₁,wᵢ) + 1 ) / ( c(wᵢ₋₁) + V )\n\nP(I|<s>)   = (2+1)/(3+6) = 3/9 = 1/3\nP(am|I)    = (2+1)/(3+6) = 3/9 = 1/3\nP(Sam|am)  = (1+1)/(2+6) = 2/8 = 1/4\nP(</s>|Sam)= (2+1)/(3+6) = 3/9 = 1/3\n\nP(S) = 1/3 × 1/3 × 1/4 × 1/3 = 1/108 ≈ 0.009"},
   {id:"nb-m2-lap2", difficulty:"exam-level",
    q:"Corpus: <s> I am here </s> · <s> I like it </s> · <s> I am happy </s>\nCompute the Laplace-smoothed (i) P(here|I) (ii) P(it|I) (iii) P(happy|I) (iv) P(I|I).",
    answer:"Word|Freq: <s>:3, </s>:3, I:3, am:2, here:1, like:1, it:1, happy:1 → V = 6, N = 9\nThe question asks for P(x | I) — a conditional on a previous word — so use the BIGRAM form:\n\nP(wᵢ|wᵢ₋₁) = ( c(wᵢ₋₁,wᵢ) + 1 ) / ( c(wᵢ₋₁) + V )\n\n(i)   P(here|I)  = (0+1)/(3+6) = 1/9   [the bigram is (am,here), not (I,here)]\n(ii)  P(it|I)    = (0+1)/(3+6) = 1/9   [the bigram is (like,it)]\n(iii) P(happy|I) = (0+1)/(3+6) = 1/9   [the bigram is (am,happy)]\n(iv)  P(I|I)     = (0+1)/(3+6) = 1/9   [never occurs]\n\nAll four are unseen bigrams, so all four collapse to the same smoothed floor 1/9 — without add-1 they would all be 0.\n\nTrap: the notes first tried the unigram form (1+1)/(9+6) = 2/15 and struck it out. Do not use the unigram form unless the question names a class."},
   {id:"nb-m2-nb1", difficulty:"exam-level",
    q:"Naive Bayes spam filter. Vocabulary size V = 8, total tokens in SPAM N = 20.\nCount in SPAM: Free:6, Money:5, Win:4, Click:3, Prize:2, Meeting:0, Project:0, Launch:0\nTest email: 'win free money meeting' — compute P(email | SPAM).",
    answer:"P(w|class) = ( c(w) + 1 ) / ( N + V ) = ( c(w)+1 ) / 28\n\nP(win|SPAM)     = (4+1)/28 = 5/28\nP(free|SPAM)    = (6+1)/28 = 7/28 = 1/4\nP(money|SPAM)   = (5+1)/28 = 6/28\nP(meeting|SPAM) = (0+1)/28 = 1/28\n\nP(email|SPAM) = 5/28 × 7/28 × 6/28 × 1/28 = 210/614656\n              = 3.42 × 10⁻⁴\n\nKey point to write down: 'meeting' has count 0 in SPAM. Without add-1 smoothing the entire product would be 0 and the classifier could never assign this email to SPAM — that is the zero-probability problem this smoothing exists to fix."},
   {id:"nb-m2-nb2", difficulty:"exam-level",
    q:"Sentiment analysis of a product review using Naive Bayes. N = 25, V = 10.\nCount in POSITIVE: great:8, love:6, excellent:5, perfect:4, amazing:2, terrible:0, refund:0, broken:0\nTest sentence: 'product broken, please refund.' Classify it.\n\n(This one was set up but left unsolved in class.)",
    answer:"P(w|POSITIVE) = ( c(w) + 1 ) / ( N + V ) = ( c(w)+1 ) / 35\n\nP(product|POS) = (0+1)/35 = 1/35   [unseen]\nP(broken|POS)  = (0+1)/35 = 1/35\nP(please|POS)  = (0+1)/35 = 1/35   [unseen]\nP(refund|POS)  = (0+1)/35 = 1/35\n\nP(review|POSITIVE) = (1/35)⁴ = 1/1,500,625 ≈ 6.66 × 10⁻⁷\n\nEvery content word of the review is unseen in the POSITIVE class, so the POSITIVE likelihood sits at its smoothed floor. The NEGATIVE class table would give 'broken' and 'refund' non-zero counts and therefore a far larger product.\n\n∴ Classify the review as NEGATIVE.\n\nExam note: you can only state the final class if you are given (or asked to assume) the NEGATIVE counts too. If the paper gives only one class table, compute that likelihood and say explicitly which comparison you would need to complete the decision."}
  ]);

   {id:"nb-m2-gt1", difficulty:"exam-level",
    q:"Construct the frequency-of-frequencies (Nc) table for c = 1,2,3,4. Calculate the total probability mass assigned to unseen words, and the Good-Turing smoothed probability of 'cat'.\nTraining corpus (N = 20): the:4, cat:3, dog:3, runs:2, sits:2, red:1, blue:1, big:1, small:1, house:1, car:1",
    answer:"a) Nc table (Nc = how many DISTINCT words occur exactly c times):\n  1 time  → red, blue, big, small, house, car  → N₁ = 6\n  2 times → runs, sits                          → N₂ = 2\n  3 times → cat, dog                            → N₃ = 2\n  4 times → the                                 → N₄ = 1\n\nb) Probability mass for unseen words:\n  P*_GT(0) = N₁/N = 6/20 = 0.30\n  ⇒ 30% of the probability mass is reserved for words never seen.\n\nc) GT probability for 'cat' (count c = 3):\n  c* = (c+1) × N_{c+1}/N_c = (3+1) × N₄/N₃ = 4 × (1/2) = 2\n  P(cat) = c*/N = 2/20 = 0.1\n\nNotice the discount: 'cat' was seen 3 times but is charged as 2. The count shaved off every seen word is what funds the 30% held back for unseen words."},

  addTo("m2","m2n7",[
   {id:"nb-m2-pp1", difficulty:"exam-level",
    q:"Compute the perplexity of the sentence \"She likes mangoes\" using a bigram model.\nCorpus: She likes apples. She likes bananas. He likes mangoes. They eat fruits. She likes grapes.",
    answer:"Step 1 — rewrite the corpus with sentence boundaries:\n  <s> She likes apples </s>\n  <s> She likes banana </s>\n  <s> He likes mangoes </s>\n  <s> They eat fruits </s>\n  <s> She likes grapes </s>\n\nStep 2 — bigrams of the test sentence:\n  [<s>, she], [she, likes], [likes, mangoes], [mangoes, </s>]\n\nStep 3 — bigram probabilities:\n  P(she|<s>)      = c(<s>,she)/c(<s>)         = 3/5\n  P(likes|she)    = c(she,likes)/c(she)       = 3/3 = 1\n  P(mangoes|likes)= c(likes,mangoes)/c(likes) = 1/4\n  P(</s>|mangoes) = c(mangoes,</s>)/c(mangoes)= 1/1 = 1\n\n  P(W) = 3/5 × 1 × 1/4 × 1 = 3/20\n\nStep 4 — perplexity, N = 3 (words in the test sentence):\n  PP(W) = ᴺ√(1/P(W)) = ³√(1/(3/20)) = ³√(20/3) = ³√6.667\n\n  PP(W) = 1.8821"},
   {id:"nb-m2-pp2", difficulty:"basic",
    q:"Two unigram models score the sentence 'The patient feels very weak' (N = 5):\nP_A(W) = 0.00008, P_B(W) = 0.00002.\nCompute the perplexity of each and say which model is better.",

   {id:"nb-m2-bow1", difficulty:"easy",
    q:"Create the vocabulary and the Bag-of-Words vectors for:\nD₁: I love NLP\nD₂: I love machine learning",
    answer:"Step 1 — vocabulary (order matters, fix it once and keep it):\n  [ I, love, NLP, machine, learning ]\n\nStep 2 — count each vocabulary word per document:\n  DOC | I | love | NLP | machine | learning\n  D₁  | 1 |  1   |  1  |    0    |    0\n  D₂  | 1 |  1   |  0  |    1    |    1\n\nD₁ = [1, 1, 1, 0, 0]\nD₂ = [1, 1, 0, 1, 1]"},
   {id:"nb-m2-tfidf1", difficulty:"exam-level",
    q:"Compute the TF-IDF vectors for:\nD₁: I love NLP\nD₂: I love machine learning\nD₃: NLP is useful",
    answer:"I) TF = occurrences of the word in the doc / total words in the doc\n  D₁: I = 1/3, love = 1/3, NLP = 1/3\n  D₂: I = 1/4, love = 1/4, machine = 1/4, learning = 1/4\n  D₃: NLP = 1/3, is = 1/3, useful = 1/3\n\nII) IDF = log( total docs / docs containing the word ), using log base 10:\n  I        in 2 docs → log(3/2) = 0.1761\n  love     in 2 docs → log(3/2) = 0.1761\n  NLP      in 2 docs → log(3/2) = 0.1761\n  machine  in 1 doc  → log(3/1) = 0.4771\n  learning in 1 doc  → log(3/1) = 0.4771\n  is       in 1 doc  → log(3/1) = 0.4771\n  useful   in 1 doc  → log(3/1) = 0.4771\n\nIII) TF-IDF = TF × IDF\n  D₁: I = 1/3 × 0.1761 = 0.0587; love = 0.0587; NLP = 0.0587\n      TF-IDF_D₁ = [0.0587, 0.0587, 0.0587]\n  D₂: I = 1/4 × 0.1761 = 0.044; love = 0.044;\n      machine = 1/4 × 0.4771 = 0.1193; learning = 0.1193\n      TF-IDF_D₂ = [0.044, 0.044, 0.1193, 0.1193]\n  D₃: NLP = 1/3 × 0.1761 = 0.0587;\n      is = 1/3 × 0.4771 = 0.1590; useful = 0.1590\n      TF-IDF_D₃ = [0.0587, 0.1590, 0.1590]\n\nReading: words in every document (I, love, NLP) get LOW weight; document-specific words (machine, is, useful) get HIGH weight. That is the whole point of the IDF factor.\n\nEXAM INSTRUCTION from p.1: don't compute the whole table — do only the word(s) the question names."}

  addTo("m3","m3n1",[
   {id:"nb-m3-hmm1", difficulty:"exam-level",
    q:"Calculate the emission and transition probability matrices for the given tagged corpus (bigram HMM):\n<s> Book/V a/DET car/N </s>\n<s> Park/V the/DET car/N </s>\n<s> The/DET book/N is/V in/Prep the/DET car/N </s>\n<s> The/DET car/N is/V in/Prep a/DET park/N </s>",
    answer:"Step 1 — word frequency table: Book:2, a:2, car:4, Park:2, the:4, is:2, in:2\nTag totals: V = 4, DET = 6, N = 6, Prep = 2\n\nStep 2 — EMISSION matrix P(word | tag) = c(tag, word)/c(tag):\n         V(4)   Det(6)  N(6)   Prep(2)\n  Book   1/4     0      1/6      0\n  a       0     2/6      0       0\n  car     0      0      4/6      0\n  park   1/4     0      1/6      0\n  is     2/4     0       0       0\n  in      0      0       0     2/2 = 1\n  the     0     4/6      0       0\n\nStep 3 — TRANSITION matrix P(tag | previous tag) = c(prev, tag)/c(prev):\n           N     V     DET   Prep   </s>\n  <s>(4)   0    2/4    2/4     0      0\n  N (6)    0    2/6     0      0     4/6\n  V (4)    0     0     2/4    2/4     0\n  Det(6)  4/6    0      0      0      0\n  Prep(2)  0     0    2/2=1    0      0\n\nCheck your work: every row of the transition matrix must sum to 1.\n\nAlways state the three things an HMM provides: (1) emission probabilities, (2) state transition probabilities, (3) the initial probability matrix (IPM)."},
   {id:"nb-m3-hmm2", difficulty:"exam-level",
    q:"Make an HMM table for the sentence 'Test passed' given IPM π = [NN 0.9, VB 0.1] and these four paths:\ni)   <s> →0.9 NN →0.5 NN →0.05 E   | NN→test 0.9, NN→passed 0.08\nii)  <s> →0.9 NN →0.9 VB →0.05 E   | NN→test 0.9, VB→passed 0.92\niii) <s> →0.1 VB →0.45 NN →0.05 E  | VB→test 0.1, NN→passed 0.08\niv)  <s> →0.1 VB →0.5 VB →0.05 E   | VB→test 0.1, VB→passed 0.92\nWhich tag sequence wins?",
    answer:"Multiply, for each row: π(X₀) × P(O₀,X₀) × P(X₀,X₁) × P(O₁,X₁) × P(X₁,E)\n\n X₀  X₁  π(X₀) P(O₀,X₀) P(X₀,X₁) P(O₁,X₁) P(X₁)   Pr        Nor Pr\n NN  NN   0.9    0.9      0.05     0.08     0.05  0.000162  0.00475\n NN  VB   0.9    0.9      0.90     0.92     0.05  0.033534  0.98323\n VB  NN   0.1    0.1      0.45     0.08     0.05  0.000180  0.00528\n VB  VB   0.1    0.1      0.50     0.92     0.05  0.000230  0.00674\n\nΣPr = 0.034106\nNormalised Pr = Pr / ΣPr\n\n∴ The winning sequence is (NN, VB) with 98.32% of the probability mass:\n  o/p = [('test','NN'), ('passed','VB')]"}
  ]);

  addTo("m3","m3n2",[
   {id:"nb-m3-vit1", difficulty:"exam-level",
    q:"For the training corpus:\n<s> Martin Justin can watch Will <E>\n<s> Spot will watch Martin <E>\n<s> Will Justin spot Martin <E>\n<s> Martin will Pat spot <E>\nCalculate the most probable tag sequence using the Viterbi algorithm and the path probability for the test sentence 'Justin will spot Will'. (N=Noun, M=modal verb, V=verb)",
    answer:"Step 1 — assign POS tags to the training corpus:\n  Martin/N Justin/N can/M watch/V Will/N\n  Spot/N   will/M   watch/V Martin/N\n  Will/M   Justin/N spot/V  Martin/N\n  Martin/N will/M   Pat/V   spot/N\nTag totals: N = 9, M = 4, V = 4\n\nStep 2 — EMISSION matrix P(word|tag):\n           N(9)   M(4)   V(4)\n  Martin   4/9     0      0\n  Justin   2/9     0      0\n  Will     1/9    3/4     0\n  Spot     2/9     0     1/4\n  can       0     1/4     0\n  watch     0      0     2/4\n  pat       0      0     1/4\n\nStep 3 — TRANSITION matrix P(tag|prev tag):\n         N     M     V    <E>\n  <s>   3/4   1/4    0     0\n  N     1/9   1/9   1/9   4/9\n  M     1/4    0    3/4    0\n  V      1     0     0     0\n\nStep 4 — state graph. Candidate tags per word:\n  <s>  Justin  will  spot  Will  <E>\n         N       N     V     N\n                 M     N     M\n  → 1 × 2 × 2 × 2 = 8 possible paths.\n\nAt each node compute (previous path prob × transition × emission) and keep only the greater-value incoming path — that pruning is what makes it Viterbi rather than enumerating all 8.\n\ne.g. start: P(N|<s>) × P(Justin|N) = 3/4 × 2/9 = 0.166\n\n∴ Best path: <s> Justin[N] will[M] spot[V] Will[N] <E>\n   Path probability = 0.000374\n\nThe MSE asks you to SHOW THE STATE GRAPH — draw the trellis and mark which arcs survive."},

/* ================= PROGRESS STORE (v3) =================
   ONE status map for every markable item in the app.
     "done"   -> completed
     "review" -> in the review queue
     absent   -> unattempted
   Module and syllabus completion are DERIVED from this map, so the
   dashboard updates automatically as questions are marked.
   ====================================================== */
function defaultProgress(){
  return { status:{}, ticks:{}, quizScores:{}, weakTopics:{}, mock:null };
}
let PROGRESS = loadProgress();
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const p = JSON.parse(raw); const d = defaultProgress();
      return Object.assign(d, p, { status: Object.assign({}, p.status||{}),
        ticks: Object.assign({}, p.ticks||{}),
        quizScores: Object.assign({}, p.quizScores||{}), weakTopics: Object.assign({}, p.weakTopics||{}) });
    }
    const legacy = localStorage.getItem(LEGACY_KEY);
    if(legacy) return migrateLegacy(JSON.parse(legacy));
    return defaultProgress();
  }catch(e){ return defaultProgress(); }
}
/* Old two-tab statuses map onto the new two-state system so nobody
   loses the work they already did. */
function migrateLegacy(p){
  const d = defaultProgress();
  try{
    ["m1","m2","m3"].forEach(m=>{
      const th = (p.theory&&p.theory[m])||{};
      Object.keys(th).forEach(id=>{ if(th[id]) d.status[id]="done"; });
      const nu = (p.numericals&&p.numericals[m])||{};
      Object.keys(nu).forEach(id=>{
        const v = nu[id];
        if(v==="correct"||v==="attempted") d.status[id]="done";
        else if(v==="incorrect"||v==="couldnt") d.status[id]="review";
      });
      const fc = (p.flashcards&&p.flashcards[m])||{};
      Object.keys(fc).forEach(id=>{
        if(fc[id]==="known" && !d.status[id]) d.status[id]="done";
        else if(fc[id]==="revision") d.status[id]="review";
      });
    });
    d.quizScores = p.quizScores || {};
    d.weakTopics = p.weakTopics || {};
    d.mock = p.mock || null;
  }catch(e){}
  return d;
}
function saveProgress(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(PROGRESS)); }catch(e){} }

/* ================= TOPIC TICKS =================
   A tick says "I have covered this topic elsewhere — stop counting its
   questions as pending". Kept SEPARATELY for theory and numerical work,
   so a topic with both shows two boxes.
   Key: module | syllabus-code | kind
   ============================================== */
/* Solved / Focus topics that are explanation-and-compare rather than
   compute-and-trace. Everything else in those banks is numerical. */
const THEORY_TOPICS = new Set([
  "s_m1_ambiguity","s_m1_stagepick","s_m2_fst","s_m3_choose","s_m3_errors",
  "f_ambig","f_morph"
]);
/* Which kind of study does this item belong to? */
function studyKindOf(i){
  if(i.kind === "theory") return "theory";
  if(i.sub === "numericals") return "numerical";
  if(i.sub === "solved" || i.sub === "focus")
    return THEORY_TOPICS.has(i.parent || i.id) ? "theory" : "numerical";
  return "theory";
}
/* The syllabus code an item sits under, e.g. "2.7.3". Non-numbered
   groupings such as "Math Seeds" are used as their own code. */
function topicCodeOf(topic){
  const t = String(topic == null ? "" : topic).trim();
  const m = t.match(/^([0-9]+(?:\.[0-9]+)*)/);
  return m ? m[1] : t;
}
/* A tick on 2.7 also covers 2.7.1 / 2.7.2 / 2.7.3, so check every
   ancestor code down to two segments. */
function tickCodesFor(code){
  const out = [code];
  const parts = String(code).split(".");
  for(let n = parts.length - 1; n >= 2; n--) out.push(parts.slice(0, n).join("."));
  return out;
}
function tickKey(m, code, kind){ return m + "|" + code + "|" + kind; }
function isTicked(m, code, kind){ return !!PROGRESS.ticks[tickKey(m, code, kind)]; }
function setTick(m, code, kind, on){
  const k = tickKey(m, code, kind);
  if(on) PROGRESS.ticks[k] = true; else delete PROGRESS.ticks[k];
  saveProgress();
}
function isTickCovered(i){
  if(!i.m) return false;
  const kind = studyKindOf(i);
  const codes = tickCodesFor(topicCodeOf(i.topic));
  for(const c of codes){ if(PROGRESS.ticks[tickKey(i.m, c, kind)]) return true; }
  return false;
}
/* What counts as this item's status once topic ticks are taken into
   account. An explicit per-question mark always wins over a tick. */
function effectiveStatus(i){
  const own = PROGRESS.status[i.id];
  if(own === "review") return "review";
  if(own === "done") return "done";
  return isTickCovered(i) ? "done" : null;
}
function isCoveredOnlyByTick(i){ return !PROGRESS.status[i.id] && isTickCovered(i); }

/* ---- the two statuses, used everywhere ---- */
function statusOf(id){ return PROGRESS.status[id] || null; }
function setStatus(id, val){
  if(PROGRESS.status[id]===val) delete PROGRESS.status[id];
  else PROGRESS.status[id]=val;
  saveProgress();
}
/* A status control that updates ITSELF and the progress bars in place.
   No re-render, so the page never jumps. */
function statusControl(id){
  const wrap = el("div",{class:"status-btns"});
  const mk = (val,label)=>{
    const b = el("button",{class:"small"},[label]);
    const paint = ()=>{
      const cur = statusOf(id);
      b.className = "small" + (cur===val ? (val==="done"?" st-done":" st-review") : "");
      b.textContent = (cur===val && val==="done") ? "\u2713 Done" : label;
    };
    b.addEventListener("click",()=>{
      setStatus(id,val);
      wrap.querySelectorAll("button").forEach(x=>x._paint && x._paint());
      refreshProgressIndicators();
    });
    b._paint = paint; paint();
    return b;
  };
  wrap.appendChild(mk("done","Done"));
  wrap.appendChild(mk("review","Mark for Review"));
  return wrap;
}
/* Paint an item's status pill, showing when a topic tick is what covers it. */
function paintStatusTag(tagEl, item){
  const own = PROGRESS.status[item.id];
  if(own){ tagEl.className = "st-tag " + own; tagEl.textContent = own === "done" ? "Done" : "For review"; }
  else if(isTickCovered(item)){ tagEl.className = "st-tag tick"; tagEl.textContent = "Topic ticked"; }
  else { tagEl.className = "st-tag"; tagEl.textContent = ""; }
}
/* Lightweight item descriptor, so filters and pills can ask about ticks. */
function itemRef(id, m, sub, topic, parent){
  return { id, m, sub, topic, parent, kind: sub === "theory" ? "theory" : "practice" };
}

/* A topic tick-off box. Ticking marks the whole topic covered for that
   kind of work, without needing every question under it answered. */
function tickBox(m, code, kind, count){
  const lab = el("label",{class:"tickbox", title:
    "Tick to count this topic's "+kind+" work as covered ("+count+" question"+(count===1?"":"s")+") without answering each one."});
  const cb = el("input",{type:"checkbox"});
  cb.addEventListener("change", ()=>{
    setTick(m, code, kind, cb.checked);
    refreshProgressIndicators();
  });
  /* the same topic can be shown in more than one place, so re-read the
     stored state on every refresh rather than trusting the local box */
  watchProgress(()=>{
    cb.checked = isTicked(m, code, kind);
    lab.classList.toggle("on", cb.checked);
  });
  lab.appendChild(cb);
  lab.appendChild(el("span",{class:"tk"},[kind==="theory" ? "Theory done" : "Numericals done"]));
  return lab;
}
/* One or two boxes for a topic, depending on which kinds of work it has. */
function tickBar(m, code, items, opts){
  opts = opts || {};
  const counts = {theory:0, numerical:0};
  items.forEach(i=>{ counts[studyKindOf(i)]++; });
  const kinds = ["theory","numerical"].filter(k=>counts[k] > 0);
  if(!kinds.length) return null;
  const bar = el("div",{class:"tickbar"});
  if(opts.label) bar.appendChild(el("span",{class:"tickhint"},[opts.label]));
  kinds.forEach(k=>bar.appendChild(tickBox(m, code, k, counts[k])));
  return bar;
}

/* Live progress elements register here; marking an item repaints them
   without touching the rest of the DOM. */
let PROGRESS_WATCHERS = [];
function watchProgress(fn){ PROGRESS_WATCHERS.push(fn); fn(); }
function refreshProgressIndicators(){ PROGRESS_WATCHERS.forEach(fn=>{ try{ fn(); }catch(e){} }); }

/* ================= ROUTER STATE ================= */
let ROUTE = { view:"dashboard", sub:{m1:"outcomes",m2:"outcomes",m3:"outcomes"}, notesSub:"exam" };
let NOTE_SEARCH = "";
let FLASH_IDX = { m1:0, m2:0, m3:0 };
let NUM_FILTER = { m1:"all", m2:"all", m3:"all" };
let QUIZ_STATE = {};
let MOCK_STATE = { started:false, submitted:false, answers:{}, selfMark:{}, startTime:null, timerId:null };

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="class") e.className = attrs[k];
    else if(k==="html") e.innerHTML = attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else if(typeof attrs[k] === "boolean"){
      /* Boolean attributes: setAttribute("disabled", false) would still
         DISABLE the element, because any value counts as present. Set the
         property instead so false really means enabled. */
      e[k] = attrs[k];
    }
    else if(attrs[k]===null || attrs[k]===undefined){ /* skip */ }
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c=>{ if(typeof c==="string") e.appendChild(document.createTextNode(c)); else if(c) e.appendChild(c); });
  return e;
}
function esc(s){ const d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }
function nl2br(s){ return esc(s).replace(/\n/g,"<br>"); }

/* ================= NAV ================= */
document.getElementById("mainNav").addEventListener("click", e=>{
  const btn = e.target.closest("button[data-view]"); if(!btn) return;
  ROUTE.view = btn.getAttribute("data-view");
  render();
});

function setActiveNav(){
  document.querySelectorAll("#mainNav button").forEach(b=>{
    b.classList.toggle("active", b.getAttribute("data-view")===ROUTE.view);
  });
  const box = document.getElementById("globalSearch");
  if(box && ROUTE.view!=="search" && box.value && !box.matches(":focus")) box.value = "";
}

/* ================= MAIN RENDER ================= */
function render(){
  setActiveNav();
  const app = document.getElementById("app");
  app.innerHTML = "";
  PROGRESS_WATCHERS = [];   /* the old view is gone; drop its watchers */
  if(ROUTE.view==="dashboard") app.appendChild(renderDashboard());
  else if(ROUTE.view==="m1"||ROUTE.view==="m2"||ROUTE.view==="m3") app.appendChild(renderModule(ROUTE.view));
  else if(ROUTE.view==="notes") app.appendChild(renderNotes());
  else if(ROUTE.view==="mock") app.appendChild(renderMock());
  else if(ROUTE.view==="fullmarks") app.appendChild(renderFullMarks());
  else if(ROUTE.view==="focus") app.appendChild(renderFocus());
  else if(ROUTE.view==="search") app.appendChild(renderSearch());
  if(SCROLL_TO_TOP) window.scrollTo(0,0);
  SCROLL_TO_TOP = true;
}
/* render() scrolls to the top only on a NAVIGATION change. Anything that
   re-renders in place (a filter, a quiz answer) calls renderKeepScroll()
   so the reader stays exactly where they were. */
let SCROLL_TO_TOP = true;

/* ================= STATS HELPERS =================
   Everything below is DERIVED from PROGRESS.status, so module and
   syllabus completion update automatically as questions are marked.
   ================================================= */
function pct(a,b){ return b===0 ? 0 : Math.round((a/b)*100); }

/* The full set of markable items in a module, each with the metadata the
   LO page and the dashboard need. Every item appears exactly ONCE, so
   nothing is double-counted. */
function moduleItems(m){
  const out = [];
  (DATA.theory[m]||[]).forEach(q=>out.push({
    id:q.id, m, kind:"theory", topic:q.topic, marks:q.marks,
    label:q.q, sub:"theory", lo:q.lo||null }));
  (DATA.numericals[m]||[]).forEach(t=>{
    (t.practice||[]).forEach(p=>out.push({
      id:p.id, m, kind:"practice", topic:t.topic, difficulty:p.difficulty,
      label:p.q, sub:"numericals", parent:t.id, lo:t.lo||null }));
  });
  (DATA.solved && DATA.solved[m] ? DATA.solved[m] : []).forEach(t=>{
    out.push({ id:t.id, m, kind:"solved", topic:t.topic, marks:t.marks,
      label:t.title, sub:"solved", lo:t.lo||null });
    (t.practice||[]).forEach(p=>out.push({
      id:p.id, m, kind:"practice", topic:t.topic, difficulty:p.difficulty,
      label:p.q, sub:"solved", parent:t.id, lo:t.lo||null }));
  });
  (typeof FOCUS !== "undefined" ? FOCUS : []).filter(t=>t.m===m).forEach(t=>{
    out.push({ id:t.id, m, kind:"focus", topic:t.topic, marks:t.marks, qslot:t.q,
      label:t.title, sub:"focus", lo:null });
    (t.questions||[]).forEach(p=>out.push({
      id:p.id, m, kind:"practice", topic:t.topic, difficulty:p.d, qslot:t.q,
      label:p.q, sub:"focus", parent:t.id, lo:null }));
  });
  return out;
}
/* Focus-only tallies, derived from moduleItems so the metadata (module,
   topic, study kind) stays identical everywhere. */
function focusItems(){
  return ["m1","m2","m3"].reduce((a,m)=>a.concat(moduleItems(m).filter(i=>i.sub==="focus")), []);
}
function focusStats(){ return tally(focusItems()); }
function focusTopicStats(t){
  return tally(moduleItems(t.m).filter(i=> i.sub==="focus" && (i.id===t.id || i.parent===t.id)));
}
function allItems(){ return ["m1","m2","m3"].reduce((a,m)=>a.concat(moduleItems(m)),[]); }

function tally(items){
  let done=0, review=0, viaTick=0;
  items.forEach(i=>{
    const own = PROGRESS.status[i.id];
    if(own === "review"){ review++; return; }
    if(own === "done"){ done++; return; }
    if(isTickCovered(i)){ done++; viaTick++; }
  });
  return { total:items.length, done, review, viaTick,
           unattempted:items.length-done-review, pct:pct(done, items.length) };
}
function moduleStats(m){ return tally(moduleItems(m)); }
function moduleOverallPct(m){ return moduleStats(m).pct; }
function overallStats(){ return tally(allItems()); }

/* Items answering a given learning outcome: an explicit id list plus any
   item whose syllabus topic code the outcome covers. */
function itemsForLO(lo){
  const ids = new Set(lo.ids||[]);
  const topics = lo.topics||[];
  return moduleItems(lo.m).filter(i=>{
    if(ids.has(i.id) || (i.parent && ids.has(i.parent))) return true;
    if(Array.isArray(i.lo) && i.lo.indexOf(lo.id)>=0) return true;
    return topics.some(t=> String(i.topic||"").indexOf(t)===0 );
  });
}
function losOf(m){ return LOS.filter(l=>l.m===m); }

/* Syllabus-line completion is derived the same way: a topic counts as
   covered in proportion to the questions under it that are marked Done. */
function syllabusLineStats(m, topicText, codeOverride){
  const code = codeOverride || topicCodeOf(topicText);
  const items = moduleItems(m).filter(i=> code ? String(i.topic||"").indexOf(code)===0 : false );
  return tally(items);
}
function reviewQueue(){
  const out=[];
  ["m1","m2","m3"].forEach(m=>moduleItems(m).forEach(i=>{ if(statusOf(i.id)==="review") out.push(Object.assign({m},i)); }));
  return out;
}
function quizPerformance(){
  const rows=[];
  ["m1","m2","m3"].forEach(m=>(QUIZ_SETS[m]||[]).forEach(q=>{
    const sc = PROGRESS.quizScores[q.key];
    if(sc) rows.push({m, key:q.key, title:q.title, score:sc.score, total:sc.total, pct:pct(sc.score,sc.total), date:sc.date});
  }));
  return rows;
}
/* Weak areas: LOs with the lowest completion that still have questions,
   plus any quiz scoring under 60%. */
function weakAreas(){
  const out=[];
  LOS.forEach(l=>{
    const t = tally(itemsForLO(l));
    if(t.total>0 && t.pct < 50) out.push({type:"lo", m:l.m, label:l.id+" — "+l.text, pct:t.pct, detail:t.done+"/"+t.total+" done"});
  });
  quizPerformance().forEach(q=>{ if(q.pct < 60) out.push({type:"quiz", m:q.m, label:q.title+" ("+MODULE_TITLES[q.m].split("—")[0].trim()+")", pct:q.pct, detail:q.score+"/"+q.total}); });
  return out.sort((a,b)=>a.pct-b.pct);
}
function nextUp(){
  const rq = reviewQueue();
  if(rq.length) return {kind:"review", m:rq[0].m, label:rq[0].label, why:"marked for review"};
  for(const m of ["m1","m2","m3"]){
    const items = moduleItems(m);
    const solvedFirst = items.filter(i=>i.kind==="solved" && !effectiveStatus(i));
    if(solvedFirst.length) return {kind:"solved", m, label:solvedFirst[0].label, why:"class-notes solved question, not yet studied"};
  }
  for(const m of ["m1","m2","m3"]){
    const un = moduleItems(m).filter(i=>!effectiveStatus(i));
    if(un.length) return {kind:"item", m, label:un[0].label, why:"unattempted"};
  }
  const noQuiz = [];
  ["m1","m2","m3"].forEach(m=>(QUIZ_SETS[m]||[]).forEach(q=>{ if(!PROGRESS.quizScores[q.key]) noQuiz.push({m,q}); }));
  if(noQuiz.length) return {kind:"quiz", m:noQuiz[0].m, label:noQuiz[0].q.title, why:"not yet attempted"};
  return {kind:"mock", m:null, label:"Final mock paper", why:"everything is marked done — sit the paper under timed conditions"};
}

/* ================= MODULE VIEW ================= */
const SUBTABS = [["outcomes","Learning Outcomes"],["theory","Theory"],["solved","Class Solved"],
                 ["numericals","Numericals"],["flashcards","Flashcards"],["quiz","Quizzes"],["revision","Quick Revision"]];
function renderModule(m){
  const wrap = el("div",{});
  wrap.appendChild(el("h1",{},[MODULE_TITLES[m]]));

  /* compact progress strip, live-updating */
  const strip = el("div",{class:"card modrow",style:"margin-bottom:12px"});
  const bar = el("div",{class:"progressbar",style:"flex:2;min-width:150px"});
  const fill = el("div",{style:"width:0%"}); bar.appendChild(fill);
  const label = el("div",{class:"mname",style:"font-weight:400"},[""]);
  const pctEl = el("div",{class:"mpct"},["0%"]);
  strip.appendChild(label); strip.appendChild(bar); strip.appendChild(pctEl);
  watchProgress(()=>{
    const t = moduleStats(m);
    fill.style.width = t.pct+"%"; pctEl.textContent = t.pct+"%";
    label.textContent = t.done+" done"+(t.viaTick?" ("+t.viaTick+" ticked)":"")
      +" · "+t.review+" for review · "+t.unattempted+" unattempted";
  });
  wrap.appendChild(strip);

  const subtabs = el("div",{class:"subtabs"});
  SUBTABS.forEach(([key,lab])=>{
    if(key==="solved" && !(DATA.solved && DATA.solved[m] && DATA.solved[m].length)) return;
    if(key==="numericals" && !(DATA.numericals[m]||[]).length) return;
    const isActive = key==="quiz" ? (ROUTE.sub[m]&&String(ROUTE.sub[m]).indexOf("quiz")===0) : ROUTE.sub[m]===key;
    subtabs.appendChild(el("button",{class:isActive?"active":"",onclick:()=>{ROUTE.sub[m]=key; render();}},[lab]));
  });
  wrap.appendChild(subtabs);

  const sub = ROUTE.sub[m];
  if(sub==="theory") wrap.appendChild(renderTheory(m));
  else if(sub==="solved") wrap.appendChild(renderSolved(m));
  else if(sub==="flashcards") wrap.appendChild(renderFlashcards(m));
  else if(sub==="numericals") wrap.appendChild(renderNumericals(m));
  else if(sub && String(sub).indexOf("quiz")===0) wrap.appendChild(renderQuizPicker(m));
  else if(sub==="revision") wrap.appendChild(renderRevision(m));
  else wrap.appendChild(renderOutcomes(m));
  return wrap;
}

  }

  /* Any syllabus line not claimed by an outcome above, plus the grouping
     codes that have questions but no syllabus line of their own — so that
     every question in the module sits under something tickable. */
  const claimed = new Set();
  losOf(m).forEach(lo=>syllabusLinesForLO(lo).forEach(l=>claimed.add(l.id)));
  const rest = groupByCode((DATA.syllabus[m]||[]).filter(l=>!claimed.has(l.id)))
                 .concat(orphanTopicGroups(m));
  if(rest.length){
    const sy = el("div",{class:"card"});
    sy.appendChild(el("h3",{style:"margin-top:0"},["Other topics"]));
    rest.forEach(g=>sy.appendChild(renderSyllabusRow(m, g)));
    wrap.appendChild(sy);
  }
  return wrap;
}

/* Several syllabus lines can share one code (three lines all start "1.1").
   A tick applies to the CODE, so collapse them into one tickable group and
   list the individual lines underneath. */
function groupByCode(lines){
  const order = [], by = {};
  lines.forEach(l=>{
    const c = topicCodeOf(l.topic);
    if(!by[c]){ by[c] = { id:"grp-"+c, _code:c, topic:l.topic, also:[] }; order.push(c); }
    else by[c].also.push(l.topic);
  });
  return order.map(c=>by[c]);
}

/* Readable names for the grouping codes that have no syllabus line. */
const EXTRA_TOPIC_NAMES = {
  "m2|2.7":"2.7 Statistical Models — overall (covers 2.7.1, 2.7.2 and 2.7.3)",
  "m3|3.4":"3.4 Parsing Techniques — overall (covers 3.4.1, 3.4.2 and 3.4.3)",
  "m1|Math Seeds":"Math Seeds — probability and Bag-of-Words warm-ups",
  "m2|Self-Learning":"Self-Learning topics",
  "m3|Self-Learning":"Self-Learning topics"
};
/* Topic codes that carry questions but that no syllabus row would tick. */
function orphanTopicGroups(m){
  const rowCodes = (DATA.syllabus[m]||[]).map(l=>topicCodeOf(l.topic));
  const seen = new Set(), out = [];
  moduleItems(m).forEach(i=>{
    const c = topicCodeOf(i.topic);
    if(seen.has(c)) return;
    seen.add(c);
    if(rowCodes.some(rc=>c.indexOf(rc)===0)) return;   /* already tickable */
    out.push({ id:"grp-"+m+"-"+c, topic: EXTRA_TOPIC_NAMES[m+"|"+c] || c, _code:c });
  });
  return out;
}

/* Which official syllabus lines does an outcome cover? Matched on the
   syllabus code that each line's text begins with. */
function syllabusLinesForLO(lo){
  const codes = lo.syl || (lo.topics||[]).filter(t=>/^[0-9]/.test(t));
  if(!codes.length) return [];
  return (DATA.syllabus[lo.m]||[]).filter(line=>
    codes.some(c=>String(line.topic).indexOf(c)===0));
}

/* One syllabus point: its text, auto-derived coverage, and — on click —
   the questions filed under it, so no row is a dead end. */
function renderSyllabusRow(m, line){
  const row = el("div",{class:"sylrow"});
  const btn = el("button",{class:"chip",style:"text-align:left;white-space:normal;max-width:none;flex:1"},[line.topic]);
  const barWrap = el("div",{class:"sb"});
  const bar = el("div",{class:"progressbar",style:"margin:0"});
  const fill = el("div",{style:"width:0%"}); bar.appendChild(fill); barWrap.appendChild(bar);
  const pctEl = el("div",{class:"sp"},[""]);
  row.appendChild(btn); row.appendChild(barWrap); row.appendChild(pctEl);

  const holder = el("div",{style:"display:none;padding:6px 0 10px"});
  const outer = el("div",{});
  outer.appendChild(row);
  if((line.also||[]).length){
    const more = el("div",{class:"small-muted",style:"margin:0 0 3px 10px;font-size:.76rem"},
      ["also: " + line.also.join(" · ")]);
    outer.appendChild(more);
  }

  /* tick this syllabus point off without answering every question */
  const sylCode = line._code || topicCodeOf(line.topic);
  const lineItems = moduleItems(m).filter(i=>String(i.topic||"").indexOf(sylCode)===0);
  const tickWrap = tickBar(m, sylCode, lineItems);
  if(tickWrap){ tickWrap.style.margin = "2px 0 6px 4px"; outer.appendChild(tickWrap); }
  outer.appendChild(holder);

  watchProgress(()=>{
    const st = syllabusLineStats(m, line.topic, sylCode);
    fill.style.width = st.pct+"%";
    pctEl.textContent = st.total===0 ? "—" : st.pct+"%";
    row.title = st.total===0 ? "No questions filed under this line"
      : st.done+" done · "+st.review+" for review · "+st.unattempted+" unattempted (of "+st.total+")";
  });

  btn.addEventListener("click", ()=>{
    if(holder.style.display === "block"){ holder.style.display = "none"; return; }
    holder.style.display = "block";
    if(holder.children.length) return;
    const items = moduleItems(m).filter(i=>String(i.topic||"").indexOf(sylCode)===0);
    if(!items.length){
      holder.appendChild(el("p",{class:"small-muted",style:"margin:0"},["No questions filed under this syllabus line."]));
      return;
    }
    const bySub = {};
    items.forEach(i=>{ (bySub[i.sub] = bySub[i.sub] || []).push(i); });
    const label = {focus:"★ MSE Focus", solved:"Class Solved", numericals:"Numericals", theory:"Theory"};
    const openSub = sub => { if(sub==="focus"){ ROUTE.view="focus"; render(); }
                             else { ROUTE.view=m; ROUTE.sub[m]=sub; render(); } };
    ["focus","solved","numericals","theory"].forEach(sub=>{
      const list = bySub[sub]; if(!list) return;
      const t = tally(list);
      const head = el("div",{style:"display:flex;gap:8px;align-items:center;margin:6px 0 3px;flex-wrap:wrap"});
      head.appendChild(el("span",{class:"pill low"},[(label[sub]||sub)+" · "+list.length]));
      head.appendChild(el("span",{class:"small-muted"},[t.done+" done"]));
      head.appendChild(el("button",{class:"small",style:"margin-left:auto",onclick:()=>openSub(sub)},
        ["Open "+(label[sub]||sub)]));
      holder.appendChild(head);
      const chips = el("div",{class:"lo-links"});
      list.slice(0,12).forEach(i=>{
        const st = statusOf(i.id);
        const mark = st==="done" ? "✓ " : st==="review" ? "↻ " : "";
        const txt = String(i.label).replace(/<[^>]*>/g,"");
        chips.appendChild(el("button",{class:"chip",onclick:()=>{
          if(i.sub==="focus"){
            jumpToFocus(i.id);
          } else jumpTo(m, i.sub, i.id);
        }},[mark + (txt.length>44 ? txt.slice(0,44)+"…" : txt)]));
      });
      if(list.length>12) chips.appendChild(el("button",{class:"chip",onclick:()=>openSub(sub)},
        ["+ "+(list.length-12)+" more →"]));
      holder.appendChild(chips);
    });
  });
  return outer;
}

function renderTheory(m){

  const doneSel = el("select",{}); [["all","All statuses"],["done","Done"],["review","For review"],["pending","Unattempted"]].forEach(([v,l])=>doneSel.appendChild(el("option",{value:v},[l])));
  const scopeSel = el("select",{}); [["all","All content"],["core","Core syllabus only"],["flagged","Scope-flagged only"]].forEach(([v,l])=>scopeSel.appendChild(el("option",{value:v},[l])));
  toolbar.appendChild(prioSel); toolbar.appendChild(doneSel); toolbar.appendChild(scopeSel);
  wrap.appendChild(toolbar);

  const list = el("div",{});
  function draw(){
    list.innerHTML = "";
    const items = DATA.theory[m].filter(q=>{
      if(prioSel.value!=="all" && q.priority!==prioSel.value) return false;
      const st = effectiveStatus(itemRef(q.id, m, "theory", q.topic));
      if(doneSel.value==="done" && st!=="done") return false;
      if(doneSel.value==="review" && st!=="review") return false;

    });
    if(!items.length) list.appendChild(el("p",{class:"small-muted"},["No questions match this filter."]));
    items.forEach(q=>list.appendChild(renderTheoryCard(m,q)));
  }
  prioSel.addEventListener("change",draw); doneSel.addEventListener("change",draw); scopeSel.addEventListener("change",draw);
  draw();
  wrap.appendChild(list);
  return wrap;
}

/* ---- Flashcards ---- */
function renderFlashcards(m){
  const wrap = el("div",{class:"flashcard-wrap"});
  let cards = DATA.theory[m].filter(q=>q.flashcard);
  const toolbar = el("div",{class:"toolbar"});
  const filterSel = el("select",{});
  [["all","All flashcards"],["review","Marked for review"],["unseen","Unattempted"]].forEach(([v,l])=>filterSel.appendChild(el("option",{value:v},[l])));
  toolbar.appendChild(filterSel);
  wrap.appendChild(toolbar);

  const holder = el("div",{});
  function getFiltered(){
    return cards.filter(c=>{
      const st = effectiveStatus(itemRef(c.id, m, "theory", c.topic));
      if(filterSel.value==="review") return st==="review";
      if(filterSel.value==="unseen") return !st;
      return true;
    });
  }
  let flipped = false;
  function draw(){
    holder.innerHTML = "";
    const filtered = getFiltered();
    if(!filtered.length){ holder.appendChild(el("p",{class:"small-muted"},["No flashcards match this filter."])); return; }
    if(FLASH_IDX[m] >= filtered.length) FLASH_IDX[m]=0;
    const card = filtered[FLASH_IDX[m]];
    const outer = el("div",{class:"flashcard-outer"});
    const fc = el("div",{class:"flashcard"+(flipped?" is-answer":"")});
    fc.appendChild(el("div",{},[flipped ? card.a : card.q]));
    fc.addEventListener("click",()=>{ flipped=!flipped; draw(); });
    outer.appendChild(el("div",{class:"side-label"},[flipped?"Answer":"Question"]));
    outer.appendChild(fc);
    holder.appendChild(outer);
    const st = statusOf(card.id);
    holder.appendChild(el("div",{class:"flashcard-status"},
      ["Card "+(FLASH_IDX[m]+1)+" of "+filtered.length+(st?" · "+(st==="done"?"done":"for review"):"")]));
    const controls = el("div",{class:"flashcard-controls"});
    controls.appendChild(el("button",{onclick:()=>{FLASH_IDX[m]=(FLASH_IDX[m]-1+filtered.length)%filtered.length; flipped=false; draw();}},["◀ Previous"]));
    controls.appendChild(el("button",{class:"primary",onclick:()=>{flipped=!flipped; draw();}},["Flip"]));
    controls.appendChild(el("button",{onclick:()=>{FLASH_IDX[m]=(FLASH_IDX[m]+1)%filtered.length; flipped=false; draw();}},["Next ▶"]));
    controls.appendChild(el("button",{class:"st-done",onclick:()=>{
      PROGRESS.status[card.id]="done"; saveProgress(); refreshProgressIndicators();
      FLASH_IDX[m]=(FLASH_IDX[m]+1)%filtered.length; flipped=false; draw();}},["✓ Done"]));
    controls.appendChild(el("button",{class:"st-review",onclick:()=>{
      PROGRESS.status[card.id]="review"; saveProgress(); refreshProgressIndicators();
      FLASH_IDX[m]=(FLASH_IDX[m]+1)%filtered.length; flipped=false; draw();}},["↻ Mark for Review"]));
    holder.appendChild(controls);
  }
  filterSel.addEventListener("change",()=>{FLASH_IDX[m]=0; flipped=false; draw();});
  draw();
  wrap.appendChild(holder);
  const done = cards.filter(c=>statusOf(c.id)==="done").length;
  const rev  = cards.filter(c=>statusOf(c.id)==="review").length;
  wrap.appendChild(el("p",{class:"small-muted",style:"text-align:center;margin-top:14px"},
    [cards.length+" flashcards · "+done+" done · "+rev+" for review · "+(cards.length-done-rev)+" unattempted"]));
  return wrap;
}

function renderQuizRunner(m,key){
  const wrap = el("div",{});
  wrap.appendChild(el("button",{class:"ghost small",onclick:()=>{ROUTE.sub[m]="quiz"; render();}},["← Back to quizzes"]));
  const qs = DATA.quiz[key];
  if(!QUIZ_STATE[key]) QUIZ_STATE[key]={answers:{},submitted:{}};
  const state = QUIZ_STATE[key];
  let scoreSoFar = 0, answeredCount = 0;
  qs.forEach((q,i)=>{ if(state.submitted[i]){ answeredCount++; if(state.submitted[i]==="correct") scoreSoFar++; } });
  wrap.appendChild(el("div",{class:"card"},[`Score so far: ${scoreSoFar}/${answeredCount} answered (${qs.length} total)`]));

  qs.forEach((q,i)=>{
    const qDiv = el("div",{class:"quiz-q"});
    qDiv.appendChild(el("div",{style:"font-weight:700;margin-bottom:6px"},[`${i+1}. ${q.q}`]));
    const submitted = state.submitted[i];
    if(q.type==="mcq"){
      q.options.forEach((opt,oi)=>{
        const btn = el("button",{class:"quiz-opt",onclick:()=>{
          if(state.submitted[i]) return;
          state.answers[i]=oi;
          state.submitted[i] = (oi===q.correct)?"correct":"incorrect";
          renderKeepScroll();
        }},[opt]);
        if(submitted){
          if(oi===q.correct) btn.classList.add("correct");
          else if(oi===state.answers[i]) btn.classList.add("incorrect");
        }
        qDiv.appendChild(btn);
      });
    } else if(q.type==="tf"){
      [["True",true],["False",false]].forEach(([label,val])=>{
        const btn = el("button",{class:"quiz-opt",onclick:()=>{
          if(state.submitted[i]) return;
          state.answers[i]=val;
          state.submitted[i] = (val===q.correct)?"correct":"incorrect";
          renderKeepScroll();
        }},[label]);
        if(submitted){
          if(val===q.correct) btn.classList.add("correct");
          else if(val===state.answers[i]) btn.classList.add("incorrect");
        }
        qDiv.appendChild(btn);
      });
    } else if(q.type==="multi"){
      const chosen = state.answers[i] || [];
      q.options.forEach((opt,oi)=>{
        const isChecked = chosen.includes(oi);
        const row = el("label",{style:"display:flex;gap:8px;align-items:center;padding:6px 4px;"});
        const cb = el("input",{type:"checkbox"});
        cb.checked = isChecked; cb.disabled = !!submitted;
        cb.addEventListener("change",()=>{
          let arr = state.answers[i]||[];
          if(cb.checked) arr = [...arr, oi]; else arr = arr.filter(x=>x!==oi);
          state.answers[i] = arr;
        });
        row.appendChild(cb); row.appendChild(document.createTextNode(opt));
        if(submitted){
          const correctSet = new Set(q.correct);
          if(correctSet.has(oi)) row.style.color = "var(--good)";
          else if(chosen.includes(oi)) row.style.color = "var(--bad)";
        }
        qDiv.appendChild(row);
      });
      if(!submitted){
        qDiv.appendChild(el("button",{class:"primary small",style:"margin-top:6px",onclick:()=>{
          const chosenArr = (state.answers[i]||[]).slice().sort();
          const correctArr = q.correct.slice().sort();
          const isCorrect = JSON.stringify(chosenArr)===JSON.stringify(correctArr);
          state.submitted[i] = isCorrect?"correct":"incorrect";
          renderKeepScroll();
        }},["Submit Answer"]));
      }
    }
    if(submitted){
      qDiv.appendChild(el("div",{class:"quiz-feedback "+submitted},[
        (submitted==="correct"?"✓ Correct. ":"✗ Incorrect. ") + q.explanation
      ]));
    }
    wrap.appendChild(qDiv);
  });

  const allAnswered = qs.every((q,i)=>state.submitted[i]);
  wrap.appendChild(el("button",{class:"primary",disabled:!allAnswered,onclick:()=>{
    const total = qs.length;
    const score = qs.filter((q,i)=>state.submitted[i]==="correct").length;
    PROGRESS.quizScores[key] = {score,total,date:new Date().toLocaleDateString()};
    saveProgress();
    alert(`Quiz complete! Score: ${score}/${total} (${pct(score,total)}%)`);
    ROUTE.sub[m]="quiz";
    render();
  }},[allAnswered?"Finish & Save Score":"Answer all questions to finish"]));
  return wrap;
}

function renderNoteSection(sec){
  const card = el("div",{class:"card nb-sec"});
  const head = el("div",{class:"nb-head"});
  head.appendChild(el("h3",{html:sec.heading}));
  if(sec.page) head.appendChild(el("span",{class:"nb-page"},[sec.page]));
  card.appendChild(head);
  (sec.blocks||[]).forEach(b=>{
    const node = renderNoteBlock(b);
    if(node) card.appendChild(node);
  });
  return card;
}

function renderNoteBlock(b){
  switch(b.t){
    case "p":
      return el("p",{class:"nb-p",html:b.v});
    case "list": {
      const ul = el("ul",{class:"nb-list"});
      b.v.forEach(x=>ul.appendChild(el("li",{html:x})));
      return ul;
    }
    case "num": {
      const ol = el("ol",{class:"nb-list"});
      b.v.forEach(x=>ol.appendChild(el("li",{html:x})));
      return ol;
    }
    case "formula":
      return el("pre",{class:"nb-formula"},[b.v]);
    case "flow":
      return el("pre",{class:"nb-flow"},[b.v]);
    case "note":
      return el("div",{class:"nb-note",html:"<b>Note · </b>"+b.v});
    case "warn":
      return el("div",{class:"nb-warn",html:"<b>⚠ </b>"+b.v});
    case "table": {
      const scroller = el("div",{class:"nb-scroll"});
      const t = el("table",{class:"nb-t"});
      if(b.head){
        const tr = el("tr",{});
        b.head.forEach(h=>tr.appendChild(el("th",{html:h})));
        t.appendChild(tr);
      }
      (b.rows||[]).forEach(row=>{
        const tr = el("tr",{});
        row.forEach(c=>tr.appendChild(el("td",{html:c})));
        t.appendChild(tr);
      });
      scroller.appendChild(t);
      return scroller;
    }
    case "ex": {
      const box = el("div",{class:"nb-ex"});
      box.appendChild(el("div",{class:"nb-q",html:"<span class='nb-qlabel'>Q</span> "+b.q}));
      const ans = el("div",{class:"nb-a",html:b.a});
      const btn = el("button",{class:"small nb-toggle",onclick:()=>{
        ans.classList.toggle("show");
        btn.textContent = ans.classList.contains("show") ? "Hide answer" : "Show answer";
      }},["Show answer"]);
      box.appendChild(btn);
      box.appendChild(ans);
      return box;
    }
    default:
      return null;
  }
}

            MOCK_STATE.selfMark[i+"_grade"]=val;

            render();
          }},[label]));
        });

      }

      render();
    }},["Submit Mock Test"]));
  } else {
    const totalMarks = DATA.mock.reduce((s,q)=>s+q.marks,0);
    const scored = DATA.mock.reduce((s,q,i)=>{
      if(q.type==="mcq") return s + (MOCK_STATE.answers[i]===q.correct?q.marks:0);
      if(q.type==="numeric") return s + (MOCK_STATE.selfMark[i]||0);
      return s + (MOCK_STATE.selfMark[i]||0);
    },0);
    const correctCount = DATA.mock.filter((q,i)=>{
      if(q.type==="mcq") return MOCK_STATE.answers[i]===q.correct;
      if(q.type==="numeric") return MOCK_STATE.selfMark[i]===q.marks;
      return MOCK_STATE.selfMark[i]===q.marks;
    }).length;
    const unanswered = DATA.mock.filter((q,i)=>MOCK_STATE.answers[i]===undefined || MOCK_STATE.answers[i]==="").length;

    const summary = el("div",{class:"card"});
    summary.appendChild(el("h2",{},["Result"]));
    summary.appendChild(el("div",{class:"grid stats"},[
      makeStat(Math.round(scored*10)/10+"/"+totalMarks,"Marks Obtained"),
      makeStat(pct(scored,totalMarks)+"%","Percentage"),
      makeStat(String(correctCount),"Fully Correct"),
      makeStat(String(unanswered),"Unanswered")
    ]));
    // module-wise breakdown
    const byModule = {m1:{got:0,total:0},m2:{got:0,total:0},m3:{got:0,total:0}};
    DATA.mock.forEach((q,i)=>{
      byModule[q.module].total += q.marks;
      if(q.type==="mcq") byModule[q.module].got += (MOCK_STATE.answers[i]===q.correct?q.marks:0);
      else byModule[q.module].got += (MOCK_STATE.selfMark[i]||0);
    });
    summary.appendChild(el("h3",{},["Module-wise Performance"]));
    Object.entries(byModule).forEach(([mm,v])=>{
      if(v.total===0) return;
      summary.appendChild(el("div",{},[`${MODULE_TITLES[mm].split("—")[0].trim()}: ${v.got}/${v.total} (${pct(v.got,v.total)}%)`]));
    });
    const mockWeakAreas = Object.entries(byModule).filter(([mm,v])=>v.total>0 && pct(v.got,v.total)<60).map(([mm])=>MODULE_TITLES[mm]);
    if(mockWeakAreas.length){
      summary.appendChild(el("h3",{},["Weak Areas To Revise"]));
      mockWeakAreas.forEach(w=>summary.appendChild(el("div",{},["🔴 "+w])));
    }
    summary.appendChild(el("button",{class:"primary",style:"margin-top:10px",onclick:()=>{
      PROGRESS.mock = {score:Math.round(scored*10)/10, total:totalMarks, date:new Date().toLocaleDateString()};
      saveProgress();
      alert("Saved to dashboard.");
    }},["Save Result to Dashboard"]));
    summary.appendChild(el("button",{class:"ghost",style:"margin-top:10px;margin-left:8px",onclick:()=>{
      if(confirm("Retake the mock test from scratch?")){ MOCK_STATE = {started:false, submitted:false, answers:{}, selfMark:{}, startTime:null, timerId:null}; render(); }
    }},["Retake Mock Test"]));
    wrap.appendChild(summary);
  }
  return wrap;
}
function startMockTimer(){
  const durationMs = 90*60*1000;
  MOCK_STATE.timerId = setInterval(()=>{
    const elapsed = Date.now()-MOCK_STATE.startTime;
    const remaining = Math.max(0, durationMs-elapsed);
    const mins = Math.floor(remaining/60000), secs = Math.floor((remaining%60000)/1000);
    const t = document.getElementById("mockTimerText");
    if(t) t.textContent = `${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
    if(remaining<=0){
      clearInterval(MOCK_STATE.timerId);
      if(!MOCK_STATE.submitted){ MOCK_STATE.submitted=true; render(); alert("Time's up! Your mock test has been auto-submitted."); }
    }
  },1000);
}

    .forEach(([v,l])=>qSel.appendChild(el("option",{value:v},[l])));
  qSel.value = FOCUS_FILTER.q;
  const sSel = el("select",{});
  [["all","All statuses"],["pending","Unattempted"],["review","For review"],["done","Done"]]
    .forEach(([v,l])=>sSel.appendChild(el("option",{value:v},[l])));
  sSel.value = FOCUS_FILTER.status;
  bar.appendChild(qSel); bar.appendChild(dSel); bar.appendChild(sSel);
  wrap.appendChild(bar);
  wrap.appendChild(el("div",{class:"focus-legend"},[
    el("span",{},["Short on time? Set difficulty to ", el("b",{},["Difficult only"]), " — that is the exam-level subset."])
  ]));

  const body = el("div",{});
  function draw(){
    body.innerHTML = "";
    ["m1","m2","m3"].forEach(m=>{
      const topics = FOCUS.filter(x=>x.m===m && (qSel.value==="all" || x.q===qSel.value));
      if(!topics.length) return;
      body.appendChild(el("h2",{},[MODULE_TITLES[m]]));
      topics.forEach(t=>body.appendChild(renderFocusTopic(t, dSel.value, sSel.value)));
    });
    if(!body.children.length) body.appendChild(el("p",{class:"small-muted"},["Nothing matches these filters."]));
  }
  [dSel,qSel,sSel].forEach(sel=>sel.addEventListener("change",()=>{
    FOCUS_FILTER = {d:dSel.value, q:qSel.value, status:sSel.value}; draw();
  }));
  draw();
  wrap.appendChild(body);
  return wrap;
}

function renderFocusTopic(t, dFilter, sFilter){
  const box = el("div",{class:"focus-card "+t.q, id:"item_"+t.id});
  const head = el("div",{class:"focus-head"});
  head.appendChild(el("span",{class:"qtag "+t.q},[t.q]));
  head.appendChild(el("span",{class:"mtag"},[t.marks+" marks"]));
  head.appendChild(el("span",{class:"small-muted"},["Syllabus "+t.topic]));
  const stTag = el("span",{class:"st-tag"},[""]);
  head.appendChild(stTag);
  const pctEl = el("span",{style:"margin-left:auto;font-weight:800;color:var(--accent)"},[""]);
  head.appendChild(pctEl);
  watchProgress(()=>{
    paintStatusTag(stTag, itemRef(t.id, t.m, "focus", t.topic));
    const ts = focusTopicStats(t);
    pctEl.textContent = ts.done+"/"+ts.total;
  });
  box.appendChild(head);
  box.appendChild(el("h3",{style:"margin:4px 0 3px"},[t.title]));
  box.appendChild(el("div",{class:"small-muted",style:"margin-bottom:8px"},[t.why]));
  const fbar = tickBar(t.m, topicCodeOf(t.topic),
    moduleItems(t.m).filter(i=>i.sub==="focus" && (i.id===t.id || i.parent===t.id)),
    {label:"Covered elsewhere?"});
  if(fbar){ fbar.style.margin = "0 0 10px"; box.appendChild(fbar); }

  /* the exact question as it was set */
  const pb = el("div",{class:"pattern-box"});
  pb.appendChild(el("div",{class:"small-muted",style:"margin-bottom:5px"},["THE PATTERN — "+t.pattern.src]));
  pb.appendChild(el("div",{class:"pq"},[t.pattern.q]));
  const sol = el("div",{class:"solution"});
  const ol = el("ol",{class:"cqsteps"});
  (t.pattern.steps||[]).forEach(x=>ol.appendChild(el("li",{},[x])));
  sol.appendChild(ol);
  sol.appendChild(el("div",{class:"ansbox"},[t.pattern.answer]));
  const sb = el("button",{class:"small",onclick:()=>{ sol.classList.toggle("show");
    sb.textContent = sol.classList.contains("show")?"Hide model answer":"Show model answer"; }},["Show model answer"]);
  pb.appendChild(sb); pb.appendChild(sol);
  box.appendChild(pb);
  box.appendChild(statusControl(t.id));

  /* graded practice */
  const qs = (t.questions||[]).filter(p=>{
    if(dFilter!=="all" && p.d!==dFilter) return false;
    const st = effectiveStatus(itemRef(p.id, t.m, "focus", t.topic, t.id));
    if(sFilter==="pending" && st) return false;
    if(sFilter==="review" && st!=="review") return false;
    if(sFilter==="done" && st!=="done") return false;
    return true;
  });
  const counts = (t.questions||[]).reduce((a,p)=>{a[p.d]=(a[p.d]||0)+1; return a;},{});
  box.appendChild(el("h4",{style:"margin:14px 0 6px"},
    ["Practice — "+qs.length+" shown ("+(counts.easy||0)+" easy · "+(counts.medium||0)+" medium · "+(counts.difficult||0)+" difficult)"]));
  if(!qs.length) box.appendChild(el("p",{class:"small-muted"},["Nothing matches these filters in this topic."]));
  qs.forEach(p=>{
    const c = el("div",{class:"practice-q", id:"item_"+p.id});
    const h = el("div",{class:"qhead"});
    const badges = el("span",{class:"badge-row"});
    badges.appendChild(el("span",{class:"pill d-"+p.d},[p.d]));
    badges.appendChild(el("span",{class:"qtag "+t.q},[t.q]));
    badges.appendChild(el("span",{class:"mtag"},[t.marks+"m"]));
    const tag = el("span",{class:"st-tag"},[""]);
    badges.appendChild(tag);
    watchProgress(()=>paintStatusTag(tag, itemRef(p.id, t.m, "focus", t.topic, t.id)));
    h.appendChild(badges);
    c.appendChild(h);
    c.appendChild(el("div",{style:"margin:6px 0;white-space:pre-wrap"},[p.q]));
    const a = el("div",{class:"solution",html:nl2br(p.a)});
    const ab = el("button",{class:"small",onclick:()=>{ a.classList.toggle("show");
      ab.textContent = a.classList.contains("show")?"Hide Solution":"Show Solution"; }},["Show Solution"]);
    c.appendChild(ab); c.appendChild(a);
    c.appendChild(statusControl(p.id));
    box.appendChild(c);
  });
  return box;
}

/* ================= GLOBAL SEARCH =================
   One flat index over everything in the app. Built once, lazily.
   ================================================= */
let SEARCH_INDEX = null;
let SEARCH_QUERY = "";
function plain(x){ return String(x==null?"":x).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim(); }

function buildSearchIndex(){
  if(SEARCH_INDEX) return SEARCH_INDEX;
  const ix = [];
  const push = o => { o.hay = (o.title+" "+o.body).toLowerCase(); ix.push(o); };

  FOCUS.forEach(t=>{
    push({sec:"MSE Focus", m:t.m, view:"focus", sub:null, id:t.id,
      title:t.title, body:plain(t.pattern.q)+" "+plain(t.why)+" "+plain(t.pattern.answer),
      tags:[t.q, t.marks+" marks", "focus"]});
    (t.questions||[]).forEach(p=>push({sec:"MSE Focus", m:t.m, view:"focus", sub:null, id:p.id,
      title:plain(p.q), body:plain(p.a), tags:[t.q, p.d, t.title]}));
  });
  ["m1","m2","m3"].forEach(m=>{
    (DATA.theory[m]||[]).forEach(q=>push({sec:"Theory", m, view:m, sub:"theory", id:q.id,
      title:plain(q.q), body:plain(q.a)+" "+plain(q.understand)+" "+plain(q.examAnswer)+" "+plain(q.mistakes),
      tags:["Topic "+q.topic, q.marks+" marks", q.priority]}));
    (DATA.solved[m]||[]).forEach(t=>{
      push({sec:"Class Solved", m, view:m, sub:"solved", id:t.id,
        title:t.title, body:plain(t.idea)+" "+plain(t.method)+" "+(t.classQs||[]).map(c=>plain(c.q)+" "+plain(c.answer)).join(" "),
        tags:["Topic "+t.topic, t.marks+" marks", "class notes"]});
      (t.practice||[]).forEach(p=>push({sec:"Class Solved", m, view:m, sub:"solved", id:p.id,
        title:plain(p.q), body:plain(p.answer), tags:[p.difficulty, p.kind||"", t.title]}));
    });
    (DATA.numericals[m]||[]).forEach(t=>{
      push({sec:"Numericals", m, view:m, sub:"numericals", id:t.id,
        title:t.title, body:plain(t.concept)+" "+plain(t.formula), tags:[t.topic]});
      (t.practice||[]).forEach(p=>push({sec:"Numericals", m, view:m, sub:"numericals", id:p.id,
        title:plain(p.q), body:plain(p.answer), tags:[p.difficulty, t.title]}));
    });
    (DATA.revision && DATA.revision[m] || []).forEach((sec,i)=>push({sec:"Quick Revision", m, view:m, sub:"revision", id:null,
      title:sec.heading, body:(sec.points||[]).map(plain).join(" "), tags:[]}));
  });
  Object.keys(DATA.notes||{}).forEach(k=>{
    (DATA.notes[k]||[]).forEach(secn=>push({sec:"Class Notes", m:(k==="exam"?null:k), view:"notes", sub:k, id:null,
      title:secn.heading, body:(secn.blocks||[]).map(b=>plain(Array.isArray(b.v)?b.v.join(" "):b.v)).join(" "),
      tags:[secn.page||""]}));
  });
  Object.keys(DATA.quiz||{}).forEach(k=>{
    const m = k.slice(0,2);
    (DATA.quiz[k]||[]).forEach(q=>push({sec:"Quiz", m, view:m, sub:"quiz", id:null,
      title:plain(q.q), body:plain(q.explanation)+" "+(q.options||[]).map(plain).join(" "), tags:[k]}));
  });
  LOS.forEach(l=>push({sec:"Learning Outcomes", m:l.m, view:l.m, sub:"outcomes", id:null,
    title:l.id+" — "+l.text, body:plain(l.form)+" P.I. "+l.pi, tags:[l.verb]}));
  SEARCH_INDEX = ix;
  return ix;
}

function runSearch(q){
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!terms.length) return [];
  return buildSearchIndex().map(e=>{
    let score = 0;
    for(const t of terms){
      if(e.hay.indexOf(t) < 0) return null;      /* every term must appear */
      const inTitle = e.title.toLowerCase().indexOf(t) >= 0;
      score += inTitle ? 12 : 3;
      if(e.sec==="MSE Focus") score += 6;         /* the exam-critical set floats up */
      if(e.sec==="Class Solved") score += 3;
    }
    return {e, score};
  }).filter(Boolean).sort((a,b)=>b.score-a.score).map(x=>x.e);
}

function highlight(text, terms, cap){
  const raw = String(text||"");
  let start = 0;
  if(cap && raw.length > cap){
    const lower = raw.toLowerCase();
    let first = -1;
    terms.forEach(t=>{ const i = lower.indexOf(t); if(i>=0 && (first<0 || i<first)) first = i; });
    if(first > 60) start = first - 60;
  }
  let out = raw.slice(start, cap ? start+cap : undefined);
  if(start > 0) out = "…"+out;
  if(cap && raw.length > start+cap) out = out+"…";
  const frag = document.createElement("span");
  frag.textContent = out;
  let html = frag.innerHTML;
  terms.forEach(t=>{
    const esc = t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    html = html.replace(new RegExp("("+esc+")","gi"), "<mark>$1</mark>");
  });
  const span = document.createElement("span");
  span.innerHTML = html;
  return span;
}

function renderSearch(){
  const wrap = el("div",{});
  const q = SEARCH_QUERY.trim();
  wrap.appendChild(el("h1",{},['Search']));
  if(q.length < 2){
    wrap.appendChild(el("p",{class:"small-muted"},["Type at least two characters. Press / anywhere to jump to the search box."]));
    return wrap;
  }
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = runSearch(q);
  wrap.appendChild(el("p",{class:"small-muted"},[hits.length+" result"+(hits.length===1?"":"s")+' for "'+q+'"']));
  if(!hits.length){
    wrap.appendChild(el("div",{class:"card"},["Nothing matched. Try a single keyword — perplexity, viterbi, porter, ambiguity, TF-IDF, CKY."]));
    return wrap;
  }
  const order = ["MSE Focus","Class Solved","Numericals","Theory","Quiz","Class Notes","Quick Revision","Learning Outcomes"];
  const bySec = {};
  hits.forEach(h=>{ (bySec[h.sec] = bySec[h.sec] || []).push(h); });
  order.forEach(sec=>{
    const list = bySec[sec]; if(!list) return;
    wrap.appendChild(el("div",{class:"searchsec"},[sec+" ("+list.length+")"]));
    list.slice(0,25).forEach(h=>{
      const card = el("div",{class:"hit"});
      const head = el("div",{class:"hit-h"});
      if(h.m) head.appendChild(el("span",{class:"pill medium"},[MODULE_TITLES[h.m].split("—")[0].trim()]));
      (h.tags||[]).filter(Boolean).forEach(t=>head.appendChild(el("span",{class:"pill low"},[String(t)])));
      if(h.id){
        const st = statusOf(h.id);
        if(st) head.appendChild(el("span",{class:"st-tag "+st},[st==="done"?"Done":"For review"]));
      }
      const go = el("button",{class:"small",style:"margin-left:auto",onclick:()=>{
        if(h.view==="focus"){ jumpToFocus(h.id); }
        else if(h.view==="notes"){ ROUTE.view="notes"; ROUTE.notesSub=h.sub||"exam"; render(); }
        else if(h.id){ jumpTo(h.view, h.sub, h.id); }
        else { ROUTE.view=h.view; if(h.sub) ROUTE.sub[h.view]=h.sub; render(); }
      }},["Open"]);
      head.appendChild(go);
      card.appendChild(head);
      const tt = el("div",{class:"hit-t",style:"font-weight:650"});
      tt.appendChild(highlight(h.title, terms, 180));
      card.appendChild(tt);
      if(h.body){
        const bb = el("div",{class:"hit-t small-muted",style:"margin-top:4px"});
        bb.appendChild(highlight(h.body, terms, 200));
        card.appendChild(bb);
      }
      wrap.appendChild(card);
    });
    if(list.length > 25) wrap.appendChild(el("p",{class:"small-muted"},["+ "+(list.length-25)+" more in this section — narrow the query."]));
  });
  return wrap;
}

/* ================= SEARCH WIRING ================= */
let PRE_SEARCH_VIEW = "dashboard";
(function(){
  const box = document.getElementById("globalSearch");
  const clear = document.getElementById("searchClear");
  if(!box) return;
  let last = "";
  let timer = null;
  box.addEventListener("input", ()=>{
    clearTimeout(timer);
    timer = setTimeout(()=>{
      const v = box.value;
      if(v === last) return;
      last = v;
      SEARCH_QUERY = v;
      if(v.trim().length === 0){
        if(ROUTE.view === "search"){ ROUTE.view = PRE_SEARCH_VIEW || "dashboard"; render(); box.focus(); }
        return;
      }
      if(ROUTE.view !== "search"){ PRE_SEARCH_VIEW = ROUTE.view; ROUTE.view = "search"; }
      renderKeepScroll();
      if(SEARCH_QUERY.trim().length >= 2) window.scrollTo(0,0);
    }, 160);
  });
  box.addEventListener("keydown", e=>{
    if(e.key === "Escape"){ box.value=""; SEARCH_QUERY=""; last="";
      ROUTE.view = PRE_SEARCH_VIEW || "dashboard"; render(); box.blur(); }
  });
  if(clear) clear.addEventListener("click", ()=>{
    box.value=""; SEARCH_QUERY=""; last="";
    ROUTE.view = PRE_SEARCH_VIEW || "dashboard"; render(); box.focus();
  });
  /* press "/" anywhere to jump into the search box */
  document.addEventListener("keydown", e=>{
    const tag = (e.target && e.target.tagName || "").toLowerCase();
    if(e.key === "/" && tag !== "input" && tag !== "textarea" && tag !== "select"){
      e.preventDefault(); box.focus(); box.select();
    }
  });
})();

/* ================= BOOT ================= */
render();

/* ===== APP_END ===== */
</script>
