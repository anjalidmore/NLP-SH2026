 practice:[
  {id:"m3n3p1", difficulty:"easy", q:"A word candidate has 2 active features (weight=1 each). Compute exp(Σwᵢfᵢ) for it.", answer:"exp(1×1 + 1×1) = exp(2) ≈ 7.389"},
  {id:"m3n3p2", difficulty:"easy", q:"Two candidates: A has 1 active feature, B has 0 active features. Compute p(A) using the softmax formula.", answer:"p(A) = exp(1)/[exp(1)+exp(0)] = e/(e+1) ≈ 2.718/3.718 ≈ 0.731"},
  {id:"m3n3p3", difficulty:"easy", q:"Two candidates each with exactly 1 active feature (tied). What is p(each)?", answer:"p(each) = exp(1)/[exp(1)+exp(1)] = 0.5 (a tie always gives 0.5/0.5 when feature counts match)"},
  {id:"m3n3p4", difficulty:"basic", q:"3 candidates have 0, 1, and 2 active features respectively. Compute all 3 probabilities (to 3 decimal places).", answer:"Denominator = exp(0)+exp(1)+exp(2) = 1+2.718+7.389 = 11.107. p(0-feature)=1/11.107≈0.090. p(1-feature)=2.718/11.107≈0.245. p(2-feature)=7.389/11.107≈0.665."},
  {id:"m3n3p5", difficulty:"basic", q:"A partial path has probability 0.6 so far. The next word's chosen tag has p=0.4 given that path. Compute the combined path probability.", answer:"Combined = 0.6 × 0.4 = 0.24"},
  {id:"m3n3p6", difficulty:"basic", q:"With Beam Size=2, four candidate paths have combined probabilities 0.05, 0.30, 0.12, 0.45. Which two survive the beam prune?", answer:"Keep the top 2: 0.45 and 0.30 (discard 0.12 and 0.05)"},
  {id:"m3n3p7", difficulty:"moderate", q:"For the word 'complex' in a NEW sentence context, complex(Verb) has 2 active features and complex(Adj) has 1 active feature (all weight=1) — the REVERSE of the worked example's feature counts. If the incoming path probability is 0.5 for both, compute both combined probabilities and state which tag wins.", answer:"Denominator = exp(2)+exp(1) = 7.389+2.718 = 10.107. p(Verb) = 7.389/10.107 ≈ 0.731 → combined = 0.731×0.5 ≈ 0.366. p(Adj) = 2.718/10.107 ≈ 0.269 → combined = 0.269×0.5 ≈ 0.135. Verb wins (0.366 > 0.135) — the OPPOSITE conclusion from the worked example, since the feature pattern reversed."},
  {id:"m3n3p8", difficulty:"moderate", q:"Beam Size=1 (i.e., only keep the SINGLE best path at each step, a greedy search). Using the original 'complex' word 2 results (Det-Adj:0.455, Noun-Adj:0.33, plus the two Verb paths already lower), which single path proceeds to word 3?", answer:"Only Det-Adj (0.455, the single highest of all 4) survives with Beam Size=1 — Noun-Adj (0.33) would be discarded even though it eventually could have led to a competitive final answer; this shows how a SMALLER beam size risks prematurely discarding paths that might have won later, trading search completeness for speed."},
  {id:"m3n3p9", difficulty:"moderate", q:"If ALL feature weights were 2 instead of 1 (but the same features remain active/inactive as the original example), would the FINAL best tagging (Det-Adj-Noun) necessarily change? Explain using the softmax property.", answer:"No — doubling every weight uniformly scales every exponent by the same factor (2× instead of 1×), which preserves the RELATIVE ORDERING of probabilities (since softmax is monotonic in the exponents, and a uniform positive scaling exaggerates differences but doesn't reverse them). The ranking of candidates stays the same, so Det-Adj-Noun would still win — though the absolute probability VALUES would differ (a more 'confident'/peaked distribution with larger weights)."},
  {id:"m3n3p10", difficulty:"difficult", q:"A path with probability 0.387 (Det-Adj-Noun, the actual winner) is compared against a hypothetical alternative path Det-Adj-Verb with a recomputed probability of 0.40 (assume a different feature table). Would the final answer change, and what does this reveal about the importance of accurate feature engineering?", answer:"Yes — if Det-Adj-Verb genuinely scored 0.40 > 0.387, it would become the new winning path, changing the final tagging to The/Det, complex/Adj, record/Verb instead of record/Noun. This reveals that MEMM's final answer is entirely dependent on which FEATURES are defined and how they're weighted — small changes in the feature set or training (leading to different weights) can flip the final decision, unlike an HMM's more rigid but often more robust closed-form emission/transition estimates; feature engineering quality is THE critical factor in MEMM performance."},
  {id:"m3n3p11", difficulty:"exam-level", q:"Explain why MEMM's beam search prunes to 'top-K' paths rather than keeping ALL paths (as full Viterbi does for HMM), and what risk this introduces.", answer:"MEMM allows arbitrary, overlapping, non-independent features (unlike HMM's constrained emission/transition structure), which means the clean Viterbi dynamic-programming recurrence (relying on Markov independence) doesn't straightforwardly apply in the same efficient way for ALL feature types — beam search is a practical APPROXIMATION that keeps the search tractable by discarding low-probability partial paths early. The risk is that beam search is NOT guaranteed to find the true global-best path — a path that looks suboptimal early on (and gets pruned) might have become the best overall path after seeing later words, a risk that grows as beam size K shrinks (as illustrated by the Beam-Size=1 question above)."},
  {id:"m3n3p12", difficulty:"challenge", q:"Design a small feature-count table (0 to 3 features per candidate, across 2 candidates) where INCREASING beam size from 1 to 2 changes the final answer, and explain the general lesson.", answer:"Example: Word 2 candidates score 0.50(A) and 0.48(B) — with beam=1, only A survives. Suppose word 3, given A's context, best continuation scores only 0.10 (combined 0.05), while given B's context (which was pruned away), the best continuation would have scored 0.90 (combined 0.48×0.90=0.432 — much higher than 0.05). With beam=1, the algorithm never explores B's continuation and returns the inferior final answer (0.05, via A); with beam=2, both A and B survive after word 2, and the true best final path (0.432, via B) is correctly found. General lesson: a larger beam size hedges against greedily committing to a locally-strong but globally-suboptimal path, at the cost of more computation — beam size is a computation/accuracy trade-off knob, not a free parameter."}
 ]
},
{
 id:"m3n4", title:"PCFG Parse Probability Computation", topic:"3.3 PCFG",
 concept:"Once a sentence has been parsed (possibly in multiple ways) using a CFG, a PCFG lets you compute a NUMERIC PROBABILITY for each complete parse tree by multiplying the probabilities of every grammar rule used to build it — the tree with the highest such product is the model's preferred (most likely) interpretation.",
 formula:"P(T) = ∏ᵢ P(RHSᵢ|LHSᵢ) — the product of every rule's probability, over all non-terminal expansions used in the tree.\nRule probability estimation: P(A→β) = Count(A→β)/Count(A).\nConstraint: for any fixed non-terminal A, its rule probabilities must sum to 1 across all of A's possible expansions.",
 workedExample:{
  title:"Compute the parse probability for 'Book book' using a tiny PCFG",
  steps:[
   "Grammar: S→NP VP [0.6], S→VP [0.4], NP→Noun [1.0], VP→Verb [0.3], VP→Verb NP [0.7], Noun→book [0.1], Verb→book [0.2].",
   "Parse 1 — 'Book' as Verb (VP→Verb), 'book' as the object... but with only 2 words and only S→VP[0.4] with VP→Verb NP[0.7] using NP→Noun[1.0]→book[0.1] for the second 'book', and Verb→book[0.1]... let's take the straightforward reading: S→VP, VP→Verb NP, Verb→book(first), NP→Noun, Noun→book(second).",
   "Step 1 — Identify every rule used: S→VP [0.4], VP→Verb NP [0.7], Verb→book [0.2], NP→Noun [1.0], Noun→book [0.1].",
   "Step 2 — Multiply all rule probabilities: P(T) = 0.4 × 0.7 × 0.2 × 1.0 × 0.1 = 0.0056.",
   "Step 3 — This is the probability of THIS SPECIFIC parse tree (reading the sentence as 'Book' [verb, command] 'book' [noun, object] — e.g. an instruction to reserve a book). A different bracketing/rule choice for the same words would give a different P(T), and PCFG parsing selects whichever complete tree has the HIGHEST such product."
  ]
 },
 practice:[
  {id:"m3n4p1", difficulty:"easy", q:"A parse uses rules with probabilities 0.8, 0.5, and 1.0. Compute the tree's total probability.", answer:"0.8 × 0.5 × 1.0 = 0.4"},
  {id:"m3n4p2", difficulty:"easy", q:"Rule A→B has Count(A→B)=15, Count(A)=60. Compute P(A→B).", answer:"15/60 = 0.25"},
  {id:"m3n4p3", difficulty:"easy", q:"Non-terminal A has exactly 2 rules: A→B [0.7] and A→C [p]. Find p.", answer:"Since probabilities must sum to 1: p = 1 - 0.7 = 0.3"},
  {id:"m3n4p4", difficulty:"basic", q:"Using the ATIS-style grammar (S→NP VP [.80]; NP→Pronoun [.35]; Pronoun→I [.40]; VP→Verb [.35]; Verb→prefer [.40]), compute P(T) for the parse of 'I prefer' as S→NP VP, NP→Pronoun, Pronoun→I, VP→Verb, Verb→prefer.", answer:"P(T) = 0.80 × 0.35 × 0.40 × 0.35 × 0.40 = 0.01568"},
  {id:"m3n4p5", difficulty:"basic", q:"Using the same ATIS grammar, compute P(T) for 'Houston' parsed as NP→Proper-Noun [.30], Proper-Noun→Houston [.60], assuming this NP is the full parse under S→VP with VP omitted (i.e., just scoring the NP fragment alone).", answer:"P(NP fragment) = 0.30 × 0.60 = 0.18 (this is the probability of just the NP sub-tree, not a full sentence parse)"},
  {id:"m3n4p6", difficulty:"basic", q:"Two competing parses for the same sentence have probabilities 0.0056 and 0.0032. Which does the PCFG parser prefer, and why?", answer:"The parser prefers the parse with probability 0.0056 (the higher value) — PCFG parsing selects the tree with the MAXIMUM probability among all valid parses as the most likely correct interpretation."},
  {id:"m3n4p7", difficulty:"moderate", q:"Using 'A pilot likes flying planes' grammar (S→NP VP[1.0]; NP→DT NN[0.3]; DT→a[0.3]; NN→pilot[0.1]; VP→VBZ NP[0.3]; VBZ→likes[0.4]; NP→JJ NNS[0.4]; JJ→flying[0.1]; NNS→planes[0.34]), compute P(T) for the reading where 'flying planes' is a NOUN PHRASE (planes that are flying).", answer:"Rules used: S→NP VP[1.0], NP→DT NN[0.3](for 'a pilot'), DT→a[0.3], NN→pilot[0.1], VP→VBZ NP[0.3], VBZ→likes[0.4], NP→JJ NNS[0.4](for 'flying planes'), JJ→flying[0.1], NNS→planes[0.34]. P(T) = 1.0×0.3×0.3×0.1×0.3×0.4×0.4×0.1×0.34 = 1.0×0.3×0.3×0.1×0.3×0.4×0.4×0.1×0.34 ≈ 0.0000147 (a very small but nonzero product, as expected when multiplying many probabilities <1)."},
  {id:"m3n4p8", difficulty:"moderate", q:"Using the same grammar, compute P(T) for the ALTERNATIVE reading where 'flying planes' is a VERB PHRASE (VP→VBG NNS[0.1], i.e. 'likes [is flying planes]' as VP→VBZ VP[0.1] then VP→VBG NNS[0.1]).", answer:"Rules: S→NP VP[1.0], NP→DT NN[0.3], DT→a[0.3], NN→pilot[0.1], VP→VBZ VP[0.1], VBZ→likes[0.4], VP→VBG NNS[0.1], VBG→flying[0.5], NNS→planes[0.34]. P(T) = 1.0×0.3×0.3×0.1×0.1×0.4×0.1×0.5×0.34 ≈ 0.0000061."},
  {id:"m3n4p9", difficulty:"moderate", q:"Compare the two 'flying planes' parse probabilities computed above (≈0.0000147 for the NP reading vs ≈0.0000061 for the VP reading). Which parse does the PCFG prefer overall, and does this match the more natural reading of the sentence?", answer:"The NP reading (≈0.0000147) has the higher probability and is preferred by the PCFG. This roughly matches the more common/natural reading of 'A pilot likes flying planes' as 'a pilot likes [flying planes]' (planes that fly, as a general hobby/interest) rather than 'a pilot likes [to be flying planes]' (though both are grammatically valid readings) — showing how PCFG probabilities can encode which interpretation is statistically more typical in the training data."},
  {id:"m3n4p10", difficulty:"difficult", q:"A PCFG rule set has S→NP VP[0.9] and S→VP[0.1] (correctly summing to 1). If a corpus-based re-estimation finds Count(S→NP VP)=270 and Count(S)=300 total S-expansions, verify these probabilities and compute Count(S→VP).", answer:"P(S→NP VP)=270/300=0.9 ✓ matches. Count(S→VP) = Count(S) - Count(S→NP VP) = 300-270=30, giving P(S→VP)=30/300=0.1 ✓ matches — confirming the corpus counts are consistent with the stated rule probabilities."},
  {id:"m3n4p11", difficulty:"exam-level", q:"Explain the derivation showing why P(T,S)=P(T) for a PCFG parse (i.e., why the joint probability of tree-and-sentence equals just the tree's probability).", answer:"By the definition of joint probability: P(T,S) = P(T)×P(S|T). But a complete parse tree T, by construction, generates (covers) EXACTLY the words of sentence S at its leaves — there is no additional uncertainty about which sentence results once the tree is fully specified, so P(S|T)=1 (given the tree, the sentence is fully determined). Substituting: P(T,S) = P(T)×1 = P(T). This is why computing 'the probability of this parse' and 'the joint probability of this parse and this exact sentence' give the identical number."},
  {id:"m3n4p12", difficulty:"challenge", q:"A grammar has Nominal→Noun[0.75], Nominal→Nominal Noun[0.20], Nominal→Nominal PP[0.05] (correctly summing to 1.0). If these probabilities were instead given as 0.75, 0.20, 0.10 (summing to 1.05), what practical problem would this cause when computing parse-tree probabilities, and how would you fix the grammar?", answer:"A probability distribution that sums to more than 1 (1.05 here) is invalid — it would allow computed 'probabilities' P(T) that could, in principle, if you summed over ALL valid parses of a sentence, exceed 1, violating basic probability axioms and making comparisons between parses (and between parses of DIFFERENT sentences) unreliable/meaningless. Fix: RENORMALIZE by dividing each of the 3 values by their sum (1.05): 0.75/1.05≈0.714, 0.20/1.05≈0.190, 0.10/1.05≈0.095 — now correctly summing to 1.0, restoring a valid probability distribution over Nominal's expansions."}
 ]
},
);

DATA.numericals.m3.push(
{
 id:"m3n5", title:"Top-Down Parsing with Backtracking", topic:"3.4.1 Top-Down Parsers",
 concept:"A top-down parser starts from the grammar's start symbol S and tries every applicable rule, expanding downward, until it either matches all the input words (success) or gets stuck (requiring backtracking to try a different rule choice made earlier).",
 formula:"No formula — this is a SEARCH procedure. At each non-terminal, try its rules (often in the order listed in the grammar) top-to-bottom; if a choice leads to a dead end (leftover unmatched input, or a mismatch against an actual word), backtrack to the most recent unexplored alternative and try again.",
 workedExample:{
  title:"Parse 'book that flight' top-down with explicit backtracking",
  steps:[
   "Grammar: S→NP VP | S→Aux NP VP | S→VP; NP→Det NOM; NOM→Noun | Noun NOM; Det→that|this|a|the; Noun→book|flight|meal|man; Verb→book|include|read; Aux→does.",
   "Attempt 1 — Try S→NP VP: expand NP→Det NOM, but the first word 'book' is not a Det (Det can only be that/this/a/the) → FAILS immediately. Backtrack.",
   "Attempt 2 — Try S→Aux NP VP: 'book' is not Aux (Aux can only be 'does') → FAILS. Backtrack.",
   "Attempt 3 — Try S→VP, expand VP→Verb: 'book' matches Verb ✓, but this only consumes 1 word, leaving 'that flight' completely unparsed with no more structure to expand → FAILS (input not fully consumed). Backtrack.",
   "Attempt 4 — Try S→VP, expand VP→Verb NP: 'book' matches Verb ✓. Now expand NP→Det NOM: 'that' matches Det ✓. Expand NOM→Noun: 'flight' matches Noun ✓. All 3 words consumed, no non-terminals left unexpanded → SUCCESS.",
   "Final parse tree: S → VP → [Verb: book] [NP → [Det: that] [NOM → [Noun: flight]]]."
  ]
 },
 practice:[
  {id:"m3n5p1", difficulty:"easy", q:"Using the grammar above, does S→NP VP ever succeed for input starting with 'book'? Why or why not?", answer:"No — NP must start with Det (that/this/a/the), and 'book' is not a Det, so S→NP VP fails immediately at the first expansion attempt."},
  {id:"m3n5p2", difficulty:"easy", q:"How many words does VP→Verb (alone, without NP) consume?", answer:"Exactly 1 word (just the Verb) — insufficient for any sentence with more than 1 word remaining."},
  {id:"m3n5p3", difficulty:"easy", q:"In the given grammar, which rule alternative for S must be tried BEFORE 'S→VP' succeeds, assuming rules are tried in the listed order (NP VP, then Aux NP VP, then VP)?", answer:"Both S→NP VP and S→Aux NP VP must be tried (and fail) before S→VP is attempted, since rules are conventionally tried in the order they're listed in the grammar."},
  {id:"m3n5p4", difficulty:"basic", q:"Parse 'the man' top-down using: NP→Det NOM; NOM→Noun; Det→the; Noun→man. Show the successful derivation.", answer:"NP→Det NOM → the NOM → the Noun → the man. No backtracking needed since 'the' matches Det and 'man' matches Noun directly."},
  {id:"m3n5p5", difficulty:"basic", q:"Parse 'read this book' using VP→Verb NP; NP→Det NOM; NOM→Noun; Verb→read; Det→this; Noun→book. Show the successful derivation path (assume S→VP is tried directly, no backtracking needed for S).", answer:"S→VP→Verb NP→ read + (NP→Det NOM→ this + (NOM→Noun→ book)) = read/Verb this/Det book/Noun, fully consuming all 3 words."},
  {id:"m3n5p6", difficulty:"basic", q:"If NOM→Noun NOM exists as an additional rule (right-recursive), and the input has only 1 remaining noun-like word, would the parser try NOM→Noun NOM before NOM→Noun (assuming NOM→Noun is listed first)? What happens if it does?", answer:"No, if NOM→Noun is listed FIRST it would be tried first and likely succeed for a single remaining word — NOM→Noun NOM would only be tried if NOM→Noun failed OR if the parser were exploring multiple rule orderings for a DIFFERENT reason (e.g. if the input had 2+ remaining nouns). If NOM→Noun NOM were tried with only 1 word left, it would need ANOTHER Noun after consuming the first one — with no more input, it would fail (need more words than available) and backtrack to NOM→Noun."},
  {id:"m3n5p7", difficulty:"moderate", q:"For 'does the book cost money' using S→Aux NP VP; NP→Det NOM; NOM→Noun; VP→Verb NP; NP(2nd)→Noun(as NP→Noun directly, a proper-noun-like bare NP); Aux→does; Det→the; Noun→book|money; Verb→cost. Trace the top-level rule choice and first few expansion steps.", answer:"S→Aux NP VP is tried: 'does' matches Aux ✓. Then NP→Det NOM: 'the' matches Det, NOM→Noun: 'book' matches Noun ✓ (NP='the book' complete). Then VP→Verb NP: 'cost' matches Verb, then a second NP is needed for 'money' — if NP→Noun is available (bare noun NP, no determiner), 'money' matches directly, completing the parse: does/Aux (the book)/NP cost/Verb (money)/NP — SUCCESS, using both NP-formation rules within one derivation."},
  {id:"m3n5p8", difficulty:"moderate", q:"Explain why 'S→VP' as the LAST S-alternative to be tried (after NP VP and Aux NP VP both fail) is not just a coincidence of grammar-writing order, but reflects something about English sentence structure. What kind of sentences does S→VP alone cover?", answer:"S→VP (without an explicit subject) covers IMPERATIVE sentences — commands like 'Book that flight!' or 'Close the door.' where the subject ('you') is implied/omitted. It's reasonable that a grammar writer would list the more common declarative forms (S→NP VP, subject+predicate) and interrogative-with-auxiliary forms (S→Aux NP VP) before the imperative form, since declaratives/questions are far more frequent in typical text than commands — though the PARSER's backtracking behavior doesn't depend on WHY the order was chosen, only that rules are tried in whatever order the grammar lists them."},
  {id:"m3n5p9", difficulty:"difficult", q:"A top-down parser for a LEFT-RECURSIVE rule like NP→NP PP (NP defined partly in terms of itself, with NP as the FIRST symbol on the right) can enter an infinite loop. Explain why, using the top-down expansion strategy.", answer:"Top-down parsing expands the LEFTMOST non-terminal first. For NP→NP PP, expanding NP immediately produces ANOTHER NP as the first symbol to expand — which, using the same rule, produces yet another NP, and so on, WITHOUT EVER CONSUMING AN ACTUAL INPUT WORD. This creates infinite recursion (the parser keeps expanding NP→NP PP→(NP→NP PP)PP→... forever) since top-down expansion never reaches a terminal-producing rule when the very first symbol to expand is always another instance of the same non-terminal. This is a well-known limitation of naive top-down (and specifically LL) parsing — left-recursive grammars must be rewritten (e.g. to right-recursive form) before top-down parsing can handle them safely."},
  {id:"m3n5p10", difficulty:"difficult", q:"Compare the NUMBER of backtracking steps needed for 'book that flight' (4 attempts before success, as worked above) versus a hypothetical sentence where S→NP VP succeeds on the FIRST try. What determines how much backtracking a top-down parser needs?", answer:"'Book that flight' needed 3 failed attempts (NP VP, Aux NP VP, VP-with-just-Verb) before the 4th succeeded, because 'book' is ambiguous (could start a Verb-only imperative) and doesn't fit the NP-first or Aux-first patterns. A sentence starting with an unambiguous subject noun phrase (e.g. 'The dog runs') would match S→NP VP immediately with NO backtracking. What determines backtracking amount: how well the INPUT's actual structure matches the ORDER in which the grammar's rule alternatives are tried — words that are lexically ambiguous across categories (like 'book' being both Verb and Noun) create more false starts, since the parser must try and fail at each structurally-plausible rule before finding the one that matches the ACTUAL intended parse."},
  {id:"m3n5p11", difficulty:"exam-level", q:"A top-down parser and a bottom-up parser are both given the sentence 'the flight'. Explain a scenario where the top-down parser would explore WASTED structure that the bottom-up parser would never build, and vice versa.", answer:"Top-down waste: the parser might try expanding S→Aux NP VP (predicting an Aux is coming) even though NO Aux word ('does'/'can'/etc.) exists anywhere in the actual input — this is 'structure without regard to the actual words', built purely from the grammar's rule possibilities, and gets discarded once it can't match 'the' against Aux. Bottom-up waste: given just the words 'the flight' with a RICHER grammar that also allows 'the' and 'flight' to combine in an unrelated way (e.g. if 'flight' could ALSO be a Verb in some other rule, and 'the flight' could bottom-up combine into some irrelevant constituent that never leads to a valid S), the bottom-up parser might build local structures using matched grammar rules that never end up contributing to a complete parse rooted at S — 'building structure that never gets used', driven purely by which rules' right-hand-sides happen to match locally, regardless of whether it leads anywhere globally. In short: top-down can predict structure the words don't support; bottom-up can build structure the FULL PARSE doesn't need."}
 ]
},
{
 id:"m3n6", title:"Earley Parser — Dotted-Rule Trace", topic:"3.4.1 Top-Down Parsers (Earley)",
 concept:"The Earley parser is a top-down, dynamic-programming parser (like CKY, but without requiring CNF) that tracks partial rule progress using a 'dot' — the dot marks the boundary between the part of a rule already matched and the part still needed. Three operations advance the dot: Predict (add new rule possibilities for an expected non-terminal), Scan (consume an actual word, advancing past a terminal), and Complete (when a rule finishes, advance any OTHER rule that was waiting for it).",
 formula:"Chart entries are written [i:j] Rule, where i:j is the word span covered so far by the part before the dot. Predict: when a rule needs a non-terminal X next, add all of X's own rules (dot at the very start) to the chart at the current position. Scan: if a rule needs a terminal next and the current word matches, advance the dot past it, extending the span by 1. Complete: when a rule's dot has reached the end (fully matched), find all OTHER rules in the chart that were waiting for exactly this non-terminal, and advance THEIR dots too.",
 workedExample:{
  title:"Trace the Earley parser on 'book the flight'",
  steps:[
   "Grammar: S→NP VP | Aux NP VP | VP; VP→Verb | Verb NP; NP→Det NOM; NOM→Noun | Noun NOM.",
   "Step 1 — Initialization (position 0): Predict all S-rules with the dot at the start: S→.NP VP, S→.Aux NP VP, S→.VP.",
   "Step 2 — Predict (still position 0): since S→.VP needs VP next, predict VP's rules: VP→.Verb, VP→.Verb NP.",
   "Step 3 — Scan 'book' (moving to position 1): 'book' matches the Verb terminal expected by VP→.Verb and VP→.Verb NP → advance dots: VP→Verb.NP (position 1, still needs an NP) [also VP→Verb. alone would complete if nothing else were expected, but since the fuller rule VP→Verb NP is still viable, we track both].",
   "Step 4 — Complete/Predict (position 1): since VP→Verb.NP needs an NP next, predict NP's rules: NP→.Det NOM.",
   "Step 5 — Scan 'the' (moving to position 2): 'the' matches Det → advance: NP→Det.NOM (position 2, needs NOM next).",
   "Step 6 — Predict (position 2): NOM is needed, so predict: NOM→.Noun, NOM→.Noun NOM.",
   "Step 7 — Scan 'flight' (moving to position 3): 'flight' matches Noun → advance: NOM→Noun. (position 3, COMPLETE — dot at the end).",
   "Step 8 — Complete cascade: NOM→Noun. is complete, so it completes NP→Det NOM. (also now fully dotted) at position 3, which in turn completes VP→Verb NP. (position 3), which in turn completes S→VP. (position 3) — the ENTIRE input is covered by a completed S rule → PARSE SUCCEEDS."
  ]
 },
 practice:[
  {id:"m3n6p1", difficulty:"easy", q:"What does the 'dot' in a dotted rule like VP→Verb.NP represent?", answer:"It marks the boundary between the part of the rule's right-hand side already matched (Verb, to the left of the dot) and the part still needed (NP, to the right of the dot)."},
  {id:"m3n6p2", difficulty:"easy", q:"Which Earley operation is used when the parser needs to consume an actual word from the input?", answer:"Scan"},
  {id:"m3n6p3", difficulty:"easy", q:"Which Earley operation adds new candidate rules for an expected non-terminal?", answer:"Predict"},
  {id:"m3n6p4", difficulty:"basic", q:"A rule NP→Det.NOM is in the chart. NOM→Noun. just completed. What operation links these two, and what does the resulting entry look like?", answer:"Complete — it advances NP→Det.NOM past NOM, giving NP→Det NOM. (now itself complete)."},
  {id:"m3n6p5", difficulty:"basic", q:"Does the Earley parser require the grammar to be in Chomsky Normal Form? Why or why not, compared to CKY?", answer:"No — unlike CKY, Earley works directly with rules of ANY length/form (not just A→BC or A→a), since its dotted-rule mechanism naturally handles rules with more than 2 symbols on the right-hand side by advancing the dot one symbol at a time, regardless of how many symbols the rule has."},
  {id:"m3n6p6", difficulty:"basic", q:"For the rule S→.Aux NP VP at position 0, if the first word is NOT 'does' (the only Aux), what happens to this chart entry?", answer:"This entry simply never advances (Scan fails to match) and is effectively abandoned/dead — unlike top-down backtracking search, Earley doesn't need to explicitly 'backtrack' since it maintains ALL viable partial-parse entries in the chart simultaneously; entries that can't advance just stop contributing, while other entries (e.g. S→.VP) continue independently."},
  {id:"m3n6p7", difficulty:"moderate", q:"Trace the first 2 steps (Initialization + first Predict) for parsing 'the flight' using NP→Det NOM; NOM→Noun; assuming the start symbol is NP (not S) for this sub-grammar.", answer:"Step 1 (Init): Predict NP→.Det NOM (dot at start, position 0). Step 2 (Predict, still position 0): since the rule needs Det next, but Det is a terminal category (or if Det has its own lexical rules Det→the, predict those too): Det→.the (if using rule-based lexicon) or directly attempt to Scan 'the' as a Det terminal."},
  {id:"m3n6p8", difficulty:"moderate", q:"Explain why Earley's chart-based approach avoids the repeated re-parsing that a naive backtracking top-down parser might do for a sentence with a common ambiguous PREFIX (e.g. two different parses that both start by successfully matching 'book' as Verb).", answer:"Once an entry like VP→Verb.NP (position 1) is added to the chart, it stays there and can be reused/extended by ANY subsequent rule that needs it — if MULTIPLE different higher-level rules would all benefit from 'book' having been matched as Verb, they all share and build on the SAME chart entry rather than each independently re-deriving 'book is a Verb' from scratch. This caching/memoization (the same dynamic-programming principle behind CKY and Viterbi) is exactly what gives Earley its polynomial-time guarantee instead of the potentially exponential re-derivation cost of naive backtracking."},
  {id:"m3n6p9", difficulty:"difficult", q:"For the grammar S→NP VP; NP→Det NOM; NOM→Noun; VP→Verb NP, trace what happens if the SECOND word doesn't match ANY predicted rule (e.g. input is 'book quickly the' where 'quickly' isn't a Det or expected category after Verb).", answer:"After Scanning 'book' as Verb (VP→Verb.NP, position 1), the parser Predicts NP→.Det NOM (expecting a Det next). When it tries to Scan 'quickly' against this expectation, it FAILS to match (quickly isn't a Det) — this particular chart entry simply dies (no advancement), and if NO OTHER entry at position 1 can successfully scan 'quickly' either, the ENTIRE parse fails at this position — Earley reports no valid parse exists for this input under this grammar, without needing explicit backtracking machinery (the chart simply accumulates no viable entries reaching position 2+)."},
  {id:"m3n6p10", difficulty:"exam-level", q:"Compare Earley's time complexity (generally cited as O(n³) for general CFGs, same as CKY) with a naive top-down backtracking parser's worst-case exponential time. What specific mechanism in Earley provides this guarantee?", answer:"Earley's O(n³) guarantee comes from the SAME dynamic-programming/memoization principle as CKY and Viterbi: each chart entry [i:j] Rule is computed and stored ONCE per position, and REUSED by every other rule/derivation path that needs it, rather than being independently re-derived every time it's needed (which is what causes exponential blowup in naive backtracking search when the same sub-structure gets rebuilt repeatedly across different branches of the search tree). The chart has O(n²) possible [i:j] spans, and for each span a bounded (grammar-size-dependent) number of dotted-rule states can exist, giving the overall polynomial bound."}
 ]
},
);

DATA.numericals.m3.push(
{
 id:"m3n7", title:"Shift-Reduce Parser Trace", topic:"3.4.2 Bottom-Up Parsers (Shift-Reduce)",
 concept:"A Shift-Reduce parser uses a stack and processes input left-to-right, choosing at each step to either SHIFT (push the next input word onto the stack) or REDUCE (if the top of the stack matches a rule's right-hand side, replace it with the rule's left-hand-side non-terminal). If a reduction choice leads to a dead end later, the parser must backtrack to try a different choice.",
 formula:"No formula — trace the stack and remaining input through 4 repeated steps: Initialize (empty stack, full input) → Shift (push next word) → Reduce (if top-of-stack matches a rule RHS, replace with LHS) → Repeat until input is empty AND stack contains only the start symbol (success).",
 workedExample:{
  title:"Trace Shift-Reduce parsing of 'Book that flight'",
  steps:[
   "Grammar: S→NP VP | Aux NP VP | VP; NP→Det NOM; NOM→Noun | Noun NOM; VP→Verb | Verb NP. Lexicon: Det→that|this|a|the; Noun→book|flight|meal|man; Verb→book|include|read; Aux→does.",
   "Stack=(), Input='Book that flight' → Shift 'Book': Stack=(Book), Input='that flight'.",
   "Reduce Verb→book (Choice #1 of 2 — 'book' could also become Noun elsewhere, but we try Verb first): Stack=(Verb), Input='that flight'.",
   "Shift 'that': Stack=(Verb, that), Input='flight'.",
   "Reduce Det→that: Stack=(Verb, Det), Input='flight'.",
   "Shift 'flight': Stack=(Verb, Det, flight), Input=''.",
   "Reduce Noun→flight: Stack=(Verb, Det, Noun), Input=''.",
   "Reduce NOM→Noun: Stack=(Verb, Det, NOM), Input=''.",
   "Reduce NP→Det NOM: Stack=(Verb, NP), Input=''.",
   "Reduce VP→Verb NP: Stack=(VP), Input=''.",
   "Reduce S→VP: Stack=(S), Input='' → stack contains ONLY the start symbol and input is empty → SUCCESS."
  ]
 },
 practice:[
  {id:"m3n7p1", difficulty:"easy", q:"What are the 2 core actions a Shift-Reduce parser alternates between?", answer:"Shift (push next input word onto the stack) and Reduce (replace a matching rule's RHS on the stack top with its LHS)."},
  {id:"m3n7p2", difficulty:"easy", q:"When is a Shift-Reduce parse considered SUCCESSFUL?", answer:"When the input is completely consumed AND the stack contains exactly the start symbol (e.g. just 'S')."},
  {id:"m3n7p3", difficulty:"easy", q:"Grammar: S→aA, A→b. Input='ab'. After Shift,Shift, the stack is (a,b). What reduction applies next?", answer:"Reduce A→b: stack becomes (a,A)"},
  {id:"m3n7p4", difficulty:"basic", q:"Continuing: stack=(a,A), input=''. What single reduction completes the parse?", answer:"Reduce S→aA: stack becomes (S) — input is empty and stack=start symbol → SUCCESS"},
  {id:"m3n7p5", difficulty:"basic", q:"Grammar: NP→Det Noun; Det→the; Noun→dog. Trace the full Shift-Reduce sequence for 'the dog'.", answer:"Shift 'the': stack=(the). Reduce Det→the: stack=(Det). Shift 'dog': stack=(Det,dog). Reduce Noun→dog: stack=(Det,Noun). Reduce NP→Det Noun: stack=(NP) — SUCCESS if NP is the start symbol."},
  {id:"m3n7p6", difficulty:"basic", q:"If, after some shifts, the stack top is (Verb, NP) and a rule VP→Verb NP exists, what reduction applies?", answer:"Reduce VP→Verb NP: the stack top (Verb, NP) is replaced by the single symbol VP."},
  {id:"m3n7p7", difficulty:"moderate", q:"In the 'book that flight' trace, what would happen differently if, at the FIRST reduction step, 'book' were reduced to Noun instead of Verb (the OTHER choice)?", answer:"Stack would become (Noun) instead of (Verb). Then Shift 'that': stack=(Noun,that). But there's no rule combining a bare Noun with a following Det in this grammar (NP requires Det NOM, in THAT order, not Noun-then-Det) — this path would get STUCK (no valid shift or reduce leads anywhere productive), forcing the parser to BACKTRACK to the original choice (reduce 'book' as Verb instead), which is exactly why the professor's slide flags this as 'Choice #1 of 2' — trying Noun first would be the alternate, failing branch."},
  {id:"m3n7p8", difficulty:"moderate", q:"Grammar: VP→Verb NP PP; PP→Prep NP; NP→Det Noun. For input 'saw the man with the telescope' (Verb=saw, Prep=with), after fully building NP='the man' and NP='the telescope' and PP='with the telescope', what's the LAST reduction needed to complete VP?", answer:"Reduce VP→Verb NP PP: combining Verb(saw) + NP(the man) + PP(with the telescope) into a single VP — this requires the stack to have exactly these 3 constituents adjacent at the top before the reduction can fire."},
  {id:"m3n7p9", difficulty:"moderate", q:"Explain why Shift-Reduce parsing does NOT require the grammar to be in Chomsky Normal Form, unlike CKY.", answer:"Shift-Reduce directly matches a rule's ENTIRE right-hand side (however many symbols it has) against the top of the stack — a rule like VP→Verb NP PP (3 symbols) can be reduced in ONE step just as easily as a 2-symbol rule, since the matching process just checks 'do the top N stack symbols equal this rule's N-symbol RHS', with no requirement that N=2. CKY's binary-chart-splitting mechanism specifically needs exactly 2-way splits (hence CNF), while Shift-Reduce has no such structural constraint."},
  {id:"m3n7p10", difficulty:"difficult", q:"A Shift-Reduce parser reaches stack=(NP, Verb, NP) with input=''. Rules available: VP→Verb NP, S→NP VP. Explain the ORDER in which reductions must be applied, and why applying them in the wrong order would fail.", answer:"Must first reduce the RIGHTMOST matching pair: Verb+NP (positions 2-3 of the stack) → VP→Verb NP, giving stack=(NP,VP). THEN reduce NP+VP → S→NP VP, giving stack=(S) — SUCCESS. If you tried to reduce the FIRST NP with the Verb first (treating stack positions 1-2 as if NP+Verb matched some rule), there is no such rule (NP+Verb isn't a valid RHS here) — reduction must always match a rule's RHS to the CURRENT TOP of the stack in the correct left-to-right symbol order, so premature/misordered reduction attempts simply don't apply and the parser must recognize which specific stack-top window actually matches an available rule."},
  {id:"m3n7p11", difficulty:"exam-level", q:"Compare the backtracking risk of Shift-Reduce parsing to the CKY algorithm's guarantee of finding ALL parses without backtracking. Why does Shift-Reduce need backtracking while CKY doesn't?", answer:"Shift-Reduce commits to ONE choice at each decision point (which rule to reduce with, or whether to shift vs reduce when both are possible — the 'shift-reduce conflict') — if that choice turns out wrong later, the parser has already discarded the alternative and must backtrack (undo reductions, try a different choice) to recover, potentially re-doing significant work. CKY, being a DYNAMIC PROGRAMMING algorithm, exhaustively fills its chart bottom-up, computing and STORING every possible non-terminal that can span every possible substring — it never 'commits' to one interpretation early, so it naturally handles ambiguity by keeping multiple valid non-terminals in the same cell (as seen in the 'flying planes' VP-vs-NP ambiguity), guaranteeing it finds every parse without ever needing to backtrack or redo work."}
 ]
},
{
 id:"m3n8", title:"CKY Algorithm — CNF Conversion & Chart Parsing", topic:"3.4.2 Bottom-Up Parsers (CKY)",
 concept:"CKY parses a CNF grammar (every rule is A→BC or A→a) by filling a triangular chart bottom-up: cell [i,j] holds every non-terminal that can generate the words spanning position i to j, built by trying every way to SPLIT that span into two adjacent smaller spans whose non-terminals combine via a grammar rule.",
 formula:"CNF form required: A→BC (exactly 2 non-terminals) or A→a (exactly 1 terminal).\nChart fill rule: non-terminal X is added to cell [i,j] if there exists a split point k (i<k<j) and a rule X→YZ such that Y is in cell [i,k] and Z is in cell [k,j].\nA full parse exists if the START SYMBOL appears in the top cell [0,n] (spanning the entire sentence).",
 workedExample:{
  title:"Build the CKY chart for 'a pilot likes flying planes'",
  steps:[
   "Grammar (CNF): S→NP VP; VP→VBG NNS; VP→VBZ VP; VP→VBZ NP; NP→DT NN; NP→JJ NNS; DT→a; NN→pilot; VBZ→likes; VBG→flying; JJ→flying; NNS→planes.",
   "Step 1 — Fill the diagonal (single-word spans) via lexical rules: [0,1]=DT(a), [1,2]=NN(pilot), [2,3]=VBZ(likes), [3,4]={VBG,JJ}(flying — ambiguous!), [4,5]=NNS(planes).",
   "Step 2 — Fill 2-word spans: [0,2]: split at k=1, combine DT(0,1)+NN(1,2) → matches NP→DT NN → [0,2]=NP ('a pilot'). [1,3]: NN+VBZ — no matching rule → empty. [2,4]: VBZ+{VBG,JJ} — no matching rule → empty. [3,5]: split at k=4, combine {VBG,JJ}(3,4)+NNS(4,5) → VBG+NNS matches VP→VBG NNS giving VP; JJ+NNS matches NP→JJ NNS giving NP → [3,5]={VP,NP} (BOTH readings valid — genuine ambiguity for 'flying planes').",
   "Step 3 — Fill 3-word spans: [0,3]: try splits k=1 (DT + [1,3]=empty → nothing) and k=2 (NP(0,2) + VBZ(2,3) → no rule combines NP+VBZ → nothing) → [0,3]=empty. [2,5]: split k=3: VBZ(2,3) + [3,5]={VP,NP} → VBZ+VP matches VP→VBZ VP giving VP; VBZ+NP matches VP→VBZ NP giving VP → [2,5]=VP (from BOTH sub-readings, giving 2 distinct derivations of the same VP span).",
   "Step 4 — Fill the full span [0,5]: split k=2: NP(0,2)=‘a pilot' + VP(2,5)='likes flying planes' → matches S→NP VP → [0,5]=S. PARSE FOUND (start symbol spans the whole sentence), and since [3,5] had 2 readings feeding into [2,5]'s VP (also achieved 2 ways), the FULL parse is ambiguous — there are 2 valid parse trees (S1: 'flying planes'=VP reading; S2: 'flying planes'=NP reading), both rooted at S spanning all 5 words."
  ]
 },
 practice:[
  {id:"m3n8p1", difficulty:"easy", q:"What are the two allowed CNF rule forms?", answer:"A→BC (exactly 2 non-terminals) and A→a (exactly 1 terminal)"},
  {id:"m3n8p2", difficulty:"easy", q:"Convert 'NP → The Nominal' (a mixed terminal+non-terminal rule) into CNF-compliant form.", answer:"Introduce a dummy non-terminal for the terminal: NP → Det Nominal, plus a new rule Det → The"},
  {id:"m3n8p3", difficulty:"easy", q:"In the CKY chart, what does cell [i,j] represent?", answer:"All non-terminals that can generate exactly the words spanning positions i through j."},
  {id:"m3n8p4", difficulty:"basic", q:"Convert the unit-production chain 'NP → Nominal' and 'Nominal → Noun' (assuming Noun→dog is already terminal-only) into a single CNF-compliant rule for NP over 'dog'.", answer:"Collapse the unit-productions by substitution: NP → dog (directly), removing the intermediate Nominal/unit-production chain — this is what Step 3 (unit-production elimination) of the CNF conversion procedure does."},
  {id:"m3n8p5", difficulty:"basic", q:"Binarize the 3-symbol rule 'NP → Det Noun PP' into CNF form.", answer:"Introduce a dummy non-terminal, e.g. Nominal → Noun PP, then NP → Det Nominal — now both rules are proper A→BC form."},
  {id:"m3n8p6", difficulty:"basic", q:"In the pilot-example chart, why is cell [1,3] (spanning 'pilot likes') empty?", answer:"Because [1,2]=NN(pilot) and [2,3]=VBZ(likes), and there is no grammar rule of the form X→NN VBZ in this grammar — no valid combination exists for this specific span, so it gets no non-terminal entry."},
  {id:"m3n8p7", difficulty:"moderate", q:"Using 'The flight includes a meal' with grammar S→NP VP; NP→Det N; VP→V NP; V→includes; Det→The|a; N→meal|flight — fill cell [0,2] (spanning 'The flight').", answer:"[0,1]=Det(The), [1,2]=N(flight). Split at k=1: Det+N matches NP→Det N → [0,2]=NP"},
  {id:"m3n8p8", difficulty:"moderate", q:"Continuing the same example, fill cell [3,5] (spanning 'a meal').", answer:"[3,4]=Det(a), [4,5]=N(meal). Split at k=4: Det+N matches NP→Det N → [3,5]=NP"},
  {id:"m3n8p9", difficulty:"moderate", q:"Continuing, fill cell [2,5] (spanning 'includes a meal') and then the full-sentence cell [0,5].", answer:"[2,3]=V(includes), [3,5]=NP(a meal, from above). Split at k=3: V+NP matches VP→V NP → [2,5]=VP. Full span [0,5]: split at k=2: NP(0,2)='The flight' + VP(2,5)='includes a meal' matches S→NP VP → [0,5]=S — PARSE SUCCEEDS, sentence fully covered by S."},
  {id:"m3n8p10", difficulty:"difficult", q:"For the ambiguous span [3,5] in the pilot example (both VP and NP valid for 'flying planes'), explain precisely HOW this ambiguity propagates to produce 2 DIFFERENT full parse trees, rather than the chart just picking one.", answer:"CKY doesn't 'pick' a single reading — it stores BOTH VP and NP as valid entries in cell [3,5], each with its own backpointer to how it was built (VBG+NNS via VP→VBG NNS, vs JJ+NNS via NP→JJ NNS). When cell [2,5] is computed, it checks span [2,3]=VBZ combined with EACH entry in [3,5] separately: VBZ+VP(3,5) satisfies VP→VBZ VP (one derivation), AND VBZ+NP(3,5) satisfies VP→VBZ NP (a second, different derivation) — BOTH produce a VP at [2,5], but via different rules/children, meaning [2,5] itself now has 2 distinct backpointer-traceable derivations even though it's labeled the same non-terminal (VP) both times. Tracing back from the final S at [0,5] through EACH distinct derivation path gives 2 separate complete parse trees — this is exactly how CKY 'generates multiple trees when the statement is ambiguous', as the professor's slides state."},
  {id:"m3n8p11", difficulty:"exam-level", q:"Explain why CKY's time complexity is O(n³) in terms of the chart-filling process (number of cells × work per cell).", answer:"There are O(n²) cells [i,j] in the triangular chart (roughly n²/2 distinct spans for a sentence of length n). For EACH cell [i,j], CKY must try every possible SPLIT POINT k between i and j to check for valid combinations — there are up to O(n) possible split points for a given span. So total work = O(n²) cells × O(n) split-points-per-cell = O(n³) — this cubic bound is why CKY (like Earley) is considered efficient/tractable for practical sentence lengths, versus the exponential blowup of naive unrestricted search."},
  {id:"m3n8p12", difficulty:"challenge", q:"A grammar produces a chart where cell [0,5] is EMPTY (no S entry) even though every individual word matched some POS tag correctly in the diagonal cells. What does this indicate, and what's the most likely grammatical cause?", answer:"This indicates the sentence's individual words are all recognized lexically (each word has a valid POS/terminal-rule match), but NO COMBINATION of those pieces, following the grammar's phrase-structure rules, successfully builds up to a complete S spanning the whole sentence — i.e., the words are individually valid but the sentence as a WHOLE is not grammatical according to this specific grammar (or the grammar is simply missing a necessary combining rule). Common causes: a required rule is missing from the grammar (e.g. no rule allows the specific VP+PP combination actually present), or the sentence uses a syntactic construction (e.g. a passive voice, or a rare word order) that the grammar's rule set doesn't cover — CKY's exhaustive bottom-up construction guarantees that if a valid derivation EXISTS in the grammar, it WILL be found; an empty top cell is definitive proof no such derivation exists for this grammar."}
 ]
},
);

   answer:"ANAPHORIC ambiguity. The pronoun 'she' has two possible antecedents.\nInterpretation 1: Riya topped the exam.  Interpretation 2: Sneha topped the exam.\nIdentifier step 4: 'Is there an issue in he/she/it/they reference?'"},
  {id:"sp_m1a4", difficulty:"basic", kind:"application", src:"notes",
   q:"Identify and interpret: “Do you know what time it is?”",
   answer:"PRAGMATIC ambiguity.\nLiteral: a yes/no question about whether you possess the knowledge.\nIntended: please tell me the time (or, said sharply to a latecomer, 'you are late').\nIdentifier step 5 — extra information about speaker intention is required."},
  {id:"sp_m1a5", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"THE Q1 TRAP. The brief says “more than one will be present”. Find EVERY ambiguity in: “Mary saw the man on the hill with the telescope and she waved at him.”",
   answer:"Three, and naming all three is the answer:\n1. SYNTACTIC (PP-attachment) — 'on the hill' and 'with the telescope' can each attach to 'saw', to 'the man', or to 'the hill', giving several parse trees.\n2. LEXICAL — 'saw' can be the past tense of 'see' or the noun/verb 'saw' (a cutting tool); context rules it out but the word itself is ambiguous.\n3. ANAPHORIC — 'him' could be the man, or some other male mentioned earlier in the discourse.\nWrite them as a numbered list with the interpretation under each; do not write an essay on ambiguity in general."},
  {id:"sp_m1a6", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"A student labels “Visiting aunts can be a nuisance” as LEXICAL because 'visiting' has two meanings. Is that right? Correct them using the class's identifier.",
   answer:"Not the best label. Run the identifier honestly:\nStep 1 — is one word confusing? 'visiting' is a single word form, so a student can defend LEXICAL.\nStep 2 — can the sentence have different grammatical structures? YES: 'visiting' is either an adjective modifying 'aunts' (aunts who are visiting) or a gerund heading the subject (the act of visiting aunts). Two parse trees exist.\nSo the stronger answer is SYNTACTIC/STRUCTURAL, and the class filed the sentence under SEMANTIC because both readings survive once the grammar is fixed.\nExam move: name the structural reading, give both interpretations, and note the lexical component in one line. The interpretations are what is marked."},
  {id:"sp_m1a7", difficulty:"difficult", kind:"scenario", src:"notes",
   q:"A voice assistant hears “Book a table for two by the window.” It responds by reading out a book review. Which ambiguity did it fail on, at which pipeline stage, and what would fix it?",
   answer:"LEXICAL ambiguity, specifically PART-OF-SPEECH disambiguation: 'Book' was read as a NOUN (a printed volume) instead of a VERB (to reserve).\nStage that failed: the SYNTACTIC stage — POS tagging (Module 3), which should have tagged sentence-initial 'Book' as a verb given the following noun phrase.\nFix: POS tagging with context (an HMM/Viterbi tagger uses P(tag|previous tag) and would strongly prefer VB at the start of an imperative), plus intent classification at the application stage.\nNote the class's own split: this is POS disambiguation, not sense disambiguation."},
  {id:"sp_m1a8", difficulty:"exam-level", kind:"application", src:"notes",
   q:"Q1-style, 2 marks. For each, name the type and give both interpretations: (a) “The old men and women were taken to safe locations.” (b) “Time flies like an arrow.”",
   answer:"(a) SYNTACTIC — scope ambiguity over the adjective 'old'.\n   Reading 1: [old [men and women]] — both groups are old.\n   Reading 2: [[old men] and [women]] — only the men are old.\n(b) SYNTACTIC + LEXICAL — the classic multi-parse sentence.\n   Reading 1: time passes in the manner of an arrow (flies = verb, like = preposition).\n   Reading 2: 'time flies' (a kind of fly) are fond of an arrow (flies = noun, like = verb).\n   Reading 3 (imperative): measure the speed of flies the way you would measure an arrow.\nTwo interpretations per sentence is enough for 2 marks; naming the third on (b) is a bonus."},
  {id:"sp_m1a9", difficulty:"exam-level", kind:"tricky", src:"notes",
   q:"Distinguish, in one line each and with a fresh example each, ANAPHORIC and PRAGMATIC ambiguity — the pair the notes warn are confused most.",
   answer:"ANAPHORIC: a referring expression (he/she/it/they/him/her) has more than one possible antecedent, so the REFERENT is unresolved. Example: “The trophy didn't fit in the suitcase because it was too big.” — is 'it' the trophy or the suitcase?\nPRAGMATIC: every word and reference is clear, but the literal meaning differs from the INTENDED meaning, so speaker intention must be recovered. Example: “It's cold in here.” — literally a temperature report, intended as a request to close the window.\nOne-line separator: anaphoric asks WHICH THING, pragmatic asks WHAT DID THEY MEAN."},
  {id:"sp_m1a10", difficulty:"challenge", kind:"scenario", src:"notes",
   q:"Your team must ship one component to reduce customer-support misunderstandings. Sample failures: (i) “I want to change my plan” (billing plan vs travel plan), (ii) “Cancel it” (which of two open orders), (iii) “Can you check my refund?” (answered “Yes.” and stopped). Rank the three ambiguity types by fix cost and say which component you ship first, with justification.",
   answer:"(i) LEXICAL — one word, 'plan', has two senses. Cheapest to fix: a domain-restricted sense inventory plus context words; word-sense disambiguation is a well-defined, supervised task.\n(ii) ANAPHORIC — 'it' has two candidate referents. Middle cost: needs dialogue state (the list of open orders) plus a coreference/reference-resolution step; solvable with rules over recency in a narrow domain.\n(iii) PRAGMATIC — the literal yes/no reading was taken over the intended request. Most expensive: needs speech-act / intent classification and world knowledge, which the notes mark as “most diff to resolve”.\nShip first: (i) LEXICAL, because it is the cheapest and, in a support domain, the sense inventory is small and closed. Then (ii). Treat (iii) as an intent-classification problem at the application stage rather than a linguistic one.\nJustification is the answer here — a bare ranking scores little."}]
},
{
 id:"s_m1_stagepick", title:"Which Pipeline Stages Does This Application Need?", topic:"1.1", marks:3,
 lo:["LO 1.2","LO 1.3"], src:"NLP Notes p.1 — CIA-1 brief: “preprocessing: identify the application, which stages will be applied”",
 tag:"Q2 in the MSE brief is applications (text-to-speech, autocorrect, caption reader, scanner)",
 idea:"Not 'list the stages' — you are given an APPLICATION and must say which stages run and what each one contributes. The class MSE brief names four applications for Q2: text-to-speech, autocorrect, caption reader, scanner (OCR).",
 method:"The six stages, with the question each answers (notes p.1–2):\n\n1. Text Preprocessing   — what are the basic units?   (tokenization, normalisation)\n2. Morphological A.     — what is the base form?       (stemming, lemmatisation)\n3. Syntactic A.         — how do the words relate?     (POS tagging, parsing)\n4. Semantic A.          — what does it mean?           (word/sentence meaning)\n5. Pragmatic A.         — what was intended?           (context, speaker intent)\n6. Application-level A. — what is the final task?\n\nHOW TO ANSWER: for each stage write one line — 'runs / does not run, and why'. Stop at the deepest stage the task genuinely needs; claiming all six for a shallow task loses marks just as skipping stages does.",
 classQs:[
  {q:"AUTOCORRECT — which stages apply?",
   steps:[
    "Preprocessing — YES. Tokenize the input to find word boundaries; this is where the misspelt token is isolated.",
    "Morphological — YES. Needed to know that 'runnning' should map to the root 'run' + '-ing', and that 'geting' is a legal root with a wrong doubling.",
    "Syntactic — YES (light). POS context decides between 'their/there/they're' — a spell-checker that ignores syntax cannot catch real-word errors.",
    "Semantic — usually NOT for classic autocorrect; needed only for context-sensitive correction.",
    "Pragmatic — NO.",
    "Application — YES. Rank candidate corrections (edit distance + a language model) and emit the top one."],
   answer:"Preprocessing + Morphological + light Syntactic + Application. Semantic and Pragmatic are not required for standard autocorrect.\nKey line to write: autocorrect is fundamentally an EDIT-DISTANCE + LANGUAGE-MODEL problem (Module 2 self-learning topic), so the heavy lifting is at the preprocessing/morphological and application levels."},
  {q:"TEXT-TO-SPEECH — which stages apply?",
   steps:[
    "Preprocessing — YES, and it is the hard part: sentence segmentation, plus expanding '₹250', 'Dr.', '3/4' into spoken words.",
    "Morphological — YES, to pronounce inflected forms correctly.",
    "Syntactic — YES. POS tagging decides pronunciation of homographs: 'I READ (reed) books' vs 'I READ (red) it yesterday'; 'record' as noun vs verb shifts the stress.",
    "Semantic — LIGHT. Mostly needed for emphasis and disambiguating homographs syntax cannot settle.",
    "Pragmatic — YES for natural output: a question gets rising intonation, a command gets a different prosody.",
    "Application — YES: grapheme-to-phoneme conversion and waveform generation."],
   answer:"Essentially all six, with Syntactic and Pragmatic doing unusually visible work (homograph pronunciation and intonation).\nThe examinable insight: TTS needs SYNTAX for pronunciation — this is the standard example of a 'shallow-looking' task that is actually deep."},
  {q:"SCANNER / OCR and CAPTION READER — which stages apply?",
   steps:[
    "SCANNER (OCR): the image-to-character step is not NLP at all; NLP starts once characters exist.",
    "Preprocessing — YES: reconstruct word and sentence boundaries from noisy character output.",
    "Morphological + Syntactic — YES, used to CORRECT OCR errors ('rn' misread as 'm') by checking the result is a legal word form in a legal position.",
    "Semantic/Pragmatic — only if the scanner also extracts meaning (e.g. reading an invoice).",
    "CAPTION READER: preprocessing + syntactic + semantic to produce a fluent description; pragmatic if it must decide what is worth mentioning."],
   answer:"OCR: Preprocessing (heaviest) + Morphological + Syntactic for error correction + Application. The optical stage itself is computer vision, not NLP — say this, it is the discriminating line.\nCaption reader: Preprocessing + Syntactic + Semantic + Application, and Pragmatic if it must select salient content."}],
 practice:[
  {id:"sp_m1s1", difficulty:"basic", kind:"application", src:"notes",
   q:"A SPAM FILTER. Which pipeline stages apply, and which do not? One line each.",
   answer:"Preprocessing — YES: tokenize the email, normalise case, strip headers.\nMorphological — YES (light): stem so 'winning', 'wins', 'win' collapse to one feature.\nSyntactic — mostly NO: bag-of-words features work well without parse trees.\nSemantic — LIGHT: only if the filter must catch paraphrased scams.\nPragmatic — NO.\nApplication — YES: the classification decision itself.\nDiscriminating line: spam filtering is a shallow-pipeline task — this is why simple BoW + Naive Bayes still works."},
  {id:"sp_m1s2", difficulty:"basic", kind:"application", src:"notes",
   q:"MACHINE TRANSLATION English → Marathi. Which stages apply and why is it the deepest example?",
   answer:"All six, and it is the standard 'needs everything' example.\nPreprocessing: tokenization (harder for Marathi — see the Indian-language challenges).\nMorphological: Marathi is morphologically rich, so the correct inflected form must be GENERATED, not just analysed.\nSyntactic: English is SVO, Marathi is SOV — the word order must be restructured.\nSemantic: sense selection ('bank' -> which Marathi noun?).\nPragmatic: politeness level / honorifics must match the intended relationship.\nApplication: fluent target-language generation (NLG).\nThe extra mark: MT is both NLU and NLG — it understands, then regenerates."},
  {id:"sp_m1s3", difficulty:"moderate", kind:"scenario", src:"notes",
   q:"A hospital chatbot answers “Your report is ready” to the question “When will my report be ready?”. Which pipeline stage failed, and which stage would you strengthen?",
   answer:"The SEMANTIC/PRAGMATIC stages failed. Preprocessing and syntax clearly worked (the sentence was parsed), but the WH-word 'When' — which sets the answer type to a TIME — was ignored.\nStrengthen: semantic analysis (question-type classification: When -> time, Where -> location, Who -> person) and then the application stage's answer selection.\nGeneral principle worth writing: a fluent but wrong answer indicates a failure LATE in the pipeline; a garbled answer indicates a failure EARLY (tokenization)."},
  {id:"sp_m1s4", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"Two students disagree. A says autocorrect needs syntactic analysis; B says it does not. Settle it with an example for each side.",
   answer:"Both are partly right, and the answer is to separate the two kinds of spelling error.\nB is right for NON-WORD errors: 'recieve' is not an English word, so a dictionary + edit distance fixes it with no syntax at all.\nA is right for REAL-WORD errors: 'I want to go their' contains only legal words, so only the syntactic context (a preposition slot needs 'there', not the possessive 'their') reveals the mistake.\nConclusion: classic autocorrect can skip syntax; context-sensitive autocorrect cannot. Stating the two-case split IS the full-marks answer."},
  {id:"sp_m1s5", difficulty:"difficult", kind:"scenario", src:"notes",
   q:"An OCR system scans a printed bill and outputs “Total: rn250”. Trace what went wrong and at which stage each remedy sits.",
   answer:"Optical stage (not NLP): the character pair 'rn' was misrecognised for 'm', or '₹' for 'rn'.\nPreprocessing (NLP stage 1): should normalise the currency symbol and separate the number from the symbol — a normalisation rule for currency would catch this.\nMorphological/lexical check: 'rn250' is not a legal token in any lexicon, so the token is flagged.\nApplication stage: a domain constraint ('Total must be followed by a currency amount') selects the correction ₹250.\nExam insight: OCR error correction is a NOISY CHANNEL problem — the observed string is a corrupted version of an intended string, exactly the Module 2 self-learning model."},
  {id:"sp_m1s6", difficulty:"exam-level", kind:"application", src:"notes",
   q:"Q2-style, 4 marks. For a TEXT-TO-SPEECH system for railway announcements in English and Marathi, give the stages applied, the specific work each does, and the single hardest stage. Justify the hardest.",
   answer:"Preprocessing — expand numbers, times, platform numbers and abbreviations into spoken words ('12:45' -> 'twelve forty-five'; 'Exp.' -> 'Express'); sentence segmentation.\nMorphological — produce correctly inflected Marathi forms (morphologically rich; gender is encoded in the verb).\nSyntactic — POS tag to fix homograph pronunciation and phrase boundaries for pausing.\nSemantic — light: resolve station names that clash with common nouns.\nPragmatic — choose intonation: an announcement vs a warning; politeness register in Marathi.\nApplication — grapheme-to-phoneme conversion and waveform synthesis.\nHardest: PREPROCESSING / text normalisation. Justification: every downstream stage receives its output, so a mis-expanded time or platform number is unrecoverable, and normalisation rules are language-specific and must be rebuilt for Marathi — the low-resource problem in miniature."},
  {id:"sp_m1s7", difficulty:"exam-level", kind:"tricky", src:"notes",
   q:"Why does the pipeline have a Preprocessing stage at all, when a modern transformer just reads the raw string? Answer in a way that earns the mark in an exam on the classical pipeline.",
   answer:"Two-part answer.\n(1) The pipeline is defined by CASCADING dependency: each stage's output is the next stage's input, so 'what are the basic units?' must be answered before 'what is the base form?' can be. Errors cascade — if tokenization is wrong, everything downstream is wrong.\n(2) Transformers do not remove the stage, they LEARN it: sub-word tokenizers (WordPiece/BPE) still run before the model, and the model learns morphology, syntax and semantics jointly in its layers rather than as separate modules. The cost is interpretability — a classical pipeline can be debugged stage by stage, a transformer is a black box.\nWriting only 'transformers do it all' loses the mark; the examiner wants the cascade + black-box trade-off."}]
},
{
 id:"s_m1_pipeline_math", title:"Small Maths on Raw Text (CIA-style 1-markers)", topic:"1.1", marks:2,
 lo:["LO 1.1"], src:"NLP Notes p.1 (CIA-1 brief: “1 m maths Q — TTR, relative freq”) + p.5–6",
 idea:"Module 1's LO 1.1 is explicitly a MATHEMATICS outcome — apply mathematical and statistical concepts to understand the pipeline. In practice that means the short numeric questions: count tokens, count types, compute a ratio, compute a relative frequency, and then say what the number MEANS.",
 method:"Tokens N = total running words in the text.\nType(w)   = how many times word w occurs.\nTypes |V| = number of DISTINCT words.\n\nTTR (whole text)   = types / tokens          -> lexical variety\nTTR (a word, as used in class) = type(w) / tokens\nRelative frequency P(w) = count(w) / N        -> unigram probability\n\nInterpretation is the second half of the mark:\n  high TTR -> varied vocabulary, little repetition\n  low  TTR -> repetitive text (and TTR always FALLS as a text gets longer)",
 classQs:[
  {q:"“The dog ran to the park. The dog saw a cat. The cat ran away and the dog barked.” Given the word 'dog', calculate its relative frequency.",
   steps:[
    "Count tokens: The(1) dog(2) ran(3) to(4) the(5) park(6) The(7) dog(8) saw(9) a(10) cat(11) The(12) cat(13) ran(14) away(15) and(16) the(17) dog(18) barked(19).",
    "N = 19 tokens (punctuation not counted as tokens here).",
    "count(dog) = 3 — positions 2, 8 and 18.",
    "P(dog) = count(dog) / N = 3/19."],
   answer:"P(dog) = 3/19 ≈ 0.158",
   watch:"State your tokenization convention in one line ('punctuation excluded, case-insensitive'). The class counted 'The' and 'the' as the same word — if you count them separately you get a different type count and the examiner cannot follow you."},
  {q:"“Online shopping has become increasingly popular. Many customers purchase products through mobile applications. Some customers also read product reviews before making a purchase.” Compute the TTR. (Class 'Smart Assist' example.)",
   steps:[
    "Count all running words -> tokens.",
    "Count distinct words -> types. Note 'customers' repeats, and 'purchase' appears as both verb and noun (same surface form -> one type).",
    "TTR = types / tokens.",
    "The class recorded tokens = 37 and types = 28, giving TTR = 28/37."],
   answer:"TTR = types/tokens = 28/37 ≈ 0.757 (as recorded in class).",
   watch:"Your own count may differ from 37 depending on whether you count punctuation and whether 'purchase' (verb) and 'purchase' (noun) are one type. Write your convention down and count consistently — an examiner marks the METHOD and the consistency, not a single magic number."}],
 practice:[
  {id:"sp_m1m1", difficulty:"easy", kind:"numerical", src:"notes",
   q:"“The cat sat on the mat. The mat was flat.” Compute N (tokens), |V| (types) and TTR. Ignore punctuation, case-insensitive.",
   answer:"Tokens: the, cat, sat, on, the, mat, the, mat, was, flat -> N = 10.\nDistinct: the, cat, sat, on, mat, was, flat -> |V| = 7.\nTTR = 7/10 = 0.70."},
  {id:"sp_m1m2", difficulty:"easy", kind:"numerical", src:"notes",
   q:"For the text in the previous question, compute the relative frequency of 'the' and of 'mat'.",
   answer:"P(the) = 3/10 = 0.30.  P(mat) = 2/10 = 0.20.\nCheck: the probabilities of all 7 types must sum to 1 — 3/10 + 2/10 + 5×(1/10) = 1. ✓"},
  {id:"sp_m1m3", difficulty:"basic", kind:"numerical", src:"notes",
   q:"A 200-word product review contains 'battery' 8 times. Give P(battery), and the expected count of 'battery' in a NEW 50-word review if the same rate held.",
   answer:"P(battery) = 8/200 = 0.04.\nExpected count in 50 words = 0.04 × 50 = 2.\nNote the probability stays 0.04 — it is estimated from the training text, not recomputed from the new one."},
  {id:"sp_m1m4", difficulty:"basic", kind:"interpret", src:"notes",
   q:"Text A: TTR = 0.85. Text B: TTR = 0.35. Both are 500 words. What can you conclude, and what can you NOT conclude?",
   answer:"CAN conclude: A has far more lexical variety — 425 distinct words vs 175 — so B repeats itself heavily (typical of instructions, legal boilerplate or a chant).\nCANNOT conclude: that A is 'better written', more complex, or more informative. TTR measures repetition, not quality. You also cannot compare across different lengths — TTR falls mechanically as a text grows, because function words repeat.\nThe 'cannot conclude' half is where the interpretation mark sits."},
  {id:"sp_m1m5", difficulty:"moderate", kind:"tricky", src:"notes",
   q:"Two students compute the TTR of the same 12-word sentence and get 0.75 and 0.58. Neither made an arithmetic error. Give two tokenization decisions that explain the gap.",
   answer:"(1) CASE: one treated 'The' and 'the' as the same type, the other as two types — more types means a higher TTR.\n(2) PUNCTUATION / CLITICS: counting '.' and ',' as tokens, or splitting \"don't\" into 'do' + \"n't\", changes BOTH the token count and the type count.\nAlso acceptable: lemmatising first ('cats' -> 'cat') merges types and lowers TTR; hyphenated words ('state-of-the-art') as one token vs four.\nExam lesson: state your convention before you count. This is exactly why the pipeline has a Preprocessing stage — every later number depends on it."},
  {id:"sp_m1m6", difficulty:"difficult", kind:"scenario", src:"notes",
   q:"You are choosing between two datasets to train a chatbot. Dataset A: 1,000,000 tokens, TTR 0.02. Dataset B: 50,000 tokens, TTR 0.40. Which has the larger vocabulary, and which would you pick? Justify.",
   answer:"Vocabulary: A has 0.02 × 1,000,000 = 20,000 types. B has 0.40 × 50,000 = 20,000 types. IDENTICAL vocabulary size — the TTR difference is almost entirely a length artefact.\nPick A: same vocabulary but 20× more data, so every word has far more contexts, which is what a language model actually needs (fewer zero counts, less smoothing).\nThe trap: reading the higher TTR as 'richer'. Compare vocabulary sizes, not raw TTRs, when the lengths differ."},
  {id:"sp_m1m7", difficulty:"exam-level", kind:"numerical", src:"notes",
   q:"“I know that you know that I know the answer.” (a) N, (b) type(know), (c) TTR of the whole text, (d) P(that).",
   answer:"Tokens: I, know, that, you, know, that, I, know, the, answer -> (a) N = 10.\n(b) type(know) = 3.\n(c) Distinct: I, know, that, you, the, answer -> |V| = 6, so TTR = 6/10 = 0.60.\n(d) P(that) = 2/10 = 0.20.\nBox each answer separately — the class brief lists 'final answer' as mandatory."}]
}
];
